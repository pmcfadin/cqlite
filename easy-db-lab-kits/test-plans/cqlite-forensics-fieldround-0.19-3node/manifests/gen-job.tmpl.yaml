apiVersion: batch/v1
kind: Job
metadata: {name: @NAME@, namespace: fr}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: gen
        image: python:3.12-slim
        env: [{name: HOME, value: /tmp}]
        command: ["bash","-c"]
        args: ["pip install -q --user cassandra-driver 2>&1 | grep -v notice; python /gen/gen.py @ARGS@ --journal /tmp/ops.jsonl; rc=$?; cat /tmp/ops.jsonl | head -c 200000 > /dev/stdout; exit $rc"]
        resources: {requests: {cpu: 250m, memory: 192Mi}, limits: {cpu: "500m", memory: 256Mi}}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        volumeMounts: [{name: gen, mountPath: /gen}]
      volumes: [{name: gen, configMap: {name: gen}}]
