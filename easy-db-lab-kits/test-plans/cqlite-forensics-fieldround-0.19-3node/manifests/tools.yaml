apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: tools, namespace: fr}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 40Gi}}}
---
apiVersion: v1
kind: Pod
metadata: {name: tools, namespace: fr}
spec:
  securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
  containers:
  - name: runner
    image: ubuntu:24.04
    command: ["sleep","infinity"]
    resources: {requests: {cpu: "250m", memory: 64Mi}, limits: {cpu: "500m", memory: 128Mi}}
    securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
    volumeMounts: [{name: work, mountPath: /work}, {name: work, mountPath: /snap, subPath: snap}, {name: work, mountPath: /dmg, subPath: dmg}]
  - name: oracle
    image: cassandra:5.0.8
    command: ["sleep","infinity"]
    resources: {requests: {cpu: "250m", memory: 384Mi}, limits: {cpu: "500m", memory: 1024Mi}}
    securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
    volumeMounts: [{name: work, mountPath: /work}, {name: work, mountPath: /snap, subPath: snap}, {name: work, mountPath: /dmg, subPath: dmg}]
  volumes:
  - {name: work, persistentVolumeClaim: {claimName: tools}}
