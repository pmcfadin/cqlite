[package]
name = "cqlite-node"
publish = false  # published to npm via napi-rs, not crates.io
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Node.js bindings for CQLite SSTable reader"

[lib]
crate-type = ["cdylib"]

[features]
default = []
write-support = ["cqlite-core/write-support"]

[dependencies]
cqlite-core = { path = "../../cqlite-core", features = ["state_machine", "all-compression", "cli-helpers", "parquet"] }
napi = { workspace = true, features = ["async", "napi9", "tokio_rt", "serde-json"] }
napi-derive = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
thiserror = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { version = "1.6", features = ["v4"] }
base64 = "0.22"
hex = "0.4"

[build-dependencies]
napi-build = { workspace = true }

[lints]
workspace = true
