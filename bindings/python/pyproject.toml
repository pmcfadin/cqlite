[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "cqlite-py"
version = "0.10.1"
description = "Python bindings for CQLite - read Cassandra 5.0 SSTables locally without a cluster"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT OR Apache-2.0"}
keywords = ["cassandra", "sstable", "database", "nosql", "cql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Homepage = "https://github.com/pmcfadin/cqlite"
Repository = "https://github.com/pmcfadin/cqlite"
Documentation = "https://github.com/pmcfadin/cqlite/tree/main/bindings/python"
Issues = "https://github.com/pmcfadin/cqlite/issues"
Changelog = "https://github.com/pmcfadin/cqlite/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.0"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "cqlite._cqlite"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
