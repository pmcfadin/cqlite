[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "cqlite-py"
version = "0.16.1"
description = "Python bindings for CQLite - read Cassandra 5.0 SSTables locally without a cluster"
readme = "README.md"
# Issue #1459: this floor is now TESTED, not merely advertised — the
# `smoke-floors` job in .github/workflows/python-ci.yml installs the cp39-abi3
# wheel on 3.9 (the floor), 3.13 (an additional compatibility leg) and 3.14
# (the current top of the advertised range) and runs an import plus one real
# query on each. Raising or lowering this line means changing that matrix in the
# same commit. Note this range is UNBOUNDED above, so its top is the newest
# released CPython, not the newest classifier below.
requires-python = ">=3.9"
license = {text = "MIT OR Apache-2.0"}
keywords = ["cassandra", "sstable", "database", "nosql", "cql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    # 3.13 and 3.14 are claimed only because the floor matrix actually
    # exercises them (issue #1459); 3.10/3.11 are covered transitively by abi3
    # plus the tested boundaries. `requires-python` is unbounded, so the newest
    # released CPython is part of the advertised range whether or not it is
    # listed here — which is why it is TESTED, not merely claimed.
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Homepage = "https://github.com/pmcfadin/cqlite"
Repository = "https://github.com/pmcfadin/cqlite"
Documentation = "https://github.com/pmcfadin/cqlite/tree/main/bindings/python"
Issues = "https://github.com/pmcfadin/cqlite/issues"
Changelog = "https://github.com/pmcfadin/cqlite/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.0"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "cqlite._cqlite"
# Panic-unwind firewall (issue #1440). maturin honors this `profile` key on ALL
# build paths, including the PEP 517 backend that `pip install .` / sdist builds
# invoke (`maturin pep517 build-wheel`), whose DEFAULT profile is `release`
# (panic = "abort"). Without this pin a source-installed wheel would ship WITHOUT
# the PyO3 catch_unwind->exception firewall. `release-unwind` inherits from
# `[profile.release]` but keeps `panic = "unwind"` so a core panic surfaces as a
# catchable CqliteError instead of aborting the host process.
# NOTE: this pin is global to maturin, so it also flips `maturin develop`'s
# default from debug to release-unwind. For a fast debug dev loop, override it:
#   maturin develop --profile dev   (CLI --profile wins over this pin).
profile = "release-unwind"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
