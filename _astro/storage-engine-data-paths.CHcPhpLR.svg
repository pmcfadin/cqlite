<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">Storage engine proposal data paths</title>
  <desc id="desc">Cold path, fresh tail path, and research path for the CQLite storage-engine proposal.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3c485f"/>
    </marker>
  </defs>
  <rect width="1180" height="520" rx="24" fill="#f8fafc"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="52" y="70" font-size="28" font-weight="760" fill="#162033">Three paths in the first proposal</text>
    <text x="52" y="100" font-size="16" fill="#59677e">The public page explains runtime data movement and how research becomes roadmap work.</text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="52" y="144" width="1076" height="88" rx="16" fill="#ffffff" stroke="#ccd6e6" stroke-width="2"/>
    <text x="82" y="179" font-size="20" font-weight="750" fill="#162033">Cold path</text>
    <g font-size="15" font-weight="700" fill="#2d3950">
      <rect x="210" y="162" width="130" height="42" rx="9" fill="#eef5ff" stroke="#c8d9fa"/>
      <text x="242" y="188">SSTables</text>
      <rect x="412" y="162" width="130" height="42" rx="9" fill="#eef5ff" stroke="#c8d9fa"/>
      <text x="455" y="188">CQLite</text>
      <rect x="614" y="162" width="130" height="42" rx="9" fill="#eef5ff" stroke="#c8d9fa"/>
      <text x="656" y="188">Flight</text>
      <rect x="816" y="162" width="130" height="42" rx="9" fill="#eef5ff" stroke="#c8d9fa"/>
      <text x="863" y="188">Trino</text>
      <rect x="984" y="162" width="110" height="42" rx="9" fill="#eef5ff" stroke="#c8d9fa"/>
      <text x="1013" y="188">Iceberg</text>
    </g>
    <path d="M340 183 L412 183" stroke="#3c485f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M542 183 L614 183" stroke="#3c485f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M744 183 L816 183" stroke="#3c485f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M744 183 C810 226 910 226 984 190" stroke="#3c485f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="52" y="260" width="1076" height="88" rx="16" fill="#ffffff" stroke="#ccd6e6" stroke-width="2"/>
    <text x="82" y="295" font-size="20" font-weight="750" fill="#162033">Fresh tail path</text>
    <g font-size="15" font-weight="700" fill="#2d3950">
      <rect x="210" y="278" width="130" height="42" rx="9" fill="#eefaf7" stroke="#bfebe0"/>
      <text x="256" y="304">Write</text>
      <rect x="412" y="278" width="130" height="42" rx="9" fill="#eefaf7" stroke="#bfebe0"/>
      <text x="443" y="304">Memtable</text>
      <rect x="614" y="278" width="130" height="42" rx="9" fill="#eefaf7" stroke="#bfebe0"/>
      <text x="653" y="304">gen-*</text>
      <rect x="816" y="278" width="130" height="42" rx="9" fill="#eefaf7" stroke="#bfebe0"/>
      <text x="859" y="304">Merge</text>
      <rect x="984" y="278" width="110" height="42" rx="9" fill="#eefaf7" stroke="#bfebe0"/>
      <text x="1020" y="304">Query</text>
    </g>
    <path d="M340 299 L412 299" stroke="#3c485f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M542 299 L614 299" stroke="#3c485f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M744 299 L816 299" stroke="#3c485f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M946 299 L984 299" stroke="#3c485f" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="52" y="376" width="1076" height="88" rx="16" fill="#ffffff" stroke="#ccd6e6" stroke-width="2"/>
    <text x="82" y="411" font-size="20" font-weight="750" fill="#162033">Research path</text>
    <g font-size="15" font-weight="700" fill="#2d3950">
      <rect x="210" y="394" width="130" height="42" rx="9" fill="#fff8ec" stroke="#f0d3a9"/>
      <text x="244" y="420">Raw notes</text>
      <rect x="412" y="394" width="130" height="42" rx="9" fill="#fff8ec" stroke="#f0d3a9"/>
      <text x="446" y="420">Synthesis</text>
      <rect x="614" y="394" width="130" height="42" rx="9" fill="#fff8ec" stroke="#f0d3a9"/>
      <text x="647" y="420">Proposal</text>
      <rect x="816" y="394" width="130" height="42" rx="9" fill="#fff8ec" stroke="#f0d3a9"/>
      <text x="864" y="420">Tasks</text>
      <rect x="984" y="394" width="110" height="42" rx="9" fill="#fff8ec" stroke="#f0d3a9"/>
      <text x="1010" y="420">Roadmap</text>
    </g>
    <path d="M340 415 L412 415" stroke="#3c485f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M542 415 L614 415" stroke="#3c485f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M744 415 L816 415" stroke="#3c485f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M946 415 L984 415" stroke="#3c485f" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
