# #3299 S-sweep worker: ONE bare scan, pinned to ONE physical core, emitting
# timestamped progress so an ALIGNED concurrency window can be computed.
#
# Its own `[workspace]` table keeps it OUT of the repo workspace, so the agent
# gate never builds it and `cargo build` at the repo root is unaffected. Path
# deps are RELATIVE (the #3026 harness hardcoded an absolute `/home/ubuntu/...`
# path, which is unbuildable in any other checkout).
[package]
name = "ws0-3299-scan-worker"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

# HOW THE MEASURED BINARY IS PINNED. This crate sits OUTSIDE the repo workspace
# (see the `[workspace]` table above), so the root `Cargo.lock` does not reach it.
# Two mechanisms, and it takes both:
#
#   1. `Cargo.lock` BESIDE THIS FILE, committed, pinning the whole TRANSITIVE
#      closure; `sweep.sh` builds `cargo build --release --locked`, so a drifted
#      or absent lockfile FAILS the build instead of silently re-resolving. This
#      is the mechanism that actually makes the binary reproducible.
#   2. The `=`-exact direct requirements below, which state the intended version
#      in the file a reviewer receives — roborev's compiled-in `**/Cargo.lock`
#      deny-list (#3278) means the lockfile itself never reaches a review diff.
#      `check-exact-pins.py` asserts the two AGREE, so neither drifts alone.
#
# `=` alone was NOT sufficient and was the round-4 finding: exact DIRECT pins say
# nothing about transitive versions, so `cargo build` months later still resolves
# a different graph and measures different codegen. The versions below are the
# ones ACTUALLY USED for the published measurements in ../../ws0-3299-report.md
# (rustc 1.97.1, the repo's pinned toolchain).
[dependencies]
# EXACTLY the feature set `tools/ws0-corpus-gen` gives cqlite-core for
# `ws0-scan-bench`: `cli-helpers` only, and deliberately NOT `arrow` — the bare
# scan arm must exclude Arrow encode. The two path deps are pinned by the REPO
# COMMIT, which is why they carry no version requirement.
cqlite-core = { path = "../../../../../cqlite-core", features = ["cli-helpers"] }
# The rig's OWN scope-verification and pinned-schema helpers, reused rather than
# copied, so the setup path here cannot drift from `ws0-scan-bench`'s.
ws0-corpus-gen = { path = "../../../../../tools/ws0-corpus-gen" }
clap = { version = "=4.6.6", features = ["derive"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros"] }
serde_json = "=1.0.151"
libc = "=0.2.189"

# Mirror the repo's [profile.release] EXACTLY (codegen-units=1, lto, panic=abort)
# so this worker measures the same codegen `ws0-scan-bench` is built with. `strip`
# is left off so the binary stays symbolised for any follow-up `perf record`.
[profile.release]
codegen-units = 1
lto = true
panic = "abort"
