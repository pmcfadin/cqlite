# CQLite Configuration File
#
# This is a project-level config file (.cqlite.toml) that reduces command-line verbosity.
# Place this file in your project root to set default options for cqlite CLI.
#
# Precedence: CLI flags > env vars > explicit --config > .cqlite.toml > user config > defaults
#
# For user-level config (affects all projects), create:
#   - macOS: ~/Library/Application Support/cqlite/config.toml
#   - Linux: ~/.config/cqlite/config.toml
#   - Windows: %AppData%\cqlite\config.toml

# =============================================================================
# Core Data Settings (M2 CLI)
# =============================================================================

# Cassandra data directory root (where SSTables are stored)
# This is typically /var/lib/cassandra/data for production Cassandra installations
# For testing, point to your local test data directory
data_directory = "./test-data/datasets"

# Schema file paths (can be .cql or .json files, or directories)
# Multiple paths are supported - list them as an array
schema_paths = ["./test-data/schemas"]

# Default keyspace to use when not specified in queries
# Optional - if not set, you'll need to use fully qualified table names
default_keyspace = "test_keyspace"

# =============================================================================
# Query Execution Settings
# =============================================================================

# Output format for query results
# Options: "table" (cqlsh-compatible), "json", "csv"
# Default: "table"
out = "table"

# Maximum number of rows to return from queries
# Optional - if not set, no limit is applied
# Useful to prevent accidentally returning huge datasets
query_limit = 1000

# =============================================================================
# Display Settings
# =============================================================================

# Disable colored output (useful for log files or terminals without color support)
# Default: false (colors enabled)
no_color = false

# =============================================================================
# REPL Settings
# =============================================================================

[repl]
# Enable command history in REPL mode
enable_history = true

# Enable tab completion in REPL mode
enable_completion = true

# Enable colored output in REPL
enable_colors = true

# Show query execution timing after each query
show_timing = false

# Number of rows per page in paginated output
page_size = 50

# Enable pagination for large result sets
enable_paging = true

# Maximum number of history entries to keep
max_history_size = 1000

# Custom REPL prompt
prompt = "cqlite> "

# Continuation prompt for multi-line statements
prompt_continuation = "    -> "

# Path to history file (optional - defaults to platform-specific location)
# history_file = "~/.cqlite_history"

# =============================================================================
# Output Formatting
# =============================================================================

[output]
# Maximum rows to display (for very large result sets)
# Optional - if not set, displays all rows within query_limit
# max_rows = 1000

# External pager command for large outputs (e.g., "less", "more")
# Optional - if not set, outputs directly to terminal
# pager = "less -R"

# Enable colored output in formatted tables
colors = true

# Timestamp format string (strftime-compatible)
timestamp_format = "%Y-%m-%d %H:%M:%S"

# =============================================================================
# Cassandra Version Hints
# =============================================================================

# Cassandra version hint for format compatibility
# Helps the parser detect the correct SSTable format
# Options: "5.0", "4.0", "3.11", etc.
# If not set, version is auto-detected from SSTables
cassandra_version = "5.0"

# Enable auto-detection of format and version from SSTable metadata
# Recommended: true (unless you need to force a specific version)
auto_detect = true

# =============================================================================
# Connection Settings (for future cluster support)
# =============================================================================

[connection]
# Connection timeout in milliseconds
timeout_ms = 30000

# Number of retry attempts for failed operations
retry_attempts = 3

# Connection pool size
pool_size = 10

# =============================================================================
# Performance Settings
# =============================================================================

[performance]
# Query execution timeout in milliseconds
query_timeout_ms = 30000

# Memory limit in MB (optional - helps prevent OOM on large queries)
# If not set, no memory limit is enforced
# memory_limit_mb = 512

# Cache size in MB for frequently accessed data
cache_size_mb = 64

# =============================================================================
# Logging Settings
# =============================================================================

[logging]
# Log level: "error", "warn", "info", "debug", "trace"
level = "info"

# Log file path (optional - if not set, logs to stderr)
# file = "/var/log/cqlite/cqlite.log"

# Log format: "Plain", "Json", "Pretty"
format = "Pretty"

# =============================================================================
# Usage Examples
# =============================================================================

# With this config file in place, you can run:
#
#   # One-shot query (uses config defaults)
#   cqlite -e "SELECT * FROM users LIMIT 5"
#
#   # Override config with CLI flags (CLI wins)
#   cqlite --out json -e "SELECT * FROM users LIMIT 5"
#
#   # Start REPL (uses config defaults)
#   cqlite repl
#
#   # Use explicit config file (overrides .cqlite.toml)
#   cqlite --config production.toml -e "SELECT * FROM users"
#
# Precedence chain ensures CLI flags always win:
#   CLI flags > env vars > --config file > .cqlite.toml > user config > defaults
