[package]
name = "cqlite-flight"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Arrow Flight server exposing on-the-fly compacted CQLite SSTable data"
publish = false

[dependencies]
# Conversion + merge engine. `arrow` brings the CQL->Arrow RecordBatch converter
# (cqlite-core::export::arrow_convert); default features bring the write_engine
# k-way merge (write-support) and the query engine (state_machine).
cqlite-core = { path = "../cqlite-core", features = ["arrow"] }

arrow = { workspace = true, features = ["ipc"] }
arrow-flight = "53"
tonic = "0.12"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
# `CancellationToken` — an async-wakeable cooperative-cancellation signal so the
# `do_get` merge producer's backpressure park (`ChannelSink::emit`) can race a
# client disconnect instead of blocking forever in `blocking_send` (issue #2264).
tokio-util = "0.7"
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# DataFusion — OPTIONAL, behind the non-default `datafusion-spike` feature
# (issue #2605). PINNED to 44.0.0 and deliberately NOT upgradeable here: DF 44 is
# the LAST line that resolves `arrow` 53.x (verified: DF 44.0.0 -> arrow 53.4.1,
# the EXACT version `cqlite-flight`/`arrow-flight 53` already use). DF >= 45 moves
# to arrow 54, which forks the Arrow type graph — two structurally identical but
# mutually incompatible `RecordBatch`/`Schema` types in one binary — and destroys
# the whole premise of this spike, which is to hand DataFusion the batches the
# EXISTING Flight producer already builds with ZERO conversion. If this ever fails
# to build, report it; do NOT bump the major.
#
# `default-features = false` + an explicit feature list: the spike needs the
# execution engine and the SQL front end, and nothing that would drag in a second
# object-store/parquet stack we do not read through.
datafusion = { version = "=44.0.0", optional = true, default-features = false }
# `#[async_trait]` is required to IMPLEMENT `datafusion::catalog::TableProvider`
# (the trait itself is declared with it), so it is not an optional nicety — it is
# part of that trait's ABI. Optional and gated with DataFusion; pinned to the
# same 0.1 line the rest of the tree (tonic) already resolves, so it adds no new
# crate to the lock.
async-trait = { version = "0.1", optional = true }

# Observability / OpenTelemetry — optional, behind the `observability` feature.
# Used for incoming W3C `traceparent` extraction (global text-map propagator)
# and parenting per-RPC spans to the extracted remote context. The catalog
# metric helpers and span macros do NOT need these crates here — they go
# through `cqlite_core::observability`, which is no-op when its own feature is
# off. These are required only for cross-process trace-context propagation.
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

# jemalloc as the process-wide allocator for the SERVER BINARY ONLY, behind the
# non-default `jemalloc` feature (issue #3997). LINUX-ONLY BY PLACEMENT: the
# allocator is a Linux-production concern (the #3551 rig, the Trino/Helm
# deployment), and jemalloc's C source is compiled from scratch by
# `tikv-jemalloc-sys`' build script — so keeping the dependency under a target
# `cfg` means a macOS/Windows developer build never pays for a C toolchain it
# has no use for. The `#[global_allocator]` use site in `src/main.rs` is
# ADDITIONALLY cfg-gated on `target_os = "linux"`, so an off-Linux build with
# `--features jemalloc` is inert rather than broken.
#
# Pinned to the `0.6` line deliberately, because the pin has to match the
# jemalloc version #3551 MEASURED. VERIFIED, not assumed: this resolves
# `tikv-jemallocator 0.6.1` -> `tikv-jemalloc-sys
# 0.6.1+5.3.0-1-ge13ca993e8ccb9ba9847cc330696e02839f328f7`, whose `+` build
# metadata names the vendored jemalloc release, and the vendored tree confirms
# it independently (`jemalloc/ChangeLog`'s newest release entry is
# `5.3.0 (May 6, 2022)`, and `build.rs` passes that same metadata to jemalloc's
# `configure --with-version`). #3551 measured `LD_PRELOAD` of the rig's distro
# `libjemalloc.so.2`, which is **5.3.0** — so this is the same major.minor, as
# task 0.3 requires. The newer `0.7` line bundles 5.3.1; taking it would make
# the linked build a different allocator release from the one the `LD_PRELOAD`
# baseline was measured against. Bump this only alongside a re-measurement.
#
# NOT in `default` here: the default posture is decided by the linked-build
# A-vs-E measurement (requirement R3), not by this manifest. The feature exists
# and is off.
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }

[features]
# Off by default: the Flight server is normally run without an OTLP collector,
# and enabling OTel pulls in the exporter stack. Turn it on explicitly with
# `--features observability` (and set CQLITE_OTEL_ENABLED=1 at runtime). This
# also activates cqlite-core's `observability` feature so the shared metric
# helpers and `tracing_layer()` export, and pulls in the propagator crates used
# for incoming `traceparent` parenting.
default = []
observability = [
    "cqlite-core/observability",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]
# THROWAWAY SPIKE, off by default (issue #2605): a thin DataFusion
# `TableProvider`/`ExecutionPlan` over the EXISTING Flight merge-producer scan
# path, plus the bench harness that compares vectorized DataFusion execution
# against the row engine over IDENTICAL batches. It exists to produce ONE
# measurement — the decode-to-column delta and the vectorized-exec delta as
# separate figures (throughput program M15) — for the #941 promotion decision.
#
# Why a feature and not a separate crate: the batch-production seam it drives
# (`MergeProducer::produce_streaming` + the `BatchSink` trait) is `pub(crate)`,
# so the provider MUST live inside `cqlite-flight`. Why non-default: it pulls
# the whole DataFusion dependency tree (see the pinned `datafusion` dep above)
# into a crate that ships an Arrow Flight server, and NOTHING in production
# reads it — there is no service route, no ticket field and no CLI flag that
# reaches this module. Deleting the feature deletes the spike.
datafusion-spike = ["dep:datafusion", "dep:async-trait"]
# Test-only: pull in cqlite-core's shared in-memory OTLP capture harness
# (`observability::testing`) so the #2162 phase/attribute assertions can read
# back the emitted `cqlite.rpc.phase.duration` / `cqlite.rpc.rows` /
# `cqlite.query.rows_scanned` series. NOT in defaults; enables the gated
# `metrics_capture_tests` module. Run:
#   cargo test -p cqlite-flight --features observability-testing
observability-testing = ["cqlite-core/observability-testing"]
# Test-only: compile the shared byte-pin infrastructure (`test_fixtures` — the
# single-source-of-truth `keyvalue` field shape + the wire-metadata-order guard,
# issues #2283/#2285). Kept OUT of the default build so this fixture/guard code
# never ships in the production `cqlite-flight` library or binary. Enabled
# automatically for the `examples/`/`tests/` targets via the self-referential
# dev-dependency below (Cargo unifies features, so `cargo test`/`cargo build
# --examples` build the lib with `test-util` on), following the same
# feature-declaration convention as `observability-testing`.
test-util = []
# Test-only: install the dhat global allocator in the `issue_1494_producer_mem_budget`
# test binary (issue #1494, AD5) so it can observe the Flight producer's total/peak
# allocation. Never in defaults — it stays confined to that one gated test binary.
dhat-heap = []
# Link jemalloc as the process-wide `#[global_allocator]` of the `cqlite-flight`
# BINARY (issue #3997, requirement R1). Off by default until the arm-A-vs-arm-E
# measurement on the #3551 rig says otherwise (requirement R3); build with
# `cargo build -p cqlite-flight --features jemalloc`. The dependency is declared
# under a `cfg(target_os = "linux")` target section above, and the install site
# in `src/main.rs` repeats that `cfg`, so this feature is a no-op off Linux —
# `cqlite-flight --version` then reports `allocator: system`, which is the truth.
# Confined to the BIN target by construction: `main.rs` is compiled into the
# binary only, so the library target that `tools/flight-loadgen`, the benches and
# every integration test link never carries an allocator
# (`scripts/tests/test_flight_allocator_confinement.sh` pins this structurally).
jemalloc = ["dep:tikv-jemallocator"]

[dev-dependencies]
# Enable cqlite-core's SHARED Arrow row-shape corpus (issue #2932) for TESTS
# ONLY, so `batch_bytes_tests::the_capacity_bound_holds_over_the_shared_shape_corpus`
# asserts the published payload->capacity conversion over exactly the corpus the
# estimator's conservatism contract is validated against — rather than a
# hand-written subset, which is how the slack under-count reached a fail-closed
# runtime check. Dev-only: `cargo build -p cqlite-flight` does not compile it.
# `producer-fault-injection` (issue #3106) additionally enables the TEST-ONLY
# `storage::producer_fault` arming API, so `issue_3106_producer_panic_fails_closed`
# can kill the single-source query row stream's producer thread mid-`do_get` and
# prove the RPC fails closed instead of completing with a truncated result set.
# Dev-only: `cargo build -p cqlite-flight` does not compile either flag.
cqlite-core = { path = "../cqlite-core", features = [
    "arrow",
    "arrow-shape-corpus",
    "producer-fault-injection",
] }
tempfile = { workspace = true }
# `test-util` enables the paused/auto-advancing Tokio clock (`tokio::time::pause`)
# so the #2420 admission-control tests drive the permit-wait timeout
# deterministically (no wall-clock sleep). Dev-only: never compiled into the
# production `cqlite-flight` binary.
tokio = { workspace = true, features = ["test-util"] }
# Criterion for the end-to-end `flight_do_get` throughput bench (issue #1494,
# AD5). ADVISORY perf-gate entry — its wall time is Tokio-runtime + tonic-
# transport dominated (the `write/ingest_wal_on` precedent), so it is reported
# but never fails CI; the hard signal for the producer path is the dhat budget.
criterion = { workspace = true }
# Serialize the tests that read the PROCESS-GLOBAL decompress counters
# (`SSTableReader::decompress_call_count`) against one another — a concurrent
# scan in the same binary would inflate the count (issue #2373).
serial_test = "3"
# NOTE (issue #3096): the `ws0.events` CI PERFORMANCE FIXTURE that
# `tests/issue_3096_arrow_buffer_digest.rs` and
# `tests/issue_3096_framing_subphase.rs` build is written by the self-contained
# `tests/support/ws0_fixture.rs` support module — no extra dependency, and the
# tests need no fetched dataset. The MEASUREMENT RIG (corpus-generator CLI,
# bare-scan bench, `perf` driver scripts) is re-anchored to issue #3272. The
# fixture is CQLite-written + CQLite-read and is a PERFORMANCE FIXTURE ONLY
# (#3042) — the oracle asserts ARM-INVARIANCE over it, never an on-disk framing
# correctness claim.

# dhat allocator for the Flight-producer peak-memory budget test (issue #1494),
# installed only under the `dhat-heap` feature in that one test binary.
dhat = "0.3"
# Self-referential dev-dependency enabling the `test-util` feature, so the
# `examples/emit_arrow_golden.rs` example and the `tests/*` integration targets
# can reach `cqlite_flight::test_fixtures` (the shared `keyvalue` byte-pin
# fixture + wire-metadata guard) WITHOUT that module being reachable from a real
# consumer of the published library. `cargo test`/`cargo build --examples`
# unify this feature onto the lib build; `cargo build`/the binary do not.
cqlite-flight = { path = ".", features = ["test-util"] }
# The golden emitter (`examples/emit_arrow_golden.rs`) length-delimit-encodes
# the encoder's `FlightData` protobuf messages to a golden file, and the
# transport test (`tests/do_get_transport_test.rs`) length-delimit-DECODES that
# same committed golden to cross-check it against the live wire bytes; pinned
# to the same prost line arrow-flight 53 uses so the `Message` impl unifies.
prost = "0.13"

# End-to-end Flight `do_get` throughput bench (issue #1494, AD5). Drives the
# PUBLIC tonic `FlightService::do_get` RPC over a real loopback transport
# (reusing the `tests/do_get_transport_test.rs` harness pattern) — wiring
# evidence for the RPC path. ADVISORY perf-gate entry (`flight/do_get`).
[[bench]]
name = "flight_do_get"
harness = false

# THROWAWAY SPIKE harness (issue #2605): the 3-scenario x 4-arm DataFusion vs
# row-engine measurement binary. `required-features` keeps it out of every
# default build — `cargo build -p cqlite-flight` does not compile it, and neither
# does the gate.
[[bin]]
name = "df_spike_bench"
path = "src/bin/df_spike_bench.rs"
required-features = ["datafusion-spike"]

# Flight-producer allocation/peak-memory budget guard (issue #1494, AD5). dhat
# global allocator in its OWN test binary; only built with `dhat-heap`. The
# `memory-budget` gate component runs it.
[[test]]
name = "issue_1494_producer_mem_budget"
required-features = ["dhat-heap"]

[lints]
workspace = true
