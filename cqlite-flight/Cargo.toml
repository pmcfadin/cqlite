[package]
name = "cqlite-flight"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Arrow Flight server exposing on-the-fly compacted CQLite SSTable data"
publish = false

[dependencies]
# Conversion + merge engine. `arrow` brings the CQL->Arrow RecordBatch converter
# (cqlite-core::export::arrow_convert); default features bring the write_engine
# k-way merge (write-support) and the query engine (state_machine).
cqlite-core = { path = "../cqlite-core", features = ["arrow"] }

arrow = { workspace = true, features = ["ipc"] }
arrow-flight = "53"
tonic = "0.12"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
# `CancellationToken` — an async-wakeable cooperative-cancellation signal so the
# `do_get` merge producer's backpressure park (`ChannelSink::emit`) can race a
# client disconnect instead of blocking forever in `blocking_send` (issue #2264).
tokio-util = "0.7"
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Observability / OpenTelemetry — optional, behind the `observability` feature.
# Used for incoming W3C `traceparent` extraction (global text-map propagator)
# and parenting per-RPC spans to the extracted remote context. The catalog
# metric helpers and span macros do NOT need these crates here — they go
# through `cqlite_core::observability`, which is no-op when its own feature is
# off. These are required only for cross-process trace-context propagation.
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[features]
# Off by default: the Flight server is normally run without an OTLP collector,
# and enabling OTel pulls in the exporter stack. Turn it on explicitly with
# `--features observability` (and set CQLITE_OTEL_ENABLED=1 at runtime). This
# also activates cqlite-core's `observability` feature so the shared metric
# helpers and `tracing_layer()` export, and pulls in the propagator crates used
# for incoming `traceparent` parenting.
default = []
observability = [
    "cqlite-core/observability",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]
# Test-only: pull in cqlite-core's shared in-memory OTLP capture harness
# (`observability::testing`) so the #2162 phase/attribute assertions can read
# back the emitted `cqlite.rpc.phase.duration` / `cqlite.rpc.rows` /
# `cqlite.query.rows_scanned` series. NOT in defaults; enables the gated
# `metrics_capture_tests` module. Run:
#   cargo test -p cqlite-flight --features observability-testing
observability-testing = ["cqlite-core/observability-testing"]
# Test-only: compile the shared byte-pin infrastructure (`test_fixtures` — the
# single-source-of-truth `keyvalue` field shape + the wire-metadata-order guard,
# issues #2283/#2285). Kept OUT of the default build so this fixture/guard code
# never ships in the production `cqlite-flight` library or binary. Enabled
# automatically for the `examples/`/`tests/` targets via the self-referential
# dev-dependency below (Cargo unifies features, so `cargo test`/`cargo build
# --examples` build the lib with `test-util` on), following the same
# feature-declaration convention as `observability-testing`.
test-util = []

[dev-dependencies]
tempfile = { workspace = true }
# Self-referential dev-dependency enabling the `test-util` feature, so the
# `examples/emit_arrow_golden.rs` example and the `tests/*` integration targets
# can reach `cqlite_flight::test_fixtures` (the shared `keyvalue` byte-pin
# fixture + wire-metadata guard) WITHOUT that module being reachable from a real
# consumer of the published library. `cargo test`/`cargo build --examples`
# unify this feature onto the lib build; `cargo build`/the binary do not.
cqlite-flight = { path = ".", features = ["test-util"] }
# The golden emitter (`examples/emit_arrow_golden.rs`) length-delimit-encodes
# the encoder's `FlightData` protobuf messages to a golden file, and the
# transport test (`tests/do_get_transport_test.rs`) length-delimit-DECODES that
# same committed golden to cross-check it against the live wire bytes; pinned
# to the same prost line arrow-flight 53 uses so the `Message` impl unifies.
prost = "0.13"

[lints]
workspace = true
