connector.name=cqlite_flight
cqlite.sidecar-uri=http://172.42.0.2:9043
cqlite.flight-port=8815
cqlite.local-datacenter=dc1
# Read mode (issue #2105): snapshot (default; consistent per-query Sidecar snapshot) or
# live (current data dir, races compaction). Uncomment to force live for stress-hunting.
# cqlite.read-mode=snapshot
# cqlite.snapshot-ttl=6h
# Aggregation-pushdown gate (issue #893); GROUP BY only — global aggregates always push.
# cqlite.aggregation-pushdown-group-by=automatic
# cqlite.aggregation-pushdown-max-group-ratio=0.5
# Weight-balanced sub-splitting (issue #2680): DEFAULT (4). Pinned explicitly so the E2E LIMIT-hang
# regression provably runs on the multi-split path (the shape that surfaced the #2782 hang) — a
# pushed LIMIT / point read still auto-plans at K=1 in getSplits regardless of this value.
cqlite.sub-splits-per-range=4
