# Minimal Cassandra Sidecar config for the co-located single-node E2E.
# The Sidecar shares Cassandra's network namespace, so Cassandra is reachable at
# 127.0.0.1 and JMX at 7199 (the compose sets LOCAL_JMX=no).
cassandra_instances:
  - id: 1
    host: 127.0.0.1
    port: 9042
    storage_dir: /var/lib/cassandra
    data_dirs:
      - /var/lib/cassandra/data
    staging_dir: /var/lib/cassandra/sstable-staging
    jmx_host: 127.0.0.1
    jmx_port: 7199
    jmx_ssl_enabled: false

sidecar:
  host: 0.0.0.0
  port: 9043
  request_idle_timeout: 5m
  request_timeout: 5m
