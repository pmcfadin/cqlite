[package]
name = "cqlite-integration-tests"
version.workspace = true
edition.workspace = true
publish = false
description = "Comprehensive test suite for CQLite Cassandra 5+ compatibility"

[lib]
name = "cqlite_tests"
path = "src/lib.rs"

[dependencies]
cqlite-core = { path = "../cqlite-core", features = [] }

# Test dependencies
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "test-util"] }
tempfile = { workspace = true }
assert_cmd = "2.0"
predicates = "3.0"
criterion = { workspace = true }
proptest = { workspace = true }
anyhow = "1.0"

# Async testing
tokio-test = "0.4"

# Serialization for test data
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"

# Logging for tests
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
env_logger = "0.11"

# Additional dependencies for Phase 2 testing
rand = "0.8"
num_cpus = "1.0"

# Parser and data handling dependencies
nom = "7.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
regex = "1.10"

# Command line interface for test runner
clap = { version = "4.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

crc32fast = { workspace = true }

# Additional missing dependencies for test compilation
colored = { workspace = true }
hex = "0.4"
base64 = "0.22"
futures = { workspace = true }
parking_lot = { workspace = true }
insta = "1.34"

# Benchmarks temporarily disabled for M1 milestone due to compilation issues
# [[bench]]
# name = "end_to_end_bench"
# harness = false
# path = "benchmarks/end_to_end_bench.rs"

# [[bench]]
# name = "performance_suite"
# harness = false
# path = "benchmarks/performance_suite.rs"

# [[bench]]
# name = "load_testing"
# harness = false
# path = "benchmarks/load_testing.rs"

# [[bench]]
# name = "compatibility_testing"
# harness = false
# path = "benchmarks/compatibility_testing.rs"

# Test runner executables
[[bin]]
name = "compatibility_test_runner"
path = "src/bin/compatibility_test_runner.rs"

[[bin]]
name = "complex_type_validation_runner"
path = "src/bin/complex_type_validation_runner.rs"

# sstable_test_runner removed in Issue #176 - depends on SSTableWriter which was removed
# [[bin]]
# name = "sstable_test_runner"
# path = "src/bin/sstable_test_runner.rs"
# required-features = ["sstable-writer"]

[[bin]]
name = "property_based_test_runner"
path = "src/bin/property_based_test_runner.rs"

[[bin]]
name = "performance_regression_test_runner"
path = "src/bin/performance_regression_test_runner.rs"

[[bin]]
name = "issue_17_test_runner"
path = "src/bin/issue_17_test_runner.rs"

# Integration tests
[[test]]
name = "integration_e2e"
path = "src/integration_e2e.rs"

[[test]]
name = "index_summary_statistics_smoke"
path = "integration/index_summary_statistics_smoke.rs"

# Cassandra 5 compatibility tests
[[test]]
name = "cassandra5_header_tests"
path = "cassandra5_header_tests.rs"

[[test]]
name = "cassandra5_smoke_test"
path = "cassandra5_smoke_test.rs"

[[test]]
name = "cassandra5_simple_test"
path = "cassandra5_simple_test.rs"

[[test]]
name = "comprehensive_component_integration_tests"
path = "comprehensive_component_integration_tests.rs"

[[test]]
name = "fixture_specific_integration_tests"
path = "fixture_specific_integration_tests.rs"

[[test]]
name = "golden_path_get_operations_tests"
path = "golden_path_get_operations_tests.rs"

[[test]]
name = "golden_path_partition_lookup_tests"
path = "golden_path_partition_lookup_tests.rs"

[[test]]
name = "golden_path_scan_operations_tests"
path = "golden_path_scan_operations_tests.rs"

[[test]]
name = "golden_path_summary_index_integration_tests"
path = "golden_path_summary_index_integration_tests.rs"

[features]
default = []
benchmarks = []
ci_zero_tolerance = []
experimental = ["cqlite-core/experimental"]
legacy-heuristics = ["cqlite-core/legacy-heuristics"]
# sstable-writer feature disabled - writer module removed in Issue #176
# This feature is a placeholder to allow conditional compilation of tests
# that depend on SSTableWriter until it is re-implemented
sstable-writer = []

# Issue #80: Mock usage control - unit tests only
unit-tests-only = ["cqlite-core/unit-tests-only"]  # Enables mock/synthetic data usage for unit tests (disabled in CI integration paths)

