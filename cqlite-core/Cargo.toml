[package]
name = "cqlite-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Core engine for CQLite — read Apache Cassandra 5.0 SSTables locally without a cluster"
readme = "../README.md"

# Not packaged: this integration test reads a fixture that lives at REPO ROOT
# (`test-data/datasets/…`), outside this package, so `cargo package` cannot carry it.
# The test fails CLOSED on a missing fixture by design (#3220) — committed source is
# never legitimately absent in a checkout — so shipping it in the published crate
# would make `cargo test` fail for a consumer who can never satisfy it.
#
# Excluding it from the PACKAGE is the fix that keeps both properties: fail-closed in
# a repository checkout, and absent (rather than skipping) where the fixture cannot
# exist. A skip would reintroduce exactly the vacuous green #3220 removed, and a
# "am I a git checkout?" runtime probe would be the environment heuristic #28 forbids.
#
# Measured effective, not assumed: `cargo package -p cqlite-core --no-verify --list`
# lists 1015 files, 0 of them this test, and 454 other `tests/` entries survive — so the
# key drops exactly one target and nothing else. (There is no `include` key, which would
# make cargo ignore `exclude` entirely.) Note this does NOT assert the crate packages
# end-to-end: `readme = "../README.md"` also points outside the package, so a full
# `cargo package` may fail on that first. Packageability is #3677's, not this lane's.
#
# This test JOINS a pre-existing class rather than creating it. #3677 measured 106
# `cqlite-core` integration tests reading repo-root `test-data/datasets`, 104 of which
# already fail hard rather than skip. Fixing the class — its recommended option (a),
# `exclude = ["tests/**"]` — is a packaging call it holds open deliberately, so the
# narrow single-file exclusion here is scoped to what this lane may decide.
#
# An earlier draft of this comment said "454 sibling integration tests have the same
# repo-root-fixture property". 454 is a real number and it is the one above — packaged
# `tests/` ENTRIES, most of which read no fixture at all — attached to a claim about a
# property it does not measure. The two counts answer different questions.
# issue_3747_empty_map_key.rs JOINS the same class for the same reason: it resolves
# `test-data/fixtures/issue_3747/` CHECKOUT-relative and fails CLOSED (a committed
# fixture is `must_run`), so a packaged copy without the fixture would always panic.
# Excluded narrowly, matching the scoping decision above rather than pre-empting
# #3677's class-wide call.
exclude = [
    "tests/issue_3358_bti_query_token_bound.rs",
    "tests/issue_3747_empty_map_key.rs",
]

# docs.rs build: document the commonly used features. Deliberately excludes
# `wasm` (wasm32-only deps would fail the default x86_64 docs.rs target).
[package.metadata.docs.rs]
features = ["all-compression", "state_machine", "write-support", "arrow", "parquet", "cli-helpers", "delta-scan"]

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time", "process"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# YAML parsing for metadata.yml (Issue #78)
serde_yaml = "0.9"

# Compression and checksums - feature-gated
lz4_flex = { workspace = true, optional = true }
snap = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
crc32fast = { workspace = true }

# Concurrency and collections
parking_lot = { workspace = true }
dashmap = { workspace = true }
# Lock-free atomic Arc swap for the per-SELECT access-path signal cell,
# replacing a process-global Mutex on the hot path (issue #1595).
arc-swap = { workspace = true }
lru = "0.16"
# Stack-backed worklist for the write-path size estimator so shallow/normal
# mutations incur ZERO heap allocation on the admission/accounting hot path
# (issue #1625). Already compiled transitively (via dashmap/parking_lot), so
# this direct dependency adds nothing to the build tree.
smallvec = "1"

# Memory management
bytes = { workspace = true }
memmap2 = { workspace = true }

# Parsing
nom = "7.1"
pest = "2.7"
pest_derive = "2.7"
hex = "0.4"
bit-vec = "0.8"
num_cpus = "1.0"
base64 = "0.21"

# Hashing for Cassandra compatibility
murmur3 = "0.5"

# Fast non-cryptographic hasher (FxHashMap) for integer/digest-keyed hot-path
# maps only — NOT for maps exposed to untrusted string keys (issue #1590, E8).
rustc-hash = "1.1"

# Arbitrary-precision integers for varint/decimal formatting (util::value_fmt)
# and the Parquet export writer's Decimal128 rescaling
num-bigint = "0.4"

# Columnar export (feature = "parquet") - optional, NOT in defaults so the
# default build's dependency surface is unchanged (Epic #682)
arrow = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }

# Features defined at end of file to avoid duplicates

# File locking for write_dir exclusivity (write-support feature only)
fs2 = { workspace = true, optional = true }

# Additional dependencies
uuid = { version = "1.10", features = ["v4"] }
regex = "1.10"
futures = "0.3"
clap = { version = "4.4", features = ["derive"] }
async-trait = "0.1.88"

# Terminal output and logging
colored = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Observability / OpenTelemetry — optional, behind the `observability` feature
# (epic #1031, issue #1032). NONE of these are pulled into the default build:
# `cargo tree -p cqlite-core` must show no opentelemetry deps unless
# `--features observability` is passed.
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry-semantic-conventions = { workspace = true, optional = true }

# Optional WASM support
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, features = ["console"], optional = true }

# Direct-I/O backend and system-memory probing need libc on Unix only
# (O_DIRECT / F_NOCACHE, sysconf). Non-Unix targets fall back to buffered I/O.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# Dev/test-only logging init (integration tests under tests/). Post the #1706
# log->tracing migration the library ships no env_logger usage, so it is a
# dev-dependency only (issue #2519, item b from #2151).
env_logger = { workspace = true }
# Heap profiling harness (examples/heap_profile.rs). The dhat allocator is only
# installed when the `dhat-heap` feature is enabled; the dependency itself is
# dev-only and never ships in the library.
dhat = "0.3"
proptest = { workspace = true }
tempfile = "3.8"
rand = "0.8"
tokio-test = "0.4"
# Direct handle to the production SAFE lz4 decoder (lz4_flex with `safe-decode`
# on, the library default) so the Stage-0 DecodePolicy bench (issue #2211,
# benches/decode_policy_bench.rs) can time the checked decode in isolation from
# the surrounding chunk-record machinery. Dev-only: the library itself reaches
# lz4_flex through the optional `lz4` feature; this makes the same crate nameable
# from the bench target regardless of feature selection.
lz4_flex = { workspace = true }
# Serialize tests that read/mutate the process-global work_counters within one
# test binary so cargo's parallel intra-binary threads cannot race the shared
# atomics between a counter test's reset() and its read (issue #1071).
serial_test = "3"
insta = { version = "1.34", features = ["json"] }
# The uniform parity failure-artifact record model + emitter (issue #1027 Wave 1).
# Dev-only: the required_parity byte/offset/checksum/JSONL parity tests emit a
# scenario-id-keyed failure bundle through this crate so every surface produces
# the identical record shape. `cassandra-parity` does NOT depend on cqlite-core,
# so this introduces no dependency cycle.
cassandra-parity = { path = "../tools/cassandra-parity" }
# cqlite-validation = { path = "../cqlite-validation" }
fastrand = "2.0"
libc = { workspace = true }
num-traits = "0.2"  # Required for BigInt conversion methods
# Full-fixture-dir hashing for the corruption-verify parity test (issue #1294).
sha2 = { workspace = true }
# Real zstd dictionary-frame generation for the zstd-dictionary fail-closed
# rejection characterization test (issue #1399). Dev-only: proves CQLite's
# decompression path rejects (never garbles) genuinely dictionary-compressed
# zstd frames. `zdict_builder` (default) provides the trained-dictionary API.
zstd = { version = "0.13", features = ["zdict_builder"] }
# Inline-CRC32 framing for the hand-built Cassandra chunk image in that same
# test (integration tests don't inherit the library's normal dependencies).
crc32fast = { workspace = true }
# Wall-clock-bounded subprocess wait for the Docker-availability probe used by
# the write-support Cassandra e2e tests: an unresponsive `docker` daemon must
# degrade to a clean SKIP instead of wedging the test binary (issue #1819,
# same hazard family as #1691/#1692). Mirrors cqlite-cli's dev-dep.
wait-timeout = "0.2"

# In-process sampling CPU profiler for the criterion benches (signal-based, so
# it works in containers and on CI runners where `perf` is unavailable).
# Unix-only: pprof does not build on Windows; benches fall back to the plain
# criterion config there (see benches/profiling/mod.rs).
[target.'cfg(unix)'.dev-dependencies]
pprof = { version = "0.14", features = ["flamegraph", "criterion"] }

# Current-RSS sampling for the open/mem bench (benches/open.rs, Issue #1566 A5):
# mach `task_info(MACH_TASK_BASIC_INFO).resident_size` is the live resident size
# (getrusage.ru_maxrss is PEAK, not current — Finding 3). libc's mach_task_self is
# deprecated in favor of mach2, so use mach2 for the non-deprecated task port.
# macOS-only, dev-only: never ships in the library.
[target.'cfg(target_os = "macos")'.dev-dependencies]
mach2 = "0.4"

# Arrow-conversion accessor-hoist parity guard (issue #1495, AE1). Declared with
# required-features = ["arrow"] because it is `#![cfg(feature = "arrow")]`, so it
# only compiles+runs when the arrow feature is on. The full agent gate runs it via
# the dedicated `arrow-parity-guard` component (scripts/agent-gate.sh:
# `cargo test -p cqlite-core --features arrow --test issue_1495_arrow_accessor_parity`),
# which is its ONLY automated executor and fails closed on a vacuous 0-run — the
# default `cli-helpers`-only core-tests run and pr-gate's `--lib --all-features`
# both skip this integration target.
[[test]]
name = "issue_1495_arrow_accessor_parity"
required-features = ["arrow"]

# Issue #3790 merged-read `time` collection-ordering guard. It calls
# `storage::write_engine::merge::assemble_read_cells`, and the whole
# `storage::write_engine` module is gated on `write-support`, so an
# auto-discovered target would fail to COMPILE under `--no-default-features`
# (the gate's `minimal-build`) — `cannot find write_engine in storage`.
#
# `required-features` rather than a crate-level `#![cfg]`: `write-support` is a
# DEFAULT feature, so this keeps the target running in `core-tests` (the gate of
# record) while excluding it only where the module genuinely does not exist. A
# `#![cfg(feature = ...)]` on a NON-default feature is what puts a target in a
# lane that executes nowhere (#3522) — that trap is the reason this test is not
# gated in its source.
[[test]]
name = "issue_3790_merged_read_time_order"
required-features = ["write-support"]

# Full-Index.db partition-enumeration regression (issue #2302). It is
# `#![cfg(all(feature = "work-counters", feature = "write-support"))]` — the
# `read_work_counters` probe gauge AND the `SSTableWriter`/mutation write API — so
# it only compiles+runs when BOTH features are on. Its ONLY automated executor is
# the `work-counters-guard` gate component (scripts/agent-gate.sh:
# `cargo test -p cqlite-core --features write-support,cli-helpers,state_machine,work-counters
# --test issue_2302_written_index_resolve`), which enables both features and fails
# closed on a vacuous 0-run.
[[test]]
name = "issue_2302_written_index_resolve"
required-features = ["work-counters", "write-support"]

# BIG clustering-slice seek positional-read migration (issue #1869). It is
# `#![cfg(all(feature = "work-counters", feature = "write-support", ...))]` — the
# `read_work_counters::file_opens` probe AND the write engine that builds the wide
# fixture — so it only compiles+runs when both features are on. Its automated
# executor is the `work-counters-guard` gate component (scripts/agent-gate.sh).
[[test]]
name = "issue_1869_big_clustering_slice_readat"
required-features = ["work-counters", "write-support"]

# Summary-guided compressed scan chunk-coalescing (issue #2877). It is
# `#![cfg(all(feature = "write-support", feature = "lz4"))]` and BOTH gates are
# load-bearing (roborev round 2, blocker C): `write-support` for the
# `SSTableWriter`/`WriteEngine` mutations that build the fixture, and `lz4` because
# the fixture is repacked through `create_compressor(CompressionAlgorithm::Lz4)`,
# which returns `Err("feature 'lz4' required")` without it. Declaring only
# `write-support` here let `cargo test --no-default-features --features
# write-support` RUN the target, where it panicked on that Err. The `#![cfg]` and
# these `required-features` must always agree.
[[test]]
name = "issue_2877_scan_chunk_coalescing"
required-features = ["write-support", "lz4"]

# `query.max_execution_time` enforcement at the engine chokepoint (issue #1695).
# It is `#![cfg(all(feature = "state_machine", feature = "cli-helpers"))]` — the
# fixture is opened through `cqlite_core::ingestion` (cli-helpers) so the lane
# drives the same `Database` surface the CLI does. Declared here so the gate and
# `--lite` run it WITH those features instead of compiling an empty target; the
# `#![cfg]` and these required-features must always agree.
[[test]]
name = "issue_1695_query_timeout"
required-features = ["state_machine", "cli-helpers"]

# Statistics.db single-TOC-walk oracle (issue #2148). `#![cfg(feature =
# "cli-helpers")]` — the `toc_walk_metrics` counter getters/`reset` +
# `record_toc_walk` live behind `cli-helpers` — so it only compiles+runs with that
# feature. The lite gate's blast-radius scoping runs cqlite-core `--lib` +
# `--features cli-helpers`, which compiles and runs this changed `--test` target;
# the full gate's core-tests (`--features cli-helpers`) also picks it up.
[[test]]
name = "issue_2148_statistics_toc_single_walk"
required-features = ["cli-helpers"]

# Per-column decode failures must be OBSERVABLE, not a silently truncated row
# (issue #3721). Drives the fixtures through `cqlite_core::ingestion::ingest` +
# `Database::execute` — the public read surface — which lives behind
# `cli-helpers`, so the target is declared here rather than compiled into a
# default-feature `cargo test` that cannot link it. The gate's `core-tests`
# component runs `--features cli-helpers`, so it EXECUTES there.
[[test]]
name = "issue_3721_column_decode_error_surface"
required-features = ["cli-helpers"]

# Column decoding must be bounded by the ROW's authoritative end, not by the length
# of the whole parse unit (issue #3809, found reviewing #3721): a cell reading past
# its row returns the NEXT row's bytes as a value, and a cell stopping short leaves
# the body partly unaccounted for — both SILENT wrong answers. Same public surface
# (`ingestion::ingest` + `Database::execute`), so the same `cli-helpers` gate.
[[test]]
name = "issue_3809_column_decode_row_bound"
required-features = ["cli-helpers"]

# Range-tombstone MARKER refusals must be OBSERVABLE too — the same swallow one
# structural level up from the per-column one (issue #3721). Same public surface
# (`ingestion::ingest` + `Database::execute`), so the same `cli-helpers` gate.
[[test]]
name = "issue_3721_range_marker_refusal_surface"
required-features = ["cli-helpers"]

# The delta-scan row loop must not re-wrap (and so ERASE) `Error::ColumnDecode`
# (issue #3721). `#![cfg]`-gated on `delta-scan` + `cli-helpers`; declared here so
# the target is not compiled into a default-feature `cargo test`.
[[test]]
name = "issue_3721_delta_scan_column_decode_variant"
required-features = ["delta-scan", "cli-helpers"]

# Scan-path error counting (issue #1704). It is
# `#![cfg(all(feature = "observability-testing", feature = "delta-scan"))]` — the
# in-memory metric capture harness needs the SDK testing exporters, and the
# `scan_delta` seam only exists under `delta-scan` — so BOTH gates are declared
# here: without them cargo would build the target feature-less and it would
# compile to an empty test binary that passes vacuously.
[[test]]
name = "issue_1704_scan_path_error_counts"
# `lz4` too: every corpus case here reads `test_comp.lz4_table` (the bit-flip fixture
# and its clean source), so without the decoder the target would still RUN and the
# clean-fixture control could not decode its chunks — coverage that executes but
# cannot assert what it claims.
required-features = ["observability-testing", "delta-scan", "lz4"]

# Corrupt-clustering-row refusal lanes (issue #3782, roborev job 59 finding 2 /
# #3950). All three targets are
# `#![cfg(all(feature = "state_machine", feature = "cli-helpers", feature = "lz4"))]`
# and all three gates are load-bearing: `cli-helpers` (which implies
# `state_machine`) for the `ingestion`/`Database` surface the lanes drive, and
# `lz4` because EVERY fixture they read is an LZ4-compressed Cassandra 5.0
# SSTable — `support/corrupt_byte_fixture.rs` asserts the algorithm before
# mutating, and without the feature `Compressor::decompress` answers
# `Err("LZ4 compression not available")`. Declaring only the first two let
# `cargo test -p cqlite-core --no-default-features --features cli-helpers` RUN
# them and fail on their PRISTINE CONTROLS: a false FAIL wearing a correctness
# failure's clothes. The `#![cfg]`s and these lists must always agree.
#
# Which lanes still EXECUTE them (#3522 — a `required-features` line that
# excludes a target from every lane is a worse defect than the bug it fixes;
# `lz4` arrives via the DEFAULT `all-compression`, and no invocation below
# passes `--no-default-features`):
#   * issue_3782_corrupt_row_refusal, probe_3782, point_vs_full_differential
#     — `core-tests` (`cargo nextest run -p cqlite-core --features cli-helpers`)
#   * point_vs_full_differential — ALSO `bti-multiclustering`
#     (`cargo test -p cqlite-core --features "state_machine cli-helpers"
#     --test point_vs_full_differential`) and the two fail-closed positive
#     controls it drives (scripts/tests/test_point_vs_full_failclosed.sh)
#   * the diff-scoped `--lite` blast radius, which also runs `--features cli-helpers`
[[test]]
name = "issue_3782_corrupt_row_refusal"
required-features = ["state_machine", "cli-helpers", "lz4"]

[[test]]
name = "probe_3782"
required-features = ["state_machine", "cli-helpers", "lz4"]

[[test]]
name = "point_vs_full_differential"
required-features = ["state_machine", "cli-helpers", "lz4"]

# Corrupt partition-HEADER refusal lane (issue #3928, the header-arm residual of
# #3782). Same `#![cfg]` and the same three load-bearing gates as the three
# targets above, for the same reasons, and executed by the same lanes
# (`core-tests` and the diff-scoped `--lite` blast radius).
[[test]]
name = "issue_3928_corrupt_header_refusal"
required-features = ["state_machine", "cli-helpers", "lz4"]

# The TRUNCATED-header half of the same issue, split out at the 1500-line test
# threshold (campsite rule, #1135). Same `#![cfg]` and the same three
# load-bearing gates as its sibling, and executed by the same lanes.
[[test]]
name = "issue_3928_truncated_header_refusal"
required-features = ["state_machine", "cli-helpers", "lz4"]

[[bench]]
name = "partition_lookup"
harness = false

[[bench]]
name = "partition_lookup_scaling"
harness = false

[[bench]]
name = "m1_performance"
harness = false

[[bench]]
name = "fixtures_smoke"
harness = false

[[bench]]
name = "read"
harness = false

# Predicate-eval / sort throughput micro-benches (issue #1644, K5, task 6.4).
# `predicate_sort/reject_most_rows` proves a predicate-rejected Bytes-backed
# Text value is never copied; `predicate_sort/order_by_text` proves the
# comparator borrow (stage 3) does not regress ORDER BY throughput. Needs
# `cli-helpers`; without it compiles to an empty criterion main.
[[bench]]
name = "predicate_sort"
path = "benches/predicate_sort_bench.rs"
harness = false

# Stage-0 measure-first bench for the runtime DecodePolicy work (issue #2211,
# F6.4). Quantifies (a) SAFE lz4 decompress-only throughput via `lz4_flex`, (b)
# the full chunk-decompress path (seek+read+CRC32+decode+validate), and (c)
# end-to-end scan throughput over the SAME compressed fixture, so the
# decompress-only cost can be read as a fraction of a real scan. The `full_scan`
# arm needs `cli-helpers` (for `open_read_db`); without it that arm compiles out
# and the binary still runs a valid criterion main. NOT a perf-gate entry — a
# one-time decision artifact feeding the Stage-0 go/no-go (docs/reports/).
[[bench]]
name = "decode_policy"
path = "benches/decode_policy_bench.rs"
harness = false

# Export / conversion throughput micro-benches (issue #1494, AD5). STRICT
# perf-gate entries (`export/rows_to_record_batch`, `export/json`,
# `export/parquet`, `export/delta`). Needs `cli-helpers` + `arrow` for the
# fixture-backed conversion/JSON benches, `parquet` for the Parquet arm, and
# `delta-scan` for the delta writer arm; under fewer features the missing arms
# compile out and the binary still runs an empty, valid criterion main.
[[bench]]
name = "export_throughput"
harness = false

# Per-CQL-type + wide-row/text-heavy decode benches (issue #1615, Epic H).
# `harness = false` criterion target. Needs `cli-helpers` (real fixture reader for
# the `&self` decode context) AND `bench-internals` (the decode_value_for_bench
# shim); without those it compiles to an empty criterion main. The two throughput
# benches (decode/wide_row_primitives, decode/text_heavy) are STRICT perf-gate
# entries; the many per-type benches are recorded/advisory.
[[bench]]
name = "decode"
path = "benches/decode_bench.rs"
harness = false

# Row-conversion (row-build) CPU instrument (issue #3027; unblocks #2901). Two
# groups over N ∈ {8,16,32,64} columns: `row_build/columns_<N>` drives the REAL
# public `build_row_from_scan_cached` over 2,000 synthetic partition-grouped rows
# with one shared PartitionKeyCache, and `row_build/hashonly_<N>` isolates the
# HashMap-construction + SipHash term. Fully synthetic (no dataset fixture), needs
# only the default `state_machine` feature. NOT a perf-gate entry — an instrument
# whose absolute rows/sec is machine-dependent.
[[bench]]
name = "row_build"
path = "benches/row_build_bench.rs"
harness = false

[[bench]]
name = "write"
harness = false

[[bench]]
name = "compaction"
harness = false

# Reconcile generation-overlap multiplier instrument (issue #2043, epic #2817 M9):
# per-row k-way-merge cost for clusters spanning k SSTable generations, k ∈
# {1,2,5,10,20} × collision mix, at a pinned `now`. ADVISORY-only in
# benches/perf-gate.json — a measurement instrument must never block a merge.
# Synthesizes its own generations, so it needs no vendored dataset corpus.
[[bench]]
name = "reconcile_overlap"
harness = false

[[bench]]
name = "concurrent_scan"
harness = false

[[bench]]
name = "observability_overhead"
harness = false

# Read-while-write reader-latency-under-write-load guard (issue #1143). GATED
# (issue #1564): a strict median entry in benches/perf-gate.json
# (read_while_write/readers6_writers2, 25% threshold). The p99 tail stays
# stderr-only / runner-noisy and is owned by the A2 tail-latency harness (#1563).
[[bench]]
name = "read_while_write"
harness = false

# Mixed-load tail-latency harness (issue #1563, Epic A / A2). `harness = false`
# custom main: emits p50/p99/p999 + intra-run ratios (JSON), which Criterion's
# median model cannot express. ADVISORY tail gate lives in
# benches/tail-latency-gate.json + scripts/ci/check_tail_latency.py.
[[bench]]
name = "tail_latency"
harness = false

# Cold-open + per-reader-memory bench (issue #1566, Epic A / A5). `harness = false`
# criterion target: `open/cold_big`, `open/cold_bti` (skip-register when absent),
# and `mem/open_n_readers` (records the per-reader RSS gauge the ledger can express
# but criterion cannot). Appends its measured medians + memory metric to the unified
# target/profiling/history.jsonl via the shared bench_ledger module.
[[bench]]
name = "open"
harness = false

[features]
# M2+ production defaults: Full query engine + write path enabled.
# write-support is a pure first-party code-gating flag (no extra dependencies),
# so including it by default makes the write engine available out of the box
# without changing the dependency surface for read-only consumers (#558).
# flush/compact remain behind the separate `experimental` flag.
default = ["all-compression", "state_machine", "write-support"]

# Compression features - properly feature-gated
lz4 = ["dep:lz4_flex"]
snappy = ["dep:snap"]
deflate = ["dep:flate2"]
zstd = ["dep:zstd"]
all-compression = ["lz4", "snappy", "deflate", "zstd"]

# Other features - non-compression, all opt-in (NOT in defaults unless noted).

# CLI-specific helpers (Issue #249) - NOT in defaults for pure library mode
# Requires state_machine for query engine and discovery dependencies
cli-helpers = ["state_machine"]

# Embeddable Arrow RecordBatch conversion (Epic #682) - NOT in defaults so that
# `cargo build --package cqlite-core` does not compile the arrow crate.
# Requires state_machine because the conversion consumes query::QueryResult.
arrow = ["state_machine", "dep:arrow"]

# Embeddable Parquet export (Epic #682) - NOT in defaults so that
# `cargo build --package cqlite-core` does not compile arrow/parquet.
# Depends on `arrow` for the CQL→RecordBatch conversion layer.
parquet = ["arrow", "dep:parquet"]

# Observability (epic #1031, issues #1032 + #1038) — opt-in OpenTelemetry
# tracing + metrics export. NOT in defaults: the helpers in
# `crate::observability` compile to zero-cost no-ops when this is off, and no
# opentelemetry dependency is linked. This flag supersedes the old hollow
# `metrics = []` flag (which referenced nothing); see `metrics` below.
observability = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry-semantic-conventions",
]

# Deprecated alias for `observability`. The original `metrics = []` flag never
# gated any code; it is retained as an alias so any out-of-tree consumer that
# enabled it keeps building, and now resolves to the real observability stack.
metrics = ["observability"]

# Observability test harness (issue #1043) — enables the in-memory OTLP
# exporters (`InMemorySpanExporter` / `InMemoryMetricExporter`) the SDK only
# exposes under its own `testing` feature, and compiles the shared
# `observability::testing` capture fixture + the correctness/sampling tests.
# NOT in defaults and NOT implied by `observability`: production builds never
# link the SDK's testing surface. Enable explicitly to run the #1043 tests:
#   cargo test -p cqlite-core --features observability-testing
observability-testing = ["observability", "opentelemetry_sdk?/testing"]

pest = []
wasm = ["wasm-bindgen", "js-sys", "web-sys"]

# Fuzz-support surface (issue #1614) — gates a single `#[doc(hidden)] pub mod
# fuzz_support` exposing thin, `Result`-returning drivers over the internal
# decode entry points so the external `fuzz/` cargo-fuzz crate can reach them
# WITHOUT widening the default public API. Adds NO new dependencies; the module
# does not exist unless this feature is enabled, so every default build / gate /
# CI run is byte-identical without it. NOT in defaults.
fuzz = []

# Bench-internals surface (issue #1615, Epic H) — gates a single
# `#[doc(hidden)] #[cfg(feature = "bench-internals")] pub fn
# SSTableReader::decode_value_for_bench` that forwards VERBATIM to the crate-private
# block-path decode entry `parse_value_with_schema_type`, so the `decode` bench
# (an external crate) can measure the REAL dispatch rather than a re-implemented
# copy. Adds NO dependencies and NO real public API: without this feature the
# symbol does not exist and every default build / gate / CI run is byte-identical.
# NOT in defaults.
bench-internals = []

# Shared Arrow row-shape corpus (issues #2825/#2932) — gates a single
# `#[doc(hidden)] pub mod export::arrow_shape_corpus` exposing the row shapes the
# estimator's conservatism contract is validated against, so `cqlite-flight`'s
# fail-closed published-capacity-bound guard can assert over the SAME corpus
# instead of a hand-written subset (which is how the #2932 gap appeared). TEST
# SUPPORT ONLY and NOT in defaults: without this feature the module does not
# exist, so every default build / gate / CI run is byte-identical. `cqlite-flight`
# enables it from its `[dev-dependencies]`, so the production flight binary never
# links it.
arrow-shape-corpus = ["arrow"]

# TEST-ONLY producer-fault injection (issue #3106) — gates the arming API of
# `storage::producer_fault`, the deterministic seam a test uses to kill the query
# row stream's producer thread mid-walk so the consumer's fail-closed handling of
# a dead producer (no terminal `Done` sentinel) can be PROVEN instead of asserted
# by inspection. Adds NO dependencies and NO production behaviour: without this
# feature the arming symbols do not exist, the armed-state statics do not exist,
# `ProducerFault` is a zero-sized no-op struct and every default build / gate /
# CI run is byte-identical. NOT in defaults; `cqlite-flight` enables it from its
# `[dev-dependencies]` (the `arrow-shape-corpus` convention), so no shipped
# binary links it.
producer-fault-injection = []

# Legacy heuristics support (backward compatibility for pre-5.0 formats)
# NOT enabled in default CI configuration - opt-in only
legacy-heuristics = []

# CI zero tolerance - treat warnings as errors
ci_zero_tolerance = []

# M1 testing remediation feature flags
state_machine = []    # query/state orchestration (M2+)
events = []           # validation/event recording (M2+)
tombstones = []       # tombstone/GC logic (M3+)
benchmarks = []       # opt-in perf runs

# Extended Index.db validation (Issue #66) - NOT enabled in M1 CI
# Gates deep promoted index and range query validation for post-M1
extended-index-validation = []
experimental = []     # Experimental features including bloom filter tests (Issue #65), disabled by default

# Issue #80: Mock usage control - unit tests only
unit-tests-only = []  # Enables mock/synthetic data usage for unit tests (disabled in CI integration paths)

# Issue #66: Enhanced index validation features (M1: disabled by default)
# Includes promoted index parsing, complex TOC validation, and advanced assertions
enhanced-index-validation = []

# Docker integration testing feature
docker-integration = []

# Test infrastructure features for Phase 2 - Enhanced TestContext Framework
test-infrastructure = [
    "test-schema-validation",
    "test-property-testing",
    "test-coverage-tracking",
    "test-quality-gates"
]
test-schema-validation = []    # Schema-aware test validation
test-property-testing = []     # Property-based testing support
test-coverage-tracking = []    # Real-time coverage tracking
test-quality-gates = []        # Quality gate enforcement

# M5: Write support - SSTable generation and persistence (Issue #359)
# fs2 provides cross-platform advisory file locking for write_dir exclusivity (Issue #485)
write-support = ["dep:fs2"]

# Delta-scan envelope (Epic #696) - off by default.
# Adds the DeltaRecord model, RangeBound, and CellDelta types for CDC-style
# Parquet projections of individual SSTable generations.  Does NOT pull in any
# extra dependencies; the scan_delta() streaming API (Issue #698) builds on top
# of this feature flag.
delta-scan = []

# Heap profiling: installs the dhat global allocator in examples/heap_profile.rs.
# Dev/profiling only — never enable for production builds (allocation tracking
# adds overhead). See docs/profiling.md.
dhat-heap = []

# Read-work counters (issue #1566, Epic A / A5). TEST/BENCH-ONLY, NOT in defaults:
# enables the getters/`reset` and the counter bodies in
# `storage::sstable::read_work_counters` so benches and integration tests can read
# the trie-walk / decompress / seek / file-open gauges. The `record_*()` call sites
# are unconditional but compile to no-ops without this feature (and without
# `cfg(test)`), so a default/release build links no counter atomics and pays
# nothing — verify with `cargo build -p cqlite-core` that no counter static is
# referenced. Consumed by epics B–G's TDD work-guard tests.
work-counters = []

# Scan-offload thread-identity probe (issue #1143 regression guard). TEST-ONLY,
# NOT in defaults: gates the `scan_stream_windowed::probe` module, the pub
# visibility of `scan_stream_windowed`, and the single `record_parse_thread()`
# call-site in the windowed parse half. With this OFF, no probe code, statics, or
# public surface compile into the build — verify with
# `cargo build -p cqlite-core` that nothing probe-related is referenced. The
# guard test (tests/issue_1143_scan_offload_thread.rs) only compiles under this
# feature; the agent gate runs it via a dedicated component.
scan-offload-probe = []

[lints]
workspace = true
