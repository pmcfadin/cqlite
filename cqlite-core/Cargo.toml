[package]
name = "cqlite-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Core database engine for CQLite"

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time", "process"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# YAML parsing for metadata.yml (Issue #78)
serde_yaml = "0.9"

# Compression and checksums - feature-gated
lz4_flex = { workspace = true, optional = true }
snap = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
crc32fast = { workspace = true }

# Concurrency and collections
crossbeam = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
lru = "0.12"

# Memory management
bytes = { workspace = true }
memmap2 = { workspace = true }

# Parsing
nom = "7.1"
pest = "2.7"
pest_derive = "2.7"
hex = "0.4"
bit-vec = "0.8"
num_cpus = "1.0"
base64 = "0.21"

# Hashing for Cassandra compatibility
murmur3 = "0.5"
md5 = "0.7"

# Features defined at end of file to avoid duplicates

# Additional dependencies
uuid = { version = "1.10", features = ["v4"] }
regex = "1.10"
futures = "0.3"
clap = { version = "4.4", features = ["derive"] }
env_logger = { workspace = true }
async-trait = "0.1.88"

# Terminal output and logging
colored = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"

# Optional WASM support
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, features = ["console"], optional = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
tempfile = "3.8"
rand = "0.8"
tokio-test = "0.4"
insta = "1.34"
# cqlite-validation = { path = "../cqlite-validation" }
fastrand = "2.0"
libc = { workspace = true }
num-bigint = "0.4"  # For varint/decimal validation in tests
num-traits = "0.2"  # Required for BigInt conversion methods

[[bench]]
name = "partition_lookup"
harness = false

[[bench]]
name = "m1_performance"
harness = false

[[bench]]
name = "component_flattening"
harness = false

[features]
# M2+ production defaults: Full query engine enabled
default = ["all-compression", "state_machine"]

# Compression features - properly feature-gated
lz4 = ["dep:lz4_flex"]
snappy = ["dep:snap"]
deflate = ["dep:flate2"]
zstd = ["dep:zstd"]
all-compression = ["lz4", "snappy", "deflate", "zstd"]

# Other features
metrics = []
pest = []
wasm = ["wasm-bindgen", "js-sys", "web-sys"]

# Legacy heuristics support (backward compatibility for pre-5.0 formats)
# NOT enabled in default CI configuration - opt-in only
legacy-heuristics = []

# CI zero tolerance - treat warnings as errors
ci_zero_tolerance = []

# M1 testing remediation feature flags
antlr = []            # CQL/ANTLR parser work (M2+)
state_machine = []    # query/state orchestration (M2+)
events = []           # validation/event recording (M2+)
tombstones = []       # tombstone/GC logic (M3+)
benchmarks = []       # opt-in perf runs

# Extended Index.db validation (Issue #66) - NOT enabled in M1 CI
# Gates deep promoted index and range query validation for post-M1
extended-index-validation = []
experimental = []     # SSTable writing and other M1 functionality (enabled by default)

# Issue #80: Mock usage control - unit tests only
unit-tests-only = []  # Enables mock/synthetic data usage for unit tests (disabled in CI integration paths)

# Issue #66: Enhanced index validation features (M1: disabled by default)
# Includes promoted index parsing, complex TOC validation, and advanced assertions
enhanced-index-validation = []

# Docker integration testing feature
docker-integration = []

# Test infrastructure features for Phase 2 - Enhanced TestContext Framework
test-infrastructure = [
    "test-schema-validation",
    "test-property-testing",
    "test-coverage-tracking",
    "test-quality-gates"
]
test-schema-validation = []    # Schema-aware test validation
test-property-testing = []     # Property-based testing support
test-coverage-tracking = []    # Real-time coverage tracking
test-quality-gates = []        # Quality gate enforcement

[lints]
workspace = true
