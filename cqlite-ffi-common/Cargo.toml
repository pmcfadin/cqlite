[package]
name = "cqlite-ffi-common"
publish = false  # internal glue for the language bindings, not a crates.io artifact
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Pure-Rust scalar rendering and error-identity logic shared by the CQLite language bindings"

[dependencies]
cqlite-core = { path = "../cqlite-core" }
# Declared locally at "0.4" to match cqlite-core, cqlite-cli and bindings/node.
# There is deliberately no `[workspace.dependencies]` entry (issue #1452 non-goal).
num-bigint = "0.4"

[lints]
workspace = true

[dev-dependencies]
# JSON parsing for the `cargo metadata` dependency-closure measurement
# (`tests/dependency_boundary.rs`). A dev-dependency, so it is not linked into
# either binding; it IS inside the measured closure, which is deliberate — the
# no-FFI-framework rule covers dev-dependencies too.
serde_json = { workspace = true }
# SHA-256, for the exact half of the committed vector expectations: a
# multi-kilobyte rendering is committed as its digest (readable) plus the
# SHA-256 hex of the FULL rendering (exact). A DEV-dependency, so neither
# binding links it — each binding suite hashes with its own standard library
# (`hashlib` / `crypto`), which is what makes the hash a cross-implementation
# check instead of one more shared function. Already in the workspace's
# dependency closure via `cqlite-core`, so no new external crate enters the tree,
# and it pulls in no FFI framework (`tests/dependency_boundary.rs` measures that).
sha2 = { workspace = true }
