# Pre-commit hooks for CQLite project
# Enforces quality standards before commit

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Format Rust code
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        description: Lint Rust code
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        description: Run Rust tests
        entry: cargo test --all-features --workspace
        language: system
        types: [rust]
        pass_filenames: false

      - id: validate-workspace-structure
        name: Workspace Structure Validation
        description: Validate project structure follows standards
        entry: scripts/ci/validate-structure.sh
        language: script
        pass_filenames: false
        always_run: true

      - id: dependency-check
        name: Dependency Security Check
        description: Check for security vulnerabilities
        entry: cargo audit
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
        args: ['--all', '--', '--check']
      - id: clippy
        args: ['--all-targets', '--all-features', '--', '-D', 'warnings']