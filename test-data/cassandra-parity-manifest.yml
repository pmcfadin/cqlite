        tests:
          - cqlite-core/tests/sstable_parity_filter_db_test.rs
        notes: >-
          filter_db_statistical_false_positive_rate_slow probes a large deterministic
          absent-key sample (50k keys, fixed seed + per-fixture salt) and reports the
          measured FPR per fixture, asserting only a generous saturation ceiling
          (< 0.50). It is gated behind CQLITE_FILTER_FPR_SLOW=1 so the per-PR lane
          stays fast — false positives are legal and never a correctness failure. It
          runs in the dedicated nightly_docker lane
          (.github/workflows/nightly-docker-parity.yml), whose runner
          (test-data/scripts/nightly-docker-parity.sh) reports the measured FPR per
          fixture against the configured bloom_filter_fp_chance in its Bloom FPR
          summary. The FPR threshold is ADVISORY at first (owner fork F4): a breach
          does NOT fail the lane while advisory. The companion no-false-negative gate
          (filter_db_strict_parameters_and_no_false_negative) is ALWAYS hard-fail in
          the same lane (cass.filter_db.no_false_negative_membership).
    fixtures:
      datasets:
        - test-data/datasets/sstables
    evidence:
      type: smoke
      artifacts: [logs]
      cassandra_version: "5.0.2"
      cassandra_git_sha: f278f6774fc76465c182041e081982105c3e7dbb
      storage_format_version: [nb, oa, da]
      fixture_generation_command: >-
        bash test-data/scripts/regenerate-datasets.sh  # cassandra:5.0.2 flush emits Filter.db
      comparison_command: >-
        env CQLITE_DATASETS_ROOT=$PWD/test-data/datasets CQLITE_FILTER_FPR_SLOW=1
        cargo test -p cqlite-core --features write-support
        --test sstable_parity_filter_db_test
        filter_db_statistical_false_positive_rate_slow -- --nocapture
      known_limitations: >-
        The measured FPR is reported (in the nightly lane's Bloom FPR summary)
        against the configured fp_chance, but the threshold is ADVISORY at first
        (owner fork F4): a breach does not fail the lane, because the committed
        fixtures are tiny (single-long bitsets) where the analytic FPR is dominated
        by quantization, not the configured fp_chance. The no-false-negative
        property is hard-fail regardless.
    ci:
      tier: nightly_docker
      workflow: .github/workflows/nightly-docker-parity.yml
    scope:
      target_issue: 987
      gap: >-
        The measured-FPR threshold is advisory, not yet a gated comparison against
        Cassandra's configured bloom_filter_fp_chance.
      next_step: >-
        Add larger-cardinality fixtures and promote the advisory FPR threshold to a
        hard-fail once the measured FPR tracks the configured fp_chance within a
        documented statistical tolerance.

