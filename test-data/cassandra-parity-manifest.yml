      normalization: >-
        The bound-marker grammar is compared field-by-field at exact offsets: the
        IS_MARKER flag, the ClusteringPrefix.Kind ordinal, the u16 cluster count,
        the prefix clustering value (a PREFIX shorter than the full arity is
