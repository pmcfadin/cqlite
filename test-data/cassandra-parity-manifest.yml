  - id: cass.data_db_decode.range_tombstone.boundary_markers
    title: Data.db range-tombstone boundary-marker (two deletion times) parity
    status: mirrored
    capability: tombstone_ttl
    priority: P0
    risk: p1_correctness
    cassandra:
      category: tombstone-ttl
      relevance: high
      files:
        - ClusteringBoundOrBoundary.java
        - RangeTombstoneListTest.java
    cqlite:
      coverage:
        suite: compaction_parity_tombstone_ttl
        tests:
          - cqlite-core/tests/issue_992_range_boundary_grammar.rs
        notes: >-
          A range-tombstone BOUNDARY marker (kind 2 = EXCL_END_INCL_START_BOUNDARY
          or 5 = INCL_END_EXCL_START_BOUNDARY) closes one range and opens the next
          at the SAME clustering point; its body carries TWO deletion-time pairs
          (primary = end of the previous range, secondary = start of the next).
          DETERMINISTIC WRITER LANE (issue #1220):
          `range_boundary_marker_exact_grammar_writer` drives the public
          `DataWriter` with TWO adjacent range tombstones meeting at clustering [4]
          with complementary inclusivity (rt1 close EXCLUSIVE(4), rt2 open
          INCLUSIVE(4)); the writer now COALESCES them into a single kind-2 boundary
          marker (not separate end+start bounds), and the test asserts the exact
          grammar at absolute offsets — IS_MARKER, the kind-2 ordinal, the u16
          count, the clustering value 4, and BOTH deletion-time pairs (primary =
          rt1's end, secondary = rt2's start, each mfda + ldt delta) — plus the
          bracketing rt1 START / rt2 END bounds. The fixture lanes
          (`fixture_range_boundary_marker_byte_parity`,
          `fixture_range_boundary_kind5_byte_parity`) walk the real adjacent_ranges
          nb Data.db, assert IS_MARKER + the kind-2 / kind-5 ordinal + the prefix
          clustering value at exact offsets, and reconstruct BOTH deletion-time µs
          (primary end + secondary start) from the two delta pairs against the
          golden start/end marked_deleted timestamps.
    fixtures:
      references:
        - test-data/datasets/sstables/test_deltas/adjacent_ranges-29bdd5c0701f11f1b5d1d98b0640ec05/nb-1-big-Data.db.jsonl
    evidence:
      type: byte_for_byte
      strict: true
      artifacts: [bytes, offsets, jsonl]
      cassandra_version: "5.0.2"
      cassandra_git_sha: f278f6774fc76465c182041e081982105c3e7dbb
      storage_format_version: [nb, oa]
      fixture_generation_command: >-
        bash test-data/scripts/regenerate-datasets.sh && sstabledump <Data.db> > <Data.db>.jsonl
      comparison_command: >-
        env CQLITE_REQUIRE_FIXTURES=1 CQLITE_DATASETS_ROOT=$PWD/test-data/datasets
        cargo test -p cqlite-core
        --features write-support --test issue_992_range_boundary_grammar
        range_boundary
      reference_paths:
        - test-data/datasets/sstables/test_deltas/adjacent_ranges-29bdd5c0701f11f1b5d1d98b0640ec05/nb-1-big-Data.db.jsonl
      failure_artifacts:
        - artifact.required_parity.byte_diff
      normalization: >-
        The boundary-marker grammar is compared field-by-field at exact offsets:
        IS_MARKER, the kind-2/kind-5 ordinal, the u16 cluster count, the prefix
        clustering value, and BOTH deletion-time pairs (primary then secondary).
        The deterministic writer lane
        (`range_boundary_marker_exact_grammar_writer`) drives the public DataWriter
        and asserts the full boundary grammar at exact offsets for a coalesced
        kind-2 boundary (both deletion-time mfda+ldt deltas), and runs everywhere
        (no fixture dependency). The fixture lanes reconstruct both deletion-time µs
        against the golden end/start marked_deleted timestamps and fail-closed under
        `CQLITE_REQUIRE_FIXTURES=1` / `CQLITE_PARITY_REQUIRE_DATASETS=1`.
      known_limitations: >-
        MIRRORED (strict byte parity on BOTH the write and read sides, issue
        #1220). WRITE side: CQLite's writer now COALESCES two adjacent range
        tombstones that share a boundary point (complementary inclusivity) into a
        single boundary marker carrying TWO deletion-time pairs, exactly as
        Cassandra emits them; the deterministic lane
        `range_boundary_marker_exact_grammar_writer` drives the public DataWriter
        and asserts the kind-2 boundary grammar at exact offsets without any fixture
        dependency. READ side: byte parity is asserted against the real Cassandra
        adjacent_ranges fixture (kind 2 AND kind 5), PINNED in the CI dataset (v3.2)
        and fail-closed under `CQLITE_REQUIRE_FIXTURES=1` /
        `CQLITE_PARITY_REQUIRE_DATASETS=1` (issue #1205). Out of scope: collapsing
        two adjacent ranges that carry the SAME deletion time into one merged range
        (Cassandra's RangeTombstoneList merge) — distinct from boundary emission.
    ci:
      tier: required_parity
      workflow: .github/workflows/sstabledump-parity-gate.yml
    scope: {}

