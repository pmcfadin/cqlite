  - id: cass.summary_db.big.index_offset_references
    title: Summary.db sampled positions resolve to Index.db partition entries (BIG)
    status: mirrored
    capability: index_summary
    priority: P0
    risk: p1_correctness
    cassandra:
      category: sstable-io
      relevance: high
