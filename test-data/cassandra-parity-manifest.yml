  - id: cass.sstable_scan.wide_partition.forward_reverse_bounds
    title: Wide-partition forward and reverse scan boundary parity
    status: mirrored
    capability: index_summary
    priority: P1
    risk: p1_correctness
    cassandra:
      category: sstable-io
      relevance: high
      files:
        - SSTableScannerTest.java
        - SSTableReverseIteratorTest.java
    cqlite:
      coverage:
        suite: sstable_parity_index_db_big
        tests:
          - cqlite-core/tests/issue_993_wide_partition_promoted_index_parity.rs
          - cqlite-core/tests/issue_1184_big_promoted_read_seek.rs
        notes: >-
          Reverse iteration is now real (issue #1184): the BIG reverse partition
          iterator walks the promoted IndexInfo blocks back-to-front
          (SSTableReader::big_reverse_partition_rows), routed through the production
          query path for single-partition `ORDER BY <ck> DESC`. issue_1184 pins
          forward==reverse on a multi-block BIG wide partition built via the write
          engine (identical clustering set, exact reverse ordering, block-by-block
          decode with per-iteration memory bounded to one block), plus the forward
          promoted-index clustering-range seek (AccessPath::ClusteringSlice) and a
          ranged read keeping the rows adjacent to a clustering gap. issue_993 pins
          the forward 290/300/300 completeness and, when the local-only Cassandra
          binaries are present, the byte-level forward==reverse 290-row equality on
          the real test_big.wide_partition fixture (skip-on-absence until the
          dataset re-pin).
    fixtures:
      references:
        - test-data/datasets/sstables/test_big/wide_partition-ffe2ee50733111f19e8f6d08b8e7a294/nb-2-big-Data.db.jsonl
    evidence:
      type: canonical_semantic
      artifacts: [offsets, jsonl]
      cassandra_version: "5.0.2"
      cassandra_git_sha: f278f6774fc76465c182041e081982105c3e7dbb
      storage_format_version: [nb]
      fixture_generation_command: >-
        bash test-data/scripts/gen-wide-big.sh
      reference_paths:
        - test-data/datasets/sstables/test_big/wide_partition-ffe2ee50733111f19e8f6d08b8e7a294/nb-2-big-Data.db.jsonl
      normalization: >-
        Forward (ASC) and reverse (DESC) single-partition scans are normalized to
        the per-partition clustering set and ordering: the live clustering values
        and their sequence are compared (forward == reverse-of-DESC), ignoring
        presentation/whitespace. Proven in CI via the production reverse iterator on
        a write-engine multi-block BIG wide partition (issue_1184); the real
        test_big.wide_partition byte-level 290-row equality runs locally on absence.
      known_limitations: >-
        The CI-runnable forward==reverse proof (issue_1184) uses a write-engine-built
        multi-block BIG wide partition. The byte-level forward==reverse equality on
        the real Cassandra test_big.wide_partition fixture is a local-only check
        (gen-wide-big.sh) that skips-on-absence until the dataset re-pin promotes
        the binaries into the release tarball.
    ci:
      tier: fast_pr
    scope:
      gap: >-
        Reverse SSTable iteration for BIG wide partitions is now implemented and
        proven in CI (issue_1184, production reverse iterator over a write-engine
        multi-block BIG wide partition). The remaining gap is byte-level coverage on
        the real fixture: the test_big.wide_partition forward==reverse 290-row
        equality reads the binary Data.db and therefore SKIPS in CI because those
        binaries are not in the pinned dataset (issue #1185 in progress); the
        CI-running JSONL canonical-semantic check proves live counts but not
        byte-level completeness across promoted-index block boundaries.
      next_step: >-
        Add the test_big.wide_partition binaries to the dataset release pin (issue
        #1185) so the byte-level forward==reverse 290-row equality runs in the
        required_parity lane rather than skip-on-absence.

