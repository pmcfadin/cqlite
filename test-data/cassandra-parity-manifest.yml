  - id: cass.index_db.RowIndexEntryTest.partition_offsets
    title: BIG Index.db partition data offsets vs Cassandra positions
    status: mirrored
    capability: index_summary
    priority: P0
    risk: p1_correctness
    cassandra:
      category: sstable-format
