        issue_933_range_tombstone_compaction) only run CQLite SELF-CONSISTENCY
        (gen1-vs-gen2, one-shot-vs-hand-driven merge, resurrection safety) by
        default. The Cassandra-reference comparison
        (differential_vs_live_cassandra_env_gated) is env-gated behind
        CQLITE_DIFFERENTIAL_CASSANDRA=1 and is NOT set by
        sstabledump-parity-gate.yml, so no committed Cassandra-compacted
        reference is actually diffed in CI. Demoted from required_parity (issue
        #1242 roborev finding 1) to stop overclaiming Cassandra parity.
      next_step: >-
        Re-promote to required_parity only after a follow-up sets
        CQLITE_DIFFERENTIAL_CASSANDRA=1 in the gating workflow AND commits a
        CI-pinned Cassandra-5.0.2-compacted reference SSTable the harness diffs
        against (fixture work, out of scope for #1242).

