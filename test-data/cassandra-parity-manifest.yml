      storage_format_version: [nb, oa]
      fixture_generation_command: >-
        bash test-data/scripts/regenerate-datasets.sh && sstabledump <Data.db> > <Data.db>.jsonl
      comparison_command: >-
        env CQLITE_DATASETS_ROOT=$PWD/test-data/datasets cargo test -p cqlite-core
        --features write-support --test issue_991_static_clustering_parity
        static_only fixture_static_columns_marker
      reference_paths:
        - test-data/datasets/sstables/test_basic/static_columns_table-6b0425d0a25111f0a3fef1a551383fb9/nb-1-big-Data.db.jsonl
      failure_artifacts:
        - target/cassandra-parity/data-db-static-row-diff.log
      normalization: >-
        Two distinct assertion families: (1) STATIC-ROW BYTE parity — the row
        flag byte, extended IS_STATIC bit, hard-coded prev_size=0, and the
        omitted clustering prefix are compared at exact offsets in the
        decompressed Data.db; (2) SEMANTIC/JSONL parity — the decoded static cell
        value and the static structure are compared against the sstabledump
        golden. These are asserted separately. The pinned fixture is decompressed
        first (FAIL CLOSED on a missing pinned fixture); the truly static-ONLY
        partition shape is covered deterministically (always) plus the local-only
        static_with_rows lane (skip-on-presence).
      known_limitations: >-
        The pinned static_columns_table has no static-ONLY partition, so the
        static-ONLY shape (a partition with a static_block and NO clustering rows)
        is proven by the DETERMINISTIC writer lane (always runs) and the LOCAL-ONLY
        test_deltas/static_with_rows lane (skip-on-presence; not in the CI
        dataset). Per-static-cell value encoding across all CQL types is covered by
        the cql_types suites, whole-file identity by
        sstable_writer_cassandra_fixture_parity. This entry covers static-row BYTE
        parity, distinct from query/scan semantic parity.
    ci:
      tier: required_parity
      workflow: .github/workflows/sstabledump-parity-gate.yml
    scope: {}

