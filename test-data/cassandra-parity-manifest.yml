  # ----------------------------------------------------------------------------
  # compaction differential harness (issue #1016, epic #973)
  # Scenarios for the compaction-parity/ differential harness. The first three are
  # anchored to Apache Cassandra compaction test sources; the last two describe the
  # harness's own two tiers. NOTE on ids: the manifest id grammar requires a
  # `cass.<group>...` prefix (schema + cassandra-parity lint), so the two harness
  # scenarios use `cass.compaction.harness_*`. They correspond to the issue's
  # conceptual identifiers `cqlite.compaction_parity.harness.logical_tier` and
  # `cqlite.compaction_parity.harness.byte_tier_artifacts` respectively.
  # ----------------------------------------------------------------------------
  - id: cass.compaction.CompactionIteratorTest.differential_compaction_loop
    title: Differential compaction loop — same inputs through both engines (logical)
    status: mirrored
    capability: compaction_merge
    priority: P0
    risk: p0_data_loss
    cassandra:
      category: compaction
      relevance: high
      files:
        - CompactionIteratorTest.java
    cqlite:
      coverage:
        suite: compaction_parity_tombstone_ttl
        tests:
          - compaction-parity/src/test/java/org/cqlite/parity/DifferentialParityTester.java
          - compaction-parity/src/test/java/org/cqlite/parity/BasicDifferentialTest.java
        notes: >-
          The differential harness builds the SAME input SSTables, runs Apache
          Cassandra's maximal compaction in-JVM (reference) and the external
          `cqlite compact` binary (candidate) over identical input files, then
          asserts a canonical `sstabledump` JSONL of both outputs matches. The
          same sstabledump tool runs over both engines' output so the comparison
          is apples-to-apples. This is the LOGICAL tier and is the hard gate.
    fixtures:
      references:
        - test-data/datasets/sstables/test_basic/simple_table-6aa08200a25111f0a3fef1a551383fb9/nb-1-big-Data.db.jsonl
    evidence:
      type: canonical_semantic
      strict: false
      artifacts: [jsonl, logs]
      cassandra_version: "5.0.2"
      cassandra_git_sha: f278f6774fc76465c182041e081982105c3e7dbb
      storage_format_version: [nb]
      fixture_generation_command: >-
        compaction-parity/scripts/bootstrap-cassandra.sh  # builds cassandra-5.0.2; harness runs reference + candidate compaction in CI
      comparison_command: >-
        cd compaction-parity && gradle --no-daemon test  # logical-tier sstabledump JSONL equality
      reference_paths:
        - test-data/datasets/sstables/test_basic/simple_table-6aa08200a25111f0a3fef1a551383fb9/nb-1-big-Data.db.jsonl
      normalization: >-
        Both outputs are dumped with Cassandra's own sstabledump (-l) and the
        wall-clock-derived `expired` flag is normalized out; merged
        partition/row/cell/timestamp/TTL/deletion facts are compared, file
        layout and presentation ignored.
      known_limitations: >-
        Logical / canonical-semantic equivalence only; byte-for-byte output
        parity is the separate (non-gated) byte tier — see
        cass.compaction.SSTableRewriterTest.output_component_integrity.
    ci:
      tier: required_parity
      workflow: .github/workflows/compaction-parity.yml
