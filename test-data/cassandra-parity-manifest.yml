  - id: cass.data_db_decode.unfiltered_serializer.row_size_vints
    title: Data.db row-size and previous-size VInt framing parity
    status: mirrored
    capability: data_db_decode
    priority: P0
    risk: p1_correctness
    cassandra:
      category: serialization
      relevance: high
      files:
        - UnfilteredSerializerTest.java
        - CQLSSTableWriterTest.java
        - CQLSSTableWriterDaemonTest.java
    cqlite:
      coverage:
        suite: sstable_parity_data_db_jsonl
        tests:
          - cqlite-core/tests/issue_990_data_db_row_framing_parity.rs
        notes: >-
          Deterministic byte tests assert the exact unsigned-VInt width
          transitions (1→2 … 8→9 bytes) for row_size/prev_size using the writer's
          own `encode_unsigned` and decode them back through the reader's
          `parse_vuint` (the function the V5CompressedLegacy row-framing parser
          uses). `writer_row_size_frames_body_exactly` and the fixture lane
          (`fixture_uncompressed_row_framing_and_timestamp_delta_parity`) confirm
          row_size frames the body and the first-row prev_size equals the
          partition-header size against a real Cassandra nb Data.db.
    fixtures:
      references:
        - test-data/datasets/sstables/test_basic/uncompressed_table-6aedb7a0a25111f0a3fef1a551383fb9/nb-1-big-Data.db.jsonl
    evidence:
      type: byte_for_byte
      strict: true
      artifacts: [bytes, offsets, jsonl]
      cassandra_version: "5.0.2"
      cassandra_git_sha: f278f6774fc76465c182041e081982105c3e7dbb
      storage_format_version: [nb, oa]
      fixture_generation_command: >-
        bash test-data/scripts/regenerate-datasets.sh && sstabledump <Data.db> > <Data.db>.jsonl
      comparison_command: >-
        env CQLITE_DATASETS_ROOT=$PWD/test-data/datasets cargo test -p cqlite-core
        --features write-support --test issue_990_data_db_row_framing_parity
        row_size_vint writer_row_size_frames_body_exactly prev_size_vint
        fixture_uncompressed_row_framing
      reference_paths:
        - test-data/datasets/sstables/test_basic/uncompressed_table-6aedb7a0a25111f0a3fef1a551383fb9/nb-1-big-Data.db.jsonl
      failure_artifacts:
        - artifact.required_parity.byte_diff
      normalization: >-
        row_size/prev_size are unsigned VInt deltas; the deterministic lane
        compares raw encoded bytes and decoded values at the exact width
        boundaries, the fixture lane compares the framing offsets of a real nb
        Data.db (FAIL CLOSED on a missing fixture).
      known_limitations: >-
        Byte parity is asserted for the row_size/prev_size VInt framing; full
        whole-file Data.db byte identity across all CQL types is covered by the
        broader sstable_writer_cassandra_fixture_parity suite.
    ci:
      tier: required_parity
      workflow: .github/workflows/sstabledump-parity-gate.yml
    scope: {}

