          - cqlite-core/tests/sstable_parity_filter_bitflip_test.rs
    fixtures:
      references:
        - test-data/datasets/corruption/test_comp_corrupt/corruption-manifest.yml
        - test-data/datasets/corruption/test_comp_corrupt/corruption-sha256.txt
    evidence:
      type: byte_for_byte
      strict: true
      artifacts: [bytes, offsets, checksums, component_files]
      cassandra_version: "5.0.2"
      cassandra_git_sha: f278f6774fc76465c182041e081982105c3e7dbb
      storage_format_version: [nb]
      fixture_generation_command: >-
        bash test-data/scripts/generate-corruption-corpus.sh
      comparison_command: >-
        env CQLITE_DATASETS_ROOT=$PWD/test-data/datasets cargo test -p cqlite-core
        --test sstable_parity_corruption_verify
      reference_paths:
        - test-data/datasets/corruption/test_comp_corrupt/corruption-manifest.yml
        - test-data/datasets/corruption/test_comp_corrupt/corruption-sha256.txt
      failure_artifacts:
        - artifact.exhaustive_regeneration.audit_report
      known_limitations: >-
        A 1→0 bit flip inside the bit array (header left valid) is a Bloom-filter
        FALSE NEGATIVE, not a structural corruption. Cassandra's sstableverify does
        NOT validate Filter.db contents and reports this fixture CLEAN (captured
        verdict), so verdict_parity is divergent: CQLite verify --mode full is
        stricter and reports FilterFalseNegative. The read-side exposure (a present
        partition silently invisible on a BIG point lookup) is Cassandra-equivalent;
        full scans and BTI lookups are unaffected. See issue #1398.
    ci:
      tier: exhaustive_regeneration
      workflow: .github/workflows/compression-corruption-parity.yml
    scope: {}

