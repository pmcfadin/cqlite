        notes: >-
          Validates timestamp, TTL, and local-deletion-time deltas as UNSIGNED
          VInts measured from the Statistics.db EncodingStats minima
          (`SerializationHeader.writeTimestamp/writeTTL/writeLocalDeletionTime`),
          for small and large/negative-looking values, with an explicit ZigZag
          counter-check so there is no signed/unsigned ambiguity. The fixture lane
