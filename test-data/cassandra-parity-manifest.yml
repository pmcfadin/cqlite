  - id: cass.data_db_decode.serialization_header.timestamp_ttl_ldt_deltas
    title: Data.db timestamp / TTL / local-deletion-time delta parity
    status: mirrored
    capability: data_db_decode
    priority: P0
    risk: p1_correctness
    cassandra:
      category: serialization
      relevance: high
