        timestamp_delta ttl_and_ldt_deltas row_tombstone_ldt_delta
        fixture_uncompressed_row_framing
      reference_paths:
        - test-data/datasets/sstables/test_basic/uncompressed_table-6aedb7a0a25111f0a3fef1a551383fb9/nb-1-big-Data.db.jsonl
      failure_artifacts:
        - target/cassandra-parity/data-db-delta-diff.log
      normalization: >-
        Deltas are decoded as unsigned VInts and reconstructed against the
        Statistics.db EncodingStats minima; the fixture lane compares the
        reconstructed absolute timestamp to the JSONL golden in microseconds
        (FAIL CLOSED on a missing fixture). Wall-clock-derived LDT bytes are
        asserted only for sign/magnitude, not an exact constant.
      known_limitations: >-
        The exact fixture cross-check is on the liveness timestamp delta; TTL and
        local-deletion-time deltas are asserted against controlled Statistics.db
        baselines in the deterministic lane (the EncodingStats min model), since
        expiring LDTs are wall-clock-derived in real fixtures.
    ci:
      tier: required_parity
      workflow: .github/workflows/sstabledump-parity-gate.yml
    scope: {}

