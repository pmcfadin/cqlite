  # ----------------------------------------------------------------------------
  # data_db_decode — static-row markers + clustering-bound prefixes (issue #991 / epic #969)
  # ----------------------------------------------------------------------------
  - id: cass.data_db_decode.static_rows.static_only_partition
    title: Data.db static-only partition marker parity
    status: mirrored
    capability: data_db_decode
    priority: P0
    risk: p1_correctness
    cassandra:
      category: serialization
      relevance: high
      files:
        - UnfilteredSerializer.java
        - UnfilteredSerializerTest.java
    cqlite:
      coverage:
        suite: sstable_parity_data_db_jsonl
        tests:
          - cqlite-core/tests/issue_991_static_clustering_parity.rs
        notes: >-
          A static row sets HAS_EXTENDED_FLAGS (0x80) and the extended IS_STATIC
          bit (0x01), and OMITS the clustering prefix. The deterministic lane
          (`static_only_row_sets_is_static_and_omits_clustering_prefix`) asserts
          these bytes at absolute offsets and that the static row's
          prev_unfiltered_size is hard-coded to 0 (issue #821 — the static
          prelude is not part of the prev-size chain), with the body framing
          closing exactly on the END_OF_PARTITION marker (a leaked clustering
          prefix would shift it) — this lane runs everywhere and is the primary
          static-only-shape evidence. The PINNED fixture lane
          (`fixture_static_columns_marker_byte_parity`) walks the real Snappy
          static_columns_table nb Data.db for the SAME static-row marker byte
          assertions (HAS_EXTENDED_FLAGS + IS_STATIC + prev_size=0 + omitted
          clustering prefix). A LOCAL-ONLY fixture lane
          (`fixture_static_only_partition_marker_byte_parity`) additionally walks
          the truly static-ONLY partition (PK=99) of test_deltas/static_with_rows
          when that (non-pinned) binary is present, SKIPPING in CI where it is
          absent.
    fixtures:
      references:
        - test-data/datasets/sstables/test_basic/static_columns_table-6b0425d0a25111f0a3fef1a551383fb9/nb-1-big-Data.db.jsonl
    evidence:
