          wrong in the same way). issue_821 anchors the deletion/TTL-bearing row
          framing byte invariants. issue_1190's
          static_row_timestamp_flags_gap_pinned_1196 now BYTE-DIFFS the
          static-only-UPDATE static row file-vs-file against the committed
          test_writeparity reference: it asserts the CQLite-written static-row flags
          byte is 0xa0 (no row-level HAS_TIMESTAMP) AND that the whole Data.db is
          byte-identical to Cassandra (the static cell carries its own explicit
          timestamp). The #1196 static-row writer divergence is RESOLVED; the test
          fails if CQLite ever re-introduces the spurious row-level timestamp. These
          are the finished tombstone/TTL artifacts a flush emits, not Cassandra
          memtable accounting internals (AC7).
    fixtures:
      datasets:
        - test-data/datasets/sstables
    evidence:
      type: partial
      artifacts: [bytes, component_files]
      cassandra_version: "5.0.2"
      cassandra_git_sha: f278f6774fc76465c182041e081982105c3e7dbb
      storage_format_version: [nb]
      fixture_generation_command: >-
        bash test-data/scripts/generate-write-load-parity.sh  # cassandra:5.0.2 flush → static_clustering_shape nb reference (Data.db + JSONL)
      comparison_command: >-
        env CQLITE_DATASETS_ROOT=$PWD/test-data/datasets cargo test -p cqlite-core
        --features write-support
        --test issue_764_explicit_local_deletion_time &&
        env CQLITE_DATASETS_ROOT=$PWD/test-data/datasets cargo test -p cqlite-core
        --features write-support --test issue_1190_write_load_byte_parity
        static_row_timestamp_flags_gap_pinned_1196
      known_limitations: >-
        Proves the flushed Data.db row-tombstone bytes (deletion flags +
        local_deletion_time) and the Statistics.db local-deletion-time / TTL
        aggregate bytes are correct against derived expected values. The #1196
        static-row writer divergence is now RESOLVED (see issue #1196): a populated
        static row from a static-only UPDATE is written with flags 0xa0 (no
        row-level HAS_TIMESTAMP / primary-key liveness) and the static cell carries
        its own explicit timestamp, byte-identical to Cassandra — issue_1190's
        static_row_timestamp_flags_gap_pinned_1196 now passes the whole Data.db
        byte diff for static_clustering_shape. It STILL STAYS partial because
        whole-artifact byte parity for the broader tombstone/TTL shape remains
        blocked by ONE real gap confirmed against the committed test_writeparity
        reference (issue #1190): a TTL cell's / DELETE's localDeletionTime is
        wall-clock-derived (nowInSeconds), so it can never byte-match an
        independent writer. Semantic visibility of tombstones/TTLs is covered by
        the live-readback scenario.
    ci:
      tier: exhaustive_regeneration
      workflow: .github/workflows/cassandra-parity.yml
    scope:
      gap: >-
        The static-row writer gap (row-level HAS_TIMESTAMP / PK liveness wrongly
        set on a static-only UPDATE) is now RESOLVED (issue #1196): CQLite emits the
        static block byte-identical to Cassandra (flags 0xa0, static cell carries
        its own explicit timestamp), verified file-vs-file against the committed
        test_writeparity.static_clustering_shape reference. Whole-artifact byte
        parity for the broader tombstone/TTL shape REMAINS blocked by
        wall-clock-derived localDeletionTime on TTL/DELETE cells (nowInSeconds, not
        reproducible across independent writers).
      next_step: >-
        The remaining blocker is intrinsic: TTL/DELETE cells carry a
        wall-clock-derived localDeletionTime (nowInSeconds) that cannot byte-match
        an independent writer, so they stay semantic-only by nature. A future
        upgrade to byte_for_byte would require a non-TTL static-tombstone reference
        whose deletion time is deterministic (explicit localDeletionTime) plus a
        strict Data.db byte diff.

