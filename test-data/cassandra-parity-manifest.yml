  # ----------------------------------------------------------------------------
  # Issue #1199 (coverage soundness fix): exact-basename matching in
  # `cassandra-parity coverage` revealed two high-relevance files that were
  # previously only substring-"classified" by longer scenario filenames
  # (AntiCompactionTest by PendingAntiCompactionTest; TombstonesTest by
  # RepairedDataTombstonesTest). Both describe node-side write/repair/query
  # guardrail behavior that CQLite (read/write/compact of on-disk SSTables)
  # does not implement, so each is conservatively out_of_scope with the
  # in-scope semantics they border named under related_in_scope_scenarios.
  # ----------------------------------------------------------------------------
  - id: cass.compaction.AntiCompactionTest.range_split_repair_state
    title: Anticompaction range-split of SSTables into pending-repair / unrepaired sets
    status: out_of_scope
    capability: compaction_merge
    priority: P2
    risk: node_behavior
    cassandra:
      category: compaction
      relevance: high
      files:
        - AntiCompactionTest.java
    cqlite:
      coverage:
        notes: >-
          Anticompaction is a node-side repair operation that physically splits
          an SSTable's partitions by token range into pending-repair and
          unrepaired output sets and stamps the repair-state flags. CQLite reads
          and merges whatever SSTables anticompaction produced; it does not run
          anticompaction, own repair sessions, or split by token range.
    fixtures:
      datasets:
        - test-data/datasets/sstables
    evidence:
      type: out_of_scope
      artifacts: [logs]
      cassandra_version: "5.0.2"
      cassandra_git_sha: f278f6774fc76465c182041e081982105c3e7dbb
    ci:
      tier: manual_debug
    scope:
      out_of_scope_category: not_sstable_reader_writer_compactor
      rationale: >-
        Anticompaction (splitting SSTables by token range during incremental
        repair, managing repair-session lifecycle and transient/full replica
        ranges) is a node-side repair behavior. CQLite is a read/write/compact
        library over on-disk SSTables and never executes anticompaction.
      cqlite_boundary: >-
        CQLite parses and preserves the repair-state metadata (repairedAt /
        pendingRepair UUID) an SSTable carries and rejects mixed-repair-state
        compaction; it does not perform the token-range split or run a repair
        session.
      safe_claim: >-
        CQLite reads and compacts the pending-repair and unrepaired SSTables
        anticompaction produced, honoring their repair-state metadata; it does
        not reproduce the anticompaction split itself.
      related_in_scope_scenarios:
        - cass.repair.PendingAntiCompactionTest.pending_repair_metadata
        - cass.tombstone_ttl.RepairedDataTombstonesTest.repair_metadata_gates_purge

  - id: cass.tombstone_ttl.TombstonesTest.overwhelming_threshold_guardrail
    title: Tombstone-overwhelming query guardrail (warn/fail thresholds + metrics)
    status: out_of_scope
    capability: tombstone_ttl
    priority: P2
    risk: node_behavior
    cassandra:
      category: tombstone-ttl
      relevance: high
      files:
        - TombstonesTest.java
    cqlite:
      coverage:
        notes: >-
          TombstonesTest exercises the query-time tombstone-overwhelming
          guardrail: raising TombstoneOverwhelmingException and incrementing
          warn/fail metrics once a read scans more tombstones than a configured
          threshold. That is a node-side query-execution guardrail. The
          underlying correctness semantics it relies on — tombstone shadowing by
          partition/row deletes and gc_grace expiry exclusion — ARE in CQLite's
          domain and are covered by the related in-scope scenarios below.
    fixtures:
      datasets:
        - test-data/datasets/sstables
    evidence:
      type: out_of_scope
      artifacts: [logs]
      cassandra_version: "5.0.2"
      cassandra_git_sha: f278f6774fc76465c182041e081982105c3e7dbb
    ci:
      tier: manual_debug
    scope:
      out_of_scope_category: not_sstable_reader_writer_compactor
      rationale: >-
        The warn/fail tombstone-count thresholds, TombstoneOverwhelmingException,
        and the associated read-failure metrics are a node-side query-execution
        guardrail enforced by the coordinator/read path, not an on-disk SSTable
        read/write/compaction behavior.
      cqlite_boundary: >-
        CQLite reads tombstones from SSTables and applies shadowing and gc_grace
        expiry during scans/merges; it does not enforce a per-query tombstone
        budget or raise TombstoneOverwhelmingException.
      safe_claim: >-
        CQLite correctly filters tombstones shadowed by partition/row deletes and
        excludes gc_grace-expired tombstones during reads and compaction; it does
        not implement the query-time tombstone-overwhelming threshold guardrail.
      related_in_scope_scenarios:
        - cass.tombstone_ttl.gc_grace.partition_row_cell
        - cass.tombstone_ttl.skipped_sstable.partition_delete_shadows_older_rows

# ==============================================================================
# Public/release-facing parity claims (issue #1023).
#
# `claim.safe.*`  — the manifest-backed wording the project is allowed to publish,
#                   each cited to the scenarios that supply its evidence.
# `claim.blocked.*` — unqualified absolute over-claims the claim-scan lint rejects
#                   in release-facing docs unless the line explicitly scopes them
#                   as a counter-example. Each names the safe wording to use.
# ==============================================================================
claims:
  - id: claim.safe.uncompressed_sstable_writes
    kind: safe
    phrase: >-
      CQLite writes uncompressed SSTables
    rationale: >-
      The production write surface (flush + compaction via SSTableWriter) emits
      UNCOMPRESSED SSTables only and never emits a CompressionInfo.db. The
      compressed-write building blocks (CompressedDataWriter,
      CompressionInfoWriter) are built but UNWIRED — used only by read-path
      fixtures — and any attempt to configure compressed production writing is
      fail-closed (SSTableWriter::with_compression /
      CompressionInfoWriter::guard_unsupported_production_write return
      Error::UnsupportedFormat). This is the claim boundary from issue #1406,
      posture (b): guard now, wire compression later. It scopes the write claim
      to uncompressed output rather than implying byte-validated compressed
      writing, for which zero Cassandra-side coverage exists.
    evidence_scenarios:
      - cass.write_load_path.cql_sstable_writer.finished_data_db_artifacts

  - id: claim.blocked.compressed_sstable_writes
    kind: blocked
    phrase: CQLite writes compressed SSTables
    rationale: >-
      CQLite does not emit compressed SSTables from any production path. The
      compressed-write modules are built but unwired and carry no Cassandra-side
      byte-parity coverage for a CQLite-emitted CompressionInfo.db (issue #1406).
      Claiming compressed writing overstates the write surface, which is
      fail-closed for every real compression algorithm.
    safe_alternative: claim.safe.uncompressed_sstable_writes

  - id: claim.safe.selected_fixture_validation
    kind: safe
    phrase: >-
      validated against selected Apache Cassandra 5.0 SSTable fixtures
    rationale: >-
      CQLite is validated against the specific Cassandra-generated fixtures and
      datasets recorded in this manifest, not against every possible SSTable. The
      wording scopes the claim to the covered corpus rather than implying
      exhaustive coverage.
    evidence_scenarios:
      - cass.sstable_format.toc_component_manifest
      - cass.data_db_decode.row_cell_flags_and_vint
      - cass.compression_info.lz4.real_fixture_chunks

  - id: claim.safe.rust_byte_level_coverage
    kind: safe
    phrase: >-
      byte-for-byte parity is proven only where this manifest records byte_for_byte evidence
    rationale: >-
      Byte-level equivalence is asserted only for scenarios carrying explicit
      byte_for_byte evidence (bytes/offsets/checksums/component files with a
      strict comparison). The wording forbids generalizing byte parity beyond
      those scenarios.
    evidence_scenarios:
      - cass.compaction_merge.byte_for_byte_output
      - cass.compaction.harness_byte_tier_artifacts

  - id: claim.safe.traceable_cassandra_parity_suite
    kind: safe
    phrase: >-
      a traceable parity suite mapping CQLite tests to specific Cassandra scenarios
    rationale: >-
      The parity manifest maps each CQLite test/fixture to the Cassandra
      scenario it mirrors, so claims are traceable to named evidence. This is
      distinct from running Cassandra's own JVM test suite.
    evidence_scenarios:
      - cass.compaction.CompactionIteratorTest.differential_compaction_loop
      - cass.data_db_decode.serialization_mirror.multi_clustering_column_order

  - id: claim.blocked.same_tests_as_cassandra
    kind: blocked
    phrase: same tests as Cassandra
    rationale: >-
      CQLite does not run Apache Cassandra's JVM test suite; it runs its own
      Rust parity suite against recorded fixtures. Claiming the "same tests"
      overstates coverage and implies node-behavior parity CQLite never asserts.
    safe_alternative: claim.safe.traceable_cassandra_parity_suite

  - id: claim.blocked.full_compaction_byte_parity
    kind: blocked
    phrase: full compaction byte parity
    rationale: >-
      Byte-for-byte compaction parity is proven only for the scenarios that
      carry byte_for_byte evidence, not for all compaction inputs/strategies.
      "Full" generalizes byte parity beyond the manifest's evidence.
    safe_alternative: claim.safe.rust_byte_level_coverage

  - id: claim.blocked.zero_diff_sstabledump_all_datasets
    kind: blocked
    phrase: zero-diff sstabledump across every dataset
    rationale: >-
      sstabledump parity is validated for the selected fixtures in this manifest,
      not for every conceivable dataset. "Across every dataset" claims exhaustive
      coverage the evidence does not support.
    safe_alternative: claim.safe.selected_fixture_validation
