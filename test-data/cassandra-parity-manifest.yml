  - id: cass.filter_db.statistical_false_positive_rate
    title: Filter.db empirical false-positive-rate report
    status: mirrored
    capability: filter_db_bloom
    priority: P2
    risk: p2_coverage
    cassandra:
      category: bloom-filter
