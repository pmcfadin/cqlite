  - id: cass.filter_db.bit_flip_false_negative_exposure
    title: Filter.db bit-array bit flip — false-negative exposure and verify detection
    status: mirrored
    capability: filter_db_bloom
    priority: P0
    risk: p0_data_loss
    cassandra:
      category: bloom-filter
      relevance: high
      files:
        - BloomFilterTest.java
        - VerifyTest.java
    cqlite:
      coverage:
        suite: sstable_parity_filter_db_bloom
        tests:
          - cqlite-core/tests/sstable_parity_filter_bitflip_test.rs
          - cqlite-core/tests/sstable_parity_corruption_verify.rs
        notes: >-
          Corpus fixture filter_db_bit_flip (corruption-manifest.yml) flips one SET
          bit inside the bit array of a real Cassandra BIG Filter.db (byte 8, the
          first bitset byte past the valid 8-byte header; the header is left valid),
          producing a Bloom-filter FALSE NEGATIVE for a present partition key. The
          exposure pin (sstable_parity_filter_bitflip_test.rs) proves the false
          negative is real (might_contain==false for a key Index.db proves present —
          exactly the predicate partition_lookup.rs gates Ok(None) on), that a FULL
          SCAN still reads the partition (scans never consult the bloom), and that
          BTI (da) is IMMUNE (the trie is the presence oracle, bloom bypassed). It
          also asserts cqlite verify --mode full reports a FilterFalseNegative
          finding on Filter.db — a detection tool Cassandra lacks. The corpus verify
          lane (sstable_parity_corruption_verify.rs) drives the SAME finding through
          the shipped verify_sstable surface and asserts the recorded divergence vs
          the captured Cassandra verdict.
    fixtures:
      references:
        - test-data/datasets/corruption/test_comp_corrupt/corruption-manifest.yml
        - test-data/datasets/corruption/test_comp_corrupt/corruption-sha256.txt
    evidence:
      type: byte_for_byte
      strict: true
      artifacts: [bytes, component_files]
      cassandra_version: "5.0.2"
      cassandra_git_sha: f278f6774fc76465c182041e081982105c3e7dbb
      storage_format_version: [nb]
      fixture_generation_command: >-
        bash test-data/scripts/generate-corruption-corpus.sh
      comparison_command: >-
        env CQLITE_DATASETS_ROOT=$PWD/test-data/datasets cargo test -p cqlite-core
        --test sstable_parity_filter_bitflip_test
      failure_artifacts:
        - artifact.required_parity.byte_diff
      reference_paths:
        - test-data/datasets/corruption/test_comp_corrupt/corruption-manifest.yml
        - test-data/datasets/corruption/test_comp_corrupt/corruption-sha256.txt
      normalization: >-
        Present keys are the raw partition-key bytes from Index.db (key_digest,
        issue #552) — the exact bytes Cassandra's Murmur3 hashed into Filter.db.
        Cassandra's verdict is its ACTUAL captured sstableverify -e outcome (CLEAN:
        'Verify ... succeeded. All 1 rows read successfully') recorded in
        corruption-manifest.yml (filter_db_bit_flip, verdict_parity: divergent).
      known_limitations: >-
        POSTURE (a), accepted exposure (issue #1398): the read-side false negative
        on the BIG point-lookup path is Cassandra-EQUIVALENT — Filter.db carries no
        checksum, and CQLite (like Cassandra) fails open only for an UNPARSEABLE
        filter, so a parseable-but-wrong filter is not rejected at load. Cassandra's
        sstableverify does NOT validate Filter.db bit-array contents (captured verdict:
        clean), so this is a recorded verdict_parity: divergent — CQLite adds a
        detection tool (verify --mode full ⇒ FilterFalseNegative) that Cassandra
        lacks. A fail-closed Filter.db checksum at load (stronger than Cassandra) is
        explicitly NOT implemented here; it is a design follow-up.
    ci:
      tier: required_parity
      workflow: .github/workflows/sstabledump-parity-gate.yml
    scope: {}

