# 'sstableverify --extended --force' outcome captured on that fixture's exact
# bytes (issue #1236), NOT hand-encoded from Cassandra source. Capture tool:
# test-data/scripts/capture-cassandra-verify-verdicts.sh (cassandra:5.0.2).
