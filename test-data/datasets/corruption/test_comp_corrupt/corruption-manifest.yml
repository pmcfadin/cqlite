    verdict_parity: divergent
    verdict_note: "Cassandra 5.0.8 sstableverify -e verifies CLEAN (captured: 'Verify of BigTableReader:big(...nb-1-big-Data.db) succeeded. All 1 rows read successfully'): the standalone verifier does NOT read/validate Filter.db bit-array contents (Cassandra only rebuilds a filter it cannot deserialize; a parseable-but-wrong filter passes), so a flipped bit-array bit does NOT trip its verify. CQLite is intentionally STRICTER: verify --mode full re-probes every present Index.db key against the decoded filter and reports FilterFalseNegative. Recorded divergence + a detection tool Cassandra lacks; the read-side exposure (silent false negative on BIG point lookups) is Cassandra-equivalent (issue #1398)."
