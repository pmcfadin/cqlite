    rationale: "Bit-array bit flip (byte 8, the first bitset byte past the valid 8-byte header): a SET bit is cleared 1->0 so a present partition key hashes to an unset bit -> Bloom-filter FALSE NEGATIVE (might_contain==false). The BIG point-lookup path then returns Ok(None) for a live partition (silent data invisibility); full scans and BTI lookups are unaffected. Filter.db has no checksum so the flip is not caught on load. CQLite adds a verify --mode full FilterFalseNegative detection Cassandra lacks."
