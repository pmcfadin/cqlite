# CQLite Enhanced Docker-based Cassandra 5+ Data Generation System


services:
  # Cassandra 5.0 - Latest version with new features (Enhanced for Issue #30)
  # Pinned to 5.0.2 (Issue #482) so e2e readback tests use a stable build.
  # Version bump procedure (Issue #669): update this image tag AND the matching
  # CASSANDRA_IMAGE env var in both CI workflow files:
  #   - .github/workflows/cassandra-validation.yml
  #   - .github/workflows/m1-ci.yml
  cassandra-5-0:
    image: cassandra:5.0.2
    container_name: cqlite-cassandra-5-0
    hostname: cassandra-5-0
    environment:
      - CASSANDRA_CLUSTER_NAME=cqlite-test-5-0
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_START_RPC=true
      - CASSANDRA_RPC_ADDRESS=0.0.0.0
      # Cassandra 5.0.2+ rejects a wildcard listen_address; use the entrypoint's
      # auto-detection so it picks up the container IP at startup.
      - CASSANDRA_LISTEN_ADDRESS=auto
      - CASSANDRA_BROADCAST_ADDRESS=cassandra-5-0
      - CASSANDRA_AUTHENTICATOR=AllowAllAuthenticator
      - CASSANDRA_AUTHORIZER=AllowAllAuthorizer
      - CASSANDRA_AUTO_BOOTSTRAP=false
      # Enhanced memory configuration for CI stability
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=256m
      # Enhanced timeout configuration for reliability
      - CASSANDRA_WRITE_REQUEST_TIMEOUT_IN_MS=15000
      - CASSANDRA_READ_REQUEST_TIMEOUT_IN_MS=15000
      - CASSANDRA_RANGE_REQUEST_TIMEOUT_IN_MS=15000
      - CASSANDRA_COUNTER_WRITE_REQUEST_TIMEOUT_IN_MS=15000
      - CASSANDRA_BATCH_SIZE_WARN_THRESHOLD_IN_KB=128
      - CASSANDRA_BATCH_SIZE_FAIL_THRESHOLD_IN_KB=1024
      # Performance optimizations for validation
      - CASSANDRA_COMPACTION_THROUGHPUT_MB_PER_SEC=64
      - CASSANDRA_CONCURRENT_READS=32
      - CASSANDRA_CONCURRENT_WRITES=32
      - CASSANDRA_MEMTABLE_ALLOCATION_TYPE=heap_buffers
    ports:
      - "9046:9042"   # CQL port
      - "7004:7000"   # Inter-node communication
      - "7203:7199"   # JMX
      - "9164:9160"   # Thrift (for compatibility)
    volumes:
      - ../scripts:/opt/scripts:ro
      - ../schemas:/opt/schemas:ro
      - ../logs:/opt/logs
    tmpfs:
      - /var/lib/cassandra
      - /tmp/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT cluster_name FROM system.local;' && nodetool status | grep -q 'UN'"]
      interval: 30s
      timeout: 30s
      retries: 15
      start_period: 300s
    # Resource limits for CI environments
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    # Restart policy for CI stability
    restart: unless-stopped
    networks:
      - cqlite-test-network

  # Data generator container for issuing type-correct inserts
  data-generator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.data-generator
    container_name: cqlite-data-generator
    depends_on:
      - cassandra-5-0
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ../scripts:/scripts:ro
      - ../schemas:/schemas:ro
      - ../logs:/logs
    networks:
      - cqlite-test-network

networks:
  cqlite-test-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/16
