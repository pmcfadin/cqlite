# Multi-Version Cassandra Test Data Generation - Issue #17
# Comprehensive Docker Compose setup for generating test data across multiple Cassandra versions
# 
# CRITICAL SUCCESS FACTOR: Command-line test execution MUST work reliably!

version: '3.8'

services:
  # Cassandra 3.7 - Legacy version support
  cassandra-3-7:
    image: cassandra:3.7
    container_name: cqlite-test-cassandra-3-7
    environment:
      - CASSANDRA_CLUSTER_NAME=CQLiteTestCluster37
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=2G
      - HEAP_NEWSIZE=400M
    volumes:
      - cassandra-3-7-data:/var/lib/cassandra
      - ./schemas:/schemas:ro
      - ./generated:/generated
    ports:
      - "9042:9042"
      - "7000:7000"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local'"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - cqlite-test-network

  # Cassandra 3.11 - Stable legacy version
  cassandra-3-11:
    image: cassandra:3.11
    container_name: cqlite-test-cassandra-3-11
    environment:
      - CASSANDRA_CLUSTER_NAME=CQLiteTestCluster311
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=2G
      - HEAP_NEWSIZE=400M
    volumes:
      - cassandra-3-11-data:/var/lib/cassandra
      - ./schemas:/schemas:ro
      - ./generated:/generated
    ports:
      - "9043:9042"
      - "7001:7000"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local'"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - cqlite-test-network

  # Cassandra 4.0 - Modern version with new features
  cassandra-4-0:
    image: cassandra:4.0
    container_name: cqlite-test-cassandra-4-0
    environment:
      - CASSANDRA_CLUSTER_NAME=CQLiteTestCluster40
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=2G
      - HEAP_NEWSIZE=400M
    volumes:
      - cassandra-4-0-data:/var/lib/cassandra
      - ./schemas:/schemas:ro
      - ./generated:/generated
    ports:
      - "9044:9042"
      - "7002:7000"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local'"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - cqlite-test-network

  # Cassandra 4.1 - Latest supported version
  cassandra-4-1:
    image: cassandra:4.1
    container_name: cqlite-test-cassandra-4-1
    environment:
      - CASSANDRA_CLUSTER_NAME=CQLiteTestCluster41
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=2G
      - HEAP_NEWSIZE=400M
    volumes:
      - cassandra-4-1-data:/var/lib/cassandra
      - ./schemas:/schemas:ro
      - ./generated:/generated
    ports:
      - "9045:9042"
      - "7003:7000"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local'"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - cqlite-test-network

  # Cassandra 5.0 - Latest version for future compatibility
  cassandra-5-0:
    image: cassandra:latest
    container_name: cqlite-test-cassandra-5-0
    environment:
      - CASSANDRA_CLUSTER_NAME=CQLiteTestCluster50
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=2G
      - HEAP_NEWSIZE=400M
    volumes:
      - cassandra-5-0-data:/var/lib/cassandra
      - ./schemas:/schemas:ro
      - ./generated:/generated
    ports:
      - "9046:9042"
      - "7004:7000"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local'"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - cqlite-test-network

  # Automated Data Generator
  data-generator:
    build:
      context: .
      dockerfile: Dockerfile.data-generator
    container_name: cqlite-data-generator
    environment:
      - TEST_DATA_SCALE=${TEST_DATA_SCALE:-COMPREHENSIVE}
      - GENERATION_TIMEOUT=${GENERATION_TIMEOUT:-3600}
      - PARALLEL_GENERATION=true
      - ENABLE_VALIDATION=true
    volumes:
      - ./schemas:/schemas:ro
      - ./generated:/generated
      - ./scripts:/scripts:ro
    depends_on:
      cassandra-3-7:
        condition: service_healthy
      cassandra-3-11:
        condition: service_healthy
      cassandra-4-0:
        condition: service_healthy
      cassandra-4-1:
        condition: service_healthy
      cassandra-5-0:
        condition: service_healthy
    networks:
      - cqlite-test-network
    command: >
      bash -c "
        echo 'Starting automated data generation for all Cassandra versions...'
        
        # Generate data for each version in parallel
        python3 /scripts/generate_comprehensive_test_data.py --version 3.7 --host cassandra-3-7 --port 9042 &
        python3 /scripts/generate_comprehensive_test_data.py --version 3.11 --host cassandra-3-11 --port 9042 &
        python3 /scripts/generate_comprehensive_test_data.py --version 4.0 --host cassandra-4-0 --port 9042 &
        python3 /scripts/generate_comprehensive_test_data.py --version 4.1 --host cassandra-4-1 --port 9042 &
        python3 /scripts/generate_comprehensive_test_data.py --version 5.0 --host cassandra-5-0 --port 9042 &
        
        # Wait for all background jobs
        wait
        
        echo 'Data generation completed for all versions'
        
        # Run validation
        if [ '$$ENABLE_VALIDATION' = 'true' ]; then
          python3 /scripts/validate_generated_data.py --all-versions
        fi
        
        echo 'All data generation and validation completed successfully'
      "

  # SSTable Exporter
  sstable-exporter:
    build:
      context: .
      dockerfile: Dockerfile.sstable-exporter
    container_name: cqlite-sstable-exporter
    environment:
      - EXPORT_FORMAT=native
      - COMPRESSION_ENABLED=true
      - INCLUDE_METADATA=true
    volumes:
      - cassandra-3-7-data:/cassandra-3-7-data:ro
      - cassandra-3-11-data:/cassandra-3-11-data:ro
      - cassandra-4-0-data:/cassandra-4-0-data:ro
      - cassandra-4-1-data:/cassandra-4-1-data:ro
      - cassandra-5-0-data:/cassandra-5-0-data:ro
      - ./generated:/generated
    depends_on:
      data-generator:
        condition: service_completed_successfully
    networks:
      - cqlite-test-network
    command: >
      bash -c "
        echo 'Starting SSTable export for all versions...'
        
        # Export SSTables from each version
        /scripts/export_sstables.sh --source /cassandra-3-7-data --target /generated/v3.7/sstables --version 3.7 &
        /scripts/export_sstables.sh --source /cassandra-3-11-data --target /generated/v3.11/sstables --version 3.11 &
        /scripts/export_sstables.sh --source /cassandra-4-0-data --target /generated/v4.0/sstables --version 4.0 &
        /scripts/export_sstables.sh --source /cassandra-4-1-data --target /generated/v4.1/sstables --version 4.1 &
        /scripts/export_sstables.sh --source /cassandra-5-0-data --target /generated/v5.0/sstables --version 5.0 &
        
        # Wait for all exports to complete
        wait
        
        echo 'SSTable export completed for all versions'
        
        # Generate metadata summaries
        /scripts/generate_sstable_metadata.sh /generated
        
        echo 'SSTable export and metadata generation completed successfully'
      "

  # Performance Monitor
  performance-monitor:
    image: python:3.11-slim
    container_name: cqlite-performance-monitor
    environment:
      - MONITOR_INTERVAL=30
      - EXPORT_METRICS=true
    volumes:
      - ./generated:/generated
      - ./scripts:/scripts:ro
    networks:
      - cqlite-test-network
    command: >
      bash -c "
        pip install psutil docker
        python3 /scripts/performance_monitor.py --output /generated/performance_metrics.json
      "

volumes:
  cassandra-3-7-data:
    driver: local
  cassandra-3-11-data:
    driver: local
  cassandra-4-0-data:
    driver: local
  cassandra-4-1-data:
    driver: local
  cassandra-5-0-data:
    driver: local

networks:
  cqlite-test-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16