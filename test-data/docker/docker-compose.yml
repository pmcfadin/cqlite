version: '3.8'

# CQLite Docker-based Test Data Generation System
# Supports multiple Cassandra versions for comprehensive testing
# Issue #18: Docker-based test data generation

services:
  # Cassandra 3.7 - Legacy version support
  cassandra-3-7:
    image: cassandra:3.7
    container_name: cqlite-cassandra-3-7
    hostname: cassandra-3-7
    environment:
      - CASSANDRA_CLUSTER_NAME=cqlite-test-3-7
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_START_RPC=true
      - CASSANDRA_RPC_ADDRESS=0.0.0.0
      - CASSANDRA_AUTHENTICATOR=AllowAllAuthenticator
      - CASSANDRA_AUTHORIZER=AllowAllAuthorizer
      - CASSANDRA_AUTO_BOOTSTRAP=false
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=200m
    ports:
      - "9042:9042"   # CQL port
      - "7000:7000"   # Inter-node communication
      - "7199:7199"   # JMX
    volumes:
      - cassandra-3-7-data:/var/lib/cassandra
      - ../scripts:/opt/scripts
      - ../schemas:/opt/schemas
      - ../generated/v3.7:/opt/generated
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT cluster_name FROM system.local;' || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 120s
    networks:
      - cqlite-test-network

  # Cassandra 3.11 - Stable legacy version
  cassandra-3-11:
    image: cassandra:3.11
    container_name: cqlite-cassandra-3-11
    hostname: cassandra-3-11
    environment:
      - CASSANDRA_CLUSTER_NAME=cqlite-test-3-11
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_START_RPC=true
      - CASSANDRA_RPC_ADDRESS=0.0.0.0
      - CASSANDRA_AUTHENTICATOR=AllowAllAuthenticator
      - CASSANDRA_AUTHORIZER=AllowAllAuthorizer
      - CASSANDRA_AUTO_BOOTSTRAP=false
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=200m
    ports:
      - "9043:9042"   # CQL port (different host port)
      - "7001:7000"   # Inter-node communication
      - "7200:7199"   # JMX
    volumes:
      - cassandra-3-11-data:/var/lib/cassandra
      - ../scripts:/opt/scripts
      - ../schemas:/opt/schemas
      - ../generated/v3.11:/opt/generated
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT cluster_name FROM system.local;' || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 120s
    networks:
      - cqlite-test-network

  # Cassandra 4.0 - Modern version with new features
  cassandra-4-0:
    image: cassandra:4.0
    container_name: cqlite-cassandra-4-0
    hostname: cassandra-4-0
    environment:
      - CASSANDRA_CLUSTER_NAME=cqlite-test-4-0
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_START_RPC=true
      - CASSANDRA_RPC_ADDRESS=0.0.0.0
      - CASSANDRA_AUTHENTICATOR=AllowAllAuthenticator
      - CASSANDRA_AUTHORIZER=AllowAllAuthorizer
      - CASSANDRA_AUTO_BOOTSTRAP=false
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=200m
    ports:
      - "9044:9042"   # CQL port (different host port)
      - "7002:7000"   # Inter-node communication
      - "7201:7199"   # JMX
    volumes:
      - cassandra-4-0-data:/var/lib/cassandra
      - ../scripts:/opt/scripts
      - ../schemas:/opt/schemas
      - ../generated/v4.0:/opt/generated
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT cluster_name FROM system.local;' || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 120s
    networks:
      - cqlite-test-network

  # Cassandra 4.1 - Latest supported version
  cassandra-4-1:
    image: cassandra:4.1
    container_name: cqlite-cassandra-4-1
    hostname: cassandra-4-1
    environment:
      - CASSANDRA_CLUSTER_NAME=cqlite-test-4-1
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_START_RPC=true
      - CASSANDRA_RPC_ADDRESS=0.0.0.0
      - CASSANDRA_AUTHENTICATOR=AllowAllAuthenticator
      - CASSANDRA_AUTHORIZER=AllowAllAuthorizer
      - CASSANDRA_AUTO_BOOTSTRAP=false
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=200m
    ports:
      - "9045:9042"   # CQL port (different host port)
      - "7003:7000"   # Inter-node communication
      - "7202:7199"   # JMX
    volumes:
      - cassandra-4-1-data:/var/lib/cassandra
      - ../scripts:/opt/scripts
      - ../schemas:/opt/schemas
      - ../generated/v4.1:/opt/generated
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT cluster_name FROM system.local;' || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 120s
    networks:
      - cqlite-test-network

  # Data generator service - runs after all Cassandra instances are healthy
  test-data-generator:
    image: python:3.9-slim-bullseye
    container_name: cqlite-test-data-generator
    depends_on:
      cassandra-3-7:
        condition: service_healthy
      cassandra-3-11:
        condition: service_healthy
      cassandra-4-0:
        condition: service_healthy
      cassandra-4-1:
        condition: service_healthy
    volumes:
      - ../scripts:/opt/scripts
      - ../schemas:/opt/schemas
      - ../generated:/opt/generated
    working_dir: /opt/scripts
    environment:
      - CASSANDRA_3_7_HOST=cassandra-3-7
      - CASSANDRA_3_11_HOST=cassandra-3-11
      - CASSANDRA_4_0_HOST=cassandra-4-0
      - CASSANDRA_4_1_HOST=cassandra-4-1
      - CASSANDRA_PORT=9042
      - TEST_DATA_SCALE=COMPREHENSIVE
      - GENERATE_ALL_PATTERNS=true
    command: /opt/scripts/generate-all-test-data.sh
    networks:
      - cqlite-test-network

  # SSTable export service - extracts generated SSTables
  sstable-exporter:
    image: python:3.9-slim-bullseye
    container_name: cqlite-sstable-exporter
    depends_on:
      test-data-generator:
        condition: service_completed_successfully
    volumes:
      - ../scripts:/opt/scripts
      - ../generated:/opt/generated
      - cassandra-3-7-data:/var/lib/cassandra-3-7:ro
      - cassandra-3-11-data:/var/lib/cassandra-3-11:ro
      - cassandra-4-0-data:/var/lib/cassandra-4-0:ro
      - cassandra-4-1-data:/var/lib/cassandra-4-1:ro
    working_dir: /opt/scripts
    environment:
      - SOURCE_DATA_DIR=/var/lib
      - OUTPUT_DIR=/opt/generated
    command: /opt/scripts/export-sstables.sh
    networks:
      - cqlite-test-network

networks:
  cqlite-test-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  cassandra-3-7-data:
  cassandra-3-11-data:
  cassandra-4-0-data:
  cassandra-4-1-data: