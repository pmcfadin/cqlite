name: Feature Request
description: Suggest a new feature or enhancement
title: "[FEATURE] "
labels: ["enhancement", "needs-triage"]
projects: ["cqlite-development"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please provide detailed information about your request.

  - type: dropdown
    id: feature-type
    attributes:
      label: Feature Type
      description: What type of feature is this?
      options:
        - New CQL Feature Support
        - Performance Enhancement
        - CLI Improvement
        - API Enhancement
        - Documentation
        - Developer Experience
        - FFI/Language Binding
        - WASM Feature
        - Tooling/Testing
        - Other
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component would this feature affect?
      options:
        - cqlite-core
        - cqlite-cli
        - cqlite-ffi
        - cqlite-wasm
        - SSTable Reader
        - CQL Parser
        - Schema Management
        - Documentation
        - Build System
        - Multiple Components
    validations:
      required: true

  - type: textarea
    id: problem-summary
    attributes:
      label: Problem Summary
      description: What problem does this feature solve? What use case does it address?
      placeholder: Describe the problem or use case this feature would address...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution in detail
      placeholder: How would you like this feature to work?
    validations:
      required: true

  - type: textarea
    id: public-surface
    attributes:
      label: Public Surface & Integration Path
      description: |
        A feature is not "done" when a low-level helper works in isolation — it is done when
        the intended USER-FACING path exercises the new capability. Name that path and the
        call chain that must reach it. (See issue #949/#963: helpers shipped green tests while
        the public path stayed unwired.) Fill in every section below — this field is required
        and the placeholder scaffold is NOT submitted, so an empty answer will be rejected.
      placeholder: |
        ## Intended caller surface(s)
        <!-- Which user-facing entry point(s) must exercise this? Check all that apply -->
        - [ ] CQL `execute` (one-shot / `--query` / `--execute`)
        - [ ] Streaming query API (`execute_streaming` / streaming iterators)
        - [ ] Prepared statements / bind params (`execute_with_params`)
        - [ ] CLI subcommand / flag
        - [ ] REPL / TUI
        - [ ] Python bindings
        - [ ] Node.js bindings
        - [ ] Internal-only (justify below under "Intentionally internal")

        ## Required call chain (storage/query/helper APIs)
        <!-- The APIs that must appear in the path from public surface down to the new code.
             e.g. SELECT execute -> QueryEngine::plan -> SSTableReader::seek_partition -> new helper -->

        ## Fallback behavior
        - [ ] A fallback path (e.g. full scan, default value) is ALLOWED if the fast path can't apply — describe when
        - [ ] Fallback is DISALLOWED — reaching this code without the new path is a bug
        <!-- If fallback is allowed, say how a reviewer can tell the NEW path actually ran vs. the fallback. -->
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Describe any alternative solutions or features you've considered
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Low - Nice to have
        - Medium - Would improve workflow
        - High - Blocking current work
        - Critical - Project depends on this
    validations:
      required: true

  - type: textarea
    id: cassandra-compatibility
    attributes:
      label: Cassandra Compatibility
      description: If applicable, describe how this relates to Apache Cassandra compatibility
      placeholder: Does this feature exist in Cassandra? Which versions support it?

  - type: textarea
    id: implementation-ideas
    attributes:
      label: Implementation Ideas
      description: If you have ideas about how this could be implemented, share them here

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, examples, or links about the feature request