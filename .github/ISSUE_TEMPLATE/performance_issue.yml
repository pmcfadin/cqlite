name: Performance Issue
description: Report performance problems or regressions
title: "[PERFORMANCE] "
labels: ["performance", "needs-triage"]
projects: ["cqlite-development"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a performance issue! Please provide detailed information to help us investigate.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component has the performance issue?
      options:
        - SSTable Reading
        - CQL Parsing
        - Query Execution
        - CLI Operations
        - WASM Performance
        - FFI Performance
        - Memory Usage
        - Build Times
        - Other
    validations:
      required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type
      description: What type of performance issue is this?
      options:
        - Slow execution/processing
        - High memory usage
        - CPU usage too high
        - Performance regression
        - Scalability issue
        - Build/compile time issue
    validations:
      required: true

  - type: textarea
    id: performance-description
    attributes:
      label: Performance Issue Description
      description: Describe the performance problem you're experiencing
    validations:
      required: true

  - type: textarea
    id: current-performance
    attributes:
      label: Current Performance
      description: What performance are you currently seeing?
      placeholder: |
        - Time taken: X seconds
        - Memory usage: X MB/GB
        - CPU usage: X%
        - File size processed: X MB/GB
    validations:
      required: true

  - type: textarea
    id: expected-performance
    attributes:
      label: Expected Performance
      description: What performance would you expect?
    validations:
      required: true

  - type: textarea
    id: public-surface
    attributes:
      label: Public Surface & Integration Path
      description: |
        A perf fix is only real if the intended USER-FACING path actually takes the faster
        route — not just an isolated benchmark of a helper. Name the public path and how a
        reviewer can prove the optimization is on it. (See issue #949/#963.) Fill in every
        section below — this field is required and the placeholder scaffold is NOT submitted,
        so an empty answer will be rejected.
      placeholder: |
        ## Intended caller surface(s)
        <!-- Which user-facing entry point(s) must get faster? Check all that apply -->
        - [ ] CQL `execute` (one-shot / `--query` / `--execute`)
        - [ ] Streaming query API (`execute_streaming` / streaming iterators)
        - [ ] Prepared statements / bind params (`execute_with_params`)
        - [ ] CLI subcommand / flag
        - [ ] REPL / TUI
        - [ ] Python bindings
        - [ ] Node.js bindings
        - [ ] Internal-only (justify below)

        ## Required call chain (storage/query/helper APIs)
        <!-- The APIs on the hot path from public surface down to the optimized code. -->

        ## How to prove the fast path ran
        <!-- Work counters (partitions/rows/blocks read), bench delta from the public surface,
             a regression guard, or a fallback-allowed note. A faster helper that the public
             path never calls does NOT close a perf issue. -->
    validations:
      required: true

  - type: textarea
    id: benchmark-data
    attributes:
      label: Benchmark Data
      description: If you have specific benchmark results, please share them
      render: shell

  - type: textarea
    id: data-characteristics
    attributes:
      label: Data Characteristics
      description: Describe the data you're working with
      placeholder: |
        - SSTable file size: X MB/GB
        - Number of partitions: X
        - Row count: X
        - Column count: X
        - Data types used: text, int, uuid, etc.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your environment details
      placeholder: |
        - OS: [e.g., Ubuntu 22.04, macOS 14.0, Windows 11]
        - CPU: [e.g., Intel i7-12700K, Apple M2, AMD Ryzen 7]
        - RAM: [e.g., 16GB DDR4, 32GB]
        - Storage: [e.g., NVMe SSD, HDD]
        - Rust version: [e.g., 1.75.0]
    validations:
      required: true

  - type: textarea
    id: profiling-data
    attributes:
      label: Profiling Data
      description: If you have profiling data (flamegraphs, etc.), please share
      render: shell

  - type: textarea
    id: comparison
    attributes:
      label: Comparison with Other Tools
      description: How does this performance compare to other tools (if applicable)?
      placeholder: e.g., "cqlsh takes 2 seconds for the same operation"