# CI gating-tier registry — the single source of truth for what `required` waits on.
#
# Issue #2910. Branch protection requires exactly ONE context, `required`
# (`.github/workflows/pr-gate.yml`), and a GitHub Actions job cannot `needs:` a job
# in another workflow. So `required` instead POLLS the pull request head's sibling
# check runs and FAILS CLOSED on any tier listed under `tiers:` below that is
# failed, still non-terminal at the deadline, or absent.
#
# Absence is ALWAYS an error. A registered tier ALWAYS emits its context — a tier
# that does not apply to the diff reports that as an explicit SUCCESS from an
# unconditional gate job. `required` therefore needs no knowledge of GitHub's
# trigger semantics, and a mechanism bug reports "absent" (red) rather than
# "not applicable" (green).
#
# TOPOLOGY. `pr-gate.yml` has two jobs: `pr-gate-core` (fmt/clippy/tests/policy)
# and `required` (`needs: [pr-gate-core]`, `if: always()`), which is the sole
# branch-protection context. Enrolment is mechanically forced by
# `scripts/ci/validate-workflows.rb`, which runs as a step in `pr-gate-core`; it
# fails when a workflow with a `pull_request`/`pull_request_target` trigger appears
# in neither `tiers:` nor `exempt:`. `required` fails unconditionally when
# `pr-gate-core` did not conclude `success`, so adding a PR-triggered workflow
# without enrolling it still reds `required` — one job removed.
#
# Of the 25 workflows that carry a `pull_request`/`pull_request_target` trigger,
# one is the aggregator (pr-gate.yml), one is a gating tier (flight-ci.yml) and
# the remaining 23 are exempted below.
#
# SCHEMA
#   version:        must be 1.
#   aggregator:     the workflow + job that performs the aggregation. Never registrable
#                   as a tier (it would wait on itself).
#   defaults:
#     wait_minutes: default aggregation deadline for a tier (minutes).
#   tiers[]:
#     id:            lowercase kebab-case; also the waiver-label suffix `ci:waive:<id>`.
#     workflow:      file name under .github/workflows/.
#     context:       the EXACT check-run name, i.e. the emitting job's `name:`.
#     wait_minutes:  optional per-tier override; the effective deadline is the MAX
#                    over tiers and must stay strictly below the aggregator job's
#                    timeout-minutes.
#     mandate_paths: documentation of the tier's own diff-based mandate predicate.
#                    The predicate itself lives in the tier's classifier job (single
#                    owner); this list exists so a reader can see the intent here.
#     notes:         free text.
#   exempt[]:
#     workflow / reason / issue — a PR-triggered workflow that deliberately does NOT
#     gate the merge. `reason` and `issue` are both mandatory.
#
# STRUCTURAL RULES ENFORCED ON EVERY ENTRY UNDER `tiers:` (gating_policy_rules.rb).
# Each exists to prevent a concrete failure, in EITHER direction — a tier that can
# be permanently absent deadlocks every PR just as surely as a silent hole lets one
# through:
#   * the workflow has a `pull_request`/`pull_request_target` trigger at all;
#   * no blocking `paths:`/`paths-ignore:`/`branches:`/`branches-ignore:` filter (only
#     the always-fire sentinel `__required_ci_context_never_matches__` is permitted);
#   * `types:` covers every event that mints a new head sha (`opened`, `synchronize`),
#     or the context is permanently absent for some head; and `types:` stays within
#     the aggregator's own observed set, or an event the aggregator cannot see could
#     cancel the tier's in-flight run with no `required` run watching for the replacement;
#   * exactly one job emits the declared context; its condition is EXACTLY `${{ !cancelled() }}`
#     (a compound `!cancelled() && …` can still evaluate false and skip — and a bare `always()`
#     is REJECTED: it runs the gate job DURING a run cancellation, turning
#     `needs.*.result == cancelled` into a `failure` conclusion and making the aggregator's
#     supersession grace unreachable); for every job it
#     depends on, some step both READS `needs.<job>.result` and can exit non-zero; and
#     its transitive `needs` closure covers every other job in the workflow;
#   * the entry is not the aggregating workflow.
#
# AND ON THE AGGREGATOR: it must fire on `labeled`/`unlabeled`, or the `ci:waive:<id>`
# break-glass below could never be exercised on a PR this mechanism has wedged
# (applying a label starts no run for an unsubscribed event type, and re-running a
# workflow replays the original event payload).

version: 1

aggregator:
  workflow: pr-gate.yml
  job: required

defaults:
  wait_minutes: 60

tiers:
  # The motivating tier (#2910 / PR #2906): the Flight end-to-end tests that
  # constituted a change's WIRING EVIDENCE ran in neither the local gate nor
  # flight-ci.yml's PR tier, because the workflow was path-filtered AND the heavy
  # job was gated on a `ci:flight-full` label the PR did not carry. Both halves are
  # now closed: the trigger always fires, and a diff touching cqlite-flight/**
  # MANDATES the full tier with or without the label.
  - id: flight
    workflow: flight-ci.yml
    context: Flight tier gate
    wait_minutes: 60
    mandate_paths:
      - cqlite-flight/**
      - cqlite-core/**
      - test-data/**
      - .github/actions/setup-rust-ci/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/flight-ci.yml
    notes: >-
      The gate job reports the aggregate of the classifier, the fmt/clippy/lib-test
      job, the full-package job (which owns cqlite-flight/tests/** — the ~30
      integration/end-to-end tests) and the image job. ONE applicability verdict
      covers all of them: matching any `mandate_paths` entry runs the whole tier.
      cqlite-core/** is in the set because core is the direction Flight breaks from
      (#2825's wrong constant, #2821 its first caller — both core diffs whose Flight
      e2e coverage was the point); an earlier cut routed a core-only diff to the
      `--lib` job alone and still reported success. `ci:flight-full` remains a manual
      opt-in for diffs that mandate nothing.

exempt:
  - workflow: cassandra-parity.yml
    reason: Scheduled/label-driven parity lane; its merge-gating half is the committed parity report checked by the local gate.
    issue: "#2910"
  - workflow: cassandra-validation.yml
    reason: Docker-backed validation lane run on demand; not merge-gating today.
    issue: "#2910"
  - workflow: ci-minimal-features.yml
    reason: Feature-matrix build lane; the merge-gating minimal-features build runs in the local gate.
    issue: "#2910"
  - workflow: ci.yml
    reason: "Broad opt-in lane; exempt because it is ci:broad-label-gated and does not run on an unlabelled PR at all — NOT because the local agent gate is a superset of it. It is not: ci.yml executes `cargo test -p cqlite-core --features delta-scan --lib`, and the local gate only COMPILES those tests (feature-iso-delta-scan is `--lib --no-run`). Audited in #3522."
    issue: "#2910"
  - workflow: compaction-parity.yml
    reason: Byte-parity lane whose merge-gating half is the local gate's compaction-byte-parity component.
    issue: "#2910"
  - workflow: coverage-baseline.yml
    reason: Advisory coverage trend lane; a coverage dip must not block a merge.
    issue: "#2910"
  - workflow: delta-roundtrip.yml
    reason: Feature-flagged delta-export lane, covered by the local gate's delta tests.
    issue: "#2910"
  - workflow: docs-site.yml
    reason: Docs site build/deploy; a site build failure is fixed forward, not merge-gating.
    issue: "#2910"
  - workflow: e2e-readback.yml
    reason: Label-gated Cassandra readback tier (ci:ingest-full); promotion to a gating tier is tracked separately.
    issue: "#2910"
  - workflow: flight-trino-e2e.yml
    reason: Docker-compose Trino end-to-end tier; promotion to a gating tier is tracked separately.
    issue: "#2910"
  - workflow: fuzz.yml
    reason: Fuzz smoke plus nightly long-run; a fuzz finding is filed as a bug, not a merge block.
    issue: "#1614"
  - workflow: live-cell-compaction-parity.yml
    reason: Docker-backed live-cell parity lane; not merge-gating today.
    issue: "#2910"
  - workflow: node-ci.yml
    reason: >-
      Node binding lane; the merge-gating half is the local gate's node-bindings
      component, which since #3522 runs the WHOLE jest suite (it ran 1 of 27 files
      before), plus binding-rust-tests for cqlite-node's Rust unit tests, which ran
      nowhere. Since #3493 it also runs `npm run typecheck` (this workflow's
      always-run PR smoke job; it is `tsc --noEmit` over the examples project, so it
      COMPILES against the shipped index.d.ts, which #3581's typescript-definitions
      test does not — that one reads the declarations as TEXT and asserts the runtime
      surface is declared. Different properties, both wanted) and pairs `npm test` with check-dataset-manifest.sh, which checks
      the CORPUS is complete rather than that the suite ran — the parity cases derive
      their table set from disk, so a partial extraction is green by omission. The
      multi-platform build matrix is release coverage, not merge-gating.
      TWO OPT-OUT STATES, WHICH DIFFER AND ARE NAMED SEPARATELY RATHER THAN LEFT TO BE
      DISCOVERED. With AGENT_GATE_ALLOW_MISSING_FIXTURES=1 and NO usable corpus,
      node-bindings SKIPs BEFORE npm ci, so neither typecheck nor the jest suite runs.
      With the same opt-out and an INCOMPLETE corpus, install, build and typecheck have
      already run — only the manifest check and the jest suite are skipped, so the
      typecheck claim above still holds there. Both are DECLARED skips, recorded in the
      gate SUMMARY by name, never a silent pass. Stating which coverage each state
      actually gives is the whole point of #3493: an exemption is only as true as what
      the named component does, in every state it can be in.
      KEEP THIS ENTRY AND run_node_bindings IN STEP: an exemption that defers to a
      local component is only as true as that component's scope, and #1255's narrowing
      to 1 file in 27 is what made this entry false for ~2 days of a deterministic
      main-red without blocking a merge.
    issue: "#2910"
  - workflow: observability-gate.yml
    reason: Observability correctness plus label-gated overhead bench; overhead is advisory.
    issue: "#2910"
  - workflow: parity-failure-issue-tests.yml
    reason: Unit tests for the parity-failure issue filer tooling; tooling-only, not product correctness.
    issue: "#2910"
  - workflow: parity-regen-matrix.yml
    reason: Regeneration matrix lane driven by the weekly exhaustive tier, not by pull requests.
    issue: "#1026"
  - workflow: perf-regression.yml
    reason: Label-gated performance lane (ci:perf); a bench delta is advisory and must not block a merge.
    issue: "#2910"
  - workflow: project-board-sync.yml
    reason: Delivery-board automation on pull_request_target; it reports no product signal.
    issue: "#2910"
  - workflow: python-ci.yml
    reason: >-
      Python binding lane. For the PYTEST SUITE the merge-gating half is the local
      gate's python-bindings component, which runs the WHOLE pytest suite (contrast
      node-ci.yml, whose identically-worded exemption was false for ~2 days because
      node-bindings ran 1 file of 27 — #3493).
      TWO PARTS OF THIS WORKFLOW ARE MERGE-GATED BY NOTHING, AND THEY ARE NAMED HERE
      RATHER THAN LEFT TO BE DISCOVERED.
      (1) THE cross-binding-parity JOB (issue #1455): it runs the SAME SELECT through
      the Python binding, the NODE binding and the CLI and requires equal canonical
      JSON. NO local gate component can run it — the gate runs pytest with
      RUN_SLOW_TESTS=0, and nothing in the gate builds the Node native module or a
      release cqlite-cli, so python-bindings cannot execute the comparison at all.
      This job is therefore the ONLY place the 3-way comparison ever runs, and it is
      NOT merge-gating: a cross-binding divergence can merge. What the local gate DOES
      cover is the canonicalizer differential pin (test_canonicalizer_vectors_python_leg,
      pure computation, no corpus, no build) — the Python HALF of it; the JS half runs
      only here. The job is also in the same heavy tier as `test` (push to main,
      nightly, workflow_dispatch, or a PR labeled ci:bindings-full), so on a routine
      unlabeled PR it does not run at all.
      (2) The cross-platform wheel matrix, which is release coverage, not merge-gating.
      KEEP THIS ENTRY AND the python-bindings component IN STEP: an exemption that
      defers to a local component is only as true as that component's scope.
    issue: "#2910"
  - workflow: smoke-tests.yml
    reason: Dataset smoke lane; the merge-gating half is the local gate's smoke component.
    issue: "#2910"
  - workflow: sstabledump-parity-gate.yml
    reason: Legacy parity context retained while branch protection points at pr-gate; superseded by this registry.
    issue: "#2910"
  - workflow: trino-connector-ci.yml
    reason: Java connector build lane; the connector releases on its own cadence.
    issue: "#2910"
  - workflow: workflow-config.yml
    reason: Workflow configuration lint; its merge-gating half is validate-workflows.rb inside required.
    issue: "#2910"
