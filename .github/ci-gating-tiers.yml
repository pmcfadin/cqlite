# CI gating-tier registry — the single source of truth for what `required` waits on.
#
# Issue #2910. Branch protection requires exactly ONE context, `required`
# (`.github/workflows/pr-gate.yml`), and a GitHub Actions job cannot `needs:` a job
# in another workflow. So `required` instead POLLS the pull request head's sibling
# check runs and FAILS CLOSED on any tier listed under `tiers:` below that is
# failed, still non-terminal at the deadline, or absent.
#
# Absence is ALWAYS an error. A registered tier ALWAYS emits its context — a tier
# that does not apply to the diff reports that as an explicit SUCCESS from an
# unconditional gate job. `required` therefore needs no knowledge of GitHub's
# trigger semantics, and a mechanism bug reports "absent" (red) rather than
# "not applicable" (green).
#
# TOPOLOGY. `pr-gate.yml` has two jobs: `pr-gate-core` (fmt/clippy/tests/policy)
# and `required` (`needs: [pr-gate-core]`, `if: always()`), which is the sole
# branch-protection context. Enrolment is mechanically forced by
# `scripts/ci/validate-workflows.rb`, which runs as a step in `pr-gate-core`; it
# fails when a workflow with a `pull_request`/`pull_request_target` trigger appears
# in neither `tiers:` nor `exempt:`. `required` fails unconditionally when
# `pr-gate-core` did not conclude `success`, so adding a PR-triggered workflow
# without enrolling it still reds `required` — one job removed.
#
# Of the 25 workflows that carry a `pull_request`/`pull_request_target` trigger,
# one is the aggregator (pr-gate.yml), one is a gating tier (flight-ci.yml) and
# the remaining 23 are exempted below.
#
# SCHEMA
#   version:        must be 1.
#   aggregator:     the workflow + job that performs the aggregation. Never registrable
#                   as a tier (it would wait on itself).
#   defaults:
#     wait_minutes: default aggregation deadline for a tier (minutes).
#   tiers[]:
#     id:            lowercase kebab-case; also the waiver-label suffix `ci:waive:<id>`.
#     workflow:      file name under .github/workflows/.
#     context:       the EXACT check-run name, i.e. the emitting job's `name:`.
#     wait_minutes:  optional per-tier override; the effective deadline is the MAX
#                    over tiers and must stay strictly below the aggregator job's
#                    timeout-minutes.
#     mandate_paths: documentation of the tier's own diff-based mandate predicate.
#                    The predicate itself lives in the tier's classifier job (single
#                    owner); this list exists so a reader can see the intent here.
#     notes:         free text.
#   exempt[]:
#     workflow / reason / issue / merge_gating_half — a PR-triggered workflow that
#     deliberately does NOT gate the merge. All four are mandatory.
#
#     merge_gating_half:  THE MACHINE-CHECKED HALF OF THE EXEMPTION (issue #3725).
#       #3493's finding: an exemption excuses a workflow by naming, IN PROSE, what
#       gates the merge in its place — and nothing checked that claim. node-ci.yml's
#       entry said "the merge-gating half is the local gate's node-bindings
#       component" while that component ran 1 of the suite's 27 test files, so 26
#       were gated by neither side and a deterministic red sat on `main` for ~2 days.
#
#       A NON-EMPTY LIST (a workflow can have more than one counterpart) under a
#       CLOSED grammar — an unrecognised shape is a NAMED refusal, never accepted:
#         - {kind: gate-component,     component: <name>}
#             a component of the full local agent gate. VERIFIED to exist in
#             scripts/agent-gate.components.
#         - {kind: required-gate-step, step: <exact step name>}
#             a named step of a job the branch-protection context `required`
#             depends on, so its failure fails `required` directly. VERIFIED to
#             exist in the aggregator workflow's `needs` closure.
#         - {kind: none,               ground: <why that is acceptable>}
#             NOTHING merge-gating covers this workflow. An honest declaration of
#             a hole — several of these lanes are genuinely in that state, and
#             saying so is the point. Must be the SOLE element: `none` beside a
#             positive claim is incoherent.
#
#       IT CHECKS EXISTENCE, NOT SCOPE. A renamed, deleted or never-existent
#       component now reds the gate. Whether the named component actually COVERS
#       this workflow — #3493's real hazard, where the component existed all along
#       — is not decidable here and is not claimed. Do not read a green run as
#       "the deferral is adequate".
#
#       AND THE PROSE `reason` IS UNCHECKED BY DESIGN. There is deliberately no
#       recogniser over it, per #3312 (remove the shared channel; a recogniser over
#       author-controlled prose never closes). Declared residual: an entry whose
#       prose contradicts its structured field is NOT caught. A deliberate trade.
#
#       NOTE ON THE TRIGGER FACT, which is derived and never stored: ALL 23
#       exemptions below carry a `pull_request`/`pull_request_target` trigger
#       (measured with `GatingRegistry.pull_request_workflow?`). A stored
#       `pr_triggered:` boolean would be constant across every entry, carry no
#       information, and be a second source of truth able to drift from the
#       workflow — so the enrolment rule derives it from the workflow's own `on:`
#       block at validation time (#3544: remove the second source, do not
#       reconcile it).
#
# STRUCTURAL RULES ENFORCED ON EVERY ENTRY UNDER `tiers:` (gating_policy_rules.rb).
# Each exists to prevent a concrete failure, in EITHER direction — a tier that can
# be permanently absent deadlocks every PR just as surely as a silent hole lets one
# through:
#   * the workflow has a `pull_request`/`pull_request_target` trigger at all;
#   * no blocking `paths:`/`paths-ignore:`/`branches:`/`branches-ignore:` filter (only
#     the always-fire sentinel `__required_ci_context_never_matches__` is permitted);
#   * `types:` covers every event that mints a new head sha (`opened`, `synchronize`),
#     or the context is permanently absent for some head; and `types:` stays within
#     the aggregator's own observed set, or an event the aggregator cannot see could
#     cancel the tier's in-flight run with no `required` run watching for the replacement;
#   * exactly one job emits the declared context; its condition is EXACTLY `${{ !cancelled() }}`
#     (a compound `!cancelled() && …` can still evaluate false and skip — and a bare `always()`
#     is REJECTED: it runs the gate job DURING a run cancellation, turning
#     `needs.*.result == cancelled` into a `failure` conclusion and making the aggregator's
#     supersession grace unreachable); for every job it
#     depends on, some step both READS `needs.<job>.result` and can exit non-zero; and
#     its transitive `needs` closure covers every other job in the workflow;
#   * the entry is not the aggregating workflow.
#
# AND ON THE AGGREGATOR: it must fire on `labeled`/`unlabeled`, or the `ci:waive:<id>`
# break-glass below could never be exercised on a PR this mechanism has wedged
# (applying a label starts no run for an unsubscribed event type, and re-running a
# workflow replays the original event payload).

version: 1

aggregator:
  workflow: pr-gate.yml
  job: required

defaults:
  wait_minutes: 60

tiers:
  # The motivating tier (#2910 / PR #2906): the Flight end-to-end tests that
  # constituted a change's WIRING EVIDENCE ran in neither the local gate nor
  # flight-ci.yml's PR tier, because the workflow was path-filtered AND the heavy
  # job was gated on a `ci:flight-full` label the PR did not carry. Both halves are
  # now closed: the trigger always fires, and a diff touching cqlite-flight/**
  # MANDATES the full tier with or without the label.
  - id: flight
    workflow: flight-ci.yml
    context: Flight tier gate
    wait_minutes: 60
    mandate_paths:
      - cqlite-flight/**
      - cqlite-core/**
      - test-data/**
      - .github/actions/setup-rust-ci/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/flight-ci.yml
    notes: >-
      The gate job reports the aggregate of the classifier, the fmt/clippy/lib-test
      job, the full-package job (which owns cqlite-flight/tests/** — the ~30
      integration/end-to-end tests) and the image job. ONE applicability verdict
      covers all of them: matching any `mandate_paths` entry runs the whole tier.
      cqlite-core/** is in the set because core is the direction Flight breaks from
      (#2825's wrong constant, #2821 its first caller — both core diffs whose Flight
      e2e coverage was the point); an earlier cut routed a core-only diff to the
      `--lib` job alone and still reported success. `ci:flight-full` remains a manual
      opt-in for diffs that mandate nothing.

exempt:
  - workflow: cassandra-parity.yml
    reason: >-
      Scheduled/label-driven parity lane; its merge-gating half is the committed
      parity report (docs/reports/cassandra-test-parity.md) whose staleness the
      local gate's SKIP-aware parity-report component catches.
    issue: "#2910"
    merge_gating_half:
      - kind: gate-component
        component: parity-report

  - workflow: cassandra-validation.yml
    reason: >-
      Docker-backed validation lane. It runs `cargo test -p cqlite-core --release
      --features write-support,docker-integration --test sstableloader_integration`
      against a live Cassandra container, which no local gate component can do.
    issue: "#2910"
    merge_gating_half:
      - kind: none
        ground: >-
          NOTHING merge-gating executes sstableloader_integration. It is
          `docker-integration`-gated and needs a running Cassandra, so no gate
          component and no `required`-gating tier reaches it. Declared, not
          covered.

  - workflow: ci-minimal-features.yml
    reason: >-
      Feature-matrix build lane. The local gate's minimal-build component runs
      `cargo build -p cqlite-core --no-default-features --features all-compression`
      plus `cargo test … --lib --no-run` under RUSTFLAGS=-D warnings, which is the
      build half. SCOPE DIFFERENCE, stated rather than left to be discovered: this
      workflow additionally EXECUTES that `--lib` suite, builds/tests the `parquet`
      feature path, and asserts the default-feature list — none of which any gate
      component does. CLAUDE.md records the pair as a #3544 circular deferral.
    issue: "#2910"
    merge_gating_half:
      - kind: gate-component
        component: minimal-build

  - workflow: ci.yml
    reason: >-
      Broad opt-in lane; exempt because it is ci:broad-label-gated and does not run
      on an unlabelled PR at all — NOT because the local agent gate is a superset of
      it. CORRECTED IN #3725: this entry previously ended "the local gate only
      COMPILES those tests (feature-iso-delta-scan is `--lib --no-run`)", which the
      same change falsified. feature-iso-delta-scan now EXECUTES — it drops
      `--no-run` and additionally names the cqlite-core integration targets
      crate-level-gated on `delta-scan` — so ci.yml's
      `cargo test -p cqlite-core --features delta-scan --lib` pass now has a
      merge-gating counterpart, and the delta-scan half of #3522's audit finding is
      closed. KEEP THIS ENTRY AND run_feature_iso_delta_scan IN STEP, for the reason
      node-ci.yml's entry records: an exemption that defers to a local component is
      only as true as that component's scope, and narrowing one for speed is a
      change to a merge gate. SCOPE DIFFERENCE that remains: ci.yml is a broad lane
      and its other jobs (the full workspace build/test matrix) are not claimed here.
    issue: "#2910"
    merge_gating_half:
      - kind: gate-component
        component: feature-iso-delta-scan

  - workflow: compaction-parity.yml
    reason: >-
      Byte-parity lane whose merge-gating half is the local gate's
      compaction-byte-parity component.
    issue: "#2910"
    merge_gating_half:
      - kind: gate-component
        component: compaction-byte-parity

  - workflow: coverage-baseline.yml
    reason: Advisory coverage trend lane; a coverage dip must not block a merge.
    issue: "#2910"
    merge_gating_half:
      - kind: none
        ground: >-
          By design: coverage is a TREND signal, and a dip is information for the
          author, not a merge block. No merge-gating counterpart is wanted.

  - workflow: delta-roundtrip.yml
    reason: >-
      Docker-backed delta-export round-trip lane. CORRECTED IN #3725 — the previous
      reason ("covered by the local gate's delta tests") was FALSE: this workflow
      runs `cargo test -p cqlite-cli --features delta-export,duckdb-tests --test
      delta_roundtrip_tests`, and that target is named in the gate's own
      "EXCLUDED from BOTH passes (delta-export/duckdb-tests/dhat-heap; deliberate,
      #916)" line, so cli-tests runs it in neither pass.
    issue: "#2910"
    merge_gating_half:
      - kind: none
        ground: >-
          NOTHING merge-gating executes delta_roundtrip_tests. cli-tests excludes
          it from both passes because `duckdb-tests` builds the DuckDB C++
          amalgamation from source (#916), and it also needs Docker for the
          multi-generation workload. Declared, not covered.

  - workflow: docs-site.yml
    reason: Docs site build/deploy; a site build failure is fixed forward, not merge-gating.
    issue: "#2910"
    merge_gating_half:
      - kind: none
        ground: >-
          By design: the site is redeployed from `main` on every push, so a broken
          build is fixed forward. Blocking merges on it would couple product
          delivery to documentation rendering.

  - workflow: e2e-readback.yml
    reason: Label-gated Cassandra readback tier (ci:ingest-full); promotion to a gating tier is tracked separately.
    issue: "#2910"
    merge_gating_half:
      - kind: none
        ground: >-
          NOTHING merge-gating performs a live Cassandra readback of CQLite-written
          SSTables. The lane needs a Cassandra container and is label-gated;
          promotion to a gating tier is tracked separately. Declared, not covered.

  - workflow: flight-trino-e2e.yml
    reason: Docker-compose Trino end-to-end tier; promotion to a gating tier is tracked separately.
    issue: "#2910"
    merge_gating_half:
      - kind: none
        ground: >-
          NOTHING merge-gating runs the Trino connector against a live Flight
          server: the lane is docker-compose + gradle and no gate component or
          registered tier reaches it. The `flight` tier covers cqlite-flight's own
          Rust end-to-end tests, which is a different surface. Declared, not
          covered.

  - workflow: fuzz.yml
    reason: Fuzz smoke plus nightly long-run; a fuzz finding is filed as a bug, not a merge block.
    issue: "#1614"
    merge_gating_half:
      - kind: none
        ground: >-
          By design, and structurally unavoidable: `fuzz/` is its own workspace,
          excluded from the main one, and cargo-fuzz needs nightly — so the stable
          gate cannot compile it at all. Crashes are filed as bug issues.

  - workflow: live-cell-compaction-parity.yml
    reason: >-
      Docker-regenerating live-cell parity lane. CORRECTED IN #3725 — the previous
      reason ("not merge-gating today") understated it: the two targets this lane
      runs, issue_1017_live_cell_compaction_byte_parity and
      issue_1020_udt_frozen_compaction_byte_parity, are BOTH named by the local
      gate's compaction-byte-parity component. What this lane adds is Docker
      REGENERATION of the fixtures those tests compare against, which the gate
      consumes from the published corpus instead.
    issue: "#2910"
    merge_gating_half:
      - kind: gate-component
        component: compaction-byte-parity

  - workflow: node-ci.yml
    reason: >-
      Node binding lane; the merge-gating half is the local gate's node-bindings
      component, which since #3522 runs the WHOLE jest suite (it ran 1 of 27 files
      before), plus binding-rust-tests for cqlite-node's Rust unit tests, which ran
      nowhere. Since #3493 it also runs `npm run typecheck` (this workflow's
      always-run PR smoke job; it is `tsc --noEmit` over the examples project, so it
      COMPILES against the shipped index.d.ts, which #3581's typescript-definitions
      test does not — that one reads the declarations as TEXT and asserts the runtime
      surface is declared. Different properties, both wanted) and pairs `npm test` with check-dataset-manifest.sh, which checks
      the CORPUS is complete rather than that the suite ran — the parity cases derive
      their table set from disk, so a partial extraction is green by omission. The
      multi-platform build matrix is release coverage, not merge-gating.
      TWO OPT-OUT STATES, WHICH DIFFER AND ARE NAMED SEPARATELY RATHER THAN LEFT TO BE
      DISCOVERED. With AGENT_GATE_ALLOW_MISSING_FIXTURES=1 and NO usable corpus,
      node-bindings SKIPs BEFORE npm ci, so neither typecheck nor the jest suite runs.
      With the same opt-out and an INCOMPLETE corpus, install, build and typecheck have
      already run — only the manifest check and the jest suite are skipped, so the
      typecheck claim above still holds there. Both are DECLARED skips, recorded in the
      gate SUMMARY by name, never a silent pass. Stating which coverage each state
      actually gives is the whole point of #3493: an exemption is only as true as what
      the named component does, in every state it can be in.
      KEEP THIS ENTRY AND run_node_bindings IN STEP: an exemption that defers to a
      local component is only as true as that component's scope, and #1255's narrowing
      to 1 file in 27 is what made this entry false for ~2 days of a deterministic
      main-red without blocking a merge. The three single lines the typecheck and
      corpus claims above rest on - `npm run typecheck`, check-dataset-manifest.sh and
      `npm test`, plus the ORDER of the last two - are PINNED by cases 93-96 of
      scripts/tests/test_check_dataset_manifest.sh (gate component tooling-tests), and
      the component's interpretation of check-dataset-manifest.sh's exit codes by its
      cases 97-102, so deleting any of them reds the gate instead of silently
      falsifying this sentence (#3642).
    issue: "#2910"
    merge_gating_half:
      - kind: gate-component
        component: node-bindings
      - kind: gate-component
        component: binding-rust-tests

  - workflow: observability-gate.yml
    reason: >-
      Observability correctness plus label-gated overhead bench; the overhead bench
      is advisory. Two merge-gating counterparts, and neither is a superset: the
      gate's all-features-check runs `cargo check` + `cargo clippy -D warnings` at
      `-p cqlite-core --all-features --all-targets` (the COMPILE/LINT half, the only
      gate component that enables the OTLP stack, executing nothing), and
      pr-gate-core's "cqlite-core fast representative tests" step EXECUTES
      `cargo test -p cqlite-core --lib --all-features`. This workflow's own
      `--test observability_*` integration targets are gated on
      `observability-testing` and run in NEITHER — #3375's family.
    issue: "#2910"
    merge_gating_half:
      - kind: gate-component
        component: all-features-check
      - kind: required-gate-step
        step: cqlite-core fast representative tests

  - workflow: parity-failure-issue-tests.yml
    reason: >-
      Unit tests for the parity-failure issue filer tooling
      (`python3 scripts/tests/test_parity_failure_issue.py`); tooling-only, not
      product correctness.
    issue: "#2910"
    merge_gating_half:
      - kind: none
        ground: >-
          NOTHING merge-gating runs test_parity_failure_issue.py — it is named by no
          gate component (tooling-tests does not list it) and by no registered tier.
          The subject is the issue-filer tooling, so a defect misfiles a report
          rather than corrupting data. Declared, not covered.

  - workflow: parity-regen-matrix.yml
    reason: >-
      CORRECTED IN #3725. The previous reason — "driven by the weekly exhaustive
      tier, NOT BY PULL REQUESTS" — was FACTUALLY FALSE: this workflow has a
      `pull_request:` trigger (branches [main]) whose `paths:` include
      cqlite-core/tests/issue_1007_complex_type_parity.rs and
      cqlite-core/src/storage/sstable/reader/**, so it DOES run on matching pull
      requests, and it is the ONLY executor of that file's 6 delta-scan-gated tests.
      Why its PR result is nonetheless non-gating: each of the three legs
      REGENERATES its fixture corpus from a `cassandra:5.0.2` Docker container
      before running any test (60-minute job timeout), so the lane depends on Docker
      Hub and on generator scripts that a `required` context cannot be made to wait
      on without wedging every unrelated PR; and it is `paths:`-filtered, so its
      context is ABSENT on most pull requests — and absence is always an error for a
      registered tier, which is why enrolling it as-is would deadlock rather than
      gate. Its PR run remains a real, strict signal (CQLITE_REQUIRE_FIXTURES=1,
      panic-instead-of-skip) that an author should read.
      THE THREE DECLARED HALVES BELOW MAP TO THE THREE LEGS, and #3725 is what made
      the cql-type one true. CORRECTED by this issue's own C audit (F7): an earlier
      draft of this paragraph said core-tests executes "the compression leg's targets
      and the tombstone leg's". That is FALSE for 6 of the tombstone leg's 9 targets.
      issue_1010/1011/1013 carry `#![cfg(feature = "delta-scan")]` and
      issue_1012/1014/1015 `#![cfg(all(feature = "delta-scan", feature =
      "write-support"))]`, so at `cli-helpers` all six compile to ZERO tests and
      core-tests executes NONE of them. What core-tests does execute from that leg is
      the other 3: issue_1019 and issue_1021 (gated on `write-support`, which is in
      `default`) and the ungated sstable_parity_repaired_metadata_test --
      compaction-byte-parity additionally names issue_1019. THE SIX ARE COVERED BY
      feature-iso-delta-scan, the same component this issue added for the cql-type
      leg, so the structured halves declared below are correct and it was this PROSE
      that mis-attributed them. That is the #3493 shape reproduced INSIDE the field
      built to stop it, and it is why the `merge_gating_half:` list is
      machine-checked while this sentence can only be reviewed. The cql-type leg was the gap this issue
      was filed on: at `cli-helpers`, issue_1007_complex_type_parity's crate-level
      `#![cfg(feature = "delta-scan")]` compiles it to ZERO tests, so its 6 cases
      ran in no merge-gating lane at all. feature-iso-delta-scan now EXECUTES those
      targets under CQLITE_REQUIRE_FIXTURES=1. SCOPE DIFFERENCE that remains, stated
      rather than left to be discovered: this lane compares against a corpus
      REGENERATED from a cassandra:5.0.2 container, where the gate compares against
      the published one — so a generator-side regression is still caught only here.
    issue: "#1026"
    merge_gating_half:
      - kind: gate-component
        component: core-tests
      - kind: gate-component
        component: compaction-byte-parity
      - kind: gate-component
        component: feature-iso-delta-scan

  - workflow: perf-regression.yml
    reason: Label-gated performance lane (ci:perf); a bench delta is advisory and must not block a merge.
    issue: "#2910"
    merge_gating_half:
      - kind: none
        ground: >-
          By design: a benchmark delta on shared CI runners is too noisy to gate a
          merge, and a real regression is triaged rather than auto-blocked.

  - workflow: project-board-sync.yml
    reason: Delivery-board automation on pull_request_target; it reports no product signal.
    issue: "#2910"
    merge_gating_half:
      - kind: none
        ground: >-
          By design: this workflow mutates the delivery board and status labels. It
          asserts nothing about the code under review, so there is no product
          property for a merge gate to protect.

  - workflow: python-ci.yml
    reason: >-
      Python binding lane. For the PYTEST SUITE the merge-gating half is the local
      gate's python-bindings component, which runs the WHOLE pytest suite (contrast
      node-ci.yml, whose identically-worded exemption was false for ~2 days because
      node-bindings ran 1 file of 27 — #3493).
      TWO PARTS OF THIS WORKFLOW ARE MERGE-GATED BY NOTHING, AND THEY ARE NAMED HERE
      RATHER THAN LEFT TO BE DISCOVERED.
      (1) THE cross-binding-parity JOB (issue #1455): it runs the SAME SELECT through
      the Python binding, the NODE binding and the CLI and requires equal canonical
      JSON. NO local gate component can run it — the gate runs pytest with
      RUN_SLOW_TESTS=0, and nothing in the gate builds the Node native module or a
      release cqlite-cli, so python-bindings cannot execute the comparison at all.
      This job is therefore the ONLY place the 3-way comparison ever runs, and it is
      NOT merge-gating: a cross-binding divergence can merge. What the local gate DOES
      cover is the canonicalizer differential pin (test_canonicalizer_vectors_python_leg,
      pure computation, no corpus, no build) — the Python HALF of it; the JS half runs
      only here. The job is also in the same heavy tier as `test` (push to main,
      nightly, workflow_dispatch, or a PR labeled ci:bindings-full), so on a routine
      unlabeled PR it does not run at all.
      (2) The cross-platform wheel matrix, which is release coverage, not merge-gating.
      KEEP THIS ENTRY AND the python-bindings component IN STEP: an exemption that
      defers to a local component is only as true as that component's scope.
    issue: "#2910"
    merge_gating_half:
      - kind: gate-component
        component: python-bindings

  - workflow: smoke-tests.yml
    reason: Dataset smoke lane; the merge-gating half is the local gate's smoke component.
    issue: "#2910"
    merge_gating_half:
      - kind: gate-component
        component: smoke

  - workflow: sstabledump-parity-gate.yml
    reason: >-
      Legacy parity context retained while branch protection points at pr-gate;
      superseded by this registry. Its merge-gating half is the local gate's
      core-tests component, which runs `cargo test -p cqlite-core --features
      cli-helpers` over EVERY target and so executes this lane's
      sstabledump_parity_{data,index,summary} and friends. SCOPE DIFFERENCE, stated:
      this lane additionally installs a real `sstabledump` binary and fetches the
      full published corpus, so it compares against Cassandra's own tool where
      core-tests compares against the committed JSONL goldens.
    issue: "#2910"
    merge_gating_half:
      - kind: gate-component
        component: core-tests

  - workflow: trino-connector-ci.yml
    reason: Java connector build lane; the connector releases on its own cadence.
    issue: "#2910"
    merge_gating_half:
      - kind: none
        ground: >-
          NOTHING merge-gating builds or tests trino-connector/: it is a Gradle/Java
          project outside the cargo workspace, and no gate component or registered
          tier invokes gradle. It releases on its own cadence. Declared, not
          covered.

  - workflow: workflow-config.yml
    reason: >-
      Workflow configuration lint. Both of its steps are ALSO steps of
      `pr-gate-core`, the job the branch-protection context `required` needs and
      refuses to pass without — so the merge-gating half is those steps, not a
