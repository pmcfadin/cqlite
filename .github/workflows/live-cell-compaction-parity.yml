name: "CI: Live-Cell Compaction Byte Parity (issue #1017, #1020)"

# Fail-closed byte-parity gate for the live-cell compaction scenarios
# (issue #1017, epic #973):
#   * live_no_clustering: partition-key-only LWW overlap
#   * live_clustering: clustering LWW overlap with preserved clustering order
# and the frozen-UDT compaction scenarios (issue #1020):
#   * udt_frozen_person: a frozen<udt> regular column
#   * udt_nested:        a frozen<udt> with a nested frozen<udt> field
#   * udt_collections:   frozen UDTs inside frozen list/map collection values
#
# Why this is a standalone workflow (not compaction-parity.yml)
# -------------------------------------------------------------
# compaction-parity.yml runs the Java/Gradle differential harness (logical +
# byte tiers) that requires a full Cassandra source build + JDK 17 + Ant.
# This workflow is purely Rust: the reference binaries are committed to git
# (test-data/datasets/sstables/test_compactionparity/** and
# test-data/datasets/sstables/test_compactionparityudt/**), so NO Docker
# regeneration is needed. The test reads CQLITE_DATASETS_ROOT and compares
# CQLite's compaction output against the committed Cassandra 5.0.2 golden
# byte-for-byte. CQLITE_REQUIRE_FIXTURES=1 ensures the test PANICS (fails
# the job) if the committed binaries are absent rather than silently skipping.
#
# GATING POLICY: runs on
#   - pull_request touching the test, its golden fixtures, the manifest, the
#     compaction write path, or this workflow file itself
#   - workflow_dispatch (manual)
#   - schedule (nightly, to catch environment-induced drift early)
#
# Manual local run (no Docker needed — fixtures are in git):
#   env CQLITE_REQUIRE_FIXTURES=1 \
#     CQLITE_DATASETS_ROOT=$PWD/test-data/datasets \
#     cargo test -p cqlite-core --features write-support \
#       --test issue_1017_live_cell_compaction_byte_parity \
#       -- --nocapture
#   env CQLITE_REQUIRE_FIXTURES=1 \
#     CQLITE_DATASETS_ROOT=$PWD/test-data/datasets \
#     cargo test -p cqlite-core --features write-support \
#       --test issue_1020_udt_frozen_compaction_byte_parity \
#       -- --nocapture

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Run cargo test with --nocapture'
        type: boolean
        default: true
  schedule:
    # Nightly at 04:53 UTC (offset from the other nightly parity jobs:
    # tombstone/TTL 04:17, cql-type 04:31, compression 05:23, compaction-diff 05:43).
    - cron: '53 4 * * *'
  pull_request:
    branches: [main]
    # PR-trigger is best-effort: it covers the primary write/merge/writer paths
    # and the two additional subsystems (murmur3 partitioner, CQL serializers)
    # whose changes would silently break byte parity without triggering any
    # already-listed path. It cannot enumerate every transitive dependency, so
    # the nightly `schedule` run is the authoritative backstop — a partitioner
    # or serialization change merged on a non-path PR will be caught within 24 h.
    paths:
      - 'cqlite-core/tests/issue_1017_live_cell_compaction_byte_parity.rs'
      - 'cqlite-core/tests/issue_1020_udt_frozen_compaction_byte_parity.rs'
      # Primary compaction + SSTable write paths (already covered)
      - 'cqlite-core/src/storage/write_engine/merge/**'
      - 'cqlite-core/src/storage/write_engine/mod.rs'
      - 'cqlite-core/src/storage/sstable/writer/**'
      # Murmur3Partitioner token logic: controls partition ordering in
      # Data.db/Index.db/Summary.db — a bug here silently reorders partitions.
      - 'cqlite-core/src/util/**'
      # CQL int/text value + cell/row serializers: a change here alters the
      # raw bytes written into Data.db cells.
      - 'cqlite-core/src/storage/serialization/**'
      # Partition-key codec: controls the raw key bytes in Data.db/Index.db.
      - 'cqlite-core/src/storage/partition_key_codec.rs'
      # Committed reference fixtures, manifest, and this workflow file
      - 'test-data/datasets/sstables/test_compactionparity/**'
      - 'test-data/datasets/sstables/test_compactionparityudt/**'
      - 'test-data/cassandra-parity-manifest.yml'
      - '.github/workflows/live-cell-compaction-parity.yml'

env:
  CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
  CQLITE_REQUIRE_FIXTURES: "1"

permissions:
  contents: read

concurrency:
  group: live-cell-compaction-parity-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  live-cell-compaction-byte-parity:
    name: Live-cell compaction byte parity (require-fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: live-cell-compaction-parity-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify committed reference fixtures are present (issue #1017)
        run: |
          echo "=== test_compactionparity reference binaries (committed to git) ==="
          find "$CQLITE_DATASETS_ROOT/sstables/test_compactionparity" \
            -name '*-Data.db' -not -name '._*' | sort
          echo ""
          echo "=== live_no_clustering fixture sizes ==="
          ls -lh "$CQLITE_DATASETS_ROOT/sstables/test_compactionparity"/live_no_clustering-*/
          echo ""
          echo "=== live_clustering fixture sizes ==="
          ls -lh "$CQLITE_DATASETS_ROOT/sstables/test_compactionparity"/live_clustering-*/
          # Fail-closed: the test reads these committed binaries; if a fixture is
          # missing the test PANICS under CQLITE_REQUIRE_FIXTURES, but assert their
          # presence up front for a clear, early failure signal.
          for d in live_no_clustering live_clustering; do
            count=$(find "$CQLITE_DATASETS_ROOT/sstables/test_compactionparity"/$d-*/ \
              -name '*-Data.db' -not -name '._*' 2>/dev/null | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "::error::missing committed fixture: test_compactionparity/$d-* (-Data.db)"
              exit 1
            fi
          done

      - name: Verify committed reference fixtures are present (issue #1020 UDT)
        run: |
          echo "=== test_compactionparityudt reference binaries (committed to git) ==="
          find "$CQLITE_DATASETS_ROOT/sstables/test_compactionparityudt" \
            -name '*-Data.db' -not -name '._*' | sort
          echo ""
          for d in udt_frozen_person udt_nested udt_collections; do
            echo "=== $d fixture sizes ==="
            ls -lh "$CQLITE_DATASETS_ROOT/sstables/test_compactionparityudt"/$d-*/
            echo ""
          done
          # Fail-closed mirror of the #1017 check: the issue_1020 test reads these
          # committed binaries; assert each frozen-UDT scenario's -Data.db is present.
          for d in udt_frozen_person udt_nested udt_collections; do
            count=$(find "$CQLITE_DATASETS_ROOT/sstables/test_compactionparityudt"/$d-*/ \
              -name '*-Data.db' -not -name '._*' 2>/dev/null | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "::error::missing committed fixture: test_compactionparityudt/$d-* (-Data.db)"
              exit 1
            fi
          done

      - name: Run live-cell compaction byte-parity tests (strict, require-fixtures)
        run: |
          env CQLITE_REQUIRE_FIXTURES=1 \
            CQLITE_DATASETS_ROOT="$CQLITE_DATASETS_ROOT" \
            cargo test -p cqlite-core --features write-support \
              --test issue_1017_live_cell_compaction_byte_parity \
              -- --nocapture

      - name: Run frozen-UDT compaction byte-parity tests (strict, require-fixtures)
        run: |
          env CQLITE_REQUIRE_FIXTURES=1 \
            CQLITE_DATASETS_ROOT="$CQLITE_DATASETS_ROOT" \
            cargo test -p cqlite-core --features write-support \
              --test issue_1020_udt_frozen_compaction_byte_parity \
              -- --nocapture

      # Issue #1027 convergence audit: this lane's live-cell/UDT compaction parity
      # tests use plain assert!/assert_eq! terminals — they do NOT route through
      # ParityFailure::panic and have no scenario-id-keyed bundle emitter — so a
      # speculative `parity-failures-*` upload here would advertise a bundle that
      # never appears (even with `if-no-files-found: ignore`, the artifact promise
      # is false). The upload was removed rather than left misleading. FOLLOW-UP:
      # to restore it, first route these tests' failure terminals through the
      # shared ParityFailure/FailureBundle emitter (out of scope for #1027, which
      # only standardises the artifact system, not each suite's assertion sites).
