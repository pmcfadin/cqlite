name: Coverage Baseline

on:
  schedule:
    # Nightly baseline coverage at 02:45 UTC, between quality gates and binding matrices.
    - cron: '45 2 * * *'
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'cqlite-core/src/**'
      - '.github/workflows/coverage-baseline.yml'

permissions:
  contents: read

concurrency:
  group: coverage-baseline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: Code Coverage Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Honor the repo toolchain pin (rust-toolchain.toml = 1.88.0), issue #1990.
      # Omitting `toolchain:` makes setup-rust-toolchain read the pin file.
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      # Prebuilt pinned tarpaulin (issue #1990) — never source-builds, so a
      # tarpaulin/rustc incompat cannot red the coverage baseline again.
      - name: Install cargo-tarpaulin (prebuilt, pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin@0.37.0

      - name: Generate coverage report
        run: |
          # Run coverage on cqlite-core lib only (integration tests timeout)
          # This measures coverage of the core library code which is the cleanup scope
          # --fail-under 0 disables tarpaulin's threshold (we use bash script check instead)
          # --ignore-config prevents tarpaulin.toml from overriding output location
          # --output-dir . ensures cobertura.xml is created in workspace root
          cargo tarpaulin --package cqlite-core --lib --out Xml --timeout 120 --fail-under 0 --ignore-config --output-dir .
        env:
          CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false
          verbose: true

      - name: Check minimum coverage threshold (30% for lib-only)
        run: |
          # Extract coverage percentage from XML report
          if [ -f cobertura.xml ]; then
            # Parse line-rate from cobertura.xml (coverage as decimal, e.g., 0.6234)
            COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+' cobertura.xml | head -n 1)

            if [ -z "$COVERAGE" ]; then
              echo "ERROR: Could not parse coverage from cobertura.xml"
              exit 1
            fi

            # Convert to percentage using bc
            COVERAGE_PCT=$(echo "$COVERAGE * 100" | bc)

            echo "Current coverage: ${COVERAGE_PCT}%"

            # Check if coverage meets 30% threshold (lib-only tests, realistic baseline)
            THRESHOLD=30
            MEETS_THRESHOLD=$(echo "$COVERAGE_PCT >= $THRESHOLD" | bc)

            if [ "$MEETS_THRESHOLD" -eq 1 ]; then
              echo "✓ Coverage ${COVERAGE_PCT}% meets minimum threshold of ${THRESHOLD}%"
            else
              echo "ERROR: Coverage ${COVERAGE_PCT}% is below minimum threshold of ${THRESHOLD}%"
              echo "Please add tests to improve code coverage"
              exit 1
            fi
          else
            echo "ERROR: cobertura.xml not found"
            exit 1
          fi

      - name: Upload baseline coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-baseline-${{ github.sha }}
          path: cobertura.xml
          retention-days: 30
          if-no-files-found: warn

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Coverage Report Summary"
            echo ""
            echo "- **Event**: ${{ github.event_name }}"
            echo "- **Commit**: ${{ github.sha }}"
            echo "- **Artifact**: coverage-baseline-${{ github.sha }} (retained 30 days)"
            echo ""

            if [ -f cobertura.xml ]; then
              COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+' cobertura.xml | head -n 1)
              COVERAGE_PCT=$(echo "$COVERAGE * 100" | bc)

              echo "- **Coverage**: ${COVERAGE_PCT}%"
              echo "- **Threshold**: 30% (lib-only)"

              MEETS_THRESHOLD=$(echo "$COVERAGE_PCT >= 30" | bc)
              if [ "$MEETS_THRESHOLD" -eq 1 ]; then
                echo "- **Status**: ✓ PASS"
              else
                echo "- **Status**: ✗ FAIL"
              fi
            else
              echo "- **Status**: ERROR - Coverage report not generated"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
