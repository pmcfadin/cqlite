name: Project Board Sync

# Server-side board hygiene the built-in Project workflows can't express.
# Covers the two gaps found in the delivery pipeline:
#   1. A PR closed WITHOUT merge leaks in "In Review" forever (the built-in
#      "Item closed" rule only acts on issues; "Pull request merged" only on
#      merges). -> move any closed PR's card to Done.
#   2. New issues can land with a NULL Status (race with Auto-add). -> sweep
#      null-status OPEN issues into Backlog.
#
# Requires a repo secret PROJECTS_TOKEN: a PAT (or GitHub App token) with the
# `project` scope. The default GITHUB_TOKEN CANNOT write user/org Projects v2.
# If the secret is ABSENT the token-guarded jobs emit a LOUD `::error::`
# annotation and FAIL (issue #2655) — a persistent red run is the alert that
# board hygiene + claim reaping have silently stopped working, instead of the
# old green ::notice:: no-op that hid the outage for weeks. Add the secret and
# the next scheduled run goes green.
#
# IDs below are for the "CQLite Delivery" user Project #1 (owner: pmcfadin).
# Re-confirm with:
#   gh api graphql -f query='query{user(login:"pmcfadin"){projectV2(number:1){
#     id field(name:"Status"){... on ProjectV2SingleSelectField{id options{id name}}}}}}'

on:
  # pull_request_target (not pull_request) so the closed-PR job can read the
  # PROJECTS_TOKEN secret. This is SAFE here: the workflow performs NO
  # actions/checkout of PR head code and executes NO PR-controlled code — it
  # consumes only structured event metadata (pull_request.node_id/number/merged)
  # and the GraphQL API. There is no untrusted-code execution surface.
  pull_request_target:
    types: [closed]
  schedule:
    # Hygiene sweep every 30 min (null-status -> Backlog; closed-PR safety net;
    # board->label mirror + drift-detector, issue #2855).
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
  # Low-latency board->label mirror correction (issue #2855): a hand-tampered
  # status:* label (or a reopen) is reverted from the issue's board Status quickly
  # rather than waiting up to 30 min for the cron sweep. The 30-min sweep remains
  # the correctness guarantee; these events only reduce lag. `edited` is
  # deliberately OMITTED — it fires on title/body edits (pure noise for a label
  # mirror) and each mirror label write already re-triggers labeled/unlabeled.
  issues:
    types: [labeled, unlabeled, reopened]

permissions:
  contents: read

# Key the concurrency group PER event/target (issue #2855, F4): the mirror edits
# labels with the PAT, so each --add/--remove-label re-triggers this workflow via
# issues:[labeled,unlabeled]. A single shared serialized group would let a burst of
# label events starve or block a pending pull_request_target:closed (closed-PR ->
# Done safety net) or the scheduled sweep. Per-(event,target) groups keep those
# distinct lanes independent; only repeated events for the SAME issue serialize.
# NOTE: a ${{ }} expression in the concurrency group KEY is not a run: shell body,
# so this is NOT the command-injection sink the guard flags — safe here.
concurrency:
  group: project-board-sync-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
  PROJECT_ID: PVT_kwHOAAZP5c4Bb2Ay
  STATUS_FIELD_ID: PVTSSF_lAHOAAZP5c4Bb2AyzhWjcFM
  OPT_BACKLOG: 35ab797f
  OPT_READY: c584340f
  OPT_IN_PROGRESS: 821bf3e8
  OPT_IN_REVIEW: 588b594a
  OPT_DONE: 3723ed80

jobs:
  # ---------------------------------------------------------------------------
  # Event path: a PR was just closed. If it is NOT merged (merges are handled
  # by the built-in "Pull request merged" rule), move its board card to Done.
  # ---------------------------------------------------------------------------
  pr-closed-to-done:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Guard token
        id: guard
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PROJECTS_TOKEN not set — board sync is NOT running. Add a PAT (or GitHub App token) with 'project' scope as repo secret PROJECTS_TOKEN. Failing loudly (issue #2655) so this outage is visible instead of a silent green no-op."
            exit 1
          fi

      - name: Move closed PR card to Done
        env:
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          set -euo pipefail
          # Find this PR's item in OUR project. Capture the raw GraphQL response
          # FIRST so a gh/auth/GraphQL failure fails the step (set -e), instead
          # of being swallowed by `|| true` and masquerading as "not on board".
          resp=$(gh api graphql -f query='
            query($id: ID!) {
              node(id: $id) {
                ... on PullRequest {
                  projectItems(first: 50) {
                    nodes {
                      id
                      project { id }
                      fieldValueByName(name: "Status") {
                        ... on ProjectV2ItemFieldSingleSelectValue { name }
                      }
                    }
                  }
                }
              }
            }' -f id="$PR_NODE_ID")

          # Run jq against the captured response. A jq PARSE failure fails the
          # step; only an EMPTY result is the benign no-match (PR legitimately
          # not on the board, or already Done) -> exit 0 below.
          item_id=$(echo "$resp" | jq -r \
            ".data.node.projectItems.nodes[] | select(.project.id==\"$PROJECT_ID\") | select((.fieldValueByName.name // \"\") != \"Done\") | .id")

          if [ -z "${item_id:-}" ]; then
            echo "PR #$PR_NUMBER: not on the board or already Done — nothing to do."
            exit 0
          fi

          echo "PR #$PR_NUMBER closed (merged=$PR_MERGED) — setting card $item_id -> Done."
          gh api graphql -f query='
            mutation($p: ID!, $i: ID!, $f: ID!, $o: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $p, itemId: $i, fieldId: $f,
                value: { singleSelectOptionId: $o }
              }) { projectV2Item { id } }
            }' -f p="$PROJECT_ID" -f i="$item_id" -f f="$STATUS_FIELD_ID" -f o="$OPT_DONE"

  # ---------------------------------------------------------------------------
  # Scheduled path: idempotent sweep over the whole board.
  #   * OPEN issue with NULL Status, older than the auto-add grace window
  #                                        -> Backlog
  #   * CLOSED PR with Status != Done      -> Done   (safety net for the leak)
  # Never touches Ready / In Progress / In Review items, and never reaps claims.
  #
  # AUTO-ADD RACE (issue #2655): the built-in "Auto-add to project" workflow adds
  # a freshly-created issue to the board and THEN sets its default Status in a
  # second step. Between those two, the item is on the board with a NULL Status.
  # If this sweep fires inside that window it would force the item to Backlog and
  # collide with auto-add's own default write (last-writer-wins churn, and a
  # `groom`-just-created issue can flicker). Fix: only sweep a NULL-status issue
  # once it has been around LONGER than SWEEP_GRACE_MINUTES (default 10, well past
  # auto-add's sub-second window but far under the 30-min cron), keyed on the
  # issue's own createdAt — never wall-clock-racing a brand-new item.
  # ---------------------------------------------------------------------------
  sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SWEEP_GRACE_MINUTES: '10'
      # Board->label drift-detector grace (issue #2855): an OPEN issue younger than
      # this is exempt from the detector so a just-added item (or a race between the
      # mirror pass and this detector) does not flap the run red.
      BLM_GRACE_SECS: '600'
    steps:
      - name: Guard token
        id: guard
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PROJECTS_TOKEN not set — board sweep + claim reaper are NOT running. Add a PAT (or GitHub App token) with 'project' scope as repo secret PROJECTS_TOKEN. Failing loudly (issue #2655) so this outage is visible instead of a silent green no-op."
            exit 1
          fi

      - name: Checkout (for scripts/ci/board-label-mirror.sh)
        uses: actions/checkout@v4

      - name: Reconcile board
        run: |
          set -euo pipefail

          set_status() { # item_id  option_id
            gh api graphql -f query='
              mutation($p: ID!, $i: ID!, $f: ID!, $o: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $p, itemId: $i, fieldId: $f,
                  value: { singleSelectOptionId: $o }
                }) { projectV2Item { id } }
              }' -f p="$PROJECT_ID" -f i="$1" -f f="$STATUS_FIELD_ID" -f o="$2" >/dev/null
          }

          # Grace cutoff (epoch seconds): a NULL-status issue is only swept once
          # its createdAt is OLDER than this — i.e. it has existed longer than the
          # auto-add settle window, so we are not racing auto-add's default write.
          grace_secs=$(( SWEEP_GRACE_MINUTES * 60 ))
          cutoff_epoch=$(( $(date -u +%s) - grace_secs ))

          cursor=""
          backlogged=0
          skipped_fresh=0
          doned=0
          while : ; do
            if [ -z "$cursor" ]; then after="null"; else after="\"$cursor\""; fi
            resp=$(gh api graphql -f query="
              query(\$p: ID!) {
                node(id: \$p) {
                  ... on ProjectV2 {
                    items(first: 100, after: $after) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        fieldValueByName(name: \"Status\") {
                          ... on ProjectV2ItemFieldSingleSelectValue { name }
                        }
                        content {
                          __typename
                          ... on Issue { number state createdAt }
                          ... on PullRequest { number state }
                        }
                      }
                    }
                  }
                }
              }" -f p="$PROJECT_ID")

            # Validate the response SHAPE before extracting IDs. With process
            # substitution (`< <(... | jq ...)`) a malformed/stale-PROJECT_ID
            # response prints a jq error to stderr but the read loop still
            # completes with zero rows and the step reports "0" — masking the
            # failure. `jq -e` here asserts the expected nodes array exists and
            # FAILS the step (set -e) on a bad shape. A genuine empty board
            # (`.items.nodes == []`) still satisfies `arrays` and is non-fatal.
            echo "$resp" | jq -e '.data.node.items.nodes | arrays' >/dev/null

            # Capture the ID lists via checked command substitutions BEFORE
            # iterating, so any extraction failure aborts the step rather than
            # being swallowed inside a process substitution. An empty list is the
            # benign no-work case and leaves the while loop a no-op.
            #
            # Auto-add race guard: convert each issue's createdAt to epoch and
            # keep only those OLDER than the grace cutoff. `--argjson` passes the
            # cutoff as a number; `fromdateiso8601` is jq builtin ISO8601->epoch.
            null_issue_ids=$(echo "$resp" | jq -r --argjson cutoff "$cutoff_epoch" '
              .data.node.items.nodes[]
              | select(.content.__typename=="Issue")
              | select(.content.state=="OPEN")
              | select((.fieldValueByName.name // "") == "")
              | select((.content.createdAt | fromdateiso8601) < $cutoff)
              | .id')

            # Count fresh (within-grace) null-status issues we deliberately SKIP,
            # for an observable "held back N racing new issues" line.
            skipped_fresh=$(( skipped_fresh + $(echo "$resp" | jq -r --argjson cutoff "$cutoff_epoch" '
              [ .data.node.items.nodes[]
                | select(.content.__typename=="Issue")
                | select(.content.state=="OPEN")
                | select((.fieldValueByName.name // "") == "")
                | select((.content.createdAt | fromdateiso8601) >= $cutoff) ] | length') ))

            closed_pr_ids=$(echo "$resp" | jq -r '
              .data.node.items.nodes[]
              | select(.content.__typename=="PullRequest")
              | select(.content.state=="CLOSED" or .content.state=="MERGED")
              | select((.fieldValueByName.name // "") != "Done")
              | .id')

            # OPEN issues with null status (past the grace window) -> Backlog
            while read -r id; do
              [ -n "$id" ] || continue
              set_status "$id" "$OPT_BACKLOG"
              backlogged=$((backlogged+1))
            done <<< "$null_issue_ids"

            # CLOSED PRs not yet Done -> Done (safety net)
            while read -r id; do
              [ -n "$id" ] || continue
              set_status "$id" "$OPT_DONE"
              doned=$((doned+1))
            done <<< "$closed_pr_ids"

            has_next=$(echo "$resp" | jq -r '.data.node.items.pageInfo.hasNextPage')
            cursor=$(echo "$resp" | jq -r '.data.node.items.pageInfo.endCursor')
            [ "$has_next" = "true" ] || break
          done

          echo "Sweep complete: $backlogged issue(s) -> Backlog, $doned closed PR card(s) -> Done, $skipped_fresh fresh null-status issue(s) held back (within ${SWEEP_GRACE_MINUTES}m auto-add grace)."

      # Board->label mirror (issue #2855): force every OPEN issue's board-derived
      # status:* label to match its board Status (Ready->status:ready, In Progress->
      # status:in-progress, In Review->status:in-review, Backlog/Done->none). The
      # single-source mapping + mirror lives in scripts/ci/board-label-mirror.sh so
      # the workflow and the shell test drive the SAME logic. Idempotent: a matching
      # board makes no edit. Does NOT touch status:spec-review/status:addressing
      # (transient skill-managed sub-markers, not board Status options).
      - name: Mirror board Status -> status:* label
        run: bash scripts/ci/board-label-mirror.sh mirror

      # Drift-detector (issue #2855): AFTER the mirror pass, re-read (Status, labels)
      # for every OPEN issue and FAIL the run (::error:: + non-zero) on any
      # board-derived-label != Status disagreement (past the BLM_GRACE_SECS window,
      # so a just-added item or an in-run race does not flap red). A red here means a
      # re-drift or an out-of-band label write — surfaced, never silently tolerated.
      - name: Drift-detect board vs label
        run: bash scripts/ci/board-label-mirror.sh detect

  # ---------------------------------------------------------------------------
  # Event path (issue #2855): an issue was edited / (un)labeled / reopened. Re-assert
  # ONLY that one issue's board-derived label from its board Status (low-latency
  # correction of a hand-tampered label). Reuses the SAME mapping in
  # scripts/ci/board-label-mirror.sh as the sweep — single source, no divergent copy.
  # ---------------------------------------------------------------------------
  mirror-one:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Guard token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PROJECTS_TOKEN not set — board->label mirror is NOT running. Add a PAT (or GitHub App token) with 'project' scope as repo secret PROJECTS_TOKEN. Failing loudly (issue #2655/#2855)."
            exit 1
          fi

      - name: Checkout (for scripts/ci/board-label-mirror.sh)
        uses: actions/checkout@v4

      # Pass the event-supplied issue number + node id via QUOTED env vars (never
      # inlined into run:) and validate the number is a bare integer before use —
      # the workflow command-injection guard (issue #2656 / check-workflow-
      # injection.sh). The node id lets mirror-one resolve the issue's project item
      # DIRECTLY (node(id){projectItems}) instead of paginating the whole board for
      # one issue (issue #2855, F4).
      - name: Re-assert this issue's label from board Status
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
        run: |
          set -euo pipefail
          case "$ISSUE_NUMBER" in
            ''|*[!0-9]*)
              echo "::error::unexpected non-numeric issue number '$ISSUE_NUMBER'"; exit 1 ;;
          esac
          bash scripts/ci/board-label-mirror.sh mirror-one "$ISSUE_NUMBER" "$ISSUE_NODE_ID"

  # ---------------------------------------------------------------------------
  # Scheduled path: CI-side claim reaper (issue #2655 / #2499 design).
  #
  # Enforces the deterministic reap rule IN CODE (it was previously only prose):
  # a supervisor-authored refs/machine-claims/<machine> liveness ref is reaped when its
  # age exceeds the threshold AND its issue has NO open PR. The PID-dead clause
  # is a LOCAL-only refinement (a foreign machine's PID is unknowable from CI), so
  # from CI the age + no-open-PR gate governs — exactly what `should-reap`
  # returns for a non-local machine. `should-reap` is FAIL-SAFE: a fresh ref, an
  # open-PR ref, or an unparseable-age ref is always KEPT (exit 1); a gh/network
  # hiccup in the open-PR probe is treated as "assume open PR" and KEEPS the ref.
  # Reaping deletes the claim ref and flips the freed board item In Progress ->
  # Ready with a traceable comment, mirroring flow-board's manual reap.
  # ---------------------------------------------------------------------------
  reap-claims:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Needs write to delete stale refs/machine-claims/* refs (the top-level
    # default is contents: read); the sweep/pr-closed jobs stay read-only.
    permissions:
      contents: write
    env:
      REAP_THRESHOLD_SECS: '14400' # 4h — matches claim-heartbeat.sh's documented default
    steps:
      - name: Guard token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PROJECTS_TOKEN not set — claim reaper is NOT running. Add a PAT (or GitHub App token) with 'project' scope as repo secret PROJECTS_TOKEN. Failing loudly (issue #2655) so this outage is visible instead of a silent green no-op."
            exit 1
          fi

      - name: Checkout (for claim-heartbeat.sh)
        uses: actions/checkout@v4

      - name: Reap stale claim refs
        run: |
          set -euo pipefail
          HB="scripts/flow/claim-heartbeat.sh"

          # Map a machine name -> its claim's issue number (parsed from the ref
          # message, same field grammar claim-heartbeat.sh writes).
          raw=$(git ls-remote origin 'refs/machine-claims/*' 2>/dev/null || true)
          if [ -z "$raw" ]; then
            echo "No claim refs on origin — nothing to reap."
            exit 0
          fi

          reaped=0
          kept=0
          # Iterate machine names from the ref list (field 2 = refname).
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            refname=$(printf '%s' "$line" | awk '{print $2}')
            machine="${refname#refs/machine-claims/}"
            [ -n "$machine" ] || continue

            # should-reap is the single source of truth for the predicate. Exit 0
            # = reap; 1 = keep; 2 = ref vanished (raced away). Never reaps a
            # fresh/open-PR/unknown-age claim. Note: from CI `machine` is never
            # THIS runner, so the PID clause is skipped and age + no-open-PR gate.
            rc=0
            bash "$HB" should-reap "$machine" "$REAP_THRESHOLD_SECS" || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "keep claim machine=$machine (should-reap rc=$rc)"
              kept=$((kept+1))
              continue
            fi

            # Recover the issue number from the ref message for the board flip +
            # comment. Best-effort: reaping the ref is the primary action.
            git fetch origin "$refname" >/dev/null 2>&1 || true
            msg=$(git log -1 --format=%B FETCH_HEAD 2>/dev/null || true)
            issue=$(printf '%s' "$msg" | sed -n 's/.*issue=\([0-9][0-9]*\).*/\1/p' | head -1)

            # `reap` re-checks the open-PR guard atomically before deleting, so a
            # PR opened between should-reap and here still refuses the delete.
            if bash "$HB" reap "$machine"; then
              echo "reaped claim machine=$machine issue=${issue:-?}"
              reaped=$((reaped+1))
              # Flip the freed item back to Ready + leave a trace (skip issue "0"
              # / unknown — a claim with no real issue has no board item to flip).
              if [ -n "${issue:-}" ] && [ "$issue" != "0" ]; then
                item_id=$(gh api graphql -f query='
                  query($p: ID!) { node(id: $p) { ... on ProjectV2 {
                    items(first: 100) { nodes { id content {
                      ... on Issue { number state } } } } } } }' \
                  -f p="$PROJECT_ID" \
                  --jq ".data.node.items.nodes[] | select(.content.number==${issue}) | select(.content.state==\"OPEN\") | .id" 2>/dev/null | head -1 || true)
                if [ -n "${item_id:-}" ]; then
                  gh api graphql -f query='
                    mutation($p: ID!, $i: ID!, $f: ID!, $o: String!) {
                      updateProjectV2ItemFieldValue(input: {
                        projectId: $p, itemId: $i, fieldId: $f,
                        value: { singleSelectOptionId: $o }
                      }) { projectV2Item { id } }
                    }' -f p="$PROJECT_ID" -f i="$item_id" -f f="$STATUS_FIELD_ID" -f o="$OPT_READY" >/dev/null || true
                  echo "flipped issue #$issue -> Ready"
                fi
                gh issue comment "$issue" --body \
                  "Automated claim reap (issue #2655 CI reaper): machine \`${machine}\`'s claim ref was stale (age > $((REAP_THRESHOLD_SECS/3600))h) with no open PR. Work is preserved on the \`issue-${issue}-*\` branch (never deleted); Status returned to Ready for re-pickup." >/dev/null 2>&1 || true
              fi
            else
              echo "reap declined machine=$machine (open PR appeared, or push error) — kept"
              kept=$((kept+1))
            fi
          done <<< "$raw"

          echo "Reap complete: $reaped claim(s) reaped, $kept kept."
