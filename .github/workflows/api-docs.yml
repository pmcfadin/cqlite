name: API Docs

# Publishes per-tag rustdoc for cqlite-core to GitHub Pages so downstream
# consumers (who pin by git tag, since CQLite is not on crates.io) can evaluate a
# version's API without checking out the repo. Each tag is published under
# /api/<tag>/ and the newest also under /api/latest/; history is preserved (keep_files).
#
# Old per-tag URLs (/<tag>/) have redirect stubs pointing to the new /api/<tag>/ paths
# so links in past release notes keep working. See the "Publish redirect stubs" step.
#
# Requires GitHub Pages to be enabled for the repo with the "gh-pages branch"
# source (Settings → Pages). Enabling Pages is a one-time maintainer action.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version subdirectory to publish under (e.g. v0.9.2)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  rustdoc:
    name: Build & publish rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Use stable for doc builds regardless of the pinned toolchain.
      - name: Override Rust toolchain
        run: rm -f rust-toolchain.toml

      - name: Resolve version label
        id: ver
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build rustdoc (cqlite-core, all features)
        run: cargo doc --no-deps --package cqlite-core --all-features

      - name: Add root redirect to crate index
        run: |
          echo '<meta http-equiv="refresh" content="0; url=cqlite_core/index.html">' > target/doc/index.html

      - name: Publish to /api/<version>/ on gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc
          destination_dir: api/${{ steps.ver.outputs.version }}
          keep_files: true

      - name: Publish to /api/latest/ on gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc
          destination_dir: api/latest
          keep_files: true

      - name: Publish redirect stubs for old per-tag URLs
        # Old rustdoc was published under /<tag>/ (e.g. /v0.9.2/, /v0.10.0/).
        # These stubs redirect those URLs to the new /api/<tag>/ locations so
        # links in past release notes and external references keep working.
        # Tags with confirmed old-style directories on gh-pages: v0.9.2, v0.10.0.
        run: |
          python3 - <<'PYEOF'
          import os, textwrap
          # Tags confirmed to have old-style /<tag>/ directories on gh-pages.
          # Redirect path: from /<tag>/index.html to /api/<tag>/ is ../api/<tag>/
          tags = ["v0.9.2", "v0.10.0"]
          for tag in tags:
              out_dir = f"/tmp/redirects/{tag}"
              os.makedirs(out_dir, exist_ok=True)
              html = textwrap.dedent(f"""\
                  <!DOCTYPE html>
                  <html lang="en">
                  <head>
                    <meta charset="utf-8">
                    <title>Redirecting to /api/{tag}/</title>
                    <meta http-equiv="refresh" content="0; url=../api/{tag}/">
                    <link rel="canonical" href="../api/{tag}/">
                  </head>
                  <body>
                    <p>This page has moved.
                       <a href="../api/{tag}/">Click here if you are not redirected.</a></p>
                  </body>
                  </html>
              """)
              with open(f"{out_dir}/index.html", "w") as f:
                  f.write(html)
              print(f"Created redirect stub for {tag}")
          PYEOF

      - name: Publish redirect stubs to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/redirects
          destination_dir: .
          keep_files: true
