name: "CI: Observability Gate"

# Validation gate for the observability stack (epic #1031, issue #1043):
#
#   1. Dependency isolation — the DEFAULT cqlite-core build links NO opentelemetry
#      crates; the stack appears only under `--features observability`.
#   2. Correctness + sampling — the in-memory-OTLP span/metric tests pass.
#   3. Zero-overhead-when-disabled — the `observability_overhead` bench, run under
#      the default build vs `--features observability` (export disabled) on the
#      SAME runner, stays within the documented overhead threshold.
#
# Like the perf-regression gate, both bench arms run on one runner so the delta is
# immune to cross-machine variance.
#
# CI TIERING (issue #1368): dependency isolation and correctness stay on
# observability-relevant PRs. The overhead benchmark runs only for PRs labeled
# `ci:observability-overhead`, workflow_dispatch, or nightly schedule.

on:
  schedule:
    # Nightly at 04:45 UTC
    - cron: '45 4 * * *'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
    # Unfiltered so adding ci:observability-overhead can start the optional
    # benchmark tier on any PR. A cheap classifier keeps correctness scoped to
    # observability-relevant paths.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  DATASET_TAG: datasets-v3
  DATASET_ASSET: cassandra5-small-full-v3.5.tar.gz
  DATASET_SHA256: 13d8da00743d9780c7ee89478649c280f9d91519a4561f6909cc4ce3bb7a3631
  CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
  # Tolerated median overhead of the export-disabled observability build over the
  # default build (see benches/observability_overhead.rs OVERHEAD_THRESHOLD_PCT).
  OVERHEAD_THRESHOLD_PCT: "2.0"
  # Keep CI bench runs short but stable.
  BENCH_ARGS: "--sample-size 30 --warm-up-time 1 --measurement-time 5"

jobs:
  classify:
    name: Classify observability scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_correctness: ${{ steps.scope.outputs.run_correctness }}
      run_overhead: ${{ steps.scope.outputs.run_overhead }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify PR paths and labels
        id: scope
        env:
          HAS_OVERHEAD_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:observability-overhead') }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_correctness=true" >> "$GITHUB_OUTPUT"
            echo "run_overhead=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > changed-files.txt

          echo "Changed files:"
          sed 's/^/  - /' changed-files.txt

          relevant_regex='^(cqlite-core/src/observability/|cqlite-core/src/query/|cqlite-core/src/storage/|bindings/|cqlite-flight/|cqlite-core/benches/observability_overhead\.rs|cqlite-core/tests/observability_correctness\.rs|cqlite-core/tests/observability_no_otel_default\.rs|cqlite-core/Cargo\.toml|Cargo\.toml|Cargo\.lock|scripts/ci/observability_overhead\.sh|scripts/ci/observability_no_otel_default\.sh|\.github/workflows/observability-gate\.yml)'

          run_correctness=false
          if grep -Eq "$relevant_regex" changed-files.txt; then
            run_correctness=true
          fi

          echo "run_correctness=${run_correctness}" >> "$GITHUB_OUTPUT"
          echo "run_overhead=${HAS_OVERHEAD_LABEL}" >> "$GITHUB_OUTPUT"

  observability-gate:
    name: Dependency isolation + correctness (+ optional overhead)
    needs:
      - classify
    if: >-
      needs.classify.outputs.run_correctness == 'true' ||
      needs.classify.outputs.run_overhead == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        # No `toolchain:` input: setup-rust-toolchain reads rust-toolchain.toml
        # (pinned 1.88.0) instead of overriding it with stable (issue #1990).
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-obsgate-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-obsgate-cargo-
            ${{ runner.os }}-cargo-

      - name: Cache canonical datasets
        uses: actions/cache@v5
        with:
          path: test-data/datasets/
          key: ${{ runner.os }}-datasets-${{ env.DATASET_TAG }}-${{ env.DATASET_SHA256 }}

      - name: Fetch canonical datasets
        run: bash ./test-data/scripts/fetch-datasets.sh

      # 1. Dependency isolation: default build links no OTel; obs build does.
      - name: cargo-tree no-OTel guard
        run: bash scripts/ci/observability_no_otel_default.sh

      # 2. Correctness + sampling: in-memory OTLP span/metric tests.
      - name: Observability correctness + sampling tests
        run: |
          cargo test -p cqlite-core \
            --features observability-testing,cli-helpers \
            --test observability_correctness \
            --test observability_no_otel_default

      # 3. Zero-overhead-when-disabled: two-build bench comparison on one runner.
      - name: Observability overhead gate
        if: ${{ needs.classify.outputs.run_overhead == 'true' }}
        run: bash scripts/ci/observability_overhead.sh

      - name: Write CI tier summary
        if: always()
        run: |
          {
            echo "## Observability gate tier"
            echo ""
            echo "- Dependency isolation and correctness run on observability-relevant PRs."
            echo "- Overhead benchmark runs on workflow_dispatch, nightly schedule, or PRs labeled \`ci:observability-overhead\`."
            echo "- Ordinary observability PRs skip the Criterion overhead benchmark by default."
          } >> "$GITHUB_STEP_SUMMARY"
