name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  DATASET_TAG: datasets-v3
  DATASET_ASSET: cassandra5-small-full-v3.tar.gz
  DATASET_SHA256: 69950feaaf45854e38c467087911d2d9772eeb459b6131adb676a342d7dfa983

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Restore dataset cache
        id: dataset-cache
        uses: actions/cache@v4
        with:
          path: test-data/datasets
          key: datasets-${{ env.DATASET_TAG }}

      - name: Fetch datasets if cache miss
        if: steps.dataset-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p test-data/datasets
          curl -fsSL -o /tmp/${DATASET_ASSET} \
            https://github.com/pmcfadin/cqlite/releases/download/${DATASET_TAG}/${DATASET_ASSET}
          echo "${DATASET_SHA256}  /tmp/${DATASET_ASSET}" | sha256sum -c -
          tar -xzf /tmp/${DATASET_ASSET} -C .

      - name: Sanity check dataset
        run: |
          test -f test-data/datasets/metadata.yml
          find test-data/datasets/sstables -name "*-Data.db" | head -n 1

      - name: Validate environment
        run: |
          echo "🔧 Environment validation"
          rustc --version
          cargo --version
          # Quick validation that datasets are available
          echo "Dataset files: $(find test-data -name '*.db' | wc -l)"

      - name: Validate references manifest (non-blocking)
        run: |
          echo "::group::References manifest validation (non-blocking)"
          if [ -f test-data/datasets/references.yml ]; then
            echo "✅ Found references.yml; validating presence of JSONL and Statistics refs..."
            MISSING=0
            while IFS= read -r -d '' DATA_FILE; do
              DIR="$(dirname "$DATA_FILE")"
              BASE="$(basename "$DATA_FILE")"
              PREFIX_NAME="${BASE%-Data.db}"
              JSONL="$DIR/${PREFIX_NAME}-Data.db.jsonl"
              STATS="$DIR/${PREFIX_NAME}-Statistics.db.txt"
              if [ ! -s "$JSONL" ]; then echo "::warning::Missing or empty $JSONL"; MISSING=$((MISSING+1)); fi
              if [ ! -s "$STATS" ]; then echo "::warning::Missing or empty $STATS"; MISSING=$((MISSING+1)); fi
            done < <(find test-data/datasets/sstables -type f -name "*-Data.db" -print0 2>/dev/null || true)
            echo "References validation complete; missing_count=$MISSING"
          else
            echo "ℹ️ references.yml not found; skipping validation (expected until datasets-v3)."
          fi
          echo "::endgroup::"

      - name: Run core tests
        env:
          CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
          RUST_LOG: debug
          RUST_BACKTRACE: full
        run: |
          echo "🧪 Running core tests..."
          echo "CQLITE_DATASETS_ROOT=$CQLITE_DATASETS_ROOT"
          echo "Checking dataset files:"
          ls -la "$CQLITE_DATASETS_ROOT/sstables/test_basic/" || echo "test_basic directory not found"
          cargo test --package cqlite-core --features cli-helpers -- --skip test_legacy_format_allows_blob_fallback_with_feature

      - name: Run integration tests (issue #514)
        env:
          CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
        run: |
          echo "Running revived orphan integration tests (issue #514)..."
          # Run the seven golden-path / chunked-reader / component tests that were
          # revived in issue #514.  The CRC-corruption and compression-matrix tests
          # are intentionally excluded here because they use synthetic metadata with
          # inconsistent chunk sizes unrelated to the UUID-discovery fix.
          cargo test --package cqlite-integration-tests \
            --test chunked_data_reader_direct_test \
            --test comprehensive_component_integration_tests \
            --test fixture_specific_integration_tests \
            --test golden_path_get_operations_tests \
            --test golden_path_partition_lookup_tests \
            --test golden_path_scan_operations_tests \
            --test golden_path_summary_index_integration_tests

      - name: Run write-support tests (issue #552)
        env:
          CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
        run: |
          echo "Running write-support unit + roundtrip + compaction tests (issue #552)..."
          # These targets are self-contained: the lib unit tests, the write/read
          # roundtrip suite, and the compaction integration suite all build their own
          # SSTables in tempdirs, so they stay green without untracked fixture data.
          cargo test --package cqlite-core --features write-support --lib
          cargo test --package cqlite-core --features write-support --test write_read_roundtrip
          cargo test --package cqlite-core --features write-support --test compaction_integration

      - name: Run CLI unit tests
        env:
          CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
        run: |
          echo "Running CLI unit tests (Issue #20)..."
          cargo test --package cqlite-cli --test unit_tests

      - name: Build CLI for one-shot smoke tests
        run: |
          echo "🔨 Building CLI binary for smoke tests..."
          cargo build --package cqlite-cli --release

      - name: Run one-shot smoke tests with snapshots
        env:
          CQLITE_DATA_DIR: ${{ github.workspace }}/test-data/datasets/sstables
          CQLITE_SCHEMA: ${{ github.workspace }}/test-data/schemas/basic-types.cql
          CQLITE_CLI: ${{ github.workspace }}/target/release/cqlite
          GOLDEN_DIR: ${{ github.workspace }}/test-data/scripts/smoke-test-snapshots
        run: |
          echo "🔍 Running one-shot CLI smoke tests..."
          echo "CQLITE_DATA_DIR=$CQLITE_DATA_DIR"
          echo "CQLITE_SCHEMA=$CQLITE_SCHEMA"
          chmod +x test-data/scripts/ci-one-shot-smoke.sh
          test-data/scripts/ci-one-shot-smoke.sh

      - name: Upload smoke test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: test-data/scripts/smoke-test-results/
          retention-days: 7

  cleanup-validation:
    name: Cleanup Safety Validation
    runs-on: ubuntu-latest
    if: contains(github.head_ref, 'cleanup/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run validation script
        env:
          CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
        run: ./scripts/ci/validate-cleanup.sh


