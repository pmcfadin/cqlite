name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  DATASET_TAG: datasets-v1
  DATASET_ASSET: cassandra5-small.tar.gz
  DATASET_SHA256: 313763f28a4de71870c80346818dfa1656f4d9db564b4dce2ddd79f4e00a44dd

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Restore dataset cache
        id: dataset-cache
        uses: actions/cache@v4
        with:
          path: test-data/datasets
          key: datasets-${{ env.DATASET_TAG }}

      - name: Fetch datasets if cache miss
        if: steps.dataset-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p test-data/datasets
          curl -fsSL -o /tmp/${DATASET_ASSET} \
            https://github.com/pmcfadin/cqlite/releases/download/${DATASET_TAG}/${DATASET_ASSET}
          echo "${DATASET_SHA256}  /tmp/${DATASET_ASSET}" | sha256sum -c -
          tar -xzf /tmp/${DATASET_ASSET} -C test-data

      - name: Sanity check dataset
        run: |
          test -f test-data/datasets/metadata.yml
          find test-data/datasets/sstables -name "*-Data.db" | head -n 1

      - name: Comprehensive Environment Diagnosis
        run: |
          echo "🔍 COMPREHENSIVE CI ENVIRONMENT DIAGNOSIS"
          echo "=========================================="
          
          echo "📁 Working Directory Structure:"
          pwd
          ls -la
          
          echo "📊 Dataset Directory Analysis:"
          echo "test-data structure:"
          find test-data -type f -name "*.db" | head -20 || echo "No .db files found"
          echo "Total .db files: $(find test-data -name '*.db' | wc -l)"
          
          echo "🏗️ Rust Environment:"
          rustc --version
          cargo --version
          echo "RUST_LOG: ${RUST_LOG:-not set}"
          
          echo "🧪 Test Environment Paths:"
          echo "Current PATH: $PATH"
          echo "HOME: $HOME"
          echo "TMPDIR: ${TMPDIR:-not set}"
          
          echo "💾 Available Disk Space:"
          df -h . || echo "df not available"
          
          echo "🔧 Integration Test Specific Checks:"
          echo "Looking for test database creation paths..."
          if [ -d "test-env" ]; then
            echo "test-env directory exists:"
            find test-env -name "*.db" | head -10 || echo "No .db files in test-env"
          else
            echo "test-env directory does not exist"
          fi
          
          echo "🌍 Environment Variables:"
          env | grep -E "(RUST|CARGO|TEST)" | sort || echo "No relevant env vars"
          
          echo "📋 Memory and Process Info:"
          free -h 2>/dev/null || echo "free command not available"
          ps aux | head -5 || echo "ps command not available"
          
          echo "✅ Environment diagnosis complete"

      - name: Run tests with enhanced debugging
        env:
          RUST_LOG: debug
          RUST_BACKTRACE: full
        run: |
          echo "🧪 Running integration tests with full debugging..."
          
          # Run the specific failing tests first with maximum verbosity
          echo "Testing error handling specifically:"
          cargo test test_error_handling --package cqlite-core --lib -- --nocapture --exact || true
          
          echo "Testing real world query examples specifically:"
          cargo test test_real_world_query_examples --package cqlite-core --lib -- --nocapture --exact || true
          
          echo "Running all tests:"
          cargo test --package cqlite-core --all-features


