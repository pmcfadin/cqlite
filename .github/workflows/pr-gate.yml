name: Required PR Gate

on:
  pull_request:
    # Issue #2910. `labeled`/`unlabeled` are LOAD-BEARING, not housekeeping:
    # applying a label starts no run for an event type this workflow does not
    # subscribe to, and re-running a workflow REPLAYS the original event payload —
    # so without them the documented `ci:waive:<tier-id>` break-glass could never
    # be exercised on a PR this gate has wedged, which is exactly when it is
    # needed. `ready_for_review` keeps this workflow's observed event set a
    # SUPERSET of every registered tier's (flight-ci.yml), so no event can cancel
    # a tier's in-flight run with no `required` run watching for the replacement.
    # gating_registry.rb enforces both relationships.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  # Issue #2910: the `required` job POLLS this PR head's sibling check runs.
  # `checks: read` reads the check-runs endpoint; `actions: read` reads this run's
  # own job ids for name-independent self-exclusion; `pull-requests: read` re-reads
  # the PR's CURRENT labels (the event payload is a snapshot from run start, and a
  # re-run replays it, so a waiver added later would otherwise be invisible). All
  # read-only and available to the default GITHUB_TOKEN, including on fork PRs.
  checks: read
  actions: read
  pull-requests: read

concurrency:
  # The GROUP is the serialization guarantee: at most one run of this workflow
  # per PR ever executes, so two runs can never both report a `required`
  # conclusion — a queued run reports nothing until it starts.
  #
  # `cancel-in-progress` only chooses cancel-vs-QUEUE (issue #2910 round 2):
  #   * a new head sha (opened/synchronize/reopened/ready_for_review) obsoletes
  #     the in-flight run, so cancel it;
  #   * a LABEL mutation changes no byte of the diff. Cancelling there would
  #     restart the 30-minute core (clippy, all-feature build, core tests, the
  #     #2644 oracle) on every `ci:perf`, board-mirror or `needs-decision` label
  #     — and on the `ci:waive:<tier-id>` break-glass itself, making the escape
  #     hatch cost a full gate re-run. Label runs therefore queue behind the
  #     in-flight run and skip the core entirely (see `pr-gate-core`'s `if:`).
  # gating_policy_rules.rb rejects an unconditional `true` here while this
  # workflow subscribes to label events.
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

jobs:
  # Everything the required gate itself computes. Split out from `required`
  # (issue #2910) so the aggregation wait gets its own generous timeout without
  # inflating this compute job's. The branch-protection context name
  # (`required`) is UNCHANGED.
  pr-gate-core:
    name: pr-gate-core
    # A label mutation changes no file, so re-running the heaviest job in the
    # repo for it is pure tax (issue #2910 round 2). The label run instead reuses
    # the result this job ALREADY recorded for the same head sha — `required`
    # verifies that via the aggregator's --core-* options and fails closed if no
    # successful core is recorded. Skipping the WORK never skips the CHECK.
    if: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so the docs-only classifier can diff the PR base
          # against its head (base.sha may be behind the shallow default).
          fetch-depth: 0

      # ALWAYS-EMIT docs-only classifier (issue #2645, pattern:
      # observability-gate.yml classify job). Computes the changed-file set for
      # this PR and decides whether the Rust build + query-semantics oracle
      # (#2644) + heavy steps must run. Fail-closed: any non-docs file, or an
      # empty/ambiguous set, forces the full path. This step MUST NOT be skipped
      # so the `required` status always reports in BOTH branches; do NOT add
      # paths/paths-ignore to the trigger (a filtered required check that never
      # fires would block every affected PR forever).
      - name: Classify docs-only diff
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Names only, NUL-safe path handling, base..head three-dot compare so
          # only files the PR actually changed are considered.
          git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > changed-files.txt

          echo "Changed files:"
          sed 's/^/  - /' changed-files.txt

          docs_only=false
          if bash scripts/ci/classify-docs-only.sh < changed-files.txt; then
            docs_only=true
          fi

          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"
          echo "Classifier verdict: docs_only=${docs_only}"

      - name: Docs-only short-circuit summary
        if: steps.classify.outputs.docs_only == 'true'
        run: |
          {
            echo "## Required PR Gate: docs-only short-circuit"
            echo ""
            echo "The changed-file set is documentation only (issue #2645), so"
            echo "the Rust build, query-semantics oracle (#2644), and other heavy"
            echo "steps were skipped. Docs validation runs on docs PRs via"
            echo "docs-site.yml. This required status reports green from the"
            echo "always-run classifier."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate workflow policy
        if: steps.classify.outputs.docs_only != 'true'
        run: >-
          bash scripts/ci/ci-timing-summary.sh measure
          "workflow policy"
          -- ruby scripts/ci/validate-workflows.rb

      - name: Dataset pin agreement (#2646)
        if: steps.classify.outputs.docs_only != 'true'
        run: >-
          bash scripts/ci/ci-timing-summary.sh measure
          "dataset pin agreement"
          -- bash scripts/ci/check-dataset-pin.sh

      - name: Release manifest version agreement (#2652)
        if: steps.classify.outputs.docs_only != 'true'
        run: >-
          bash scripts/ci/ci-timing-summary.sh measure
          "release version agreement"
          -- bash scripts/bump-version.sh check

      - name: Flight Dockerfile Rust-pin lockstep (#2870)
        if: steps.classify.outputs.docs_only != 'true'
        run: >-
          bash scripts/ci/ci-timing-summary.sh measure
          "flight dockerfile rust-pin"
          -- bash scripts/ci/check-dockerfile-rust-pin.sh

      - name: Setup Rust
        if: steps.classify.outputs.docs_only != 'true'
        uses: ./.github/actions/setup-rust-ci
        with:
          components: rustfmt,clippy
          cache-key: pr-gate

      - name: Cargo.lock freshness (--locked, #2870)
        if: steps.classify.outputs.docs_only != 'true'
        # Cargo.lock is tracked and the flight image build resolves --locked; a
        # manifest edit that leaves the lock stale must fail HERE on the required
        # surface (fork PRs, workflow-only PRs), not only at the later image build.
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "cargo lock freshness" -- bash -e -u -o pipefail -c '
            cargo metadata --locked --format-version 1 > /dev/null
          '

      - name: Rust format check
        if: steps.classify.outputs.docs_only != 'true'
        run: >-
          bash scripts/ci/ci-timing-summary.sh measure
          "cargo fmt"
          -- cargo fmt --all -- --check

      - name: cqlite-core clippy hard gate
        if: steps.classify.outputs.docs_only != 'true'
        run: >-
          bash scripts/ci/ci-timing-summary.sh measure
          "cqlite-core clippy"
          -- cargo clippy --package cqlite-core --all-targets --all-features -- -D warnings

      - name: cqlite-core all-feature build
        if: steps.classify.outputs.docs_only != 'true'
        run: >-
          bash scripts/ci/ci-timing-summary.sh measure
          "cqlite-core all-feature build"
          -- cargo build --package cqlite-core --all-features

      - name: cqlite-core fast representative tests
        if: steps.classify.outputs.docs_only != 'true'
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "cqlite-core fast tests" -- bash -e -u -o pipefail -c '
            # Mirrors scripts/local/pre-merge.sh fast. The skipped tests are legacy
            # write-path cases tracked outside this PR gate; keeping the same scope
            # makes the required check deterministic and fast without Docker/datasets.
            cargo test --package cqlite-core --lib --all-features --no-fail-fast -- \
              --skip query::engine::plan_cache_tests \
              --skip query::select_integration_tests \
              --skip storage::tests::test_batch_operations \
              --skip tests::test_database
          '

      - name: Query-semantics oracle (fail-closed, #2644)
        if: steps.classify.outputs.docs_only != 'true'
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "query-semantics oracle" -- bash -e -u -o pipefail -c '
            # Read-time-reconciliation parity oracle (#1742): committed-fixture,
            # pinned-now, no Docker. The fixtures live in-repo under
            # test-data/datasets/sstables/test_compaction_tombstone_ttl (git-tracked),
            # so actions/checkout alone provides them and the test resolves them via
            # its repo-root fallback. CQLITE_REQUIRE_FIXTURES=1 makes an absent/empty
            # fixture a HARD FAILURE (reds this required job) instead of a silent skip.
            CQLITE_REQUIRE_FIXTURES=1 \
              cargo test -p cqlite-core --features "state_machine cli-helpers" \
                --test query_semantics_oracle_parity
          '

      - name: Required PR Gate timing summary
        if: steps.classify.outputs.docs_only != 'true'
        run: bash scripts/ci/ci-timing-summary.sh summary "Required PR Gate timing"

  # THE branch-protection context. `name: required` is load-bearing — it is the
  # single entry in .github/branch-protection.json's required_status_checks
  # contexts, which this change deliberately does NOT touch.
  #
  # Issue #2910: a GitHub Actions job cannot `needs:` a job in another workflow,
  # so every tier in a sibling workflow used to be invisible to
  # `gh pr merge --auto`. This job closes that by polling the PR head's sibling
  # check runs and failing closed on any tier registered in
  # .github/ci-gating-tiers.yml that is failed, non-terminal at the deadline, or
  # absent. It NEVER masks the core: `pr-gate-core` not concluding `success` is
  # an unconditional failure here.
  #
  # `if: always()` so the required context still reports (red) when the core job
  # fails, is cancelled, or is skipped — a never-reported required context would
  # block every affected PR forever.
  #
  # COST, stated honestly (issue #2910 round 2): this is a SECOND `ubuntu-latest`
  # runner that lives until the slowest registered tier reaches a terminal state
  # (worst case the 60-minute deadline, then a reported red). The earlier claim
  # that the job split "releases the heavy runner before the wait begins" was
  # wrong — the split separates TIMEOUTS, not runners. What it does keep cheap is
  # this job's shape: a bare checkout of the base ref, no toolchain, no cache, no
  # build; and when the tiers already finished while `pr-gate-core` was running,
  # the first poll decides and the job exits in well under a minute. See
  # openspec/changes/required-aggregates-sibling-tiers/design.md ("Cost").
  required:
    name: required
    needs: [pr-gate-core]
    if: always()
    runs-on: ubuntu-latest
    # Strictly GREATER than the registry's aggregation deadline (60m default), so
    # expiry surfaces as a reported red with a diagnostic instead of an Actions
    # job cancellation. validate-workflows.rb asserts this relationship.
    timeout-minutes: 75

    steps:
      # TRUST BOUNDARY (issue #2910 round 2). Everything that DECIDES this
      # context — the aggregator, its ruby modules and the tier registry — is
      # read from the pull request's BASE REF, never from the PR's own checkout.
      # Otherwise the check is defined by the thing it checks: a PR could gut
      # scripts/ci/aggregate-required-tiers.sh, or move its own tier from
      # `tiers:` to `exempt:` (the enrolment rule accepts any reason + issue
      # ref), and `required` would go green on instructions the PR wrote. A
      # registry change now takes effect AFTER it merges, which is the correct
      # semantics. `base.sha` is a commit on the (protected) base branch, so it
      # is not reachable from the PR head.
      #
      # We deliberately do NOT switch this workflow to `pull_request_target`:
      # that hands a base-context token to a run that must also see head content
      # — the classic pwn-request shape. Checking out the base copy of the
      # specific trusted files is the smaller instrument, and this job never
      # checks out head content at all (except in the bootstrap branch below).
      #
      # RESIDUAL, stated rather than hidden: a PR still controls the code its own
      # tiers execute, so a tier's classifier can be edited to report "not
      # applicable". Base-ref evaluation guarantees the SET of tiers, their
      # contexts and the aggregation logic — not the work a tier chooses to do.
      # That residual is a visible diff to a registered tier's workflow;
      # CODEOWNERS on `.github/` + `scripts/ci/` is the complementary control.
      - name: Checkout the base ref's gating mechanism (trusted copy)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-gating
          persist-credentials: false

      - name: Select the gating mechanism source
        id: source
        run: |
          set -euo pipefail
          if [ -f base-gating/.github/ci-gating-tiers.yml ] &&
             [ -f base-gating/scripts/ci/aggregate-required-tiers.sh ]; then
            echo "dir=base-gating" >> "$GITHUB_OUTPUT"
            echo "Gating mechanism source: the BASE ref (trusted)."
            exit 0
          fi
          # BOOTSTRAP ONLY: the base ref predates this mechanism (the PR that
          # introduces it, or a PR onto a branch cut before it). There is nothing
          # on the base to subvert, and the base's state is not PR-controllable,
          # so this fallback can never be used to escape a base registry that
          # exists — a PR that DELETES the registry still faces the base copy.
          echo "::warning::the base ref carries no gating registry; falling back to this PR's copy (bootstrap)"
          echo "dir=head-gating" >> "$GITHUB_OUTPUT"

      - name: Checkout this PR (bootstrap only — the base has no mechanism)
        if: steps.source.outputs.dir == 'head-gating'
        uses: actions/checkout@v5
        with:
          path: head-gating
          persist-credentials: false

      # MIGRATION DETECTION (issue #2910 round 3). The trust-boundary fix above
      # split WHERE THE REGISTRY LIVES (the base ref) from WHERE THE EMITTER
      # LIVES (the tree this event ran). When they disagree — a PR that renames a
      # registered tier's context, deletes its workflow, or predates the tier —
      # the context can NEVER appear, and without this the aggregator would poll
      # it for the full 60 minutes, hold a runner, and report an unexplained red.
      #
      # `github.sha` is deliberate: for a `pull_request` event that is the MERGE
      # COMMIT, which is exactly the tree GitHub took this run's workflow
      # definitions from — so this reads the same flight-ci.yml the Flight tier
      # would have run from, not the raw head. Sparse, read-only, no credentials:
      # the content is untrusted and is only ever PARSED, never executed, and the
      # verdict it can produce is a failure, never a pass (see
      # scripts/ci/gating_head_emitability.rb).
      #
      # `continue-on-error` because losing this checkout must not red a
      # legitimate PR: the aggregator warns and falls back to ordinary polling.
      - name: Checkout the event tree's workflow definitions (read-only)
        id: event-tree
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: event-tree
          persist-credentials: false
          sparse-checkout: .github/workflows
          sparse-checkout-cone-mode: false

      - name: Aggregate registered gating tiers
        env:
          # Migration detection inputs (see the checkout step above).
          EVENT_WORKFLOWS_DIR: event-tree/.github/workflows
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The aggregator re-reads the PR's labels from the API on every poll
          # (see PR_NUMBER); this payload snapshot is only the fallback for when
          # that read fails. Waiver labels only — anything that is not
          # `ci:waive:<tier-id>` is ignored.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          # The gate's own compute job. On a label event it is skipped and the
          # aggregator requires the result already RECORDED for this head sha;
          # on any other event `skipped` is an unconditional failure.
          CORE_CONTEXT: pr-gate-core
          CORE_RESULT: ${{ needs.pr-gate-core.result }}
          EVENT_ACTION: ${{ github.event.action }}
          GATING_DIR: ${{ steps.source.outputs.dir }}
        run: bash "$GATING_DIR/scripts/ci/aggregate-required-tiers.sh"
