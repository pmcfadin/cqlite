name: "CI: Performance Regression"

on:
  workflow_dispatch:
  # Disabled for M1 milestone - will be re-enabled post-M1
  # push:
  #   branches: [ main, develop ]
  # pull_request:
  #   branches: [ main, develop ]
    inputs:
      benchmark_mode:
        description: 'Benchmark mode'
        required: false
        default: 'comprehensive'
        type: choice
        options:
          - 'smoke'
          - 'comprehensive'
          - 'stress'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  performance-baseline:
    name: Performance Baseline & Regression Detection
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history for baseline comparison

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        key: benchmark-${{ hashFiles('**/Cargo.lock') }}
        cache-on-failure: true

    - name: Restore performance baselines
      uses: actions/cache/restore@v4
      id: baseline-cache
      with:
        path: |
          target/criterion/
          performance-baselines/
        key: performance-baseline-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          performance-baseline-${{ github.ref_name }}-
          performance-baseline-main-

    - name: Restore test datasets
      uses: actions/cache/restore@v4
      with:
        path: test-data/datasets/
        key: datasets-v2-${{ hashFiles('test-data/**/*.md') }}
        restore-keys: datasets-v2-

    - name: Download test datasets (if needed)
      run: |
        if [ ! -d "test-data/datasets" ] || [ $(find test-data -name '*.db' | wc -l) -eq 0 ]; then
          echo "📦 Downloading test datasets for performance testing..."
          mkdir -p test-data
          gh release download datasets-v2 --pattern "cassandra5-small-full.tar.gz" --dir /tmp
          echo "4eb496339a5f4bc62c3490b75e57966317d7e5c216bbffe8161a659e87cbb56b  /tmp/cassandra5-small-full.tar.gz" | sha256sum -c -
          tar -xzf /tmp/cassandra5-small-full.tar.gz -C .
          echo "✅ Test datasets ready for benchmarking"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Install performance analysis tools
      run: |
        cargo install cargo-criterion --locked || echo "cargo-criterion already installed"
        pip3 install matplotlib pandas numpy || echo "Python packages already installed"

    - name: Build optimized benchmarks
      run: |
        echo "🔨 Building optimized benchmark binaries..."
        cargo build --release \
          --package cqlite-core \
          --bin performance_baseline_runner \
          --bin benchmark_streaming \
          --features "all-compression,metrics,experimental,benchmarks"

    - name: Run baseline performance tests
      env:
        CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
        BENCHMARK_MODE: ${{ github.event.inputs.benchmark_mode || 'comprehensive' }}
      run: |
        echo "⚡ Running performance baseline tests..."
        mkdir -p performance-baselines

        # Determine benchmark scope based on mode
        case "$BENCHMARK_MODE" in
          "smoke")
            BENCHMARK_ARGS="--mode=smoke --duration=30"
            ;;
          "stress")
            BENCHMARK_ARGS="--mode=stress --duration=300"
            ;;
          *)
            BENCHMARK_ARGS="--mode=comprehensive --duration=120"
            ;;
        esac

        echo "🎯 Running benchmarks with: $BENCHMARK_ARGS"

        # Core reading performance benchmarks
        echo "📊 Core SSTable reading benchmarks..."
        cargo run --release \
          --package cqlite-core \
          --bin performance_baseline_runner \
          -- $BENCHMARK_ARGS \
          --output-json performance-baselines/core-reading.json \
          --output-summary performance-baselines/summary.txt

    - name: Run Criterion benchmarks
      run: |
        echo "📈 Running Criterion performance benchmarks..."
        cargo criterion --package cqlite-core --all-features || echo "⚠️ Some benchmarks may have failed (non-blocking)"

    - name: Detect performance regressions
      run: |
        echo "🔍 Analyzing performance regressions..."

        # Create regression analysis script
        cat > analyze_regression.py << 'EOF'
        #!/usr/bin/env python3
        import json
        import sys
        import os
        from pathlib import Path

        def load_json_file(file_path):
            """Load JSON file with error handling."""
            try:
                with open(file_path, 'r') as f:
                    return json.load(f)
            except (FileNotFoundError, json.JSONDecodeError) as e:
                print(f"⚠️ Could not load {file_path}: {e}")
                return None

        def analyze_regression(current_file, baseline_file, max_regression=0.1):
            """Analyze performance regression between current and baseline."""
            current = load_json_file(current_file)
            baseline = load_json_file(baseline_file)

            if not current or not baseline:
                print("ℹ️ Unable to compare - missing baseline or current data")
                return True  # Allow pass if no data for comparison

            regressions = []
            improvements = []

            # Compare metrics (assuming both have similar structure)
            for metric_name in current.get('metrics', {}):
                if metric_name in baseline.get('metrics', {}):
                    current_val = current['metrics'][metric_name].get('mean', 0)
                    baseline_val = baseline['metrics'][metric_name].get('mean', 0)

                    if baseline_val > 0:  # Avoid division by zero
                        change = (current_val - baseline_val) / baseline_val

                        if change > max_regression:
                            regressions.append({
                                'metric': metric_name,
                                'change': change,
                                'current': current_val,
                                'baseline': baseline_val
                            })
                        elif change < -0.05:  # 5% improvement threshold
                            improvements.append({
                                'metric': metric_name,
                                'change': change,
                                'current': current_val,
                                'baseline': baseline_val
                            })

            # Report results
            print("📊 Performance Analysis Results:")
            print(f"   Max allowed regression: {max_regression*100:.1f}%")
            print()

            if improvements:
                print("🚀 Performance Improvements:")
                for imp in improvements:
                    print(f"   ✅ {imp['metric']}: {abs(imp['change']*100):.1f}% faster")
                print()

            if regressions:
                print("⚠️ Performance Regressions Detected:")
                for reg in regressions:
                    print(f"   ❌ {reg['metric']}: {reg['change']*100:.1f}% slower")
                    print(f"      Current: {reg['current']:.2f}, Baseline: {reg['baseline']:.2f}")
                print()
                return False
            else:
                print("✅ No significant performance regressions detected")
                return True

        # Run analysis
        current_results = "performance-baselines/core-reading.json"
        baseline_results = "performance-baselines/baseline-core-reading.json"

        # If no baseline exists, create one from current results
        if not os.path.exists(baseline_results) and os.path.exists(current_results):
            print("📝 Creating initial performance baseline...")
            import shutil
            shutil.copy(current_results, baseline_results)
            print("✅ Baseline created - future runs will compare against this")
            sys.exit(0)

        # Perform regression analysis
        max_regression = float(os.environ.get('MAX_REGRESSION', '0.1'))
        success = analyze_regression(current_results, baseline_results, max_regression)

        if not success:
            print("❌ Performance regression gate FAILED")
            print("💡 Review the regression details above")
            print("💡 Consider optimizing the affected code paths")
            sys.exit(1)
        else:
            print("✅ Performance regression gate PASSED")
        EOF

        # Run regression analysis
        export MAX_REGRESSION=0.1  # 10% regression threshold from Cargo.toml
        python3 analyze_regression.py

    - name: Generate performance report
      if: always()
      run: |
        echo "📋 Generating performance report..."
        mkdir -p artifacts/performance

        # Copy all performance artifacts
        cp -r performance-baselines/* artifacts/performance/ 2>/dev/null || echo "No performance baselines to copy"
        cp -r target/criterion/* artifacts/performance/ 2>/dev/null || echo "No criterion results to copy"

        # Generate summary report
        cat > artifacts/performance/report.md << 'EOF'
        # Performance Analysis Report

        ## Summary
        - **Benchmark Mode**: ${{ github.event.inputs.benchmark_mode || 'comprehensive' }}
        - **Commit**: ${{ github.sha }}
        - **Branch**: ${{ github.ref_name }}
        - **Timestamp**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

        ## Results
        Performance analysis completed. Check individual benchmark files for detailed results.

        ## Artifacts
        - `core-reading.json`: Core SSTable reading performance metrics
        - `summary.txt`: Human-readable performance summary
        - `criterion/`: Detailed Criterion benchmark results

        ## Regression Analysis
        Maximum allowed regression: 10% (configurable via Cargo.toml)
        EOF

    - name: Cache performance baselines
      uses: actions/cache/save@v4
      if: always()
      with:
        path: |
          target/criterion/
          performance-baselines/
        key: performance-baseline-${{ github.ref_name }}-${{ github.sha }}

    - name: Upload performance artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-analysis-${{ github.sha }}
        path: artifacts/performance/
        retention-days: 30

  # Integration with other quality gates
  performance-gate:
    name: Performance Quality Gate
    runs-on: ubuntu-latest
    needs: [performance-baseline]
    if: always()

    steps:
    - name: Evaluate performance gate
      run: |
        echo "🎯 Performance Quality Gate Results:"
        echo "Status: ${{ needs.performance-baseline.result }}"

        if [ "${{ needs.performance-baseline.result }}" != "success" ]; then
          echo "❌ Performance regression detection failed"
          echo "💡 Check performance analysis above for details"
          echo "💡 Regressions exceeding 10% threshold require optimization"
          exit 1
        fi

        echo "✅ Performance regression gate passed!"
        echo "📊 No performance regressions > 10% detected"

  # Store performance results for coordination
  store-performance-results:
    name: Store Performance Results
    runs-on: ubuntu-latest
    needs: [performance-gate]
    if: always()

    steps:
    - name: Store performance test results
      run: |
        echo "📊 Performance testing completed with status: ${{ needs.performance-gate.result }}"
        echo "🔄 Results available for coordination with coverage and multi-arch gates"