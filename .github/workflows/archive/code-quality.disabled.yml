name: Code Quality Enforcement

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings -D unused-imports -D unused-variables -D dead-code"

jobs:
  clippy-enforcement:
    name: Clippy Strict Enforcement
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Run clippy with strict lints - Core
        working-directory: cqlite-core
        run: |
          cargo clippy --all-targets --all-features -- \
            -D warnings \
            -D clippy::all \
            -D clippy::pedantic \
            -D clippy::nursery \
            -D clippy::cargo \
            -D unused-imports \
            -D unused-variables \
            -D dead-code \
            -D unused-mut \
            -D unused-assignments \
            -D unreachable-code \
            -D unused-must-use \
            -W clippy::missing-docs-in-private-items
            
      - name: Run clippy with strict lints - CLI
        working-directory: cqlite-cli
        run: |
          cargo clippy --all-targets --all-features -- \
            -D warnings \
            -D clippy::all \
            -D clippy::pedantic \
            -D clippy::nursery \
            -D clippy::cargo \
            -D unused-imports \
            -D unused-variables \
            -D dead-code \
            -D unused-mut \
            -D unused-assignments \
            -D unreachable-code \
            -D unused-must-use \
            -W clippy::missing-docs-in-private-items
            
      - name: Run clippy with strict lints - Testing Framework
        working-directory: testing-framework
        run: |
          cargo clippy --all-targets --all-features -- \
            -D warnings \
            -D clippy::all \
            -D clippy::pedantic \
            -D clippy::nursery \
            -D clippy::cargo \
            -D unused-imports \
            -D unused-variables \
            -D dead-code \
            -D unused-mut \
            -D unused-assignments \
            -D unreachable-code \
            -D unused-must-use \
            -W clippy::missing-docs-in-private-items
            
      - name: Run clippy with strict lints - Tests
        working-directory: tests
        run: |
          cargo clippy --all-targets --all-features -- \
            -D warnings \
            -D clippy::all \
            -D clippy::pedantic \
            -D clippy::nursery \
            -D clippy::cargo \
            -D unused-imports \
            -D unused-variables \
            -D dead-code \
            -D unused-mut \
            -D unused-assignments \
            -D unreachable-code \
            -D unused-must-use \
            -W clippy::missing-docs-in-private-items

  dead-code-detection:
    name: Dead Code Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Check for dead code - Core
        working-directory: cqlite-core
        run: |
          RUSTFLAGS="-D dead-code" cargo check --all-targets --all-features
          
      - name: Check for dead code - CLI
        working-directory: cqlite-cli
        run: |
          RUSTFLAGS="-D dead-code" cargo check --all-targets --all-features
          
      - name: Check for dead code - Testing Framework
        working-directory: testing-framework
        run: |
          RUSTFLAGS="-D dead-code" cargo check --all-targets --all-features
          
      - name: Check for dead code - Tests
        working-directory: tests
        run: |
          RUSTFLAGS="-D dead-code" cargo check --all-targets --all-features

  code-metrics:
    name: Code Quality Metrics
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          
      - name: Install tokei for code metrics
        run: cargo install tokei
        
      - name: Generate code metrics
        run: |
          echo "## Code Quality Report" > code-quality-report.md
          echo "Generated on: $(date)" >> code-quality-report.md
          echo "" >> code-quality-report.md
          
          echo "### Lines of Code" >> code-quality-report.md
          tokei --output markdown >> code-quality-report.md
          echo "" >> code-quality-report.md
          
          echo "### Clippy Warning Summary" >> code-quality-report.md
          for dir in cqlite-core cqlite-cli testing-framework tests; do
            if [ -d "$dir" ]; then
              echo "#### $dir" >> code-quality-report.md
              cd "$dir"
              cargo clippy --message-format=json --all-targets --all-features 2>/dev/null | \
                jq -r 'select(.reason == "compiler-message") | .message.level' | \
                sort | uniq -c | awk '{print "- " $2 ": " $1}' >> ../code-quality-report.md || \
                echo "- No warnings found" >> ../code-quality-report.md
              cd ..
            fi
          done
          
      - name: Upload code quality report
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-report
          path: code-quality-report.md

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: [clippy-enforcement, dead-code-detection]
    
    steps:
      - name: Quality Gate Check
        run: |
          echo "✅ All quality gates passed!"
          echo "- Clippy strict enforcement: PASSED"
          echo "- Dead code detection: PASSED"
          echo "- Code is ready for merge"