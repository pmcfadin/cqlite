name: CLI Testing

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'cqlite-cli/**'
      - '.github/workflows/cli-testing.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'cqlite-cli/**'
      - '.github/workflows/cli-testing.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test CLI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta]
        exclude:
          # Reduce CI load by excluding some combinations
          - os: windows-latest
            rust: beta
          - os: macos-latest
            rust: beta
    
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache Cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt --all -- --check
      working-directory: cqlite-cli

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
      working-directory: cqlite-cli

    - name: Build CLI
      run: cargo build --verbose
      working-directory: cqlite-cli

    - name: Run unit tests
      run: cargo test --lib --verbose
      working-directory: cqlite-cli

    - name: Run integration tests
      run: cargo test --test integration --verbose
      working-directory: cqlite-cli

    - name: Run CLI smoke tests
      run: |
        cargo build --release
        ./target/release/cqlite --version
        ./target/release/cqlite --help
      working-directory: cqlite-cli

  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ubuntu-latest-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build CLI for performance testing
      run: cargo build --release
      working-directory: cqlite-cli

    - name: Run performance benchmarks  
      run: cargo test --release test_cli_performance_benchmarks --verbose
      working-directory: cqlite-cli

    - name: Run load tests
      run: cargo test --release test_load_testing --verbose
      working-directory: cqlite-cli

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run security audit
      run: cargo audit
      working-directory: cqlite-cli

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-tarpaulin
      run: cargo install cargo-tarpaulin

    - name: Generate code coverage
      run: cargo tarpaulin --verbose --all-features --workspace --timeout 120 --out xml
      working-directory: cqlite-cli

    - name: Upload to codecov.io
      uses: codecov/codecov-action@v4
      with:
        file: cqlite-cli/cobertura.xml
        fail_ci_if_error: false

  documentation:
    name: Documentation Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Test documentation
      run: cargo doc --no-deps --document-private-items
      working-directory: cqlite-cli

    - name: Test documentation examples
      run: cargo test --doc
      working-directory: cqlite-cli

  compatibility:
    name: CLI Compatibility Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Build CLI
      run: cargo build --release
      working-directory: cqlite-cli

    - name: Test CLI compatibility with different input formats
      run: |
        # Test help output format consistency
        ./target/release/cqlite --help > help_output.txt
        grep -q "CQLite - High-performance embedded database" help_output.txt
        
        # Test version output format
        ./target/release/cqlite --version > version_output.txt
        grep -E "^cqlite [0-9]+\.[0-9]+\.[0-9]+" version_output.txt
        
        # Test error message format
        ./target/release/cqlite invalid_command 2> error_output.txt || true
        grep -q "error:" error_output.txt
      working-directory: cqlite-cli

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [test, compatibility]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Build CLI
      run: cargo build --release
      working-directory: cqlite-cli

    - name: Create test fixtures
      run: |
        mkdir -p test_data
        echo '{"tables": [{"name": "test", "columns": []}]}' > test_data/schema.json
        echo 'dummy sstable content' > test_data/test.sstable
      working-directory: cqlite-cli

    - name: Run E2E workflow tests
      run: |
        # Test complete workflow
        ./target/release/cqlite info test_data/test.sstable || echo "Info command handled missing schema gracefully"
        ./target/release/cqlite read test_data/test.sstable --schema test_data/schema.json --limit 10 || echo "Read command handled test data gracefully"
      working-directory: cqlite-cli

  release-test:
    name: Release Build Test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, performance, security, e2e]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Build optimized release
      run: cargo build --release
      working-directory: cqlite-cli
      env:
        RUSTFLAGS: "-C target-cpu=native"

    - name: Test release binary
      run: |
        ./target/release/cqlite --version
        ./target/release/cqlite --help
        
        # Basic functionality test
        echo "Testing basic CLI functionality in release mode"
        timeout 30s ./target/release/cqlite --help > /dev/null
        
        # Performance check - help should execute quickly
        time timeout 5s ./target/release/cqlite --help > /dev/null
      working-directory: cqlite-cli

    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cqlite-cli-release-${{ github.sha }}
        path: cqlite-cli/target/release/cqlite
        retention-days: 30