name: Coverage Enforcement

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'cqlite-core/src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'cqlite-core/Cargo.toml'
  push:
    branches: [main, develop]
    paths:
      - 'cqlite-core/src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'cqlite-core/Cargo.toml'

env:
  CARGO_TERM_COLOR: always
  COVERAGE_THRESHOLD: 90

jobs:
  coverage:
    name: Coverage Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: coverage-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            coverage-${{ runner.os }}-cargo-

      - name: Check code compilation
        run: |
          echo "🔍 Checking code compilation..."
          cargo check --all-targets --all-features

      - name: Run coverage analysis
        run: |
          echo "📊 Running comprehensive coverage analysis..."
          chmod +x scripts/coverage.sh
          ./scripts/coverage.sh

      - name: Generate coverage report
        run: |
          echo "📝 Generating detailed coverage report..."
          cargo llvm-cov --workspace \
            --html --output-dir target/coverage/html \
            --ignore-filename-regex='(test|spec|bench)' \
            --lcov --output-path target/coverage/lcov.info \
            -- --test-threads=1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: target/coverage/lcov.info
          flags: core-reading
          name: cqlite-core-reading-coverage
          fail_ci_if_error: true

      - name: Archive coverage results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-report
          path: |
            target/coverage/
            !target/coverage/**/*.profraw

      - name: Coverage gate enforcement
        run: |
          echo "🚪 Enforcing coverage gate..."
          
          # Parse coverage percentage from lcov file
          python3 << 'EOF'
          import re
          import sys
          
          def parse_coverage(lcov_file):
              try:
                  with open(lcov_file, 'r') as f:
                      content = f.read()
              except FileNotFoundError:
                  print("❌ Coverage file not found")
                  return None
          
              # Extract coverage data
              lines_hit = 0
              lines_found = 0
              
              for line in content.split('\n'):
                  if line.startswith('LH:'):
                      lines_hit += int(line[3:])
                  elif line.startswith('LF:'):
                      lines_found += int(line[3:])
              
              if lines_found == 0:
                  return None
              
              return (lines_hit / lines_found) * 100
          
          threshold = float("${{ env.COVERAGE_THRESHOLD }}")
          coverage = parse_coverage("target/coverage/lcov.info")
          
          if coverage is None:
              print("❌ Failed to parse coverage data")
              sys.exit(1)
          
          print(f"📊 Overall Coverage: {coverage:.2f}%")
          print(f"🎯 Required Threshold: {threshold:.2f}%")
          
          if coverage >= threshold:
              print(f"✅ Coverage gate passed! ({coverage:.2f}% >= {threshold:.2f}%)")
          else:
              print(f"❌ Coverage gate failed! ({coverage:.2f}% < {threshold:.2f}%)")
              print("📝 Please add tests to improve coverage of core reading modules")
              sys.exit(1)
          EOF

      - name: Comment PR with coverage results
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            try {
              // Read coverage results
              const coverageFile = 'target/coverage/lcov.info';
              if (!fs.existsSync(coverageFile)) {
                console.log('Coverage file not found');
                return;
              }
              
              const content = fs.readFileSync(coverageFile, 'utf8');
              
              // Parse coverage
              let linesHit = 0;
              let linesFound = 0;
              
              content.split('\n').forEach(line => {
                if (line.startsWith('LH:')) {
                  linesHit += parseInt(line.substring(3));
                } else if (line.startsWith('LF:')) {
                  linesFound += parseInt(line.substring(3));
                }
              });
              
              const coverage = linesFound > 0 ? (linesHit / linesFound) * 100 : 0;
              const threshold = parseFloat(process.env.COVERAGE_THRESHOLD);
              const passed = coverage >= threshold;
              
              const statusIcon = passed ? '✅' : '❌';
              const statusText = passed ? 'PASSED' : 'FAILED';
              
              const comment = `## ${statusIcon} Coverage Report
              
              | Metric | Value |
              |--------|-------|
              | **Overall Coverage** | ${coverage.toFixed(2)}% |
              | **Required Threshold** | ${threshold}% |
              | **Lines Covered** | ${linesHit}/${linesFound} |
              | **Status** | ${statusText} |
              
              ### Core Reading Modules Coverage
              
              This PR ${passed ? 'meets' : 'does not meet'} the required ${threshold}% coverage threshold for core reading functionality.
              
              ${passed ? 
                '🎉 Great job! The coverage gate has passed.' : 
                '📝 Please add tests for uncovered code paths in the core reading modules.'
              }
              
              <details>
              <summary>View detailed coverage report</summary>
              
              The detailed HTML coverage report is available in the CI artifacts.
              Focus on these core modules:
              - \`cqlite-core/src/storage/sstable/\`
              - \`cqlite-core/src/parser/\`
              - \`cqlite-core/src/schema/\`
              
              </details>`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
              
            } catch (error) {
              console.log('Error generating coverage comment:', error);
            }

  property-testing:
    name: Property-Based Testing
    runs-on: ubuntu-latest
    needs: coverage
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: proptest-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run property-based tests
        run: |
          echo "🎲 Running property-based tests for edge cases..."
          cargo test --release property_ -- --nocapture --test-threads=1
          
      - name: Run stress tests
        run: |
          echo "💪 Running stress tests for core reading modules..."
          cargo test --release stress_ -- --nocapture --test-threads=1

      - name: Verify deterministic tests
        run: |
          echo "🔄 Verifying test determinism..."
          for i in {1..5}; do
            echo "Run $i/5..."
            cargo test --workspace -- --test-threads=1 --nocapture
          done
          echo "✅ All test runs completed successfully - tests are deterministic"