name: Flight ↔ Trino E2E

# Full integration test of BOTH sides: builds the Java connector plugin and the
# cqlite-flight Rust image, brings up Cassandra + Sidecar + cqlite-flight + Trino
# via docker compose, loads data, flushes to SSTables, and asserts query results
# through the connector (incl. SSTable-vs-memtable semantics).

on:
  schedule:
    # Nightly full Flight/Trino Docker E2E at 04:35 UTC
    - cron: '35 4 * * *'
  release:
    types: [published]
  push:
    branches: [ main ]
    paths:
      - 'cqlite-flight/**'
      - 'cqlite-core/**'
      - 'trino-connector/**'
      - '.github/workflows/flight-trino-e2e.yml'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths:
      - 'cqlite-flight/**'
      - 'cqlite-core/**'
      - 'trino-connector/**'
      - '.github/workflows/flight-trino-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flight-trino-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tier-summary:
    name: E2E tier summary
    runs-on: ubuntu-latest
    env:
      RUN_FULL: >-
        ${{
          github.event_name != 'pull_request' ||
          contains(github.event.pull_request.labels.*.name, 'ci:flight-full') ||
          contains(github.event.pull_request.labels.*.name, 'ci:trino-full')
        }}
    steps:
      - name: Write CI tier summary
        run: |
          {
            echo "## Flight ↔ Trino E2E tier"
            echo ""
            echo "- Docker compose E2E is a full-tier workflow."
            echo "- Ordinary PRs skip the Docker stack by default."
            echo "- PRs can opt in with \`ci:flight-full\` or \`ci:trino-full\`."
            echo "- Full E2E also runs on push to main, nightly schedule, workflow_dispatch, and release publication."
            echo "- Current full-tier decision: ${RUN_FULL}."
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: docker-compose integration
    needs: tier-summary
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'ci:flight-full') ||
        contains(github.event.pull_request.labels.*.name, 'ci:trino-full')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The Rust image build + Cassandra/Sidecar/Trino images need headroom.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Setup JDK 21 (for the connector plugin build inside the script)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: trino-connector/*.gradle.kts

      - name: Run end-to-end integration test
        run: ./trino-connector/docker/e2e-test.sh

      - name: Dump container logs on failure
        if: failure()
        run: |
          cd trino-connector/docker
          docker compose logs --tail 200 || true
