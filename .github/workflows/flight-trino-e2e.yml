name: Flight ↔ Trino E2E

# Full integration test of BOTH sides: builds the Java connector plugin and the
# cqlite-flight Rust image, brings up Cassandra + Sidecar + cqlite-flight + Trino
# via docker compose, loads data, flushes to SSTables, and asserts query results
# through the connector (incl. SSTable-vs-memtable semantics).

on:
  schedule:
    # Nightly full Flight/Trino Docker E2E at 04:35 UTC
    - cron: '35 4 * * *'
  release:
    types: [published]
  push:
    branches: [ main ]
    paths:
      - 'cqlite-flight/**'
      - 'cqlite-core/**'
      - 'trino-connector/**'
      - '.github/workflows/flight-trino-e2e.yml'
  pull_request:
    branches: [ main ]
    # `labeled` (#2869): the fat-flavor job `e2e-fat` is full-tier only and opts in
    # via the `ci:trino-full` label. Without this type, applying that label to an
    # ALREADY-OPEN PR would never re-trigger the workflow, so the opt-in would
    # silently do nothing until the next push. Allowed here because this workflow has
    # path filters, so the extra event type cannot broaden it beyond that surface.
    #
    # `unlabeled` is deliberately NOT here: removing a label never needs to START a
    # run, so subscribing to it would buy nothing.
    #
    # Subscribing to `labeled` at all costs TWO guards, both below, because a label
    # mutation changes no byte of the diff and must therefore neither kill nor repeat
    # the ~40 min Cassandra + Sidecar + cqlite-flight + Trino stack:
    #   * `concurrency.cancel-in-progress` excludes label events, so a label cannot
    #     CANCEL an in-flight run (that decision is made at the RUN level, before any
    #     job `if:` is evaluated, so a job gate alone cannot prevent it);
    #   * `e2e`'s `if:` excludes label events, so a label cannot START a redundant
    #     copy of it.
    # Neither is hypothetical: this repo applies `status:*` read-mirror labels
    # PROGRAMMATICALLY at every stage transition, so its own labelling habits would
    # trigger this routinely.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    # Targeted path filter (#2358): the docker-compose E2E runs automatically on
    # PRs touching the Flight/Trino integration surface or the core storage
    # read path that feeds it — the exact surface whose regression (#2352,
    # warm handles #2310) was structurally uncatchable pre-merge. Kept narrow so
    # unrelated PRs (docs, other core modules) never spin up the Docker stack.
    paths:
      - 'cqlite-flight/**'
      - 'trino-connector/**'
      - 'cqlite-core/src/storage/**'
      - '.github/workflows/flight-trino-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flight-trino-e2e-${{ github.ref }}
  # A new head sha obsoletes the in-flight run, so cancel it. A LABEL mutation
  # changes no byte of the diff, so it must NOT (#2869): this workflow now
  # subscribes to `labeled` so `ci:trino-full` can opt an already-open PR into
  # `e2e-fat`, and cancellation is decided at the RUN level BEFORE any job `if:` is
  # evaluated — so without this clause a label event would kill an in-flight ~40 min
  # Cassandra + Sidecar + cqlite-flight + Trino stack no matter how `e2e` is gated.
  # This repo applies `status:*` read-mirror labels PROGRAMMATICALLY at every stage
  # transition, so that would fire routinely. Label runs now coexist with the
  # in-flight run and skip `e2e` entirely (see its `if:`). Same idiom as
  # flight-ci.yml and pr-gate.yml; `unlabeled` is kept in the predicate defensively
  # even though it is not in `types`, so a future types change cannot silently
  # restore the cancel.
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
    && github.event.action != 'labeled'
    && github.event.action != 'unlabeled' }}

jobs:
  tier-summary:
    name: E2E tier summary
    runs-on: ubuntu-latest
    steps:
      - name: Write CI tier summary
        run: |
          {
            echo "## Flight ↔ Trino E2E tier"
            echo ""
            echo "- Docker compose E2E is a full-tier workflow."
            echo "- On PRs it runs automatically when the diff touches the integration surface:"
            echo "  \`cqlite-flight/**\`, \`trino-connector/**\`, or \`cqlite-core/src/storage/**\` (#2358)."
            echo "- Unrelated PRs (docs, other core modules) do not trigger the Docker stack."
            echo "- Full E2E also runs on push to main, nightly schedule, workflow_dispatch, and release publication."
            echo "- The \`e2e\` job uses the multi-jar plugin flavor (50 jars) — the default, unchanged."
            echo "- The \`e2e-fat\` job (#2869) runs the SAME E2E against the single shaded fat jar and is FULL TIER ONLY:"
            echo "  nightly, push to main, workflow_dispatch, release publication, or a PR labeled \`ci:trino-full\`."
            echo "  It is the only proof that Trino loads the one shaded jar and returns rows."
            echo "- Need it on a PR outside the path filter? Trigger it manually via workflow_dispatch."
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: docker-compose integration
    needs: tier-summary
    # No opt-in LABEL gate: any event that reaches this workflow warrants the E2E.
    # On pull_request the on.paths filter above already restricts triggering to
    # the integration surface, so the job runs as a required-visible check for
    # exactly those PRs (#2358).
    #
    # The one exclusion (#2869): label events. `labeled` was added to
    # on.pull_request.types so `ci:trino-full` can opt an already-open PR into
    # `e2e-fat`; that is `e2e-fat`'s trigger, never this job's. A label mutation
    # changes no byte of the diff, so re-running this ~40 min Cassandra + Sidecar +
    # cqlite-flight + Trino stack on one would be pure waste — and it would fire on
    # every `status:*` read-mirror label this repo applies programmatically at each
    # stage transition. The companion half is `concurrency.cancel-in-progress` above,
    # which keeps a label run from CANCELLING an in-flight one; this `if:` keeps the
    # label run from starting a redundant one. Same two-part shape as pr-gate.yml.
    # This job's real triggers (open/synchronize/reopen/ready_for_review, push,
    # schedule, dispatch, release) are unaffected: on those events
    # `github.event.action` is never 'labeled'/'unlabeled'.
    if: >-
      ${{ github.event.action != 'labeled'
      && github.event.action != 'unlabeled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The Rust image build + Cassandra/Sidecar/Trino images need headroom.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Setup JDK 21 (for the connector plugin build inside the script)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          # `**` so the key covers gradle/fatjar-oracles.gradle.kts too — a single `*`
          # does not cross `/`, which left that file outside the cache key (#2869).
          cache-dependency-path: trino-connector/**/*.gradle.kts

      - name: Run end-to-end integration test
        run: ./trino-connector/docker/e2e-test.sh

      - name: Dump container logs on failure
        if: failure()
        run: |
          cd trino-connector/docker
          docker compose logs --tail 200 || true

  e2e-fat:
    name: docker-compose integration (fat plugin flavor)
    needs: tier-summary
    # FULL TIER ONLY. This doubles a Cassandra-class E2E (Cassandra + Sidecar +
    # cqlite-flight + Trino, twice), so unlike `e2e` above it does NOT run on every
    # path-matching PR: it runs on nightly schedule, push to main, workflow_dispatch,
    # release publication, or a PR explicitly labeled `ci:trino-full`. Same tier
    # expression trino-connector-ci.yml uses for its own full tier.
    #
    # What it proves, and nothing else does (#2869): that Trino LOADS the single
    # shaded fat jar as a plugin and returns rows. `verifyFatJar` in
    # trino-connector-ci.yml asserts the jar's CONTENTS (complete, service-merged,
    # version-pinned); only a live Trino can show the bundled, UNRELOCATED tree
    # actually resolves under the plugin classloader. Nothing is relocated by
    # design — see the NO RELOCATION rationale on `tasks.shadowJar` in
    # build.gradle.kts — so this job is what demonstrates that Trino's child-first
    # plugin classloader really does isolate the bundled copies from the engine's.
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'ci:trino-full')
      }}
    runs-on: ubuntu-latest
    # Mandatory: this job is new, so it is not in the workflow validator's legacy
    # timeout-migration exemption table (and must never be added to it).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # The Rust image build + Cassandra/Sidecar/Trino images need headroom.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Setup JDK 21 (for the connector plugin build inside the script)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          # `**` so the key covers gradle/fatjar-oracles.gradle.kts too — a single `*`
          # does not cross `/`, which left that file outside the cache key (#2869).
          cache-dependency-path: trino-connector/**/*.gradle.kts

      - name: Run end-to-end integration test (fat plugin flavor)
        # --plugin-flavor=fat mounts build/plugin-fat/cqlite_flight (exactly ONE
        # shaded jar) instead of the 50-jar build/plugin/cqlite_flight tree. The
        # default remains `multi`, which the `e2e` job above keeps exercising.
        run: ./trino-connector/docker/e2e-test.sh --plugin-flavor=fat

      - name: Dump container logs on failure
        if: failure()
        run: |
          cd trino-connector/docker
          docker compose logs --tail 200 || true
