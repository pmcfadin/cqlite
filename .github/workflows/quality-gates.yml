name: "CI: Quality Gates Coordination"

on:
  schedule:
    # Nightly deep validation coordination at 02:05 UTC.
    - cron: '5 2 * * *'
  workflow_dispatch:
    inputs:
      gate_mode:
        description: "Quality gate mode"
        required: false
        default: "essential"
        type: choice
        options:
          - "essential"
          - "full"
          - "fast"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  essential-validations:
    name: Essential Validations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0  # pinned to rust-toolchain.toml (issue #1990)
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: quality-gates-${{ hashFiles('**/Cargo.lock') }}
          cache-on-failure: true

      - name: Validate Cargo.toml quality metadata
        run: |
          set -euo pipefail
          echo "Validating quality gate configuration in Cargo.toml..."

          if ! grep -q "\[package.metadata.coverage\]" Cargo.toml; then
            echo "Missing coverage configuration in Cargo.toml"
            exit 1
          fi

          if ! grep -q "\[package.metadata.performance\]" Cargo.toml; then
            echo "Missing performance configuration in Cargo.toml"
            exit 1
          fi

          COVERAGE_THRESHOLD=$(grep "minimum-coverage" Cargo.toml | cut -d'=' -f2 | tr -d ' ')
          if [ "$COVERAGE_THRESHOLD" != "90" ]; then
            echo "Coverage threshold should be 90, found: $COVERAGE_THRESHOLD"
            exit 1
          fi

          PERF_THRESHOLD=$(grep "max-regression" Cargo.toml | cut -d'=' -f2 | tr -d ' ')
          if [ "$PERF_THRESHOLD" != "0.1" ]; then
            echo "Performance regression threshold should be 0.1, found: $PERF_THRESHOLD"
            exit 1
          fi

          echo "Quality gate metadata validated"
          echo "Coverage threshold: $COVERAGE_THRESHOLD%"
          echo "Performance regression threshold: $PERF_THRESHOLD"

      - name: Quick build verification
        run: cargo check --package cqlite-core --all-features

      - name: Code formatting check
        run: cargo fmt --all -- --check

      - name: Clippy hard gate
        run: cargo clippy --package cqlite-core --all-targets --all-features -- -D warnings

  quality-gates-coordinator:
    name: Quality Gates Coordinator
    runs-on: ubuntu-latest
    needs: [essential-validations]
    if: always()

    steps:
      - name: Evaluate quality gates
        run: |
          set -euo pipefail
          echo "Quality Gates Coordination Results"
          echo "=================================="
          echo ""

          ESSENTIAL_STATUS="${{ needs.essential-validations.result }}"

          echo "Individual Gate Results:"
          echo "  Essential Validations: $ESSENTIAL_STATUS"
          echo ""

          if [ "$ESSENTIAL_STATUS" != "success" ]; then
            echo "Essential validations failed"
            exit 1
          fi

          echo "All configured quality gates passed"

      - name: Generate quality gate report
        if: always()
        run: |
          set -euo pipefail
          mkdir -p quality-gate-reports

          cat > quality-gate-reports/summary.md << EOF
          # Quality Gates Report

          **Generated**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Commit**: ${{ github.sha }}
          **Branch**: ${{ github.ref_name }}
          **Mode**: ${{ github.event.inputs.gate_mode || 'essential' }}

          ## Results

          | Gate | Status | Requirement |
          | --- | --- | --- |
          | Essential Validations | ${{ needs.essential-validations.result }} | Cargo metadata, build, fmt, Clippy |

          ## Policy

          See docs/ci/ci-tier-policy.md for the CI tier contract.
          EOF

          {
            echo "## Quality Gates Coordination"
            echo ""
            echo "- Event: ${{ github.event_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Branch: ${{ github.ref_name }}"
            echo "- Mode: ${{ github.event.inputs.gate_mode || 'essential' }}"
            echo "- Essential validations: ${{ needs.essential-validations.result }}"
            echo "- Artifact: quality-gate-report-${{ github.sha }} (retained 45 days)"
            echo ""
            echo "If this nightly run failed, open the artifact above first, then inspect the failing job log."
            echo "Policy: docs/ci/ci-tier-policy.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload quality gate report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: quality-gate-report-${{ github.sha }}
          path: quality-gate-reports/
          retention-days: 45
          if-no-files-found: warn
