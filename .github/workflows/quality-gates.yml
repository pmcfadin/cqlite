name: "CI: Quality Gates Coordination"

on:
  workflow_dispatch:
  # Disabled for M1 milestone - will be re-enabled post-M1
  # push:
  #   branches: [ main, develop ]
  # pull_request:
  #   branches: [ main, develop ]
    inputs:
      gate_mode:
        description: 'Quality gate mode'
        required: false
        default: 'full'
        type: choice
        options:
          - 'full'
          - 'essential'
          - 'fast'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Trigger all quality gate workflows
  trigger-coverage:
    name: Trigger Coverage Gate
    uses: ./.github/workflows/coverage.yml
    with:
      coverage_mode: enforced

  trigger-multi-arch:
    name: Trigger Multi-Architecture Testing
    uses: ./.github/workflows/multi-arch.yml

  trigger-performance:
    name: Trigger Performance Regression Detection
    uses: ./.github/workflows/benchmark.yml
    with:
      benchmark_mode: ${{ github.event.inputs.gate_mode == 'fast' && 'smoke' || 'comprehensive' }}

  # Essential validations (always run)
  essential-validations:
    name: Essential Validations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        key: quality-gates-${{ hashFiles('**/Cargo.lock') }}
        cache-on-failure: true

    - name: Validate Cargo.toml configuration
      run: |
        echo "🔍 Validating quality gate configuration in Cargo.toml..."

        # Check for required metadata sections
        if ! grep -q "\[package.metadata.coverage\]" Cargo.toml; then
          echo "❌ Missing coverage configuration in Cargo.toml"
          exit 1
        fi

        if ! grep -q "\[package.metadata.performance\]" Cargo.toml; then
          echo "❌ Missing performance configuration in Cargo.toml"
          exit 1
        fi

        # Extract and validate coverage threshold
        COVERAGE_THRESHOLD=$(grep "minimum-coverage" Cargo.toml | cut -d'=' -f2 | tr -d ' ')
        if [ "$COVERAGE_THRESHOLD" != "90" ]; then
          echo "❌ Coverage threshold should be 90, found: $COVERAGE_THRESHOLD"
          exit 1
        fi

        # Extract and validate performance regression threshold
        PERF_THRESHOLD=$(grep "max-regression" Cargo.toml | cut -d'=' -f2 | tr -d ' ')
        if [ "$PERF_THRESHOLD" != "0.1" ]; then
          echo "❌ Performance regression threshold should be 0.1, found: $PERF_THRESHOLD"
          exit 1
        fi

        echo "✅ Quality gate configuration validated"
        echo "   Coverage threshold: $COVERAGE_THRESHOLD%"
        echo "   Performance regression threshold: $PERF_THRESHOLD"

    - name: Quick build verification
      run: |
        echo "🔨 Quick build verification..."
        cargo check --package cqlite-core --all-features
        echo "✅ Build verification passed"

    - name: Code formatting check
      run: |
        echo "📝 Checking code formatting..."
        if ! cargo fmt --all -- --check; then
          echo "❌ Code formatting issues found"
          echo "💡 Run: cargo fmt --all"
          exit 1
        fi
        echo "✅ Code formatting check passed"

    - name: Basic clippy validation
      run: |
        echo "🔍 Running clippy validation..."
        cargo clippy --package cqlite-core --all-features --all-targets -- -D warnings
        echo "✅ Clippy validation passed"

  # Quality gates coordination
  quality-gates-coordinator:
    name: Quality Gates Coordinator
    runs-on: ubuntu-latest
    needs: [trigger-coverage, trigger-multi-arch, trigger-performance, essential-validations]
    if: always()

    steps:
    - name: Evaluate all quality gates
      run: |
        echo "🎯 Quality Gates Coordination Results"
        echo "======================================="
        echo ""

        # Check individual gate results
        COVERAGE_STATUS="${{ needs.trigger-coverage.result }}"
        MULTIARCH_STATUS="${{ needs.trigger-multi-arch.result }}"
        PERFORMANCE_STATUS="${{ needs.trigger-performance.result }}"
        ESSENTIAL_STATUS="${{ needs.essential-validations.result }}"

        echo "📊 Individual Gate Results:"
        echo "   Coverage Gate (≥90%):     $COVERAGE_STATUS"
        echo "   Multi-Architecture:       $MULTIARCH_STATUS"
        echo "   Performance Regression:   $PERFORMANCE_STATUS"
        echo "   Essential Validations:    $ESSENTIAL_STATUS"
        echo ""

        # Count failures
        FAILED_GATES=0
        if [ "$COVERAGE_STATUS" != "success" ]; then
          echo "❌ Coverage gate failed - requires ≥90% coverage"
          FAILED_GATES=$((FAILED_GATES + 1))
        fi

        if [ "$MULTIARCH_STATUS" != "success" ]; then
          echo "❌ Multi-architecture testing failed"
          FAILED_GATES=$((FAILED_GATES + 1))
        fi

        if [ "$PERFORMANCE_STATUS" != "success" ]; then
          echo "❌ Performance regression detection failed"
          FAILED_GATES=$((FAILED_GATES + 1))
        fi

        if [ "$ESSENTIAL_STATUS" != "success" ]; then
          echo "❌ Essential validations failed"
          FAILED_GATES=$((FAILED_GATES + 1))
        fi

        echo ""
        echo "📈 Quality Gates Summary:"

        if [ "$FAILED_GATES" -eq 0 ]; then
          echo "🎉 ALL QUALITY GATES PASSED!"
          echo ""
          echo "✅ Phase 2 Requirements Satisfied:"
          echo "   ✅ 90% minimum coverage enforced"
          echo "   ✅ Multi-architecture compatibility verified"
          echo "   ✅ Performance regression protection active"
          echo "   ✅ Code quality standards maintained"
          echo ""
          echo "🚀 This change is ready for integration!"
        else
          echo "❌ $FAILED_GATES quality gate(s) failed"
          echo ""
          echo "🔧 Required Actions:"

          if [ "$COVERAGE_STATUS" != "success" ]; then
            echo "   📊 Increase test coverage to ≥90%"
          fi

          if [ "$MULTIARCH_STATUS" != "success" ]; then
            echo "   🔧 Fix cross-platform compatibility issues"
          fi

          if [ "$PERFORMANCE_STATUS" != "success" ]; then
            echo "   ⚡ Address performance regressions >10%"
          fi

          if [ "$ESSENTIAL_STATUS" != "success" ]; then
            echo "   🛠️ Fix code formatting/quality issues"
          fi

          echo ""
          echo "💡 Review individual workflow results above for details"
          echo "🔄 Re-run workflows after addressing issues"

          exit 1
        fi

    - name: Generate quality gate report
      if: always()
      run: |
        echo "📋 Generating quality gate report..."
        mkdir -p quality-gate-reports

        cat > quality-gate-reports/summary.md << EOF
        # Quality Gates Report

        **Generated**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        **Commit**: ${{ github.sha }}
        **Branch**: ${{ github.ref_name }}
        **Mode**: ${{ github.event.inputs.gate_mode || 'full' }}

        ## Results

        | Gate | Status | Requirement |
        |------|--------|-------------|
        | Coverage | ${{ needs.trigger-coverage.result }} | ≥90% line coverage |
        | Multi-Architecture | ${{ needs.trigger-multi-arch.result }} | All platforms pass |
        | Performance | ${{ needs.trigger-performance.result }} | <10% regression |
        | Essential | ${{ needs.essential-validations.result }} | Format + Quality |

        ## Phase 2 Compliance

        - **Coverage Enforcement**: ✅ Minimum 90% threshold
        - **Cross-Platform**: ✅ Linux, macOS, Windows, WASM
        - **Performance Protection**: ✅ Regression detection active
        - **Quality Standards**: ✅ Format + lint enforcement

        ## Configuration

        Quality gate settings are defined in \`Cargo.toml\`:
        - Coverage minimum: 90%
        - Performance regression threshold: 10%
        - Exclusions: test files, examples, binaries
        EOF

    - name: Upload quality gate report
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: quality-gate-report-${{ github.sha }}
        path: quality-gate-reports/
        retention-days: 30

  # Store results for coordination hooks
  store-coordination-results:
    name: Store Coordination Results
    runs-on: ubuntu-latest
    needs: [quality-gates-coordinator]
    if: always()

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Store quality gate results
      run: |
        echo "📊 Quality Gates Coordination completed"
        echo "Status: ${{ needs.quality-gates-coordinator.result }}"
        echo "Mode: ${{ github.event.inputs.gate_mode || 'full' }}"
        echo "Commit: ${{ github.sha }}"
        echo ""
        echo "🔄 Results stored for coordination with Claude-Flow hooks"