name: cqlite-flight image

# Build and publish the cqlite-flight Arrow Flight (gRPC) server container to
# GHCR. Runs automatically on every v* release tag, and on demand via the
# "Run workflow" button (workflow_dispatch) two ways:
#   - `version` (e.g. 0.13.1, no leading v): builds from the dispatched ref and
#     pushes the SAME tag set a `v0.13.1` tag push would (vX.Y.Z + vX.Y) — use
#     this to backfill/republish a release image when the tag-push run didn't
#     produce one (issue #2117). `latest` is NOT moved unless `move_latest` is
#     also set — a dispatch can build from an arbitrary ref, so silently
#     retargeting the floating `latest` pointer would be surprising.
#   - `image_tag` (e.g. dev, 0.13.0-rc1): a free-form one-off tag, unrelated to
#     any release version. Ignored when `version` is set.
#
# Canonical tag scheme (issue #2117): every version tag this workflow emits is
# v-prefixed (vX.Y.Z, vX.Y), matching this repo's own git tag convention
# (v0.10.0, v0.11.0, ...). Older bare tags (0.13.0, 0.13) published before this
# was normalized are left in place on GHCR (not deleted) but are not part of
# the contract going forward — see cqlite-flight/README.md.
#
# The image exposes the Flight gRPC listener on :8815 and reads SSTables from a
# directory mounted at runtime (--data-dir). The Trino connector is released
# separately (it ships as a Trino plugin, not in this image).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (no leading v), e.g. 0.13.1 — mirrors a vX.Y.Z tag push (emits vX.Y.Z + vX.Y). Leave blank to use `image_tag` instead.'
        type: string
        required: false
      move_latest:
        description: 'Also move the `latest` tag to this build (only applies when `version` is set)'
        type: boolean
        default: false
      image_tag:
        description: 'One-off custom tag, used only when `version` is blank (e.g. dev, 0.13.0-rc1)'
        required: true
        default: 'dev'

env:
  CARGO_TERM_COLOR: always
  # GHCR repo. Must be lowercase; `pmcfadin` already is.
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/cqlite-flight

jobs:
  # Build per architecture on a NATIVE runner (amd64 on ubuntu-latest, arm64 on
  # ubuntu-24.04-arm) and push each by digest. Native runners avoid
  # QEMU-emulated Rust compiles, which are slow and prone to OOM. The multi-arch
  # manifest is assembled in the `merge` job below.
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
    - name: Prepare platform tag
      run: |
        platform="${{ matrix.platform }}"
        echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

    - uses: actions/checkout@v5

    - name: Docker metadata (labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY_IMAGE }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: cqlite-flight/Dockerfile
        platforms: ${{ matrix.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

    - name: Export digest
      run: |
        mkdir -p "${{ runner.temp }}/digests"
        digest="${{ steps.build.outputs.digest }}"
        touch "${{ runner.temp }}/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v4
      with:
        name: digests-${{ env.PLATFORM_PAIR }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  # Assemble the per-arch digests into one multi-arch manifest list and apply
  # the human tags. On a v* tag: vX.Y.Z, vX.Y, and `latest` (non-prerelease).
  # On a manual `version` dispatch: the SAME vX.Y.Z + vX.Y set (`latest` only
  # if `move_latest` is also set). On a manual `image_tag`-only dispatch (no
  # `version`): just that one custom tag, unchanged from before.
  merge:
    name: Publish multi-arch image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    outputs:
      # Primary tag the smoke job pulls (the dispatch input on a manual run, or
      # the release version on a v* tag). docker/metadata-action sets `version`
      # from the highest-priority tag — the same value the Inspect step uses.
      version: ${{ steps.meta.outputs.version }}
    steps:
    - name: Download digests
      uses: actions/download-artifact@v4
      with:
        path: ${{ runner.temp }}/digests
        pattern: digests-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Resolve a single (version, major_minor, move_latest) triple for BOTH
    # trigger types, so the tags step below has one uniform source of truth
    # instead of duplicating semver-vs-raw logic per event. A tag push derives
    # the version from the git ref; a manual dispatch derives it from the
    # `version` input (blank means "use `image_tag` instead", the legacy
    # one-off path). Inputs are read via env vars, never interpolated inline
    # into the script, per this repo's command-injection guard (see
    # trino-publish.yml's Resolve version step, which this mirrors).
    - name: Resolve version and latest-move decision
      id: version
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_MOVE_LATEST: ${{ inputs.move_latest }}
      run: |
        set -euo pipefail
        if [ "$EVENT_NAME" = "push" ]; then
          resolved="${REF_NAME#v}"
        else
          resolved="${INPUT_VERSION#v}"
        fi

        if [ -z "$resolved" ]; then
          # workflow_dispatch with no `version` input: the legacy one-off
          # `image_tag`-only path. No version/latest tags here — the raw
          # `image_tag` tag below covers it.
          {
            echo "resolved="
            echo "major_minor="
            echo "move_latest=false"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Strict allowlist mirrors trino-publish.yml's Resolve version step:
        # semver core with an optional pre-release suffix (e.g. 0.13.1,
        # 0.13.1-rc1). Reject anything else so a crafted `version` input can't
        # inject into the raw tag values computed below.
        if ! printf '%s' "$resolved" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
          echo "::error::Refusing to publish: version '$resolved' is not a valid release version (expected ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$)"
          exit 1
        fi

        major_minor="$(printf '%s' "$resolved" | cut -d. -f1,2)"

        move_latest=false
        if [ "$EVENT_NAME" = "push" ]; then
          # Tag push: move `latest` for a stable release only (no `-`
          # prerelease suffix) — same gate the prior
          # `!contains(github.ref_name, '-')` expression implemented.
          case "$resolved" in
            *-*) move_latest=false ;;
            *) move_latest=true ;;
          esac
        elif [ "$INPUT_MOVE_LATEST" = "true" ]; then
          # Manual dispatch: never move `latest` unless explicitly requested —
          # a dispatch can build from an arbitrary ref, so silently retargeting
          # the floating `latest` pointer from an ad-hoc run would be
          # surprising.
          move_latest=true
        fi

        {
          echo "resolved=$resolved"
          echo "major_minor=$major_minor"
          echo "move_latest=$move_latest"
        } >> "$GITHUB_OUTPUT"

    - name: Docker metadata (tags)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY_IMAGE }}
        tags: |
          type=raw,value=v${{ steps.version.outputs.resolved }},enable=${{ steps.version.outputs.resolved != '' }},priority=900
          type=raw,value=v${{ steps.version.outputs.major_minor }},enable=${{ steps.version.outputs.resolved != '' }},priority=800
          type=raw,value=latest,enable=${{ steps.version.outputs.move_latest == 'true' }},priority=700
          type=raw,value=${{ github.event.inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && steps.version.outputs.resolved == '' }},priority=600

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create manifest list and push
      working-directory: ${{ runner.temp }}/digests
      run: |
        docker buildx imagetools create \
          $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

    - name: Inspect image
      run: |
        docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}

  # Prove the published image is pullable and actually serves Flight on :8815 on
  # EACH architecture, natively (amd64 on ubuntu-latest, arm64 on
  # ubuntu-24.04-arm). A pulled image that cannot run, or that never binds :8815,
  # fails the run instead of shipping silently — the wiring-evidence for #1145's
  # acceptance ("pull works" + "the image runs and listens on :8815"). We pull
  # the just-published tag, run the container against a throwaway empty data dir,
  # and poll a TCP connect to :8815; we deliberately do NOT do a full do_get
  # round-trip here (that needs a mounted SSTable fixture and is covered by
  # `cargo test -p cqlite-flight`) — port readiness is the low-flake signal that
  # the entrypoint launched and bound the listener.
  smoke:
    name: Smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: merge
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Resolve the published tag
      id: tag
      run: |
        set -euo pipefail
        version="${{ needs.merge.outputs.version }}"
        # The merge job normally resolves a tag (a v* release version, or the
        # `image_tag` dispatch input — required, defaulting to `dev` in the UI,
        # though a programmatic dispatch can still send it empty). Guard rather
        # than assume: an empty value means something upstream broke, so fail
        # clearly instead of issuing `docker pull <image>:` with a dangling ref.
        if [ -z "$version" ]; then
          echo "::error::merge job resolved no published tag (empty version) — cannot smoke-test the image"
          exit 1
        fi
        echo "ref=${{ env.REGISTRY_IMAGE }}:${version}" >> "$GITHUB_OUTPUT"

    - name: Pull published image
      run: docker pull "${{ steps.tag.outputs.ref }}"

    - name: Run container and assert it serves :8815
      run: |
        set -euo pipefail
        data="$RUNNER_TEMP/flight-data"
        mkdir -p "$data"
        # Read-only data mount is intentional and matches production use: the
        # Flight server only reads/merges SSTables and never writes to its data
        # dir, so :ro is the correct, safe mount (see cqlite-flight/README.md).
        cid=$(docker run -d -p 8815:8815 \
          -v "$data":/data:ro \
          "${{ steps.tag.outputs.ref }}" \
          --data-dir /data --listen 0.0.0.0:8815)
        # Always surface logs + clean up, whether we pass, fail, or error out.
        trap 'echo "--- container logs ---"; docker logs "$cid" 2>&1 || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
        # Poll the listener with an explicit socket connect (python3 is always
        # present on GitHub ubuntu runners) rather than a bash /dev/tcp redirect.
        for i in $(seq 1 30); do
          if python3 -c "import socket,sys; s=socket.socket(); s.settimeout(2); sys.exit(0 if s.connect_ex(('127.0.0.1',8815))==0 else 1)"; then
            echo "cqlite-flight is accepting connections on :8815 (after ${i}s) on ${{ matrix.platform }}"
            exit 0
          fi
          # Bail early with a clear message if the container died before binding.
          if [ "$(docker inspect -f '{{.State.Running}}' "$cid" 2>/dev/null)" != "true" ]; then
            echo "::error::container exited before binding :8815 on ${{ matrix.platform }}"
            exit 1
          fi
          sleep 1
        done
        echo "::error::cqlite-flight did not accept a connection on :8815 within 30s on ${{ matrix.platform }}"
        exit 1
