name: Python CI

on:
  push:
    branches: [main]
    paths:
      - 'bindings/python/**'
      - 'cqlite-core/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bindings/python/**'
      - 'cqlite-core/**'
      - '.github/workflows/python-ci.yml'

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  DATASET_TAG: datasets-v3
  DATASET_ASSET: cassandra5-small-full-v3.2.tar.gz
  DATASET_SHA256: bebc763752c8d68c7fb0483a1b31294b4d1d21343d3f7d124da069e5073202fa

jobs:
  build-only-wheels:
    name: Build wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          # Cross-compiled wheels that cannot run the native pytest suite.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: macos-14
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Issue #1209: GitHub runner images ship a stable toolchain that already
      # provides bin/cargo-clippy. The dtolnay/rust-toolchain@stable action is
      # invoked with `targets:`, so it performs a rustup reconcile that can
      # intermittently try to (re)install the 'clippy-preview' component and
      # fail with "detected conflict: 'bin/cargo-clippy'". Remove the conflicting
      # component FIRST — before the toolchain action runs any rustup work — so
      # the @stable setup (which defaults to the minimal profile, no clippy)
      # cannot reinstall clippy-preview. The runner ships a working rustup, so
      # this `run:` step before the action has rustup available.
      # This wheel build does not run clippy. Idempotent: a no-op if clippy is absent.
      - name: Remove preinstalled clippy (avoid clippy-preview install conflict)
        shell: bash
        run: rustup component remove clippy 2>/dev/null || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Normalize PATH for macOS (prepend ~/.cargo/bin so real cargo wins over rustup-init)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify Rust toolchain (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          which -a cargo rustup rustup-init || true
          cargo --version
          rustup --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "bindings/python -> target"
          key: ${{ matrix.os }}-${{ matrix.target }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: bindings/python
          manylinux: ${{ matrix.manylinux || 'auto' }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          retention-days: 7

  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        include:
          # Native test platforms only
          # Note: x86_64-apple-darwin is build-only (cross-compiled on ARM64, can't test)
          # Note: aarch64-unknown-linux-gnu is build-only (cross-compiled, can't test)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            python: "3.12"
            manylinux: "2_28"
          - os: macos-14
            target: aarch64-apple-darwin
            python: "3.12"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Issue #1209: GitHub runner images ship a stable toolchain that already
      # provides bin/cargo-clippy. The dtolnay/rust-toolchain@stable action is
      # invoked with `targets:`, so it performs a rustup reconcile that can
      # intermittently try to (re)install the 'clippy-preview' component and
      # fail with "detected conflict: 'bin/cargo-clippy'". Remove the conflicting
      # component FIRST — before the toolchain action runs any rustup work — so
      # the @stable setup (which defaults to the minimal profile, no clippy)
      # cannot reinstall clippy-preview. The runner ships a working rustup, so
      # this `run:` step before the action has rustup available.
      # This native build/test job does not run clippy. Idempotent: a no-op if clippy is absent.
      - name: Remove preinstalled clippy (avoid clippy-preview install conflict)
        shell: bash
        run: rustup component remove clippy 2>/dev/null || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Normalize PATH for macOS (prepend ~/.cargo/bin so real cargo wins over rustup-init)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify Rust toolchain (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          which -a cargo rustup rustup-init || true
          cargo --version
          rustup --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "bindings/python -> target"
          key: ${{ matrix.os }}-${{ matrix.target }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: bindings/python
          manylinux: ${{ matrix.manylinux || 'auto' }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          retention-days: 7

      # Build the CLI once while the native wheel job's Rust target cache is
      # still hot. Pytest's fixture finds this binary and skips its own rebuild.
      # The Python parity tests do not exercise the full-screen TUI, so keep
      # this build on the lighter cli-helpers feature set.
      - name: Build CLI binary for tests
        shell: bash
        run: cargo build --package cqlite-cli --release --no-default-features --features cli-helpers

      - name: Install wheel and test dependencies
        shell: bash
        run: |
          pip install pytest>=7.0
          pip install bindings/python/dist/*.whl

      - name: Restore dataset cache
        id: dataset-cache
        uses: actions/cache@v5
        with:
          path: test-data/datasets
          key: datasets-${{ env.DATASET_TAG }}-${{ env.DATASET_SHA256 }}

      - name: Fetch datasets if cache miss (Unix)
        if: steps.dataset-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p test-data/datasets
          curl -fsSL -o /tmp/${DATASET_ASSET} \
            https://github.com/pmcfadin/cqlite/releases/download/${DATASET_TAG}/${DATASET_ASSET}
          echo "${DATASET_SHA256}  /tmp/${DATASET_ASSET}" | sha256sum -c -
          tar -xzf /tmp/${DATASET_ASSET} -C . --exclude='*/._*' --exclude='._*' --exclude='*/.DS_Store' --exclude='.DS_Store'

      - name: Fetch datasets if cache miss (Windows)
        if: steps.dataset-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-data/datasets
          $url = "https://github.com/pmcfadin/cqlite/releases/download/$env:DATASET_TAG/$env:DATASET_ASSET"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\$env:DATASET_ASSET"
          # Verify SHA256
          $hash = (Get-FileHash "$env:TEMP\$env:DATASET_ASSET" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:DATASET_SHA256) {
            throw "SHA256 mismatch: expected $env:DATASET_SHA256, got $hash"
          }
          tar -xzf "$env:TEMP\$env:DATASET_ASSET" -C . --exclude='*/._*' --exclude='._*' --exclude='*/.DS_Store' --exclude='.DS_Store'

      - name: Sanity check dataset
        shell: bash
        run: |
          set -euo pipefail
          test -f test-data/datasets/metadata.yml
          # Issue #1230: assert the full 39-table enforced corpus (33 nb + 6
          # test_oa), not just test_basic, so a partial extraction reds CI
          # instead of skip-greening the pytest lane.
          bash test-data/scripts/check-dataset-manifest.sh test-data/datasets

      - name: Run pytest
        env:
          CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
          RUN_SLOW_TESTS: "1"  # Issue #331: Run all tests including CLI parity
          # Issue #1230: fail-closed. With this flag the conftest skip helper turns
          # a missing dataset into a FAILURE (not a silent skip). What catches a
          # dropped/renamed table or a #773-class path regression is the
          # check-dataset-manifest.sh step above (full 39-table corpus) plus that
          # strict skip-helper failure. The pytest_sessionfinish "no tests ran"
          # floor is only a whole-session no-op guard (it reds when 0 tests pass
          # at all); it does NOT detect dataset tests skipping while non-dataset
          # tests still pass.
          CQLITE_REQUIRE_FIXTURES: "1"
        shell: bash
        run: |
          pytest bindings/python/tests/ -v --tb=short

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-results-${{ matrix.os }}
          path: |
            bindings/python/.pytest_cache/
          retention-days: 7

  quality-gate:
    name: Python CI Quality Gate
    runs-on: ubuntu-latest
    needs: [build-only-wheels, test]
    if: always()

    steps:
      - name: Check build-only wheel results
        run: |
          echo "Build-only wheel results: ${{ needs.build-only-wheels.result }}"
          if [ "${{ needs.build-only-wheels.result }}" != "success" ]; then
            echo "::error::Build-only wheel builds failed"
            exit 1
          fi

      - name: Check native build/test results
        run: |
          echo "Native build/test results: ${{ needs.test.result }}"
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Native build/test failed on one or more platforms"
            exit 1
          fi

      - name: Download all wheels
        uses: actions/download-artifact@v7
        with:
          pattern: wheel-*
          path: wheels
          merge-multiple: true

      - name: List wheel artifacts
        run: |
          echo "::group::Built wheels"
          ls -lh wheels/
          echo "::endgroup::"

          WHEEL_COUNT=$(ls wheels/*.whl 2>/dev/null | wc -l)
          echo "Wheel count: $WHEEL_COUNT"

          # Verify at least 5 wheels (one per target, plus optional PyPy wheels)
          if [ "$WHEEL_COUNT" -lt 5 ]; then
            echo "::error::Expected at least 5 wheels, found $WHEEL_COUNT"
            exit 1
          fi

      - name: Upload merged wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: cqlite-wheels
          path: wheels/*.whl
          retention-days: 30

      - name: Summary
        run: |
          echo "## Python CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Wheel Builds" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| x86_64-unknown-linux-gnu | :white_check_mark: |" >> $GITHUB_STEP_SUMMARY
          echo "| aarch64-unknown-linux-gnu | :white_check_mark: |" >> $GITHUB_STEP_SUMMARY
          echo "| x86_64-apple-darwin | :white_check_mark: |" >> $GITHUB_STEP_SUMMARY
          echo "| aarch64-apple-darwin | :white_check_mark: |" >> $GITHUB_STEP_SUMMARY
          echo "| x86_64-pc-windows-msvc | :white_check_mark: |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Tests passed on 3 native platforms (ARM64 Linux and x86_64 macOS are build-only)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "Download wheels: \`cqlite-wheels\`" >> $GITHUB_STEP_SUMMARY
