name: Python CI

on:
  schedule:
    # Nightly full bindings coverage at 03:35 UTC
    - cron: '35 3 * * *'
  push:
    branches: [main]
    # THE RULE FOR THIS LIST (issue #1455): these are the INPUTS THIS WORKFLOW
    # READS — above all the `cross-binding-parity` job, which compares the
    # Python binding, the NODE binding and the CLI against one canonical form.
    # A change to ANY of them must be able to trigger this workflow. Extending
    # the harness means extending this list in the same edit.
    #
    # It is enumerated in full here because the SAME omission was found THREE
    # times in review — `bindings/node/**` + `cqlite-cli/**`, then
    # `cqlite-ffi-common/**`, then `test-data/schemas/**` — each time as a
    # single missing path rather than as the class. Each entry below says which
    # step reads it, so the next reader can check the list against the job
    # instead of guessing.
    paths:
      # --- the workflow itself -------------------------------------------
      - '.github/workflows/python-ci.yml'
      # The composite action the dataset step USES; a change to it changes how
      # (or whether) the corpus is restored for every dataset-backed job here.
      - '.github/actions/restore-canonical-datasets/**'
      # --- the three surfaces under comparison ----------------------------
      # The wheel under test, and the pytest that IS the comparator.
      - 'bindings/python/**'
      # The shared canonical form + fixtures + drivers (the harness itself).
      - 'bindings/parity/**'
      # The Node native module: one of the three legs, built by `npm run build`.
      - 'bindings/node/**'
      # The release CLI: the third leg, built by `cargo build -p cqlite-cli`.
      - 'cqlite-cli/**'
      # --- what all three legs read through ------------------------------
      - 'cqlite-core/**'
      # BOTH bindings depend on cqlite-ffi-common for the decimal, varint, inet
      # and JSON-number adapters — exactly the conversions this harness
      # compares — and it is easy to miss because neither binding's own
      # directory mentions it.
      - 'cqlite-ffi-common/**'
      # --- committed test inputs -------------------------------------------
      # Every fixture in bindings/parity/fixtures.json names a schema here, and
      # `columns` (the authoritative type source for canonicalization) mirrors
      # it. A schema-only change can alter a parity query's column shape, so
      # without this path the harness runs on the OLD shape or not at all.
      - 'test-data/schemas/**'
      # The dataset steps EXECUTE check-dataset-manifest.sh and (via the
      # composite action) fetch-datasets.sh; a change to either can decide
      # whether the corpus this job compares against is complete.
      - 'test-data/scripts/**'
      # Issue #1459: the ABI-critical dependency versions are inherited from the
      # workspace root, NOT declared in bindings/python — `napi` and `pyo3` are
      # `{ workspace = true }`. So a root manifest/lockfile bump can change the
      # Node-API level or the abi3 floor, which is exactly what the floor jobs
      # below certify. Without these two paths such a bump merges WITHOUT
      # running them, and the floor claim's own premise changes untested.
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    # THE RULE FOR THIS LIST (issue #1455): these are the INPUTS THIS WORKFLOW
    # READS — above all the `cross-binding-parity` job, which compares the
    # Python binding, the NODE binding and the CLI against one canonical form.
    # A change to ANY of them must be able to trigger this workflow. Extending
    # the harness means extending this list in the same edit.
    #
    # It is enumerated in full here because the SAME omission was found THREE
    # times in review — `bindings/node/**` + `cqlite-cli/**`, then
    # `cqlite-ffi-common/**`, then `test-data/schemas/**` — each time as a
    # single missing path rather than as the class. Each entry below says which
    # step reads it, so the next reader can check the list against the job
    # instead of guessing.
    paths:
      # --- the workflow itself -------------------------------------------
      - '.github/workflows/python-ci.yml'
      # The composite action the dataset step USES; a change to it changes how
      # (or whether) the corpus is restored for every dataset-backed job here.
      - '.github/actions/restore-canonical-datasets/**'
      # --- the three surfaces under comparison ----------------------------
      # The wheel under test, and the pytest that IS the comparator.
      - 'bindings/python/**'
      # The shared canonical form + fixtures + drivers (the harness itself).
      - 'bindings/parity/**'
      # The Node native module: one of the three legs, built by `npm run build`.
      - 'bindings/node/**'
      # The release CLI: the third leg, built by `cargo build -p cqlite-cli`.
      - 'cqlite-cli/**'
      # --- what all three legs read through ------------------------------
      - 'cqlite-core/**'
      # BOTH bindings depend on cqlite-ffi-common for the decimal, varint, inet
      # and JSON-number adapters — exactly the conversions this harness
      # compares — and it is easy to miss because neither binding's own
      # directory mentions it.
      - 'cqlite-ffi-common/**'
      # --- committed test inputs -------------------------------------------
      # Every fixture in bindings/parity/fixtures.json names a schema here, and
      # `columns` (the authoritative type source for canonicalization) mirrors
      # it. A schema-only change can alter a parity query's column shape, so
      # without this path the harness runs on the OLD shape or not at all.
      - 'test-data/schemas/**'
      # The dataset steps EXECUTE check-dataset-manifest.sh and (via the
      # composite action) fetch-datasets.sh; a change to either can decide
      # whether the corpus this job compares against is complete.
      - 'test-data/scripts/**'
      # Issue #1459: the ABI-critical dependency versions are inherited from the
      # workspace root, NOT declared in bindings/python — `napi` and `pyo3` are
      # `{ workspace = true }`. So a root manifest/lockfile bump can change the
      # Node-API level or the abi3 floor, which is exactly what the floor jobs
      # below certify. Without these two paths such a bump merges WITHOUT
      # running them, and the floor claim's own premise changes untested.
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  DATASET_TAG: datasets-v3
  DATASET_ASSET: cassandra5-small-full-v3.5.tar.gz
  DATASET_SHA256: 414195074f6df446a7381aad051af84158e9a021a6e2cd21cbc6c3ad0be1ba16

jobs:
  smoke:
    name: PR smoke (Ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1  # pinned to rust-toolchain.toml (issue #1990)

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "bindings/python -> target"
          key: ${{ runner.os }}-smoke

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build local wheel
        uses: PyO3/maturin-action@v1
        with:
          # release-unwind: matches the shipped profile in python-release.yml so
          # CI exercises the exact panic = "unwind" build that PyPI receives —
          # the PyO3 catch_unwind firewall (issue #1440) is active here, catching
          # a panic-strategy regression at PR/CI time instead of at release.
          args: --profile release-unwind --out dist --manylinux off
          working-directory: bindings/python

      - name: Install wheel and smoke dependencies
        shell: bash
        run: |
          python -m pip install 'pytest>=7.0'
          python -m pip install bindings/python/dist/*.whl

      - name: Run smoke pytest subset
        shell: bash
        run: |
          pytest \
            bindings/python/tests/test_basic.py \
            bindings/python/tests/test_config.py \
            bindings/python/tests/test_errors.py \
            bindings/python/tests/test_write_api.py \
            -v --tb=short

      # Issue #1459: the floor jobs below REUSE this wheel instead of building
      # their own. `bindings/python/Cargo.toml` enables pyo3's `abi3-py39`, so a
      # single wheel (cp39-abi3) must install and import on every interpreter
      # `requires-python` claims. Uploading it here — rather than in the
      # label-gated `test` job, the only other producer of a linux x86_64
      # wheel — is what lets the floor legs REBUILD NOTHING.
      #
      # The name MUST stay outside the `wheel-*` namespace. `quality-gate`
      # collects `pattern: wheel-*` with `merge-multiple: true` and republishes
      # the result as the 30-day `cqlite-wheels` artifact a human grabs to
      # publish; this wheel is built `--manylinux off`, so it is tied to the
      # runner's glibc and must never land there. Keeping it out also keeps that
      # job's `WHEEL_COUNT -lt 5` guard exact: 5 production targets, 5 wheels,
      # so a MISSING production wheel cannot be masked by this one.
      - name: Upload floor-smoke wheel artifact (abi3, reused by the floor jobs)
        uses: actions/upload-artifact@v6
        with:
          name: floor-smoke-wheel-abi3-linux
          path: bindings/python/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  smoke-floors:
    # Issue #1459: `pyproject.toml` advertises `requires-python = ">=3.9"` and
    # classifiers up to 3.14, but every other job in this workflow pins 3.12 —
    # so both ends of the advertised range went untested and a 3.9-incompatible
    # change (or an abi3 packaging break) would have reached users first. This
    # job closes that honesty gap at the cost of one artifact download per
    # boundary interpreter: it REBUILDS NOTHING, installing the cp39-abi3 wheel
    # the `smoke` job already produced. Deliberately NOT a pytest matrix — an
    # import plus one real query is what proves the wheel works on a major;
    # behavioural coverage is the `test` job's business.
    name: Floor smoke (Python ${{ matrix.python }})
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'ci:bindings-full')
      }}
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # The ENDS of the advertised range. Interior versions are covered
        # transitively by abi3 plus the 3.12 `test` job; testing the boundaries
        # is what catches a floor/ceiling claim going stale.
        #
        # `requires-python = ">=3.9"` is deliberately UNBOUNDED (capping it is a
        # packaging anti-pattern — it cannot be relaxed retroactively for an
        # already-published release), so the top of the advertised range is
        # simply the newest released CPython, NOT the newest classifier. That
        # makes this list time-sensitive: when 3.15 ships it belongs here and in
        # the classifier list, in one commit. Issue #1459 was filed when 3.13 was
        # newest; 3.14 is the top today.
        #
        # MAJOR.MINOR, not exact patch — deliberately asymmetric with the Node
        # leg, which DOES pin an exact patch. The asymmetry is real, not an
        # oversight: `napi9` becomes available AT a patch boundary (Node
        # 18.17.0), so the patch level is load-bearing there. Here it is not.
        # `requires-python = ">=3.9"` admits 3.9.0, and both halves of this
        # package are patch-independent across 3.9.x — the extension is
        # `abi3-py39` (the stable ABI exists from 3.9.0), and the pure-Python
        # wrapper is 87 lines that import nothing from the stdlib, so there is no
        # post-3.9.0 stdlib surface to regress on. Pinning `3.9.0` would test
        # nothing additional that could plausibly break, while risking that
        # setup-python has no 3.9.0 build for the current runner image, which
        # would red this lane for no gain.
        python: ["3.9", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Download the abi3 wheel built by the smoke job
        uses: actions/download-artifact@v7
        with:
          # Deliberately NOT `wheel-*`-shaped — see the upload step in `smoke`.
          name: floor-smoke-wheel-abi3-linux
          path: floor-wheel

      - name: Assert the interpreter and the wheel are the ones we mean to test
        shell: bash
        env:
          EXPECTED_PYTHON: ${{ matrix.python }}
        run: |
          set -euo pipefail
          # A `setup-python` no-op would otherwise make this a third 3.12 run
          # reporting a floor it never touched.
          actual="$(python -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          if [ "${actual}" != "${EXPECTED_PYTHON}" ]; then
            echo "::error::expected Python ${EXPECTED_PYTHON}, got ${actual}; the floor was NOT tested"
            exit 1
          fi
          echo "interpreter OK: Python ${actual}"
          # An abi3 wheel is the whole premise of reusing one build across
          # majors. A version-specific (cp3XX-cp3XX) wheel would install on
          # exactly one interpreter and silently narrow what we can claim.
          wheel="$(find floor-wheel -maxdepth 1 -type f -name '*.whl' | head -n 1)"
          if [ -z "${wheel}" ]; then
            echo "::error::no wheel in the downloaded artifact"
            exit 1
          fi
          echo "wheel: ${wheel}"
          case "${wheel}" in
            *-abi3-*) echo "wheel tag OK: abi3 (installs on 3.9+)" ;;
            *)
              echo "::error::${wheel} is not an abi3 wheel; reusing one build across majors is unsound"
              exit 1
              ;;
          esac

      - name: Install the wheel
        shell: bash
        # No `pip install --upgrade pip` on purpose: it is not needed to install
        # a local wheel, and on the 3.9 leg it is one more moving part that can
        # fail for reasons unrelated to the floor being tested.
        run: |
          set -euo pipefail
          python -m pip install floor-wheel/*.whl

      - name: Restore canonical datasets
        uses: ./.github/actions/restore-canonical-datasets
        with:
          dataset-tag: ${{ env.DATASET_TAG }}
          dataset-asset: ${{ env.DATASET_ASSET }}
          dataset-sha256: ${{ env.DATASET_SHA256 }}

      - name: Run floor smoke (import + one real query, 0 rows fails)
        shell: bash
        env:
          CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
          # The step above restores the corpus, so an absent one here is a
          # BROKEN RESTORE, not a legitimate skip. Fail rather than report a
          # green floor whose query never ran.
          CQLITE_FLOOR_STRICT_FIXTURES: '1'
        run: |
          set -euo pipefail
          python bindings/python/scripts/floor_smoke.py

  build-only-wheels:
    name: Build wheel (${{ matrix.target }})
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'ci:bindings-full')
      }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: macos-14
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Issue #1209: GitHub runner images ship a stable toolchain that already
      # provides bin/cargo-clippy. The dtolnay/rust-toolchain@1.97.1 action is
      # invoked with `targets:`, so it performs a rustup reconcile that can
      # intermittently try to (re)install the 'clippy-preview' component and
      # fail with "detected conflict: 'bin/cargo-clippy'". Remove the conflicting
      # component FIRST — before the toolchain action runs any rustup work — so
      # the @stable setup (which defaults to the minimal profile, no clippy)
      # cannot reinstall clippy-preview. The runner ships a working rustup, so
      # this `run:` step before the action has rustup available.
      # This wheel build does not run clippy. Idempotent: a no-op if clippy is absent.
      - name: Remove preinstalled clippy (avoid clippy-preview install conflict)
        shell: bash
        run: rustup component remove clippy 2>/dev/null || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1  # pinned to rust-toolchain.toml (issue #1990)
        with:
          targets: ${{ matrix.target }}

      - name: Normalize PATH for macOS (prepend ~/.cargo/bin so real cargo wins over rustup-init)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify Rust toolchain (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          which -a cargo rustup rustup-init || true
          cargo --version
          rustup --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "bindings/python -> target"
          key: ${{ matrix.os }}-${{ matrix.target }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # release-unwind: matches the shipped profile in python-release.yml so
          # CI builds the exact panic = "unwind" wheel that PyPI receives (the
          # PyO3 catch_unwind firewall, issue #1440), catching a panic-strategy
          # regression at CI time instead of at release.
          args: --profile release-unwind --out dist
          working-directory: bindings/python
          manylinux: ${{ matrix.manylinux || 'auto' }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          retention-days: 7

  test:
    name: Test (${{ matrix.os }})
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'ci:bindings-full')
      }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          # Native test platforms only
          # Note: x86_64-apple-darwin is build-only (cross-compiled on ARM64, can't test)
          # Note: aarch64-unknown-linux-gnu is build-only (cross-compiled, can't test)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            python: "3.12"
            manylinux: "2_28"
            run_slow_tests: true
          - os: macos-14
            target: aarch64-apple-darwin
            python: "3.12"
            run_slow_tests: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python: "3.12"
            run_slow_tests: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Issue #1209: GitHub runner images ship a stable toolchain that already
      # provides bin/cargo-clippy. The dtolnay/rust-toolchain@1.97.1 action is
      # invoked with `targets:`, so it performs a rustup reconcile that can
      # intermittently try to (re)install the 'clippy-preview' component and
      # fail with "detected conflict: 'bin/cargo-clippy'". Remove the conflicting
      # component FIRST — before the toolchain action runs any rustup work — so
      # the @stable setup (which defaults to the minimal profile, no clippy)
      # cannot reinstall clippy-preview. The runner ships a working rustup, so
      # this `run:` step before the action has rustup available.
      # This wheel build does not run clippy. Idempotent: a no-op if clippy is absent.
      - name: Remove preinstalled clippy (avoid clippy-preview install conflict)
        shell: bash
        run: rustup component remove clippy 2>/dev/null || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1  # pinned to rust-toolchain.toml (issue #1990)
        with:
          targets: ${{ matrix.target }}

      - name: Normalize PATH for macOS (prepend ~/.cargo/bin so real cargo wins over rustup-init)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify Rust toolchain (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          which -a cargo rustup rustup-init || true
          cargo --version
          rustup --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "bindings/python -> target"
          key: ${{ matrix.os }}-${{ matrix.target }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # release-unwind: matches the shipped profile in python-release.yml so
          # the tested wheel is byte-identical in panic strategy to the PyPI
          # artifact (panic = "unwind", PyO3 catch_unwind firewall — issue #1440).
          # This exercises the firewall under pytest, catching a panic-strategy
          # regression at CI time instead of at release.
          args: --profile release-unwind --out dist
          working-directory: bindings/python
          manylinux: ${{ matrix.manylinux || 'auto' }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          retention-days: 7

      - name: Install wheel and test dependencies
        shell: bash
        run: |
          python -m pip install 'pytest>=7.0'
          python -m pip install bindings/python/dist/*.whl

      - name: Restore dataset cache
        id: dataset-cache
        uses: actions/cache@v5
        with:
          path: test-data/datasets
          key: datasets-${{ env.DATASET_TAG }}-${{ env.DATASET_SHA256 }}

      - name: Fetch datasets if cache miss (Unix)
        if: steps.dataset-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p test-data/datasets
          curl -fsSL -o "/tmp/${DATASET_ASSET}" \
            "https://github.com/pmcfadin/cqlite/releases/download/${DATASET_TAG}/${DATASET_ASSET}"
          # Issue #1324: portable checksum — GitHub's macOS runners ship `shasum`
          # (perl), not GNU coreutils `sha256sum`. Match release.yml's idiom.
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${DATASET_SHA256}  /tmp/${DATASET_ASSET}" | sha256sum -c -
          else
            echo "${DATASET_SHA256}  /tmp/${DATASET_ASSET}" | shasum -a 256 -c -
          fi
          tar -xzf "/tmp/${DATASET_ASSET}" -C . --exclude='*/._*' --exclude='._*' --exclude='*/.DS_Store' --exclude='.DS_Store'
          # Issue #1335: stamp the .dataset-pin that fetch-datasets.sh writes so
          # the shared `datasets-${DATASET_TAG}-${DATASET_SHA256}` cache entry is
          # accepted by has_required_dataset() in jobs that use fetch-datasets.sh
          # (no needless re-download; a genuinely stale pin still forces refetch).
          printf 'tag=%s\nasset=%s\nsha256=%s\n' \
            "${DATASET_TAG}" "${DATASET_ASSET}" "${DATASET_SHA256}" \
            > test-data/datasets/.dataset-pin

      - name: Fetch datasets if cache miss (Windows)
        if: steps.dataset-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-data/datasets
          $url = "https://github.com/pmcfadin/cqlite/releases/download/$env:DATASET_TAG/$env:DATASET_ASSET"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\$env:DATASET_ASSET"
          # Verify SHA256
          $hash = (Get-FileHash "$env:TEMP\$env:DATASET_ASSET" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:DATASET_SHA256) {
            throw "SHA256 mismatch: expected $env:DATASET_SHA256, got $hash"
          }
          tar -xzf "$env:TEMP\$env:DATASET_ASSET" -C . --exclude='*/._*' --exclude='._*' --exclude='*/.DS_Store' --exclude='.DS_Store'
          # Issue #1335: stamp the .dataset-pin fetch-datasets.sh writes so the
          # shared cache entry is accepted by has_required_dataset(). LF newlines
          # to match the bash-written pin (grep -qx exact-line match).
          $pin = "tag=$env:DATASET_TAG`nasset=$env:DATASET_ASSET`nsha256=$env:DATASET_SHA256`n"
          [System.IO.File]::WriteAllText("test-data/datasets/.dataset-pin", $pin)

      - name: Sanity check dataset
        shell: bash
        run: |
          set -euo pipefail
          test -f test-data/datasets/metadata.yml
          # Issue #1230: assert the full 39-table enforced corpus (33 nb + 6
          # test_oa), not just test_basic, so a partial extraction reds CI
          # instead of skip-greening the pytest lane.
          bash test-data/scripts/check-dataset-manifest.sh test-data/datasets

      # Issue #331: Pre-build CLI binary for faster CLI parity tests
      - name: Build CLI binary for tests
        if: matrix.run_slow_tests
        shell: bash
        run: |
          cargo build --package cqlite-cli --release

      - name: Run pytest (full, with slow CLI parity)
        if: matrix.run_slow_tests
        env:
          CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
          RUN_SLOW_TESTS: "1"  # Issue #331: Run all tests including CLI parity
          # Issue #1230: fail-closed. With this flag the conftest skip helper turns
          # a missing dataset into a FAILURE (not a silent skip). What catches a
          # dropped/renamed table or a #773-class path regression is the
          # check-dataset-manifest.sh step above (full 39-table corpus) plus that
          # strict skip-helper failure. The pytest_sessionfinish "no tests ran"
          # floor is only a whole-session no-op guard (it reds when 0 tests pass
          # at all); it does NOT detect dataset tests skipping while non-dataset
          # tests still pass.
          CQLITE_REQUIRE_FIXTURES: "1"
        shell: bash
        run: |
          pytest bindings/python/tests/ -v --tb=short

      - name: Run pytest (non-slow)
        if: ${{ !matrix.run_slow_tests }}
        env:
          CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
          CQLITE_REQUIRE_FIXTURES: "1"
        shell: bash
        run: |
          pytest bindings/python/tests/ -v --tb=short -m "not slow"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-results-${{ matrix.os }}
          path: |
            bindings/python/.pytest_cache/
          retention-days: 7

  cross-binding-parity:
    name: Cross-binding parity (Python vs Node vs CLI)
    # Same tier as `test`: this job builds a release wheel, a release CLI and
    # the Node native module, so it runs where the rest of the heavy bindings
    # tier runs (push to main, nightly schedule, workflow_dispatch, or a PR
    # labeled ci:bindings-full) rather than on every core-touching PR.
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'ci:bindings-full')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Issue #1209: remove the runner's preinstalled clippy BEFORE the pinned
      # toolchain action reconciles, or the clippy-preview install can conflict.
      - name: Remove preinstalled clippy (avoid clippy-preview install conflict)
        shell: bash
        run: rustup component remove clippy 2>/dev/null || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1  # pinned to rust-toolchain.toml (issue #1990)
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "bindings/python -> target"
          key: cross-binding-parity-x86_64-unknown-linux-gnu

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bindings/node/package-lock.json

      - name: Build Python wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-unknown-linux-gnu
          # release-unwind matches the shipped profile (issue #1440), so the leg
          # under comparison is the one users get.
          args: --profile release-unwind --out dist
          working-directory: bindings/python
          manylinux: "2_28"

      - name: Install wheel and test dependencies
        shell: bash
        run: |
          python -m pip install 'pytest>=7.0'
          python -m pip install bindings/python/dist/*.whl

      - name: Build Node native module
        shell: bash
        working-directory: bindings/node
        run: |
          npm ci
          npm run build

      - name: Build CLI binary (release)
        shell: bash
        run: cargo build --package cqlite-cli --release

      # The shared composite action, not a hand-rolled curl: it also REPAIRS a
      # partial cache, which a bare cache+tar cannot.
      - name: Restore canonical datasets
        uses: ./.github/actions/restore-canonical-datasets
        with:
          dataset-tag: ${{ env.DATASET_TAG }}
          dataset-asset: ${{ env.DATASET_ASSET }}
          dataset-sha256: ${{ env.DATASET_SHA256 }}

      - name: Sanity check dataset
        shell: bash
        run: |
          set -euo pipefail
          test -f test-data/datasets/metadata.yml
          bash test-data/scripts/check-dataset-manifest.sh test-data/datasets

      - name: Run 3-way cross-binding parity (issue #1455)
        env:
          CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
          # Datasets present but a leg erroring or returning 0 rows is a FAILURE,
          # never a skip.
          CQLITE_REQUIRE_FIXTURES: "1"
          # The Node leg has its OWN fail-closed switch: CQLITE_REQUIRE_FIXTURES
          # is about the DATASET corpus, and the `test` job sets it while never
          # provisioning Node. This job DOES build the native module, so an
          # absent Node leg here is a broken build, not a legitimate omission.
          CQLITE_PARITY_REQUIRE_NODE: "1"
          RUN_SLOW_TESTS: "1"
        shell: bash
        run: |
          pytest bindings/python/tests/test_cross_binding_parity.py -v --tb=short

      - name: Upload canonical artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: cross-binding-parity-artifacts
          path: bindings/parity/out/
          retention-days: 7

  quality-gate:
    name: Python CI Quality Gate
    runs-on: ubuntu-latest
    needs: [smoke, smoke-floors, build-only-wheels, test, cross-binding-parity]
    if: always()
    env:
      RUN_FULL: >-
        ${{
          github.event_name != 'pull_request' ||
          contains(github.event.pull_request.labels.*.name, 'ci:bindings-full')
        }}

    steps:
      - name: Check smoke results
        run: |
          echo "Smoke results: ${{ needs.smoke.result }}"
          if [ "${{ needs.smoke.result }}" != "success" ]; then
            echo "::error::Python smoke checks failed"
            exit 1
          fi

      - name: Check floor smoke results
        # Only assert when the floor tier actually ran. RUN_FULL is the SAME
        # condition that gates the floor job itself, so on a routine unlabeled PR
        # the job is legitimately `skipped` and this check must not fire — an
        # unconditional `!= success` here would red every ordinary PR.
        if: env.RUN_FULL == 'true'
        env:
          FLOOR_RESULT: ${{ needs.smoke-floors.result }}
        run: |
          # Issue #1459: asserted whenever the floor tier RAN. Guarded by
          # RUN_FULL above because `smoke-floors` is a binding matrix job and repo
          # policy (scripts/ci/validate-workflows.rb) requires those to be
          # label-gated — so on a routine unlabeled PR it is legitimately
          # `skipped`, and an unconditional `!= success` would red every such PR.
          echo "Floor smoke results: ${FLOOR_RESULT}"
          if [ "${FLOOR_RESULT}" != "success" ]; then
            echo "::error::Python floor smoke failed (advertised requires-python floor/ceiling)"
            exit 1
          fi

      - name: Check build results
        if: env.RUN_FULL == 'true'
        run: |
          echo "Build-only wheel results: ${{ needs.build-only-wheels.result }}"
          if [ "${{ needs.build-only-wheels.result }}" != "success" ]; then
            echo "::error::Build-only wheel builds failed"
            exit 1
          fi

      - name: Check test results
        if: env.RUN_FULL == 'true'
        run: |
          echo "Test results: ${{ needs.test.result }}"
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Tests failed on one or more platforms"
            exit 1
          fi

      - name: Check cross-binding parity results
        # Issue #1455: the 3-way harness (Python binding vs Node binding vs CLI)
        # is in the SAME heavy tier as `test`, so it is legitimately `skipped` on
        # a routine unlabeled PR and must be asserted only when it ran.
        if: env.RUN_FULL == 'true'
        env:
          PARITY_RESULT: ${{ needs.cross-binding-parity.result }}
        run: |
          echo "Cross-binding parity results: ${PARITY_RESULT}"
          if [ "${PARITY_RESULT}" != "success" ]; then
            echo "::error::3-way cross-binding parity failed (Python binding vs Node binding vs CLI)"
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "## Python CI Summary"
            echo ""
            echo "### Tier"
            echo "- Ordinary PRs run one Ubuntu Python 3.12 wheel build plus non-dataset smoke pytest files."
            echo "- Floor smoke covers Python 3.9 (the floor), 3.13 and 3.14 (the current top of the advertised range), reusing the abi3 wheel from the smoke job; each leg restores the canonical corpus and runs one real query, failing on a 0-row result. It is a binding MATRIX tier, so per repo policy it runs on every push to \`main\`, on the nightly schedule, and on PRs labeled \`ci:bindings-full\` — NOT on a routine unlabeled PR (issue #1459)."
            echo "- Full cross-platform wheel builds, the full dataset-backed pytest suite, slow CLI parity, and wheel artifacts run on push to main, nightly schedule, workflow_dispatch, or PRs labeled \`ci:bindings-full\`."
            echo "- 3-way cross-binding parity (issue #1455) runs the SAME SELECT through the Python binding, the Node binding and the CLI and requires equal canonical JSON. Same tier as the full suite. It is the ONLY lane that exercises the Node leg of that comparison — no local agent-gate component builds the Node native module or a release CLI."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${RUN_FULL}" = "true" ]; then
            echo "Full Python bindings tier completed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Full Python bindings tier skipped for the default PR smoke tier." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download all wheels
        if: env.RUN_FULL == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: wheel-*
          path: wheels
          merge-multiple: true

      - name: List wheel artifacts
        if: env.RUN_FULL == 'true'
        run: |
          echo "::group::Built wheels"
          ls -lh wheels/
          echo "::endgroup::"

          WHEEL_COUNT=$(find wheels -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')
          echo "Wheel count: $WHEEL_COUNT"

          # Verify at least 5 wheels (one per target, plus optional PyPy wheels)
          if [ "$WHEEL_COUNT" -lt 5 ]; then
            echo "::error::Expected at least 5 wheels, found $WHEEL_COUNT"
            exit 1
          fi

      - name: Upload merged wheel artifact
        if: env.RUN_FULL == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: cqlite-wheels
          path: wheels/*.whl
          retention-days: 30

      - name: Full artifact summary
        if: env.RUN_FULL == 'true'
        run: |
          {
            echo "### Wheel Builds"
            echo "| Target | Status |"
            echo "|--------|--------|"
            echo "| x86_64-unknown-linux-gnu | :white_check_mark: |"
            echo "| aarch64-unknown-linux-gnu | :white_check_mark: |"
            echo "| x86_64-apple-darwin | :white_check_mark: |"
            echo "| aarch64-apple-darwin | :white_check_mark: |"
            echo "| x86_64-pc-windows-msvc | :white_check_mark: |"
            echo ""
            echo "### Test Results"
            echo "Full Python tests, including slow CLI parity, passed on Ubuntu."
            echo "Non-slow Python binding tests passed on macOS and Windows."
            echo "ARM64 Linux and x86_64 macOS are build-only."
            echo ""
            echo "### Artifacts"
            echo "Download wheels: \`cqlite-wheels\`"
          } >> "$GITHUB_STEP_SUMMARY"
