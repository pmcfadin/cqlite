name: Python CI

on:
  push:
    branches: [main]
    paths:
      - 'bindings/python/**'
      - 'cqlite-core/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bindings/python/**'
      - 'cqlite-core/**'
      - '.github/workflows/python-ci.yml'

env:
  CARGO_TERM_COLOR: always
  DATASET_TAG: datasets-v2
  DATASET_ASSET: cassandra5-small-full.tar.gz
  DATASET_SHA256: 5be43811bbee320a412aaf79aa63134ec1e2ec5434c03815a082b4a31bd86c55

jobs:
  build-wheels:
    name: Build wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "bindings/python -> target"
          key: ${{ matrix.os }}-${{ matrix.target }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: bindings/python
          manylinux: ${{ matrix.manylinux || 'auto' }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          retention-days: 7

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build-wheels
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          # Native test platforms only (no ARM64 Linux cross-compile)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            python: "3.12"
          - os: macos-13
            target: x86_64-apple-darwin
            python: "3.12"
          - os: macos-14
            target: aarch64-apple-darwin
            python: "3.12"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist

      - name: Install wheel and test dependencies
        shell: bash
        run: |
          pip install pytest>=7.0
          pip install dist/*.whl

      - name: Restore dataset cache
        id: dataset-cache
        uses: actions/cache@v4
        with:
          path: test-data/datasets
          key: datasets-${{ env.DATASET_TAG }}

      - name: Fetch datasets if cache miss (Unix)
        if: steps.dataset-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p test-data/datasets
          curl -fsSL -o /tmp/${DATASET_ASSET} \
            https://github.com/pmcfadin/cqlite/releases/download/${DATASET_TAG}/${DATASET_ASSET}
          echo "${DATASET_SHA256}  /tmp/${DATASET_ASSET}" | sha256sum -c -
          tar -xzf /tmp/${DATASET_ASSET} -C .

      - name: Fetch datasets if cache miss (Windows)
        if: steps.dataset-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-data/datasets
          $url = "https://github.com/pmcfadin/cqlite/releases/download/$env:DATASET_TAG/$env:DATASET_ASSET"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\$env:DATASET_ASSET"
          # Verify SHA256
          $hash = (Get-FileHash "$env:TEMP\$env:DATASET_ASSET" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:DATASET_SHA256) {
            throw "SHA256 mismatch: expected $env:DATASET_SHA256, got $hash"
          }
          tar -xzf "$env:TEMP\$env:DATASET_ASSET" -C .

      - name: Sanity check dataset
        shell: bash
        run: |
          test -f test-data/datasets/metadata.yml
          ls test-data/datasets/sstables/test_basic/ | head -n 1

      - name: Run pytest
        env:
          CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
        shell: bash
        run: |
          pytest bindings/python/tests/ -v --tb=short

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.os }}
          path: |
            bindings/python/.pytest_cache/
          retention-days: 7

  quality-gate:
    name: Python CI Quality Gate
    runs-on: ubuntu-latest
    needs: [build-wheels, test]
    if: always()

    steps:
      - name: Check build results
        run: |
          echo "Build results: ${{ needs.build-wheels.result }}"
          if [ "${{ needs.build-wheels.result }}" != "success" ]; then
            echo "::error::Wheel builds failed"
            exit 1
          fi

      - name: Check test results
        run: |
          echo "Test results: ${{ needs.test.result }}"
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Tests failed on one or more platforms"
            exit 1
          fi

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: wheels
          merge-multiple: true

      - name: List wheel artifacts
        run: |
          echo "::group::Built wheels"
          ls -lh wheels/
          echo "::endgroup::"

          WHEEL_COUNT=$(ls wheels/*.whl 2>/dev/null | wc -l)
          echo "Wheel count: $WHEEL_COUNT"

          # Verify 5 wheels (one per target)
          if [ "$WHEEL_COUNT" -ne 5 ]; then
            echo "::error::Expected 5 wheels, found $WHEEL_COUNT"
            exit 1
          fi

      - name: Upload merged wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: cqlite-wheels
          path: wheels/*.whl
          retention-days: 30

      - name: Summary
        run: |
          echo "## Python CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Wheel Builds" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| x86_64-unknown-linux-gnu | :white_check_mark: |" >> $GITHUB_STEP_SUMMARY
          echo "| aarch64-unknown-linux-gnu | :white_check_mark: |" >> $GITHUB_STEP_SUMMARY
          echo "| x86_64-apple-darwin | :white_check_mark: |" >> $GITHUB_STEP_SUMMARY
          echo "| aarch64-apple-darwin | :white_check_mark: |" >> $GITHUB_STEP_SUMMARY
          echo "| x86_64-pc-windows-msvc | :white_check_mark: |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Tests passed on 4 native platforms (ARM64 Linux is build-only)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "Download wheels: \`cqlite-wheels\`" >> $GITHUB_STEP_SUMMARY
