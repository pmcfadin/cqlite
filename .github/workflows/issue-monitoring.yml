name: Issue Progress Monitoring

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Type of report to generate'
        required: false
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly
          - critical

permissions:
  issues: read
  contents: write
  pull-requests: read

jobs:
  monitor-issues:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          npm install @octokit/rest
          npm install @actions/core
          npm install @actions/github
      
      - name: Monitor Critical Issues
        uses: actions/github-script@v7
        id: critical-issues
        with:
          script: |
            const script = require('./.github/issue-monitoring/scripts/monitor-critical.js');
            return await script({github, context, core});
      
      - name: Track Progress Updates
        uses: actions/github-script@v7
        id: progress-tracking
        with:
          script: |
            const script = require('./.github/issue-monitoring/scripts/track-progress.js');
            return await script({github, context, core});
      
      - name: Check Validation Gates
        uses: actions/github-script@v7
        id: validation-gates
        with:
          script: |
            const script = require('./.github/issue-monitoring/scripts/check-validation-gates.js');
            return await script({github, context, core});
      
      - name: Identify Blockers
        uses: actions/github-script@v7
        id: blocker-detection
        with:
          script: |
            const script = require('./.github/issue-monitoring/scripts/identify-blockers.js');
            return await script({github, context, core});
      
      - name: Calculate Metrics
        uses: actions/github-script@v7
        id: metrics-calculation
        with:
          script: |
            const script = require('./.github/issue-monitoring/scripts/calculate-metrics.js');
            return await script({github, context, core});
      
      - name: Generate Report
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.github/issue-monitoring/scripts/generate-report.js');
            const reportType = '${{ github.event.inputs.report_type }}' || 'daily';
            return await script({
              github, 
              context, 
              core,
              reportType,
              criticalIssues: ${{ steps.critical-issues.outputs.result }},
              progressData: ${{ steps.progress-tracking.outputs.result }},
              validationData: ${{ steps.validation-gates.outputs.result }},
              blockers: ${{ steps.blocker-detection.outputs.result }},
              metrics: ${{ steps.metrics-calculation.outputs.result }}
            });
      
      - name: Post Report to Issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const reportIssueNumber = 16; // Dedicated monitoring report issue
            const report = require('./.github/issue-monitoring/reports/latest-report.json');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: reportIssueNumber,
              body: report.markdown
            });
      
      - name: Notify Critical Issues
        if: steps.critical-issues.outputs.has_critical == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.github/issue-monitoring/scripts/notify-critical.js');
            return await script({github, context, core});

  update-dashboard:
    needs: monitor-issues
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Update Dashboard
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.github/issue-monitoring/scripts/update-dashboard.js');
            return await script({github, context, core});
      
      - name: Commit Dashboard Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .github/issue-monitoring/reports/
          git commit -m "Update issue monitoring dashboard [skip ci]" || exit 0
          git push