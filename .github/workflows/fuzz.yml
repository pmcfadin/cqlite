# Runner pinned to ubuntu-24.04: ubuntu-latest moved to 26.04 and broke duckdb + Python 3.9 (#4473).
name: Parser fuzz (safety net)

# Standing parser fuzz harness (issue #1614, epic #1601 finding H1).
#
# This workflow is ISOLATED from the stable agent gate / CI: it runs on NIGHTLY
# Rust + cargo-fuzz (libFuzzer needs nightly). It never touches
# `scripts/agent-gate.sh`, and the `fuzz/` crate is excluded from the main
# workspace, so no stable build/clippy/test compiles it.
#
# Two jobs:
#   - pr-smoke: bounded per-target run on PRs that touch the parser or the fuzz
#     crate (so a PR can never hang on fuzzing).
#   - nightly:  a long per-target budget on a schedule + manual dispatch.
#
# Both pass `-rss_limit_mb` and `-timeout` on every invocation (never-OOM /
# never-hang enforcement) and upload any crash reproducer as an artifact.

on:
  pull_request:
    paths:
      - 'fuzz/**'
      - 'cqlite-core/src/parser/**'
      - 'cqlite-core/src/storage/sstable/**'
      - 'cqlite-core/src/storage/commitlog/**'
      - 'cqlite-core/src/schema/**'
      - 'cqlite-core/src/types.rs'
      - 'cqlite-core/src/types/**'
      - 'cqlite-core/src/fuzz_support.rs'
      # `fuzz_find` drives the CLI crate's find probe + CommitLog scan (issue #4502).
      - 'cqlite-cli/src/commands/find*.rs'
      - 'cqlite-cli/Cargo.toml'
      # Manifests: feature/dependency resolution for the fuzz surface (the crate
      # depends on cqlite-core with `--features fuzz`).
      - 'cqlite-core/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/fuzz.yml'
      - '.github/actions/restore-canonical-datasets/**'
  schedule:
    # Nightly long-run, 04:07 UTC (off-peak, between gate 03:37 and
    # cql-type-parity 04:31).
    - cron: '7 4 * * *'
  workflow_dispatch:

# Least-privilege: this workflow only reads repo code and uploads artifacts.
permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Bounded per-target smoke on PRs. Each target is a separate matrix leg so a
  # crash pinpoints the target and the legs run in parallel.
  pr-smoke:
    name: PR smoke (${{ matrix.target }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # STATIC, literal target list (never derived from untrusted input).
        # `fuzz_block_emit` needs a real SSTable fixture (`test_basic/simple_table`, via
        # `CQLITE_DATASETS_ROOT`; its driver no-ops without one), so its leg restores the
        # canonical datasets first (issue #4502). It was excluded while it reproduced the decimal
        # length add-overflow crash (#1795); that is fixed (closed 2026-07-15), a 120 s local run
        # on the datasets-v4 fixture executed ~840k inputs with no finding, and an excluded
        # target reports false-green coverage. `fuzz_audit` (#4195) and `fuzz_find` (#4205, per-
        # generation probe + CommitLog scan) fuzz whole generation directories seeded from the
        # corruption corpus (`fuzz/seed_audit_find.py`); they assert the #4159 property (an
        # unreadable component never reads as success) on the tool's own result.
        target:
          - fuzz_vint
          - fuzz_value_decode
          - fuzz_bti
          - fuzz_schema_parse
          - fuzz_block_emit
          - fuzz_commitlog_frame
          - fuzz_audit
          - fuzz_find
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust (nightly)
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: nightly
          cache-key: fuzz-nightly

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked

      - name: Restore canonical datasets (fuzz_block_emit / fuzz_audit / fuzz_find fixtures, issue #4502)
        if: matrix.target == 'fuzz_block_emit' || matrix.target == 'fuzz_audit' || matrix.target == 'fuzz_find'
        uses: ./.github/actions/restore-canonical-datasets

      - name: Run bounded fuzz smoke
        # matrix.target is a trusted static literal, but pass it via a quoted env
        # var (never inline `${{ }}` in the shell) per the command-injection
        # doctrine.
        env:
          TARGET: ${{ matrix.target }}
          # Read by fuzz_block_emit, fuzz_audit and fuzz_find (a no-op for every other target).
          CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run "$TARGET" -- \
            -max_total_time=45 \
            -rss_limit_mb=2048 \
            -timeout=25

      - name: Upload crash reproducer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/**
          if-no-files-found: ignore

  # Long per-target run on a nightly schedule / manual dispatch.
  nightly:
    name: Nightly long-run (${{ matrix.target }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Same list as the pr-smoke matrix (issue #4502): `fuzz_block_emit`, `fuzz_audit` and
        # `fuzz_find` run with the canonical datasets restored (real base generations),
        # `fuzz_commitlog_frame` needs no fixture.
        target:
          - fuzz_vint
          - fuzz_value_decode
          - fuzz_bti
          - fuzz_schema_parse
          - fuzz_block_emit
          - fuzz_commitlog_frame
          - fuzz_audit
          - fuzz_find
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust (nightly)
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: nightly
          cache-key: fuzz-nightly

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked

      - name: Restore canonical datasets (fuzz_block_emit / fuzz_audit / fuzz_find fixtures, issue #4502)
        if: matrix.target == 'fuzz_block_emit' || matrix.target == 'fuzz_audit' || matrix.target == 'fuzz_find'
        uses: ./.github/actions/restore-canonical-datasets

      - name: Run long fuzz budget
        env:
          TARGET: ${{ matrix.target }}
          # Read by fuzz_block_emit, fuzz_audit and fuzz_find (a no-op for every other target).
          CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run "$TARGET" -- \
            -max_total_time=600 \
            -rss_limit_mb=2048 \
            -timeout=25

      - name: Upload crash reproducer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-nightly-${{ matrix.target }}
          path: fuzz/artifacts/**
          if-no-files-found: ignore
