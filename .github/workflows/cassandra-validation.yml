name: "CI: Cassandra sstableloader Validation"

# INGEST TIERING (issue #1368):
# This workflow is the single default writer-path PR smoke path. It validates the
# narrower `sstableloader` ingest acceptance path.
# The complementary `nodetool refresh` readback path remains in e2e-readback.yml,
# but it is label/manual/nightly/release gated so ordinary writer PRs do not run
# two separate 30-minute Cassandra ingest jobs by default.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'cqlite-core/src/storage/write_engine/**'
      - 'cqlite-core/src/storage/sstable/writer/**'
      - 'cqlite-core/src/parser/**'
      - 'cqlite-core/src/schema/**'
      - 'cqlite-core/tests/sstableloader_integration.rs'
      - '.github/workflows/cassandra-validation.yml'
      # Note: cqlite-core/src/parser/** and schema/** are included here to gate
      # serialization-adjacent code changes. e2e-readback.yml also triggers on these
      # paths; both workflows serve different validation roles (sstableloader vs
      # nodetool refresh), so some overlap is intentional — see issue #728.
  push:
    branches: [main]
    paths:
      - 'cqlite-core/src/storage/write_engine/**'
      - 'cqlite-core/src/storage/sstable/writer/**'
      - 'cqlite-core/src/parser/**'
      - 'cqlite-core/src/schema/**'
      - 'cqlite-core/tests/sstableloader_integration.rs'
      - '.github/workflows/cassandra-validation.yml'
  workflow_dispatch:
    inputs:
      run_stress_tests:
        description: 'Run stress tests (10K partitions, wide partitions)'
        type: boolean
        default: false

# Pin location: CASSANDRA_IMAGE is the single source of truth for the Cassandra
# version used in this workflow. To bump: update CASSANDRA_IMAGE here.
# The same version must also be set in:
#   - .github/workflows/m1-ci.yml  (env.CASSANDRA_IMAGE)
#   - test-data/docker/docker-compose-cassandra5.yml  (services.cassandra-5-0.image)
# Issue #669 unified all three locations to cassandra:5.0.2.
# NOTE: env context is NOT available at jobs.<job>.services.<svc>.image per GitHub's
# context-availability rules. The literal image tag is set directly there instead.
env:
  CASSANDRA_IMAGE: cassandra:5.0.2

permissions:
  contents: read
  pull-requests: write

# Cancel any in-progress PR run when a new push arrives; let push/scheduled runs complete.
concurrency:
  group: cassandra-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This workflow validates that SSTables written by CQLite can be imported
# into a real Cassandra 5.0 cluster using the current loader-based harness
# (Issue #396).

jobs:
  sstableloader-validation:
    name: sstableloader Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      cassandra:
        # Pin: cassandra:5.0.2 — env context is unavailable at service image keys.
        # To bump the version: update this literal AND env.CASSANDRA_IMAGE above.
        image: cassandra:5.0.2
        env:
          MAX_HEAP_SIZE: 1G
          HEAP_NEWSIZE: 256m
        ports:
          - 9042:9042
        options: >-
          --health-cmd "cqlsh -e 'DESCRIBE KEYSPACES'"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        # No `toolchain:` input: setup-rust-toolchain reads rust-toolchain.toml
        # (pinned 1.88.0) instead of overriding it with stable (issue #1990).
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cassandra-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cassandra-
            ${{ runner.os }}-cargo-

      - name: Wait for Cassandra to be ready
        run: |
          echo "⏳ Waiting for Cassandra service container..."
          for i in {1..60}; do
            if docker exec ${{ job.services.cassandra.id }} cqlsh -e "DESCRIBE KEYSPACES" 2>/dev/null; then
              echo "✅ Cassandra is ready!"
              break
            fi
            echo "Attempt $i/60: Cassandra not ready yet..."
            sleep 5
          done

      - name: Verify Cassandra container
        run: |
          echo "::group::Cassandra container info"
          docker exec ${{ job.services.cassandra.id }} nodetool status
          docker exec ${{ job.services.cassandra.id }} cqlsh -e "DESCRIBE KEYSPACES"
          echo "::endgroup::"

      - name: Build CQLite with write support
        run: |
          cargo build --release --package cqlite-core --features write-support,docker-integration

      - name: Create test keyspace in Cassandra
        run: |
          docker exec ${{ job.services.cassandra.id }} cqlsh -e "CREATE KEYSPACE IF NOT EXISTS sstableloader_test WITH REPLICATION = {'class': 'SimpleStrategy', 'replication_factor': 1};"

      - name: Run Tier 1 - sstableloader Acceptance Tests
        id: tier1
        shell: bash
        env:
          CQLITE_CASSANDRA_CONTAINER: ${{ job.services.cassandra.id }}
        run: |
          set -euo pipefail
          echo "::group::Tier 1: sstableloader Acceptance Tests"
          trap 'echo "::endgroup::"' EXIT
          cargo test --release --package cqlite-core \
            --test sstableloader_integration \
            --features write-support,docker-integration \
            -- --test-threads=1 \
            test_sstableloader_simple_table \
            test_sstableloader_clustering_table \
            test_sstableloader_multiple_partitions \
            test_sstableloader_all_stage0_types \
            --nocapture 2>&1 | tee tier1_results.txt

      - name: Run Tier 2 - CQL Query Verification Tests
        id: tier2
        if: success()
        shell: bash
        env:
          CQLITE_CASSANDRA_CONTAINER: ${{ job.services.cassandra.id }}
        run: |
          set -euo pipefail
          echo "::group::Tier 2: CQL Query Verification Tests"
          trap 'echo "::endgroup::"' EXIT
          cargo test --release --package cqlite-core \
            --test sstableloader_integration \
            --features write-support,docker-integration \
            -- --test-threads=1 \
            test_sstableloader_select_all_returns_written_rows \
            test_sstableloader_where_on_partition_key \
            test_sstableloader_where_on_clustering_key \
            test_sstableloader_stage0_types_round_trip_values \
            --nocapture 2>&1 | tee tier2_results.txt

      - name: Run Tier 3 - Stress Tests
        id: tier3
        if: |
          success() &&
          (github.event_name == 'workflow_dispatch' && github.event.inputs.run_stress_tests == 'true' ||
           github.event_name == 'push')
        shell: bash
        env:
          CQLITE_CASSANDRA_CONTAINER: ${{ job.services.cassandra.id }}
        run: |
          set -euo pipefail
          echo "::group::Tier 3: Stress Tests"
          trap 'echo "::endgroup::"' EXIT
          cargo test --release --package cqlite-core \
            --test sstableloader_integration \
            --features write-support,docker-integration \
            -- --test-threads=1 \
            test_sstableloader_large_partition_1000_rows \
            test_sstableloader_many_partitions_100_distinct \
            test_sstableloader_concurrent_writes_followed_by_load \
            --nocapture 2>&1 | tee tier3_results.txt

      - name: Generate Test Summary
        if: always()
        run: |
          {
            echo "# sstableloader Integration Test Results"
            echo ""
            echo "## Tier 1: Acceptance Tests"
            echo "Status: ${{ steps.tier1.outcome }}"
            echo ""
            echo "## Tier 2: Query Verification"
            echo "Status: ${{ steps.tier2.outcome }}"
            echo ""
            echo "## Tier 3: Stress Tests"
            echo "Status: ${{ steps.tier3.outcome }}"
            echo ""
            echo "## CI Tier Notes"
            echo "This is the default writer-path PR ingest smoke."
            echo "Run the full nodetool refresh readback path with the ci:ingest-full label, e2e-readback workflow_dispatch, nightly schedule, or release trigger."
          } > test_summary.md
          {
            echo "## sstableloader ingest tier"
            echo ""
            echo "- Default writer-path PR smoke: this workflow."
            echo "- Full nodetool refresh readback: add \`ci:ingest-full\`, run e2e-readback manually, wait for nightly, or use the release trigger."
          } >> "$GITHUB_STEP_SUMMARY"

      # Issue #1027: this lane gates a nightly_docker parity scenario
      # (cass.write_load_path.live_readback.semantic_only), so its binding
      # retention minimum is 30 days — see docs/development/parity-ci-tiers.md.
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sstableloader-test-results
          path: |
            tier1_results.txt
            tier2_results.txt
            tier3_results.txt
            test_summary.md
          retention-days: 30

      # Issue #1027 convergence audit: this lane's sstableloader_integration tests
      # use plain assert!/assert_eq! terminals — they do NOT route through
      # ParityFailure::panic and have no scenario-id-keyed bundle emitter — so a
      # `parity-failures-*` upload here would advertise a bundle that never
      # appears (even with `if-no-files-found: ignore`, the artifact promise is
      # false). The speculative upload was removed; the "Upload Test Artifacts"
      # step above already captures this lane's real forensics (tier results +
      # summary). FOLLOW-UP: to emit the shared bundle for the live-readback
      # comparison, route the failure terminal through the shared
      # ParityFailure/FailureBundle emitter (out of scope for #1027, which
      # standardises the artifact system, not each lane's terminal).

      - name: Comment on PR (Success)
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const summary = `## ✅ sstableloader Integration Tests PASSED

            All SSTable format validation tests passed:
            - ✅ Tier 1: Acceptance Tests - sstableloader accepted packaged flushed SSTables
            - ✅ Tier 2: Query Verification - Cassandra returned the expected rows
            - ${{ steps.tier3.outcome == 'success' && '✅' || '⏭️' }} Tier 3: Stress Tests

            CQLite-written SSTables were imported successfully into Cassandra 5.0 through the loader-based validation path.

            Full nodetool refresh readback remains available through the \`ci:ingest-full\` label, e2e-readback workflow_dispatch, nightly schedule, or release trigger.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Comment on PR (Failure)
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const summary = `## ❌ sstableloader Integration Tests FAILED

            One or more SSTable validation tests failed:
            - Tier 1 (Acceptance): ${{ steps.tier1.outcome }}
            - Tier 2 (Query Verification): ${{ steps.tier2.outcome }}
            - Tier 3 (Stress): ${{ steps.tier3.outcome }}

            ### Debugging Steps:
            \`\`\`bash
            # Start Cassandra container
            docker compose -f test-data/docker/docker-compose-cassandra5.yml up -d cassandra-5-0

            # Run tests locally
            cargo test --package cqlite-core \\
              --test sstableloader_integration \\
              --features write-support,docker-integration \\
              -- --nocapture
            \`\`\`

            See workflow artifacts for detailed logs.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Fail on test errors
        if: |
          steps.tier1.outcome != 'success' ||
          steps.tier2.outcome != 'success'
        run: |
          echo "❌ sstableloader integration tests failed"
          echo "Tier 1: ${{ steps.tier1.outcome }}"
          echo "Tier 2: ${{ steps.tier2.outcome }}"
          exit 1
