name: SSTableDump Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'cqlite-core/src/**'
      - 'tools/sstabledump-validator/**'
      - '.github/workflows/sstabledump-validation.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'cqlite-core/src/**'
      - 'tools/sstabledump-validator/**'
      - '.github/workflows/sstabledump-validation.yml'
  schedule:
    # Run validation daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      zero_tolerance:
        description: 'Enable zero tolerance mode (fail on ANY difference)'
        required: false
        default: 'true'
        type: boolean
      detailed_report:
        description: 'Generate detailed comparison report'
        required: false
        default: 'true'
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info

jobs:
  validate-sstabledump:
    name: Zero-Tolerance SSTableDump Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      cassandra:
        image: cassandra:5.0
        env:
          CASSANDRA_CLUSTER_NAME: cqlite-validator
          MAX_HEAP_SIZE: 1G
          HEAP_NEWSIZE: 200m
        ports:
          - 9042:9042
        options: >-
          --health-cmd "cqlsh -e 'SELECT cluster_name FROM system.local;'"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 180s

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libssl-dev

    - name: Build CQLite core
      working-directory: ./cqlite-core
      run: |
        cargo build --release
        cargo test --release

    - name: Build SSTableDump Validator
      working-directory: ./tools/sstabledump-validator
      run: |
        cargo build --release

    - name: Wait for Cassandra to be ready
      run: |
        echo "Waiting for Cassandra to be ready..."
        timeout 300s bash -c 'until cqlsh -h localhost -e "SELECT cluster_name FROM system.local;" > /dev/null 2>&1; do sleep 5; done'
        echo "Cassandra is ready!"

    - name: Generate test data
      working-directory: ./tools/sstabledump-validator
      run: |
        echo "Generating comprehensive test data..."
        cargo run --release -- generate --count 100 --edge-cases
        
        # Verify test data was created
        if ! cqlsh -h localhost -e "SELECT COUNT(*) FROM validator_test.basic_types;" > /dev/null 2>&1; then
          echo "❌ Failed to generate test data"
          exit 1
        fi
        
        echo "✅ Test data generated successfully"

    - name: Extract SSTable files from Cassandra
      run: |
        echo "Extracting SSTable files..."
        
        # Create directory for extracted SSTables
        mkdir -p ./test-sstables
        
        # Force flush to ensure data is written to disk
        docker exec $(docker ps --filter "ancestor=cassandra:5.0" --format "{{.ID}}") nodetool flush
        
        # Copy SSTable files from container
        CONTAINER_ID=$(docker ps --filter "ancestor=cassandra:5.0" --format "{{.ID}}")
        docker cp $CONTAINER_ID:/var/lib/cassandra/data/validator_test ./test-sstables/
        
        # List extracted files
        find ./test-sstables -name "*.db" | head -10
        
        echo "✅ SSTable files extracted"

    - name: Run Zero-Tolerance Validation
      working-directory: ./tools/sstabledump-validator
      env:
        ZERO_TOLERANCE: ${{ github.event.inputs.zero_tolerance || 'true' }}
        DETAILED_REPORT: ${{ github.event.inputs.detailed_report || 'true' }}
      run: |
        echo "🔍 Starting zero-tolerance cell-by-cell validation..."
        
        EXIT_CODE=0
        
        # Find all SSTable files to validate
        SSTABLE_FILES=$(find ../../test-sstables -name "*-Data.db" | head -5)
        
        if [ -z "$SSTABLE_FILES" ]; then
          echo "❌ No SSTable files found to validate"
          exit 1
        fi
        
        # Validate each SSTable file
        for SSTABLE in $SSTABLE_FILES; do
          echo "📊 Validating: $SSTABLE"
          
          if [ "$ZERO_TOLERANCE" = "true" ]; then
            if ! cargo run --release -- validate "$SSTABLE" --fail-on-diff --detailed > "validation_report_$(basename $SSTABLE).txt" 2>&1; then
              echo "❌ VALIDATION FAILED for $SSTABLE (Zero Tolerance Mode)"
              cat "validation_report_$(basename $SSTABLE).txt"
              EXIT_CODE=1
            else
              echo "✅ Perfect match for $SSTABLE"
            fi
          else
            cargo run --release -- validate "$SSTABLE" --detailed > "validation_report_$(basename $SSTABLE).txt" 2>&1
            echo "ℹ️  Validation completed for $SSTABLE (tolerance mode)"
          fi
        done
        
        if [ $EXIT_CODE -ne 0 ]; then
          echo ""
          echo "🚨 ZERO TOLERANCE VALIDATION FAILED"
          echo "Cell-by-cell comparison found differences between CQLite and Cassandra output."
          echo "This is exactly what was requested - CI MUST fail on ANY difference."
          echo ""
          exit $EXIT_CODE
        fi
        
        echo ""
        echo "🎉 ALL VALIDATIONS PASSED!"
        echo "CQLite output matches Cassandra sstabledump exactly."

    - name: Generate Comprehensive Report
      if: always()
      working-directory: ./tools/sstabledump-validator
      run: |
        echo "📋 Generating comprehensive validation report..."
        
        # Combine all validation reports
        echo "# SSTableDump Validation Report" > ../validation_summary.md
        echo "Generated on: $(date -u)" >> ../validation_summary.md
        echo "" >> ../validation_summary.md
        
        # Add validation results
        if ls validation_report_*.txt >/dev/null 2>&1; then
          for report in validation_report_*.txt; do
            echo "## $(basename $report)" >> ../validation_summary.md
            echo '```' >> ../validation_summary.md
            cat "$report" >> ../validation_summary.md
            echo '```' >> ../validation_summary.md
            echo "" >> ../validation_summary.md
          done
        else
          echo "No validation reports found" >> ../validation_summary.md
        fi

    - name: Upload validation artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: sstabledump-validation-${{ github.run_id }}
        path: |
          tools/sstabledump-validator/validation_report_*.txt
          validation_summary.md
          test-sstables/
        retention-days: 30

    - name: Generate JUnit report for test results
      if: always()
      working-directory: ./tools/sstabledump-validator
      run: |
        # Create JUnit XML format report
        echo '<?xml version="1.0" encoding="UTF-8"?>' > junit_validation.xml
        echo '<testsuite name="SSTableDump Validation" tests="1">' >> junit_validation.xml
        
        if [ -f "validation_report_*.txt" ] && grep -q "❌" validation_report_*.txt; then
          echo '  <testcase name="zero_tolerance_validation" classname="SSTableDumpValidator">' >> junit_validation.xml
          echo '    <failure message="Cell-by-cell comparison failed">' >> junit_validation.xml
          echo '      Zero tolerance validation found differences between CQLite and Cassandra output.' >> junit_validation.xml
          echo '    </failure>' >> junit_validation.xml
          echo '  </testcase>' >> junit_validation.xml
        else
          echo '  <testcase name="zero_tolerance_validation" classname="SSTableDumpValidator" />' >> junit_validation.xml
        fi
        
        echo '</testsuite>' >> junit_validation.xml

    - name: Publish test results
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: SSTableDump Validation Results
        path: tools/sstabledump-validator/junit_validation.xml
        reporter: java-junit

    - name: Comment on PR (if validation fails)
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🚨 **SSTableDump Validation Failed**
            
            Zero-tolerance cell-by-cell comparison found differences between CQLite and Cassandra output.
            
            This validation ensures perfect compatibility by comparing every cell value, timestamp, and metadata field.
            
            **What this means:**
            - CQLite's SSTable reading produces different results than Cassandra's sstabledump
            - This MUST be fixed before merging to maintain compatibility
            
            **Next steps:**
            1. Review the validation artifacts uploaded to this workflow run
            2. Fix the SSTable reading implementation in cqlite-core
            3. Re-run this validation until it passes with zero differences
            
            See the workflow run for detailed comparison reports.`
          });

  compatibility-matrix:
    name: Multi-Version Compatibility Matrix
    needs: validate-sstabledump
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cassandra_version: ['4.1', '5.0']
      fail-fast: false
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Test Cassandra ${{ matrix.cassandra_version }} compatibility
      run: |
        echo "Testing compatibility with Cassandra ${{ matrix.cassandra_version }}"
        
        # Start specific Cassandra version
        docker run -d --name cassandra-${{ matrix.cassandra_version }} \
          -p 9042:9042 \
          -e CASSANDRA_CLUSTER_NAME=cqlite-compat-test \
          cassandra:${{ matrix.cassandra_version }}
        
        # Wait for readiness
        timeout 300s bash -c 'until docker exec cassandra-${{ matrix.cassandra_version }} cqlsh -e "SELECT cluster_name FROM system.local;" > /dev/null 2>&1; do sleep 10; done'
        
        # Build and run validation
        cd tools/sstabledump-validator
        cargo build --release
        cargo run --release -- generate --count 50
        
        # Extract and validate SSTables
        docker exec cassandra-${{ matrix.cassandra_version }} nodetool flush
        docker cp cassandra-${{ matrix.cassandra_version }}:/var/lib/cassandra/data/validator_test ./test-sstables-${{ matrix.cassandra_version }}/
        
        # Run validation with zero tolerance
        for sstable in $(find ./test-sstables-${{ matrix.cassandra_version }} -name "*-Data.db" | head -3); do
          echo "Validating $sstable against Cassandra ${{ matrix.cassandra_version }}"
          cargo run --release -- validate "$sstable" --fail-on-diff || echo "FAILED: $sstable"
        done