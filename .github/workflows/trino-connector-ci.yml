name: Trino Connector CI

# Builds and tests the Java Trino connector and publishes the assembled plugin
# directory as a workflow artifact. The Gradle wrapper (9.1) runs on JDK 21 and
# auto-provisions the JDK 25 toolchain via the foojay resolver.

on:
  schedule:
    # Nightly full Trino connector coverage at 04:55 UTC
    - cron: '55 4 * * *'
  push:
    branches: [ main ]
    paths:
      - 'trino-connector/**'
      - '.github/workflows/trino-connector-ci.yml'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths:
      - 'trino-connector/**'
      - '.github/workflows/trino-connector-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trino-connector-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: gradle test (+ optional plugin)
    runs-on: ubuntu-latest
    env:
      RUN_FULL: >-
        ${{
          github.event_name != 'pull_request' ||
          contains(github.event.pull_request.labels.*.name, 'ci:trino-full')
        }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 21 (runs Gradle; toolchain fetches JDK 25)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          # `**` so the key covers gradle/fatjar-oracles.gradle.kts too — a single `*`
          # does not cross `/`, which left that file outside the cache key (#2869).
          cache-dependency-path: trino-connector/**/*.gradle.kts

      - name: Test
        working-directory: trino-connector
        # verifyPublishedPomNettyPin asserts the netty pin survives into the
        # published POM's <dependencies> for downstream Maven consumers (issue #2300).
        # generateMetadataFileForMavenPublication + generatePomFileForMavenPublication
        # run Gradle 9.1's publication validation on EVERY PR (issue #2334): these tasks
        # otherwise fire only on the publish path, so an enforced-platform / metadata
        # leak (e.g. #2334's enforcedPlatform in a published variant) was invisible to
        # CI until the release publish job failed. Running them here catches it pre-merge.
        # verifyShadowNotPublished asserts the shaded fat jar (#2869) never leaks into
        # the Maven Central publication: the fat jar is a Release ASSET, and a shaded
        # uber-jar in Central would hand every downstream consumer a duplicate,
        # unresolvable copy of the runtime tree. It reads only the two generate* tasks'
        # own outputs, both already produced above, so it costs essentially nothing.
        run: >-
          ./gradlew --no-daemon test verifyPublishedPomNettyPin
          generateMetadataFileForMavenPublication generatePomFileForMavenPublication
          verifyShadowNotPublished

      # Named as its own step so the fat-jar contents assertion appears BY NAME in the
      # log rather than hiding inside an aggregate `check`. Cheap on every PR: `test`
      # above has already compiled `main`, so shading is seconds. verifyFatJar is the
      # only oracle for the shaded jar's CONTENTS — that the bundled runtime tree
      # easy-db-lab curls as ONE artifact instead of resolving 50 is complete,
      # service-merged and version-pinned (#2869). NOTE: nothing is relocated, and
      # that is deliberate — see the NO RELOCATION rationale on `tasks.shadowJar` in
      # build.gradle.kts. Trino's child-first plugin classloader already isolates the
      # bundled netty/grpc/arrow from the engine's copies.
      - name: Shade fat jar and verify its contents (shadowJar verifyFatJar)
        working-directory: trino-connector
        run: ./gradlew --no-daemon shadowJar verifyFatJar

      - name: Assemble plugin (multi-jar and fat flavors)
        if: env.RUN_FULL == 'true'
        working-directory: trino-connector
        # installPlugin => build/plugin/cqlite_flight (the 50-jar runtime tree, unchanged);
        # installPluginFat => build/plugin-fat/cqlite_flight (exactly one shaded jar, #2869).
        run: ./gradlew --no-daemon installPlugin installPluginFat

      - name: Upload plugin artifact
        if: env.RUN_FULL == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cqlite-trino-plugin
          path: trino-connector/build/plugin/cqlite_flight
          if-no-files-found: error

      - name: Upload fat plugin artifact
        if: env.RUN_FULL == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cqlite-trino-plugin-fat
          path: trino-connector/build/plugin-fat/cqlite_flight
          # error, not warn: a run that assembled the fat flavor and uploaded NOTHING
          # must never report green (#2869).
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trino-connector-test-reports
          path: trino-connector/build/reports/tests
          if-no-files-found: ignore

      - name: Write CI tier summary
        if: always()
        run: |
          {
            echo "## Trino connector CI tier"
            echo ""
            echo "- Ordinary PRs run: Gradle \`test\`, \`verifyPublishedPomNettyPin\`, the two publication-metadata generators,"
            echo "  \`verifyShadowNotPublished\` (the shaded jar must stay OUT of the Maven Central publication),"
            echo "  and \`shadowJar verifyFatJar\` (the shaded fat jar's contents oracle, #2869)."
            echo "- Plugin assembly and artifact upload run on push to main, nightly schedule, workflow_dispatch, or PRs labeled \`ci:trino-full\`."
            echo "  That tier assembles BOTH flavors — \`installPlugin\` (50-jar tree) and \`installPluginFat\` (one shaded jar) —"
            echo "  and uploads each as an artifact with \`if-no-files-found: error\`."
            echo "- Full Docker E2E lives in flight-trino-e2e.yml and accepts \`ci:trino-full\`; its \`e2e-fat\` job is the only"
            echo "  proof that Trino actually LOADS the single shaded jar and returns rows."
            echo "- Current full-tier decision: ${RUN_FULL}."
          } >> "$GITHUB_STEP_SUMMARY"
