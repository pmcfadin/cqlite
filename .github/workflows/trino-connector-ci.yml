name: Trino Connector CI

# Builds and tests the Java Trino connector and publishes the assembled plugin
# directory as a workflow artifact. The Gradle wrapper (9.1) runs on JDK 21 and
# auto-provisions the JDK 25 toolchain via the foojay resolver.

on:
  schedule:
    # Nightly full Trino connector coverage at 04:55 UTC
    - cron: '55 4 * * *'
  push:
    branches: [ main ]
    paths:
      - 'trino-connector/**'
      - '.github/workflows/trino-connector-ci.yml'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths:
      - 'trino-connector/**'
      - '.github/workflows/trino-connector-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trino-connector-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: gradle test (+ optional plugin)
    runs-on: ubuntu-latest
    env:
      RUN_FULL: >-
        ${{
          github.event_name != 'pull_request' ||
          contains(github.event.pull_request.labels.*.name, 'ci:trino-full')
        }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 21 (runs Gradle; toolchain fetches JDK 25)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: trino-connector/*.gradle.kts

      - name: Test
        working-directory: trino-connector
        # verifyPublishedPomNettyPin asserts the netty pin survives into the
        # published POM's <dependencies> for downstream Maven consumers (issue #2300).
        run: ./gradlew --no-daemon test verifyPublishedPomNettyPin

      - name: Assemble plugin
        if: env.RUN_FULL == 'true'
        working-directory: trino-connector
        run: ./gradlew --no-daemon installPlugin

      - name: Upload plugin artifact
        if: env.RUN_FULL == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cqlite-trino-plugin
          path: trino-connector/build/plugin/cqlite_flight
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trino-connector-test-reports
          path: trino-connector/build/reports/tests
          if-no-files-found: ignore

      - name: Write CI tier summary
        if: always()
        run: |
          {
            echo "## Trino connector CI tier"
            echo ""
            echo "- Ordinary PRs run Gradle tests only."
            echo "- Plugin assembly and artifact upload run on push to main, nightly schedule, workflow_dispatch, or PRs labeled \`ci:trino-full\`."
            echo "- Full Docker E2E lives in flight-trino-e2e.yml and accepts \`ci:trino-full\`."
            echo "- Current full-tier decision: ${RUN_FULL}."
          } >> "$GITHUB_STEP_SUMMARY"
