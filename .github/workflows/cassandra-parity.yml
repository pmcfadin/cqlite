name: Cassandra Parity Manifest

# Fast PR gate (issue #976/#978): validates the parity manifest against the
# schema + cross-field rules and fails if the generated report is stale.
# No Docker, live Cassandra, or downloaded dataset binaries required — the tool
# only reads the manifest, the repository tree, and the assessment report. The
# JSONL/TOC/Digest reference files it checks are committed to the repo.

on:
  push:
    branches: [ main ]
    paths:
      - 'test-data/cassandra-parity-manifest.yml'
      - 'test-data/cassandra-parity-manifest.schema.json'
      - 'tools/cassandra-parity/**'
      - 'docs/reports/cassandra-test-parity*.md'
      - 'docs/cassandra_test_index.md'
      # ANY workflow under .github/workflows is a potential `ci.workflow` target
      # of a required_parity scenario; the lint's anti-overstatement check
      # (workflow_check) reads those files to prove the mapped test runs
      # blocking + fail-closed. Editing a referenced parity workflow MUST re-run
      # this lint, so scope the whole directory (not just this file). Without
      # this the machine enforcement could be silently bypassed by a workflow
      # edit. (issue #1228 roborev finding A)
      - '.github/workflows/**'
      # Release-facing docs the public-claim scanner (`lint`) reads — must stay in
      # sync with `claim_scan::RELEASE_FILES` so an over-claim added to one of
      # these still triggers the lint job. (issue #1023)
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/development/parity-ci-tiers.md'
      - 'docs/development/parity-release-checklist.md'
      - 'docs/development/cassandra-parity-manifest.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'test-data/cassandra-parity-manifest.yml'
      - 'test-data/cassandra-parity-manifest.schema.json'
      - 'tools/cassandra-parity/**'
      - 'docs/reports/cassandra-test-parity*.md'
      - 'docs/cassandra_test_index.md'
      # ANY workflow under .github/workflows is a potential `ci.workflow` target
      # of a required_parity scenario; the lint's anti-overstatement check
      # (workflow_check) reads those files to prove the mapped test runs
      # blocking + fail-closed. Editing a referenced parity workflow MUST re-run
      # this lint, so scope the whole directory (not just this file). Without
      # this the machine enforcement could be silently bypassed by a workflow
      # edit. (issue #1228 roborev finding A)
      - '.github/workflows/**'
      # Release-facing docs the public-claim scanner (`lint`) reads — must stay in
      # sync with `claim_scan::RELEASE_FILES` so an over-claim added to one of
      # these still triggers the lint job. (issue #1023)
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/development/parity-ci-tiers.md'
      - 'docs/development/parity-release-checklist.md'
      - 'docs/development/cassandra-parity-manifest.md'
  # Nightly + on-demand: the orphaned-debt open-state check (#1401) needs the
  # network + an authenticated gh, so it runs off the PR path (the offline linter
  # already gates PRs). SKIP-aware, so it can never flake a scheduled run.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: cassandra-parity-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parity-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Issue #1209/#1217: GitHub runner images ship a stable toolchain that
      # already provides bin/cargo-clippy. The dtolnay/rust-toolchain@1.88.0
      # action performs a rustup reconcile that can intermittently try to
      # (re)install the 'clippy-preview' component and fail with
      # "detected conflict: 'bin/cargo-clippy'". Remove the conflicting
      # component FIRST — before the toolchain action runs any rustup work — so
      # the @stable setup (minimal profile, no clippy) cannot reinstall
      # clippy-preview. The runner ships a working rustup, so this `run:` step
      # before the action has rustup available.
      # This lane does not run clippy. Idempotent: a no-op if clippy is absent.
      - name: Remove preinstalled clippy (avoid clippy-preview install conflict)
        shell: bash
        run: rustup component remove clippy --toolchain stable 2>/dev/null || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0  # pinned to rust-toolchain.toml (issue #1990)

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-parity-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}

      - name: Build cassandra-parity
        run: cargo build -p cassandra-parity

      - name: Lint manifest (schema + cross-field parity rules)
        run: cargo run -p cassandra-parity -- lint --manifest test-data/cassandra-parity-manifest.yml

      - name: Tier contract is not drifted (doc == schema == code enum; #1022)
        # Fast, dependency-free: reads only the tier doc, schema JSON, and manifest YAML.
        run: cargo run -p cassandra-parity -- tier-contract-check --manifest test-data/cassandra-parity-manifest.yml

      - name: Artifact retention meets tier minimums (#1027)
        # Fail-closed enforcement of the per-tier retention policy: parses each
        # parity workflow's upload-artifact `retention-days` (grouped by the tiers
        # its manifest scenarios gate) against the documented minimums in
        # docs/development/parity-ci-tiers.md. Fast, dependency-free: reads only
        # the tier doc, manifest YAML, and workflow YAML already in the checkout.
        run: cargo run -p cassandra-parity -- retention-check --manifest test-data/cassandra-parity-manifest.yml

      - name: Report is not stale
        run: cargo run -p cassandra-parity -- report --manifest test-data/cassandra-parity-manifest.yml --output docs/reports/cassandra-test-parity.md --check

      - name: Coverage of high-relevance Cassandra files (strict — every high-relevance file must be classified)
        # Fail-closed ratchet (issue #1199): every high-relevance Cassandra index
        # file must be classified by a manifest scenario (mirrored/partial/planned/
        # out_of_scope). An unclassified high-relevance file fails the gate, so
        # coverage can never silently regress below 100%.
        run: cargo run -p cassandra-parity -- coverage --strict --manifest test-data/cassandra-parity-manifest.yml

      - name: Unit + integration tests
        run: cargo test -p cassandra-parity

  # Orphaned-debt open-state check (issue #1401). The OFFLINE linter (the
  # `parity-manifest` job above) fail-closes when a `partial` scenario lacks a
  # scope.target_issue or its next_step does not cite it. THIS job is the NETWORK
  # half: it verifies each partial's target_issue is still OPEN on GitHub, so debt
  # parked on a now-CLOSED tracker (exactly the #1401 failure) is caught. It runs
  # nightly + on demand (never on the PR path) and is SKIP-aware, so it cannot flake
  # a scheduled run. No untrusted `${{ github.* }}` value is interpolated into any
  # `run:` shell — the manifest path is a constant.
  partial-open-issue-check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify every partial target_issue is OPEN (SKIP-aware)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/tests/check-parity-partial-open-issues.sh

  # Self-healing for the semantic merge race (issue #1338). The committed report
  # docs/reports/cassandra-test-parity.md is a DERIVED artifact rendered from the
  # manifest. Two manifest-changing PRs can each regenerate it correctly vs their
  # own base, yet a squash-merge in the wrong order leaves main's report rendered
  # against a stale base — a drift no per-PR `--check` can catch (each PR is green
  # vs its base; the staleness exists only post-merge). The `parity-manifest` job
  # above is the DETECTOR (its `Report is not stale` step reds on the bad tip); this
  # job is the HEALER. On push to main, if the report is stale it regenerates it and
  # opens (or force-updates) a single regeneration PR from a fixed bot branch — it
  # NEVER pushes to protected main directly. The regen PR's merge makes `--check`
  # green on the new tip, terminating the cycle.
  #
  # Non-recursion: this job's push trigger is scoped to `branches: [main]`, so a
  # push to the bot branch (a different branch) cannot retrigger it; we also guard
  # on actor as defense-in-depth. No untrusted `${{ github.* }}` value is ever
  # interpolated into a `run:` shell — paths/branch are constants passed via quoted
  # env vars and the PR title/body are static (GitHub Actions command-injection
  # safety).
  parity-report-heal:
    # Serialize heal runs so two near-simultaneous main pushes cannot both
    # force-push auto/parity-report-regen and race the `gh pr list`/`gh pr create`
    # TOCTOU (issue #1338 roborev). Do not cancel: each push must be evaluated.
    concurrency:
      group: parity-report-heal
      cancel-in-progress: false
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      REGEN_BRANCH: auto/parity-report-regen
      REPORT_PATH: docs/reports/cassandra-test-parity.md
      MANIFEST_PATH: test-data/cassandra-parity-manifest.yml
      # NOTE: the PAT/App token (secret PARITY_HEAL_TOKEN) is NOT exported job-wide.
      # It is set as step-level `env:` only on the final `gh`-invoking step, so the
      # `cargo build`/`cargo run` steps (which execute third-party crate build
      # scripts) never see it as an env var. Combined with `persist-credentials:
      # false` on checkout (below) the PAT is also NOT written to .git/config, so a
      # build script in the cargo dependency tree cannot read it off disk either —
      # the credential exists only inside the final gh/push step (issue #1338 roborev).
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Do NOT persist any credential into .git/config: otherwise the token
          # would be readable on disk by the later cargo build/run steps for the
          # whole job. The clone uses the default token; the regen push is
          # authenticated explicitly, in-step, with $GH_TOKEN (issue #1338 roborev).
          persist-credentials: false

      # Same clippy-conflict avoidance as the parity-manifest job (issue #1209/#1217).
      - name: Remove preinstalled clippy (avoid clippy-preview install conflict)
        shell: bash
        run: rustup component remove clippy --toolchain stable 2>/dev/null || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0  # pinned to rust-toolchain.toml (issue #1990)

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-parity-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}

      - name: Build cassandra-parity
        run: cargo build -p cassandra-parity

      - name: Detect report staleness
        id: freshness
        shell: bash
        run: |
          set +e
          out=$(cargo run -p cassandra-parity -- report \
                  --manifest "$MANIFEST_PATH" --output "$REPORT_PATH" --check 2>&1)
          rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -q 'STALE'; then
            # Genuine drift: report differs from a fresh render → heal it.
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            # A non-stale failure (e.g. an invalid manifest that fails lint) must
            # NOT masquerade as staleness — regenerating would fail identically and
            # obscure the real cause. Fail this step distinctly (issue #1338 roborev).
            echo "::error::report --check failed for a non-staleness reason (e.g. invalid manifest); not a drift. See output above." >&2
            exit "$rc"
          fi

      - name: Regenerate the report
        if: steps.freshness.outputs.stale == 'true'
        shell: bash
        run: |
          cargo run -p cassandra-parity -- report \
            --manifest "$MANIFEST_PATH" --output "$REPORT_PATH"

      - name: Open or update the regeneration PR
        if: steps.freshness.outputs.stale == 'true'
        shell: bash
        # Scope the PAT/App token to only this step (not the cargo build/run steps).
        # A PR opened with the default GITHUB_TOKEN does NOT trigger `pull_request`
        # CI (recursion guard), so PARITY_HEAL_TOKEN (contents + pull-requests write,
        # like PROJECTS_TOKEN) makes the regen PR fire CI. Absent → the guard below
        # SKIPs with a ::notice:: rather than opening a check-less PR (issue #1338).
        env:
          GH_TOKEN: ${{ secrets.PARITY_HEAL_TOKEN }}
        run: |
          set -euo pipefail
          # A PR opened by the default GITHUB_TOKEN gets no CI (GitHub recursion
          # guard). Without the PAT/App token we cannot open a mergeable PR, so
          # SKIP loudly instead of opening a check-less one (issue #1338).
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::PARITY_HEAL_TOKEN not set — report drifted on main but the auto-regeneration PR was skipped. Add a PAT/App token (contents + pull-requests write) as repo secret PARITY_HEAL_TOKEN to enable self-healing; until then regenerate manually: cargo run -p cassandra-parity -- report --output $REPORT_PATH"
            exit 0
          fi
          # The regen step writes only the report. Refuse to proceed if anything
          # else changed (defensive; keeps the heal PR to a single file — D4).
          # Stage all changes first so the guard also sees a newly-created (untracked)
          # report — `git diff --name-only` alone omits untracked files (issue #1338).
          git add -A
          changed=$(git diff --cached --name-only)
          if [ -z "$changed" ]; then
            echo "Report already in sync after regeneration; nothing to do."
            exit 0
          fi
          if [ "$changed" != "$REPORT_PATH" ]; then
            echo "Refusing to open PR: regeneration changed more than $REPORT_PATH:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Force-update the fixed bot branch so we never stack duplicate PRs (D4).
          # The staged report survives the branch switch (same HEAD, index preserved).
          git checkout -B "$REGEN_BRANCH"
          git add "$REPORT_PATH"
          git commit -m "chore(parity): regenerate stale cassandra-test-parity report"
          # Authenticate the push in-step (checkout used persist-credentials: false,
          # so `origin` has no stored credential). $GH_TOKEN is a masked secret and
          # $GITHUB_REPOSITORY is a trusted default env var — no untrusted value is
          # interpolated. Pushing with the PAT is what makes the regen PR fire CI.
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/$REGEN_BRANCH"
          # Open a PR only if none is already open for this branch; otherwise the
          # force-push above has already updated the existing PR (idempotent — D4).
          existing=$(gh pr list --head "$REGEN_BRANCH" --state open --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh pr create --base main --head "$REGEN_BRANCH" \
              --title "chore(parity): regenerate stale cassandra-test-parity report" \
              --body "Automated regeneration of the committed parity report from the manifest. The report drifted from a fresh render on main (a semantic merge race between two manifest-changing PRs — see docs/development/parity-ci-tiers.md and issue #1338). This PR changes only docs/reports/cassandra-test-parity.md; merging it makes the parity-manifest staleness check green again."
          else
            echo "An open regeneration PR already exists; its branch was updated."
          fi
