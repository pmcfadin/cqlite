name: Cassandra Parity Manifest

# Fast PR gate (issue #976/#978): validates the parity manifest against the
# schema + cross-field rules and fails if the generated report is stale.
# No Docker, live Cassandra, or downloaded dataset binaries required — the tool
# only reads the manifest, the repository tree, and the assessment report. The
# JSONL/TOC/Digest reference files it checks are committed to the repo.

on:
  push:
    branches: [ main ]
    paths:
      - 'test-data/cassandra-parity-manifest.yml'
      - 'test-data/cassandra-parity-manifest.schema.json'
      - 'tools/cassandra-parity/**'
      - 'docs/reports/cassandra-test-parity*.md'
      - 'docs/cassandra_test_index.md'
      # ANY workflow under .github/workflows is a potential `ci.workflow` target
      # of a required_parity scenario; the lint's anti-overstatement check
      # (workflow_check) reads those files to prove the mapped test runs
      # blocking + fail-closed. Editing a referenced parity workflow MUST re-run
      # this lint, so scope the whole directory (not just this file). Without
      # this the machine enforcement could be silently bypassed by a workflow
      # edit. (issue #1228 roborev finding A)
      - '.github/workflows/**'
      # Release-facing docs the public-claim scanner (`lint`) reads — must stay in
      # sync with `claim_scan::RELEASE_FILES` so an over-claim added to one of
      # these still triggers the lint job. (issue #1023)
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/development/parity-ci-tiers.md'
      - 'docs/development/parity-release-checklist.md'
      - 'docs/development/cassandra-parity-manifest.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'test-data/cassandra-parity-manifest.yml'
      - 'test-data/cassandra-parity-manifest.schema.json'
      - 'tools/cassandra-parity/**'
      - 'docs/reports/cassandra-test-parity*.md'
      - 'docs/cassandra_test_index.md'
      # ANY workflow under .github/workflows is a potential `ci.workflow` target
      # of a required_parity scenario; the lint's anti-overstatement check
      # (workflow_check) reads those files to prove the mapped test runs
      # blocking + fail-closed. Editing a referenced parity workflow MUST re-run
      # this lint, so scope the whole directory (not just this file). Without
      # this the machine enforcement could be silently bypassed by a workflow
      # edit. (issue #1228 roborev finding A)
      - '.github/workflows/**'
      # Release-facing docs the public-claim scanner (`lint`) reads — must stay in
      # sync with `claim_scan::RELEASE_FILES` so an over-claim added to one of
      # these still triggers the lint job. (issue #1023)
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/development/parity-ci-tiers.md'
      - 'docs/development/parity-release-checklist.md'
      - 'docs/development/cassandra-parity-manifest.md'

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: cassandra-parity-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parity-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-parity-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}

      - name: Build cassandra-parity
        run: cargo build -p cassandra-parity

      - name: Lint manifest (schema + cross-field parity rules)
        run: cargo run -p cassandra-parity -- lint --manifest test-data/cassandra-parity-manifest.yml

      - name: Tier contract is not drifted (doc == schema == code enum; #1022)
        # Fast, dependency-free: reads only the tier doc, schema JSON, and manifest YAML.
        run: cargo run -p cassandra-parity -- tier-contract-check --manifest test-data/cassandra-parity-manifest.yml

      - name: Report is not stale
        run: cargo run -p cassandra-parity -- report --manifest test-data/cassandra-parity-manifest.yml --output docs/reports/cassandra-test-parity.md --check

      - name: Coverage of high-relevance Cassandra files (strict — every high-relevance file must be classified)
        # Fail-closed ratchet (issue #1199): every high-relevance Cassandra index
        # file must be classified by a manifest scenario (mirrored/partial/planned/
        # out_of_scope). An unclassified high-relevance file fails the gate, so
        # coverage can never silently regress below 100%.
        run: cargo run -p cassandra-parity -- coverage --strict --manifest test-data/cassandra-parity-manifest.yml

      - name: Unit + integration tests
        run: cargo test -p cassandra-parity
