name: Node.js CI

on:
  schedule:
    # Nightly full bindings coverage at 03:15 UTC
    - cron: '15 3 * * *'
  push:
    branches: [main]
    paths:
      - 'bindings/node/**'
      - 'cqlite-core/**'
      - '.github/workflows/node-ci.yml'
      # Issue #1459: the ABI-critical dependency versions are inherited from the
      # workspace root, NOT declared in bindings/node — `napi` and `pyo3` are
      # `{ workspace = true }`. So a root manifest/lockfile bump can change the
      # Node-API level or the abi3 floor, which is exactly what the floor jobs
      # below certify. Without these two paths such a bump merges WITHOUT
      # running them, and the floor claim's own premise changes untested.
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths:
      - 'bindings/node/**'
      - 'cqlite-core/**'
      - '.github/workflows/node-ci.yml'
      # Issue #1459: the ABI-critical dependency versions are inherited from the
      # workspace root, NOT declared in bindings/node — `napi` and `pyo3` are
      # `{ workspace = true }`. So a root manifest/lockfile bump can change the
      # Node-API level or the abi3 floor, which is exactly what the floor jobs
      # below certify. Without these two paths such a bump merges WITHOUT
      # running them, and the floor claim's own premise changes untested.
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

concurrency:
  group: node-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  DATASET_TAG: datasets-v3
  DATASET_ASSET: cassandra5-small-full-v3.5.tar.gz
  DATASET_SHA256: 414195074f6df446a7381aad051af84158e9a021a6e2cd21cbc6c3ad0be1ba16
  APP_NAME: cqlite-node

jobs:
  smoke:
    name: PR smoke (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bindings/node/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1  # pinned to rust-toolchain.toml (issue #1990)

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "bindings/node -> target"
          key: ${{ runner.os }}-smoke

      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci

      - name: Build native module
        working-directory: bindings/node
        run: npm run build

      - name: Typecheck examples
        working-directory: bindings/node
        run: npm run typecheck

      - name: Run smoke Jest subset
        working-directory: bindings/node
        # write-smoke.test.js (issue #1460) runs against the release-built
        # (`npm run build` = --features write-support) `.node` artifact and
        # asserts a DML INSERT is routed to the write engine and persists a
        # non-empty *-Data.db. It reds if the write-support flag is ever dropped
        # (the fix makes a stripped build fail closed on DML). Kept in the always
        # -required smoke subset so it guards every PR, not just ci:bindings-full.
        run: npx jest __test__/loader.test.js __test__/publish.test.js __test__/smoke.test.js __test__/write-smoke.test.js --runInBand

      # Issue #1459: the floor job below REUSES this binary instead of building
      # its own. Node-API is ABI-stable across Node majors, which is the whole
      # reason we ship a prebuilt `.node` — so the artifact that must load on
      # Node 18 is THIS one, not a fresh Node-18 build. Uploading it here —
      # rather than in the label-gated `build` job, the only other producer of a
      # linux x86_64 module — is what lets the floor legs REBUILD NOTHING.
      #
      # The name MUST stay outside the `bindings-*` namespace. `quality-gate`
      # collects `pattern: bindings-*` with `merge-multiple: true` and
      # republishes the result as the `cqlite-node-binaries` artifact. That
      # merge flattens every artifact into ONE directory, and this upload's
      # `path` is the same `${APP_NAME}.*.node` basename the production
      # x86_64-unknown-linux-gnu build emits — so inside the `bindings-*`
      # namespace this module would not merely be an extra file, it would
      # OVERWRITE the production module and be published in its place.
      - name: Upload smoke native module (reused by the floor job)
        uses: actions/upload-artifact@v6
        with:
          name: floor-smoke-bindings-linux
          path: bindings/node/${{ env.APP_NAME }}.*.node
          if-no-files-found: error
          retention-days: 7

  smoke-floor:
    # Issue #1459: `package.json` advertised `engines.node: ">= 18"` while every
    # other job here pinned Node 20 — so the advertised floor went untested and
    # a floor break would have reached users first. This job closes that honesty
    # gap cheaply: it REBUILDS NOTHING, loading the prebuilt `.node` the `smoke`
    # job already produced (Node-API is ABI-stable across majors).
    #
    # The matrix is BOTH ends of the advertised range, and the range is
    # DISCONTINUOUS on purpose: `Cargo.toml` enables napi9, and Node-API 9 ships
    # in 18.17.0+ and 20.3.0+ but NEVER in 19.x or 20.0-20.2. So `engines.node`
    # is `^18.17.0 || >= 20.3.0`, which has TWO lower boundaries — and a claim
    # is only tested if every boundary it asserts is executed. Testing 18.17.0
    # alone would leave the 20.3.0 boundary advertised-but-unproven, which is
    # the exact shape of the bug this issue exists to close.
    #
    # Scope is deliberate. Each leg runs the floor smoke script (version + load
    # + ONE real query, failing on a 0-row result) plus the SAME dataset-free
    # jest subset the `smoke` job runs — enough to catch a jest/Node
    # incompatibility in the harness itself. It does NOT run the full `npm test`
    # suite: behavioural coverage is the `test` job's business, and duplicating
    # it per boundary buys the same assertions three times.
    name: Floor smoke (Node ${{ matrix.node }})
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'ci:bindings-full')
      }}
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # The two lower BOUNDARIES of `engines.node`, plus the current
        # maintained MAJOR. Boundaries are exact patch versions — `'18'`
        # resolves to the newest 18.x and would leave the actual boundary
        # unexercised — while `24` is a bare major because no specific patch is
        # being claimed there. floor-smoke.js asserts exactly and by-major
        # respectively, chosen by the shape of the value.
        #
        # 24 is here because `engines.node` is unbounded ABOVE `20.3.0`, so the
        # newest maintained major is inside the advertised range; Node-API ABI
        # stability does NOT cover regressions in the JS loader or wrapper. It is
        # also the major `node-release.yml:163` already publishes with, so
        # without this leg the release path itself ran on an untested major.
        # Time-sensitive, like the Python list: when a new major becomes current
        # it belongs here.
        node: ['18.17.0', '20.3.0', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node }} (an advertised engines.node boundary, exactly)
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: bindings/node/package-lock.json

      - name: Download the native module built by the smoke job
        uses: actions/download-artifact@v7
        with:
          name: floor-smoke-bindings-linux
          path: bindings/node

      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci

      - name: Generate the platform loader
        # index.js is generated, not committed (scripts/generate-loader.mjs, run
        # by the `postbuild`/`pretest` hooks). The floor smoke requires it
        # directly, so generate it explicitly rather than relying on a hook.
        working-directory: bindings/node
        run: node scripts/generate-loader.mjs

      - name: Restore canonical datasets
        uses: ./.github/actions/restore-canonical-datasets
        with:
          dataset-tag: ${{ env.DATASET_TAG }}
          dataset-asset: ${{ env.DATASET_ASSET }}
          dataset-sha256: ${{ env.DATASET_SHA256 }}

      - name: Run floor smoke (load + one real query, 0 rows fails)
        working-directory: bindings/node
        env:
          CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
          # Asserted inside the script: a `setup-node` no-op would otherwise
          # make this a second Node-20 run reporting a floor it never touched.
          CQLITE_FLOOR_EXPECT_NODE_VERSION: ${{ matrix.node }}
          # The step above restores the corpus, so an absent one here is a
          # BROKEN RESTORE, not a legitimate skip. Fail rather than report a
          # green floor whose query never ran.
          CQLITE_FLOOR_STRICT_FIXTURES: '1'
        run: |
          set -euo pipefail
          node scripts/floor-smoke.js

      - name: Run smoke Jest subset on Node ${{ matrix.node }}
        working-directory: bindings/node
        run: |
          set -euo pipefail
          npx jest __test__/loader.test.js __test__/publish.test.js __test__/smoke.test.js __test__/write-smoke.test.js --runInBand

  build:
    name: Build (${{ matrix.target }})
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'ci:bindings-full')
      }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bindings/node/package-lock.json

      # Issue #1209: GitHub runner images ship a stable toolchain that already
      # provides bin/cargo-clippy. The dtolnay/rust-toolchain@1.97.1 action is
      # invoked with `targets:`, so it performs a rustup reconcile that can
      # intermittently try to (re)install the 'clippy-preview' component and
      # fail with "detected conflict: 'bin/cargo-clippy'". Remove the conflicting
      # component FIRST — before the toolchain action runs any rustup work — so
      # the @stable setup (which defaults to the minimal profile, no clippy)
      # cannot reinstall clippy-preview. The runner ships a working rustup, so
      # this `run:` step before the action has rustup available.
      # This build lane does not run clippy. Idempotent: a no-op if clippy is absent.
      - name: Remove preinstalled clippy (avoid clippy-preview install conflict)
        shell: bash
        run: rustup component remove clippy 2>/dev/null || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1  # pinned to rust-toolchain.toml (issue #1990)
        with:
          targets: ${{ matrix.target }}

      - name: Ensure Rust target is installed
        run: rustup target add ${{ matrix.target }}

      - name: Normalize PATH for macOS (prepend ~/.cargo/bin so real cargo wins over rustup-init)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify Rust toolchain (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          which -a cargo rustup rustup-init || true
          cargo --version
          rustup --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "bindings/node -> target"
          key: ${{ matrix.os }}-${{ matrix.target }}

      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci

      - name: Build native module
        working-directory: bindings/node
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            # Use --use-napi-cross for ARM64 Linux cross-compilation (napi-rs v3)
            npm run build -- --target aarch64-unknown-linux-gnu --use-napi-cross
          else
            # Native builds (including x86_64-apple-darwin on Intel Mac)
            npm run build
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node/${{ env.APP_NAME }}.*.node
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test (${{ matrix.os }})
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'ci:bindings-full')
      }}
    runs-on: ${{ matrix.os }}
    needs: build
    timeout-minutes: 20
    # Issue #1979: windows-latest has 3 chronic, pre-existing, Windows-only test
    # failures (refresh / write-smoke / execute-deprecation — filesystem/locking
    # behaviors, e.g. refresh expects readersRemoved===1 but gets 0). They are NOT
    # release-gating for v0.13 (owner decision 2026-07-05). Keep the leg RUNNING for
    # visibility but non-blocking, so a windows failure does not red the workflow.
    # ubuntu-latest + macos-14 remain required. Debt tracked in #1979.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Native test platforms only
          # Note: x86_64-apple-darwin is build-only (cross-compiled on ARM64, can't test)
          # Note: aarch64-unknown-linux-gnu is build-only (cross-compiled, can't test)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bindings/node/package-lock.json

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node

      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci

      - name: Restore dataset cache
        id: dataset-cache
        uses: actions/cache@v5
        with:
          path: test-data/datasets
          key: datasets-${{ env.DATASET_TAG }}-${{ env.DATASET_SHA256 }}

      - name: Fetch datasets if cache miss (Unix)
        if: steps.dataset-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p test-data/datasets
          curl -fsSL -o "/tmp/${DATASET_ASSET}" \
            "https://github.com/pmcfadin/cqlite/releases/download/${DATASET_TAG}/${DATASET_ASSET}"
          # Issue #1324: portable checksum — GitHub's macOS runners ship `shasum`
          # (perl), not GNU coreutils `sha256sum`. Match release.yml's idiom.
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${DATASET_SHA256}  /tmp/${DATASET_ASSET}" | sha256sum -c -
          else
            echo "${DATASET_SHA256}  /tmp/${DATASET_ASSET}" | shasum -a 256 -c -
          fi
          tar -xzf "/tmp/${DATASET_ASSET}" -C . --exclude='*/._*' --exclude='._*' --exclude='*/.DS_Store' --exclude='.DS_Store'
          # Issue #1335: stamp the .dataset-pin that fetch-datasets.sh writes so
          # the shared `datasets-${DATASET_TAG}-${DATASET_SHA256}` cache entry is
          # accepted by has_required_dataset() in jobs that use fetch-datasets.sh
          # (no needless re-download; a genuinely stale pin still forces refetch).
          printf 'tag=%s\nasset=%s\nsha256=%s\n' \
            "${DATASET_TAG}" "${DATASET_ASSET}" "${DATASET_SHA256}" \
            > test-data/datasets/.dataset-pin

      - name: Fetch datasets if cache miss (Windows)
        if: steps.dataset-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-data/datasets
          $url = "https://github.com/pmcfadin/cqlite/releases/download/$env:DATASET_TAG/$env:DATASET_ASSET"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\$env:DATASET_ASSET"
          $hash = (Get-FileHash "$env:TEMP\$env:DATASET_ASSET" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:DATASET_SHA256) {
            throw "SHA256 mismatch: expected $env:DATASET_SHA256, got $hash"
          }
          tar -xzf "$env:TEMP\$env:DATASET_ASSET" -C . --exclude='*/._*' --exclude='._*' --exclude='*/.DS_Store' --exclude='.DS_Store'
          # Issue #1335: stamp the .dataset-pin fetch-datasets.sh writes so the
          # shared cache entry is accepted by has_required_dataset(). LF newlines
          # to match the bash-written pin (grep -qx exact-line match).
          $pin = "tag=$env:DATASET_TAG`nasset=$env:DATASET_ASSET`nsha256=$env:DATASET_SHA256`n"
          [System.IO.File]::WriteAllText("test-data/datasets/.dataset-pin", $pin)

      - name: Sanity check dataset
        shell: bash
        run: |
          set -euo pipefail
          test -f test-data/datasets/metadata.yml
          # Issue #1230: assert the full 39-table enforced corpus (33 nb + 6
          # test_oa) — was a non-failing `ls ... || true` that passed even on a
          # partial extraction.
          bash test-data/scripts/check-dataset-manifest.sh test-data/datasets

      - name: Run smoke tests
        working-directory: bindings/node
        env:
          CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
          # Issue #1230: for the node lane this flag is DOCUMENTARY only — it is a
          # cqlite-core TEST-ONLY helper and is NOT consulted by the node binding
          # runtime. Actual fail-closed coverage here comes from the
          # check-dataset-manifest.sh step above (hard-fails on a partial/dropped
          # 39-table corpus) plus the JS assertDatasetsAvailable() throw on missing data
          # (#3641 renamed it from skipIfNoDatasets, which never skipped). The flag
          # is set for parity of intent with the Rust/Python lanes.
          CQLITE_REQUIRE_FIXTURES: "1"
          # Issue #1465 (roborev V1): the exception-path/abandoned-iterator leak budgets
          # in __test__/leak-paths.test.js run 2x-relaxed on THESE legs, and that is now
          # OPT-IN and explicit. It used to happen by accident — the multiplier keyed on
          # `CI`, which every Actions runner sets — which also silently doubled the
          # ceilings in gate.yml's nightly FULL-gate backstop on main. The gate now
          # UNSETS this variable, so the only relaxed runs are the ones that ask.
          #
          # Why these legs ask: every budget number in that file was measured on one
          # Linux fleet box, and this matrix (ubuntu-latest, macos-14, windows-latest)
          # has never been measured. node-ci.yml is a registered exemption in
          # .github/ci-gating-tiers.yml, so a red here is triage noise rather than a
          # merge block — and a flaky red on an exempt lane teaches people to ignore the
          # lane. If a leg is ever measured strict-clean, drop this line (with the data).
          CQLITE_LEAK_BUDGET_RELAX: "2x-ceilings"
        run: npm test

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.os }}
          path: bindings/node/__test__/
          retention-days: 7

  quality-gate:
    name: Node.js CI Quality Gate
    runs-on: ubuntu-latest
    needs: [smoke, smoke-floor, build, test]
    if: always()
    env:
      RUN_FULL: >-
        ${{
          github.event_name != 'pull_request' ||
          contains(github.event.pull_request.labels.*.name, 'ci:bindings-full')
        }}

    steps:
      - name: Check smoke results
        run: |
          echo "Smoke results: ${{ needs.smoke.result }}"
          if [ "${{ needs.smoke.result }}" != "success" ]; then
            echo "::error::Node.js smoke checks failed"
            exit 1
          fi

      - name: Check floor smoke results
        # Only assert when the floor tier actually ran. RUN_FULL is the SAME
        # condition that gates the floor job itself, so on a routine unlabeled PR
        # the job is legitimately `skipped` and this check must not fire — an
        # unconditional `!= success` here would red every ordinary PR.
        if: env.RUN_FULL == 'true'
        env:
          FLOOR_RESULT: ${{ needs.smoke-floor.result }}
        run: |
          # Issue #1459: asserted whenever the floor tier RAN. Guarded by
          # RUN_FULL above because `smoke-floor` is a binding matrix job and repo
          # policy (scripts/ci/validate-workflows.rb) requires those to be
          # label-gated — so on a routine unlabeled PR it is legitimately
          # `skipped`, and an unconditional `!= success` would red every such PR.
          echo "Floor smoke results: ${FLOOR_RESULT}"
          if [ "${FLOOR_RESULT}" != "success" ]; then
            echo "::error::Node.js floor smoke failed (advertised engines.node floor)"
            exit 1
          fi

      - name: Check build results
        if: env.RUN_FULL == 'true'
        run: |
          echo "Build results: ${{ needs.build.result }}"
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::Native module builds failed"
            exit 1
          fi

      - name: Check test results
        if: env.RUN_FULL == 'true'
        run: |
          echo "Test results: ${{ needs.test.result }}"
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Tests failed on one or more platforms"
            exit 1
          fi

      - name: Download all artifacts
        if: env.RUN_FULL == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: bindings-*
          path: artifacts
          merge-multiple: true

      - name: List native modules
        if: env.RUN_FULL == 'true'
        run: |
          echo "::group::Built native modules"
          ls -lh artifacts/
          echo "::endgroup::"

          MODULE_COUNT=$(find artifacts -maxdepth 1 -type f -name '*.node' | wc -l | tr -d ' ')
          echo "Native module count: $MODULE_COUNT"

          if [ "$MODULE_COUNT" -ne 5 ]; then
            echo "::error::Expected exactly 5 native modules (the supported matrix), found $MODULE_COUNT"
            exit 1
          fi

      - name: Upload merged artifact
        if: env.RUN_FULL == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: cqlite-node-binaries
          path: artifacts/*.node
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "## Node.js CI Summary"
            echo ""
            echo "### Tier"
            echo "- Ordinary PRs run the Ubuntu smoke build, typecheck, and loader/package smoke Jest subset."
            echo "- Floor smoke covers both advertised \`engines.node\` boundaries (18.17.0, 20.3.0) plus the current maintained major (24), reusing the prebuilt native module from the smoke job; each leg restores the canonical corpus and runs one real query, failing on a 0-row result. It is a binding MATRIX tier, so per repo policy it runs on every push to \`main\`, on the nightly schedule, and on PRs labeled \`ci:bindings-full\` — NOT on a routine unlabeled PR (issue #1459)."
            echo "- Full cross-platform builds, the full dataset-backed Jest suite, and merged native artifacts run on push to main, nightly schedule, workflow_dispatch, or PRs labeled \`ci:bindings-full\`."
            echo ""
            echo "### Native Module Builds"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${RUN_FULL}" = "true" ]; then
            {
              echo "| Target | Status |"
              echo "|--------|--------|"
              echo "| x86_64-unknown-linux-gnu | :white_check_mark: |"
              echo "| aarch64-unknown-linux-gnu | :white_check_mark: |"
              echo "| x86_64-apple-darwin | :white_check_mark: |"
              echo "| aarch64-apple-darwin | :white_check_mark: |"
              echo "| x86_64-pc-windows-msvc | :white_check_mark: |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Skipped for the default PR smoke tier." >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo ""
            echo "### Test Results"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${RUN_FULL}" = "true" ]; then
            {
              echo "Tests passed on 3 native platforms (ARM64 Linux and x86_64 macOS are build-only)"
              echo "Floor legs (Node 18.17.0, 20.3.0 and 24) each restored the canonical corpus and ran one real query (issue #1459)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # RUN_FULL is false, which is EXACTLY when the label-gated floor
            # matrix was skipped — so this branch must not claim the floor legs
            # ran. Saying otherwise would make the CI summary itself assert an
            # untested floor, which is the defect issue #1459 exists to remove.
            {
              echo "Smoke checks passed on Ubuntu (the \`smoke\` job is dataset-free)."
