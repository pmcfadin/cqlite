name: Node.js CI

on:
  schedule:
    # Nightly full bindings coverage at 03:15 UTC
    - cron: '15 3 * * *'
  push:
    branches: [main]
    paths:
      - 'bindings/node/**'
      - 'cqlite-core/**'
      - '.github/workflows/node-ci.yml'
      # Issue #1459: the ABI-critical dependency versions are inherited from the
      # workspace root, NOT declared in bindings/node — `napi` and `pyo3` are
      # `{ workspace = true }`. So a root manifest/lockfile bump can change the
      # Node-API level or the abi3 floor, which is exactly what the floor jobs
      # below certify. Without these two paths such a bump merges WITHOUT
      # running them, and the floor claim's own premise changes untested.
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    # REGISTERED GATING TIER (issue #3640; registry .github/ci-gating-tiers.yml,
    # mechanism #2910). The trigger MUST always fire so the `Node.js CI Quality
    # Gate` context is emitted on EVERY pull request — to the aggregator an absent
    # registered context is an ERROR, never "not applicable". Hence the
    # established always-fire sentinel: a paths-ignore that can never match. The
    # diff-based mandate that used to live in the `paths:` list above now lives in
    # the `classify` job below, which is what lets an inapplicable tier report
    # itself as an explicit SUCCESS instead of as silence.
    #
    # No `branches:` filter either: a PR based on anything but main would never
    # start this workflow, leaving `required` to wait out the whole deadline on a
    # context that can never appear. gating_event_rules.rb enforces both absences,
    # and the `types:` list must stay a subset of pr-gate.yml's observed set.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths-ignore:
      - '__required_ci_context_never_matches__'
  workflow_dispatch:

concurrency:
  group: node-ci-${{ github.ref }}
  # A new head sha obsoletes the in-flight run, so cancel it. A LABEL mutation
  # does not (issue #2910 round 4, applied here by #3640): this workflow
  # subscribes to `labeled` so its `ci:bindings-full` opt-in is reachable, and
  # `github.event_name == 'pull_request'` is TRUE for `labeled`/`unlabeled` — so
  # the previous expression behaved exactly like `true` on a label event. Now that
  # this workflow is a REGISTERED TIER that is actively harmful: applying the
  # `ci:waive:node` break-glass to a wedged PR would CANCEL this tier's in-flight
  # run and mint a fresh `queued` check run, and a PENDING tier's waiver is only
  # honoured at the aggregation deadline — the escape hatch making things worse
  # before it made them better. gating_event_rules.rb `concurrency_errors` rejects
  # any cancellation policy on a registered tier that is not provably false for
  # label events.
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
    && github.event.action != 'labeled'
    && github.event.action != 'unlabeled' }}

env:
  CARGO_TERM_COLOR: always
  DATASET_TAG: datasets-v3
  DATASET_ASSET: cassandra5-small-full-v3.5.tar.gz
  DATASET_SHA256: 414195074f6df446a7381aad051af84158e9a021a6e2cd21cbc6c3ad0be1ba16
  APP_NAME: cqlite-node

jobs:
  # ALWAYS-RUN classifier (issue #3640; pattern: flight-ci.yml `classify`, itself
  # after observability-gate.yml). This workflow is a REGISTERED GATING TIER, so
  # its trigger can carry no `paths:` filter — applicability has to be decided
  # HERE instead, from the diff, and reported through ONE output.
  #
  # EXACTLY ONE applicability output (issue #2910 round 2, enforced by
  # gating_policy_rules.rb `applicability_scope_errors`): two outputs behind one
  # context means a diff can satisfy the narrower predicate, skip the work the
  # tier exists to run, and still report success. The `ci:bindings-full` label
  # survives as a manual opt-in that also sets `run_tier=true`, so the heavy
  # label-gated jobs below can never run with `smoke` skipped.
  classify:
    name: Classify Node tier scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_tier: ${{ steps.scope.outputs.run_tier }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify diff and labels
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_FULL_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:bindings-full') }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run_tier=true" >> "$GITHUB_OUTPUT"
            echo "reason=non-PR event (${EVENT_NAME}): full tier" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > changed-files.txt
          echo "Changed files:"
          sed 's/^/  - /' changed-files.txt

          # FAIL-CLOSED on an empty/ambiguous changed-file set (same rule as
          # pr-gate.yml's docs-only classifier and flight-ci.yml's): if we cannot
          # see the diff we cannot conclude the tier is inapplicable.
          if [ ! -s changed-files.txt ]; then
            echo "run_tier=true" >> "$GITHUB_OUTPUT"
            echo "reason=empty changed-file set; running the tier fail-closed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # THE MANDATE SET. It is DELIBERATELY THE SAME SET the `pull_request`
          # `paths:` filter carried before this workflow was enrolled (#3640), so
          # enrolment changes WHEN the context is emitted (always) without
          # changing WHICH diffs run the work:
          #   bindings/node/**                 the binding, its loader and its tests
          #   cqlite-core/**                   the engine the binding wraps
          #   Cargo.toml / Cargo.lock          issue #1459: `napi` is
          #                                    `{ workspace = true }`, so a root
          #                                    manifest bump can move the Node-API
          #                                    level the floor claim rests on
          #   .github/workflows/node-ci.yml    the tier definition itself
          # NOT mandated, deliberately: test-data/** and rust-toolchain.toml. The
          # Linux half of a corpus/toolchain change is already covered by the local
          # gate's node-bindings + binding-rust-tests components, and the VALUE of
          # this enrolment is the macOS and Windows legs, which a corpus edit does
          # not single out. `ci:bindings-full` remains the opt-in for those diffs.
          # `.github/ci-gating-tiers.yml` documents this list under `mandate_paths`
          # and gating_policy_rules.rb reds the gate if the two drift apart.
          mandate_regex='^(bindings/node/|cqlite-core/|Cargo\.toml$|Cargo\.lock$|\.github/workflows/node-ci\.yml$)'

          run_tier=false
          reason='no Node-binding-relevant path in the diff and no ci:bindings-full label'
          if grep -Eq "$mandate_regex" changed-files.txt; then
            run_tier=true
            reason='diff reaches the Node binding at runtime; running the tier on all three gating platforms'
          fi
          if [ "$HAS_FULL_LABEL" = "true" ]; then
            run_tier=true
            reason='ci:bindings-full label opt-in'
          fi

          echo "run_tier=${run_tier}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "Node tier verdict: run_tier=${run_tier} (${reason})"

  smoke:
    name: PR smoke (Ubuntu)
    needs: classify
    if: needs.classify.outputs.run_tier == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bindings/node/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1  # pinned to rust-toolchain.toml (issue #1990)

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "bindings/node -> target"
          key: ${{ runner.os }}-smoke

      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci

      - name: Build native module
        working-directory: bindings/node
        run: npm run build

      - name: Typecheck examples
        working-directory: bindings/node
        run: npm run typecheck

      - name: Run smoke Jest subset
        working-directory: bindings/node
        # write-smoke.test.js (issue #1460) runs against the release-built
        # (`npm run build` = --features write-support) `.node` artifact and
        # asserts a DML INSERT is routed to the write engine and persists a
        # non-empty *-Data.db. It reds if the write-support flag is ever dropped
        # (the fix makes a stripped build fail closed on DML). Kept in the always
        # -required smoke subset so it guards every PR, not just ci:bindings-full.
        run: npx jest __test__/loader.test.js __test__/publish.test.js __test__/smoke.test.js __test__/write-smoke.test.js --runInBand

      # Issue #1459: the floor job below REUSES this binary instead of building
      # its own. Node-API is ABI-stable across Node majors, which is the whole
      # reason we ship a prebuilt `.node` — so the artifact that must load on
      # Node 18 is THIS one, not a fresh Node-18 build. Uploading it here —
      # rather than in the label-gated `build` job, the only other producer of a
      # linux x86_64 module — is what lets the floor legs REBUILD NOTHING.
      #
      # The name MUST stay outside the `bindings-*` namespace. The `bundle` job
      # (split out of `quality-gate` by #3640) collects `pattern: bindings-*` with
      # `merge-multiple: true` and republishes the result as the
      # `cqlite-node-binaries` artifact. That
      # merge flattens every artifact into ONE directory, and this upload's
      # `path` is the same `${APP_NAME}.*.node` basename the production
      # x86_64-unknown-linux-gnu build emits — so inside the `bindings-*`
      # namespace this module would not merely be an extra file, it would
      # OVERWRITE the production module and be published in its place.
      - name: Upload smoke native module (reused by the floor job)
        uses: actions/upload-artifact@v6
        with:
          name: floor-smoke-bindings-linux
          path: bindings/node/${{ env.APP_NAME }}.*.node
          if-no-files-found: error
          retention-days: 7

  smoke-floor:
    # Issue #1459: `package.json` advertised `engines.node: ">= 18"` while every
    # other job here pinned Node 20 — so the advertised floor went untested and
    # a floor break would have reached users first. This job closes that honesty
    # gap cheaply: it REBUILDS NOTHING, loading the prebuilt `.node` the `smoke`
    # job already produced (Node-API is ABI-stable across majors).
    #
    # The matrix is BOTH ends of the advertised range, and the range is
    # DISCONTINUOUS on purpose: `Cargo.toml` enables napi9, and Node-API 9 ships
    # in 18.17.0+ and 20.3.0+ but NEVER in 19.x or 20.0-20.2. So `engines.node`
    # is `^18.17.0 || >= 20.3.0`, which has TWO lower boundaries — and a claim
    # is only tested if every boundary it asserts is executed. Testing 18.17.0
    # alone would leave the 20.3.0 boundary advertised-but-unproven, which is
    # the exact shape of the bug this issue exists to close.
    #
    # Scope is deliberate. Each leg runs the floor smoke script (version + load
    # + ONE real query, failing on a 0-row result) plus the SAME dataset-free
    # jest subset the `smoke` job runs — enough to catch a jest/Node
    # incompatibility in the harness itself. It does NOT run the full `npm test`
    # suite: behavioural coverage is the `test` job's business, and duplicating
    # it per boundary buys the same assertions three times.
    name: Floor smoke (Node ${{ matrix.node }})
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'ci:bindings-full')
      }}
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # The two lower BOUNDARIES of `engines.node`, plus the current
        # maintained MAJOR. Boundaries are exact patch versions — `'18'`
        # resolves to the newest 18.x and would leave the actual boundary
        # unexercised — while `24` is a bare major because no specific patch is
        # being claimed there. floor-smoke.js asserts exactly and by-major
        # respectively, chosen by the shape of the value.
        #
        # 24 is here because `engines.node` is unbounded ABOVE `20.3.0`, so the
        # newest maintained major is inside the advertised range; Node-API ABI
        # stability does NOT cover regressions in the JS loader or wrapper. It is
        # also the major `node-release.yml:163` already publishes with, so
        # without this leg the release path itself ran on an untested major.
        # Time-sensitive, like the Python list: when a new major becomes current
        # it belongs here.
        node: ['18.17.0', '20.3.0', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node }} (an advertised engines.node boundary, exactly)
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: bindings/node/package-lock.json

      - name: Download the native module built by the smoke job
        uses: actions/download-artifact@v7
        with:
          name: floor-smoke-bindings-linux
          path: bindings/node

      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci

      - name: Generate the platform loader
        # index.js is generated, not committed (scripts/generate-loader.mjs, run
        # by the `postbuild`/`pretest` hooks). The floor smoke requires it
        # directly, so generate it explicitly rather than relying on a hook.
        working-directory: bindings/node
        run: node scripts/generate-loader.mjs

      - name: Restore canonical datasets
        uses: ./.github/actions/restore-canonical-datasets
        with:
          dataset-tag: ${{ env.DATASET_TAG }}
          dataset-asset: ${{ env.DATASET_ASSET }}
          dataset-sha256: ${{ env.DATASET_SHA256 }}

      - name: Run floor smoke (load + one real query, 0 rows fails)
        working-directory: bindings/node
        env:
          CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
          # Asserted inside the script: a `setup-node` no-op would otherwise
          # make this a second Node-20 run reporting a floor it never touched.
          CQLITE_FLOOR_EXPECT_NODE_VERSION: ${{ matrix.node }}
          # The step above restores the corpus, so an absent one here is a
          # BROKEN RESTORE, not a legitimate skip. Fail rather than report a
          # green floor whose query never ran.
          CQLITE_FLOOR_STRICT_FIXTURES: '1'
        run: |
          set -euo pipefail
          node scripts/floor-smoke.js

      - name: Run smoke Jest subset on Node ${{ matrix.node }}
        working-directory: bindings/node
        run: |
          set -euo pipefail
          npx jest __test__/loader.test.js __test__/publish.test.js __test__/smoke.test.js __test__/write-smoke.test.js --runInBand

  build:
    name: Build (${{ matrix.target }})
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'ci:bindings-full')
      }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bindings/node/package-lock.json

      # Issue #1209: GitHub runner images ship a stable toolchain that already
      # provides bin/cargo-clippy. The dtolnay/rust-toolchain@1.97.1 action is
      # invoked with `targets:`, so it performs a rustup reconcile that can
      # intermittently try to (re)install the 'clippy-preview' component and
      # fail with "detected conflict: 'bin/cargo-clippy'". Remove the conflicting
      # component FIRST — before the toolchain action runs any rustup work — so
      # the @stable setup (which defaults to the minimal profile, no clippy)
      # cannot reinstall clippy-preview. The runner ships a working rustup, so
      # this `run:` step before the action has rustup available.
      # This build lane does not run clippy. Idempotent: a no-op if clippy is absent.
      - name: Remove preinstalled clippy (avoid clippy-preview install conflict)
        shell: bash
        run: rustup component remove clippy 2>/dev/null || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1  # pinned to rust-toolchain.toml (issue #1990)
        with:
          targets: ${{ matrix.target }}

      - name: Ensure Rust target is installed
        run: rustup target add ${{ matrix.target }}

      - name: Normalize PATH for macOS (prepend ~/.cargo/bin so real cargo wins over rustup-init)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify Rust toolchain (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          which -a cargo rustup rustup-init || true
          cargo --version
          rustup --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "bindings/node -> target"
          key: ${{ matrix.os }}-${{ matrix.target }}

      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci

      - name: Build native module
        working-directory: bindings/node
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            # Use --use-napi-cross for ARM64 Linux cross-compilation (napi-rs v3)
            npm run build -- --target aarch64-unknown-linux-gnu --use-napi-cross
          else
            # Native builds (including x86_64-apple-darwin on Intel Mac)
            npm run build
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node/${{ env.APP_NAME }}.*.node
          if-no-files-found: error
          retention-days: 7

  test:
    # THE MERGE-GATING HALF OF THIS TIER (issue #3640, owner ruling 2026-08-31:
    # "enrol with ALL THREE platforms gating"). The local agent gate's
    # node-bindings component already runs the whole jest suite — on LINUX ONLY —
    # so the value of enrolment is precisely the macOS and Windows legs, and
    # gating one platform would add nothing. Accepted cost: merge latency tied to
    # those runners.
    #
    # Consequences of that ruling, both visible here:
    #   * the applicability condition is the DIFF (`run_tier`), not the
    #     `ci:bindings-full` label. A label-gated merge gate is not a merge gate:
    #     a routine unlabeled PR would skip every platform.
    #   * `continue-on-error` is GONE. It used to green the windows leg
    #     unconditionally (issue #1979), which is exactly "gating one platform".
    #     A red here now reds `Node.js CI Quality Gate` and therefore `required`.
    #     A known FLAKE gets `gh run rerun --failed`, never a bypass.
    #
    # This job no longer downloads the `build` job's artifact: `build` is release
    # coverage (5 targets, two of them cross-compiled) and stays label-gated, while
    # these three legs must run on every mandating PR. Each therefore builds its
    # own module natively — the same `npm run build` the `build` job runs for these
    # three targets.
    name: Test (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.run_tier == 'true'
    runs-on: ${{ matrix.os }}
    # 45, not the old 20: this job now BUILDS the native module as well as running
    # the suite (see the note above), and a cold release-profile napi build on the
    # windows/macOS runners is the dominant cost.
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        # THE THREE GATING PLATFORMS (issue #3640). Native test platforms only:
        # x86_64-apple-darwin and aarch64-unknown-linux-gnu are cross-compiled and
        # cannot be tested, so they stay build-only in the `build` job. No `target:`
        # key any more — this job builds natively for its own runner and nothing
        # here consumes a target triple.
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bindings/node/package-lock.json

      # Issue #1209 (copied from the `build` job, where it was diagnosed): the
      # runner images ship a stable toolchain that already provides
      # bin/cargo-clippy, and a rustup reconcile can intermittently try to
      # (re)install 'clippy-preview' and fail with "detected conflict". Remove it
      # FIRST. This job does not run clippy; idempotent no-op if clippy is absent.
      - name: Remove preinstalled clippy (avoid clippy-preview install conflict)
        shell: bash
        run: rustup component remove clippy 2>/dev/null || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1  # pinned to rust-toolchain.toml (issue #1990)

      - name: Normalize PATH for macOS (prepend ~/.cargo/bin so real cargo wins over rustup-init)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "bindings/node -> target"
          key: ${{ matrix.os }}-test

      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci

      # Issue #3640: built here rather than downloaded from `build`. `build` is
      # release coverage and stays `ci:bindings-full`-gated; this job is the merge
      # gate and runs on every mandating PR, so it cannot depend on a job that a
      # routine PR skips. The command is byte-identical to the one `build` runs for
      # these three native targets.
      - name: Build native module
        working-directory: bindings/node
        shell: bash
        run: npm run build

      - name: Restore dataset cache
        id: dataset-cache
        uses: actions/cache@v5
        with:
          path: test-data/datasets
          key: datasets-${{ env.DATASET_TAG }}-${{ env.DATASET_SHA256 }}

      - name: Fetch datasets if cache miss (Unix)
        if: steps.dataset-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p test-data/datasets
          curl -fsSL -o "/tmp/${DATASET_ASSET}" \
            "https://github.com/pmcfadin/cqlite/releases/download/${DATASET_TAG}/${DATASET_ASSET}"
          # Issue #1324: portable checksum — GitHub's macOS runners ship `shasum`
          # (perl), not GNU coreutils `sha256sum`. Match release.yml's idiom.
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${DATASET_SHA256}  /tmp/${DATASET_ASSET}" | sha256sum -c -
          else
            echo "${DATASET_SHA256}  /tmp/${DATASET_ASSET}" | shasum -a 256 -c -
          fi
          tar -xzf "/tmp/${DATASET_ASSET}" -C . --exclude='*/._*' --exclude='._*' --exclude='*/.DS_Store' --exclude='.DS_Store'
          # Issue #1335: stamp the .dataset-pin that fetch-datasets.sh writes so
          # the shared `datasets-${DATASET_TAG}-${DATASET_SHA256}` cache entry is
          # accepted by has_required_dataset() in jobs that use fetch-datasets.sh
          # (no needless re-download; a genuinely stale pin still forces refetch).
          printf 'tag=%s\nasset=%s\nsha256=%s\n' \
            "${DATASET_TAG}" "${DATASET_ASSET}" "${DATASET_SHA256}" \
            > test-data/datasets/.dataset-pin

      - name: Fetch datasets if cache miss (Windows)
        if: steps.dataset-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-data/datasets
          $url = "https://github.com/pmcfadin/cqlite/releases/download/$env:DATASET_TAG/$env:DATASET_ASSET"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\$env:DATASET_ASSET"
          $hash = (Get-FileHash "$env:TEMP\$env:DATASET_ASSET" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:DATASET_SHA256) {
            throw "SHA256 mismatch: expected $env:DATASET_SHA256, got $hash"
          }
          tar -xzf "$env:TEMP\$env:DATASET_ASSET" -C . --exclude='*/._*' --exclude='._*' --exclude='*/.DS_Store' --exclude='.DS_Store'
          # Issue #1335: stamp the .dataset-pin fetch-datasets.sh writes so the
          # shared cache entry is accepted by has_required_dataset(). LF newlines
          # to match the bash-written pin (grep -qx exact-line match).
          $pin = "tag=$env:DATASET_TAG`nasset=$env:DATASET_ASSET`nsha256=$env:DATASET_SHA256`n"
          [System.IO.File]::WriteAllText("test-data/datasets/.dataset-pin", $pin)

      - name: Sanity check dataset
        shell: bash
        run: |
          set -euo pipefail
          test -f test-data/datasets/metadata.yml
          # Issue #1230: assert the full 39-table enforced corpus (33 nb + 6
          # test_oa) — was a non-failing `ls ... || true` that passed even on a
          # partial extraction.
          bash test-data/scripts/check-dataset-manifest.sh test-data/datasets

      - name: Run the jest suite
        working-directory: bindings/node
        shell: bash
        env:
          CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
          # Issue #1230: for the node lane this flag is DOCUMENTARY only — it is a
          # cqlite-core TEST-ONLY helper and is NOT consulted by the node binding
          # runtime. Actual fail-closed coverage here comes from the
          # check-dataset-manifest.sh step above (hard-fails on a partial/dropped
          # 39-table corpus) plus the JS skipIfNoDatasets throw on missing data. The flag
          # is set for parity of intent with the Rust/Python lanes.
          CQLITE_REQUIRE_FIXTURES: "1"
          # Issue #1465 (roborev V1): the exception-path/abandoned-iterator leak budgets
          # in __test__/leak-paths.test.js run 2x-relaxed on THESE legs, and that is now
          # OPT-IN and explicit. It used to happen by accident — the multiplier keyed on
          # `CI`, which every Actions runner sets — which also silently doubled the
          # ceilings in gate.yml's nightly FULL-gate backstop on main. The gate now
          # UNSETS this variable, so the only relaxed runs are the ones that ask.
          #
          # Why these legs ask: every budget number in that file was measured on one
          # Linux fleet box, and this matrix (ubuntu-latest, macos-14, windows-latest)
          # has never been measured. THE REASON CHANGED WITH #3640 AND THE LINE DID
          # NOT: node-ci.yml is no longer a registered exemption, it is a registered
          # GATING TIER, so a red here is a MERGE BLOCK rather than triage noise.
          # That makes the relaxation more load-bearing, not less — an unmeasured
          # ceiling on a gating leg would red merges for a budget nobody has ever
          # measured on this platform. It stays until each leg is measured
          # strict-clean; drop this line then, with the data.
          CQLITE_LEAK_BUDGET_RELAX: "2x-ceilings"
          # DECLARED, PLATFORM-SCOPED SUITE EXCLUSION (issue #1979, applied by
          # #3640). Windows now GATES the merge, and two suites fail
          # deterministically there for Windows filesystem reasons in the harness
          # itself — measured on run 33488084650 (2026-09-01): refresh.test.js
          # (`readersRemoved` 0 not 1, the removed generation is still mmap'd) and
          # execute-deprecation.test.js (`fs.rmSync` teardown ENOTEMPTY). Including
          # them would red EVERY mandating pull request, i.e. wedge the repo. This
          # is a TEST-LEVEL, named exclusion, not a platform exemption: the other 29
          # suites gate on Windows exactly like the other two platforms, and any new
          # Windows-only failure reds `required`. jest.config.js applies it
          # ADDITIVELY and prints it, and #1979 owns removing it.
          CQLITE_JEST_IGNORE_SUITES: ${{ runner.os == 'Windows' && '/__test__/refresh\.test\.js$,/__test__/execute-deprecation\.test\.js$' || '' }}
        run: |
          set -euo pipefail
          # An EMPTY value must not reach jest.config.js, which throws on a set
          # variable that names no pattern (that throw is what stops a silent
          # exclusion of nothing). The `${{ }}` above yields '' off Windows.
          if [ -z "${CQLITE_JEST_IGNORE_SUITES:-}" ]; then
            unset CQLITE_JEST_IGNORE_SUITES
          fi
          npm test

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.os }}
          path: bindings/node/__test__/
          retention-days: 7

  # Release-artifact bundling, split out of `quality-gate` by #3640. It lives in
  # its own job for two reasons: the gate job that emits a registered tier's
  # context must be a pure REPORTER (a gate job that also does work can red for a
  # reason unrelated to the tier's verdict), and this half is `ci:bindings-full`
  # release coverage, not merge-gating. It carries the same condition as `build`,
  # whose five artifacts it merges.
  bundle:
    name: Bundle native modules
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'ci:bindings-full')
      }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: bindings-*
          path: artifacts
          merge-multiple: true

      - name: List native modules
        run: |
          set -euo pipefail
          echo "::group::Built native modules"
          ls -lh artifacts/
          echo "::endgroup::"

          MODULE_COUNT=$(find artifacts -maxdepth 1 -type f -name '*.node' | wc -l | tr -d ' ')
          echo "Native module count: $MODULE_COUNT"

          if [ "$MODULE_COUNT" -ne 5 ]; then
            echo "::error::Expected exactly 5 native modules (the supported matrix), found $MODULE_COUNT"
            exit 1
          fi

      - name: Upload merged artifact
        uses: actions/upload-artifact@v6
        with:
          name: cqlite-node-binaries
          path: artifacts/*.node
          retention-days: 30

  # ALWAYS-EMIT gate job (issue #3640; mechanism #2910, shape copied from
  # flight-ci.yml `tier-gate`). Its `name:` IS the check-run context registered in
  # .github/ci-gating-tiers.yml, and `required` polls for it on the PR head. The
  # condition means the context is emitted in EVERY case, INCLUDING the
  # inapplicable one, so an ABSENT context is unambiguously an error rather than
  # "the tier did not apply". It must depend on every other job in this workflow
  # and inspect each `.result`, so no Node job's failure can go unreported —
  # gating_policy_rules.rb enforces both structurally.
  #
  # `!cancelled()`, NOT `always()`. `always()` runs this job even while the RUN IS
  # BEING CANCELLED, and a cancelled run hands it `needs.*.result == 'cancelled'`,
  # which the `case` below maps to `exit 1`. The check run would then conclude
  # `failure`, so a ROUTINE supersession (this workflow cancels in-progress PR runs
  # on every new head sha) would red `required` and the aggregator's supersession
  # grace, which keys on `cancelled`/`stale`/`skipped`, could never fire.
  quality-gate:
    name: Node.js CI Quality Gate
    needs: [classify, smoke, smoke-floor, build, test, bundle]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report the Node tier result
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          FLOOR_RESULT: ${{ needs.smoke-floor.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUNDLE_RESULT: ${{ needs.bundle.result }}
          RUN_TIER: ${{ needs.classify.outputs.run_tier }}
          SCOPE_REASON: ${{ needs.classify.outputs.reason }}
        run: |
          set -euo pipefail

          {
            echo "## Node.js CI Quality Gate (issue #3640)"
            echo ""
            echo "- scope: run_tier=\`${RUN_TIER:-unknown}\` (${SCOPE_REASON:-no reason recorded})"
            echo "- classify: \`${CLASSIFY_RESULT}\`"
            echo "- PR smoke (Ubuntu): \`${SMOKE_RESULT}\`"
            echo "- floor smoke (engines.node boundaries): \`${FLOOR_RESULT}\`"
            echo "- cross-platform builds: \`${BUILD_RESULT}\`"
            echo "- tests (ubuntu-latest, macos-14, windows-latest): \`${TEST_RESULT}\`"
            echo "- bundled native modules: \`${BUNDLE_RESULT}\`"
            echo ""
            echo "All three test platforms GATE the merge (issue #3640 owner ruling)."
            echo "Floor smoke, the 5-target build matrix and artifact bundling stay \`ci:bindings-full\` release coverage."
          } >> "$GITHUB_STEP_SUMMARY"

          # `skipped` is a PASS here and only here: it is how an inapplicable tier
          # — and a label-gated release job on a routine PR — reports itself.
          # Everything else that is not `success` reds the context, which reds
          # `required`.
          failed=""
          for pair in \
            "classify:${CLASSIFY_RESULT}" \
            "smoke:${SMOKE_RESULT}" \
            "smoke-floor:${FLOOR_RESULT}" \
            "build:${BUILD_RESULT}" \
            "test:${TEST_RESULT}" \
            "bundle:${BUNDLE_RESULT}"; do
            job="${pair%%:*}"
            result="${pair#*:}"
            case "$result" in
              success|skipped) ;;
              *) failed="${failed}${job}(${result}) " ;;
            esac
          done

          if [ -n "$failed" ]; then
            echo "::error::Node tier failed: ${failed}"
            {
              echo ""
              echo "**Node tier FAILED: ${failed}**"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # UNKNOWN MUST NOT READ AS PASS (issue #2910 round 4, same rule as the
          # Flight tier). Everything above is `success` or `skipped`, and `skipped`
          # is a pass ONLY because an inapplicable tier reports itself that way —
          # which is a claim about `run_tier`. If the classifier concluded success
          # but `run_tier` is empty or not a boolean (a renamed step id, an output
          # never written, a future refactor), then every downstream job is
          # `skipped`, the loop reads that as a pass, and the tier reports SUCCESS
          # with "not applicable to this diff" — the silent-green defect the
          # registry exists to close, reproduced inside this tier's own gate.
          case "${RUN_TIER:-}" in
            true|false) ;;
            *)
              echo "::error::Node tier gate: the classifier's applicability verdict is" \
                   "run_tier='${RUN_TIER:-}' (neither 'true' nor 'false'). An unreadable verdict is" \
                   "NOT inapplicability — the tier reds rather than reporting a vacuous success." \
                   "Check the classify job's 'scope' step output."
              {
                echo ""
                echo "**Node tier FAILED: unreadable applicability verdict"
                echo "\`run_tier='${RUN_TIER:-}'\` (expected \`true\` or \`false\`).**"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac

          # The other half of the same claim: when the tier IS applicable, the
          # merge-gating work must actually have run. `skipped` is a legitimate
          # pass for those two jobs only under run_tier=false. The label-gated
          # release jobs (smoke-floor, build, bundle) are excluded, exactly as the
          # Flight tier excludes its `image` job: they legitimately do not run on a
          # routine pull request.
          if [ "$RUN_TIER" = "true" ]; then
            inconsistent=""
            for pair in \
              "classify:${CLASSIFY_RESULT}" \
              "smoke:${SMOKE_RESULT}" \
              "test:${TEST_RESULT}"; do
              job="${pair%%:*}"
              result="${pair#*:}"
              [ "$result" = "success" ] || inconsistent="${inconsistent}${job}(${result}) "
            done
            if [ -n "$inconsistent" ]; then
              echo "::error::Node tier gate: run_tier=true (${SCOPE_REASON:-no reason recorded}) but" \
                   "${inconsistent}did not run to success. A mandating diff whose work was skipped must" \
                   "never report a green tier."
              {
                echo ""
                echo "**Node tier FAILED: run_tier=true but ${inconsistent}was not a success.**"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          else
            echo "Node tier not applicable to this diff (${SCOPE_REASON:-}); reporting success."
          fi
          echo "Node.js CI Quality Gate: PASS"
