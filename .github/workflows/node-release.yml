name: Node.js Release

on:
  push:
    tags:
      - 'v*'
  # Manual re-publish path (issue #2026). Re-running a tag-triggered run uses the
  # workflow YAML as of that tag (the broken one), and we must NOT rewrite a
  # published tag. workflow_dispatch runs THIS file from the selected branch
  # (e.g. main after the fix lands) and publishes the version in
  # bindings/node/package.json without touching the git tag. Pick the release
  # branch in the "Run workflow" UI; publish_version must match package.json.
  workflow_dispatch:
    inputs:
      publish_version:
        description: 'npm version to publish; MUST equal bindings/node/package.json (e.g. 0.13.0). Republishes from the selected branch WITHOUT rewriting the git tag.'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  APP_NAME: cqlite-node

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bindings/node/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Ensure Rust target is installed
        run: rustup target add ${{ matrix.target }}

      - name: Normalize PATH for macOS (prepend ~/.cargo/bin so real cargo wins over rustup-init)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify Rust toolchain (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          which -a cargo rustup rustup-init || true
          cargo --version
          rustup --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "bindings/node -> target"
          key: release-${{ matrix.os }}-${{ matrix.target }}

      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci

      - name: Build native module
        working-directory: bindings/node
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            # Use --use-napi-cross for ARM64 Linux cross-compilation (napi-rs v3)
            npm run build -- --target aarch64-unknown-linux-gnu --use-napi-cross
          else
            # Native builds (including x86_64-apple-darwin on Intel Mac)
            npm run build
          fi

      # Issue #1460: prove the release artifact we are about to ship can actually
      # write. If `--features write-support` were ever dropped from the build,
      # the fix makes DML fail closed, so this smoke reds instead of silently
      # publishing a binary that no-ops INSERTs. Skipped only for the
      # aarch64-linux CROSS build, which cannot be executed on the x86_64 host.
      - name: Verify release artifact can write (write-smoke)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        # Windows (x86_64-pc-windows-msvc) is a best-effort, waived platform for
        # this release (issues #2007, #2026). Its own file-handle/rmdir cleanup
        # race must never block the npm publish, so the step is non-fatal ONLY on
        # Windows. linux/macOS stay strict and still catch a write-support-stripped
        # build — the `--features write-support` flag is set in package.json, so a
        # strip fails the smoke on every platform, not just Windows.
        continue-on-error: ${{ runner.os == 'Windows' }}
        working-directory: bindings/node
        shell: bash
        run: npx jest __test__/write-smoke.test.js --runInBand

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node/${{ env.APP_NAME }}.*.node
          if-no-files-found: error
          retention-days: 30

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write  # Required for npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      # Resolve the version to publish from either the pushed tag or the
      # workflow_dispatch input, fail-closed on anything that is not strict
      # semver. Inputs/context are passed via env (never inlined into the shell).
      - name: Determine publish version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.publish_version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Refusing to publish: resolved version '$VERSION' is not valid semver"
            exit 1
          fi
          if printf '%s' "$VERSION" | grep -q -- '-'; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Resolved publish version: $VERSION (prerelease=$PRERELEASE)"

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: bindings-*
          path: bindings/node/artifacts
          merge-multiple: false

      - name: Move artifacts to package root
        working-directory: bindings/node
        shell: bash
        run: |
          # napi-rs v3 loader expects .node files in package root
          # Files are named: cqlite-node.{platform}.node

          for dir in artifacts/bindings-*/; do
            if [ -d "$dir" ]; then
              target=$(basename "$dir" | sed 's/bindings-//')
              echo "Processing target: $target"

              # Find and copy the .node file to package root
              node_file=$(find "$dir" -name "*.node" -type f | head -n 1)
              if [ -n "$node_file" ]; then
                cp "$node_file" ./
                echo "Copied $node_file to package root"
              fi
            fi
          done

          # Clean up artifact directories
          rm -rf artifacts

          echo "::group::Native modules in package root"
          ls -la *.node
          echo "::endgroup::"

      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci

      - name: Validate artifacts
        working-directory: bindings/node
        run: |
          MODULE_COUNT=$(ls -1 *.node 2>/dev/null | wc -l)
          echo "Native module count: $MODULE_COUNT"

          if [ "$MODULE_COUNT" -ne 5 ]; then
            echo "::error::Expected exactly 5 native modules (the supported matrix), found $MODULE_COUNT"
            exit 1
          fi

      - name: Validate version consistency
        working-directory: bindings/node
        env:
          EXPECTED_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")

          echo "Expected version: $EXPECTED_VERSION"
          echo "package.json version: $PKG_VERSION"

          if [ "$EXPECTED_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch! Expected $EXPECTED_VERSION but package.json has $PKG_VERSION"
            exit 1
          fi

      - name: Dry-run publish verification
        working-directory: bindings/node
        run: |
          echo "::group::npm pack dry-run output"
          npm pack --dry-run 2>&1
          echo "::endgroup::"
          echo "Dry-run publish verification passed"

      # Trusted Publishing: OIDC authentication, no token needed
      # Provenance attestations are automatic with trusted publishing
      - name: Publish to npm (stable)
        if: steps.ver.outputs.prerelease == 'false'
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
        run: npm publish --access public --provenance

      - name: Publish to npm (pre-release)
        if: steps.ver.outputs.prerelease == 'true'
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
        run: npm publish --access public --tag next --provenance

      - name: Summary
        env:
          PKG_VERSION: ${{ steps.ver.outputs.version }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "## npm Publish Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version**: $PKG_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "**Trigger**: $TRIGGER" >> "$GITHUB_STEP_SUMMARY"
          echo "**Package**: [@cqlite/node](https://www.npmjs.com/package/@cqlite/node/v/$PKG_VERSION)" >> "$GITHUB_STEP_SUMMARY"

          if [ "$PRERELEASE" = "true" ]; then
            echo "**Dist Tag**: \`next\` (pre-release)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Dist Tag**: \`latest\` (stable)" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published Platforms" >> $GITHUB_STEP_SUMMARY
          echo "- Linux x86_64 (GNU)" >> $GITHUB_STEP_SUMMARY
          echo "- Linux ARM64 (GNU)" >> $GITHUB_STEP_SUMMARY
          echo "- macOS x86_64" >> $GITHUB_STEP_SUMMARY
          echo "- macOS ARM64" >> $GITHUB_STEP_SUMMARY
          echo "- Windows x86_64" >> $GITHUB_STEP_SUMMARY

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Same fail-closed version resolution as publish-npm, so the release can be
      # (re)created on workflow_dispatch (branch ref has no tag) against the
      # existing v<version> tag WITHOUT rewriting the git tag.
      - name: Determine release version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.publish_version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Refusing to release: resolved version '$VERSION' is not valid semver"
            exit 1
          fi
          if printf '%s' "$VERSION" | grep -q -- '-'; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: bindings-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.node > SHA256SUMS.txt
          echo "::group::SHA256 Checksums"
          cat SHA256SUMS.txt
          echo "::endgroup::"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ steps.ver.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
