name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # GHCR repo for the cqlite-flight Arrow Flight (gRPC) server image. Must be
  # lowercase; `pmcfadin` already is. The Trino connector is released
  # separately (it ships as a Trino plugin, not in this image).
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/cqlite-flight

jobs:
  build-cli:
    name: Build CLI (${{ matrix.target }})
    strategy:
      matrix:
        include:
          # Linux gnu build runs under cross so the binary links against an
          # older glibc (cross's image floor is ~2.31) rather than the
          # ubuntu-latest host's glibc (2.39 on 24.04). This keeps the binary
          # runnable on enterprise distros like Rocky/RHEL 9 (glibc 2.34). (#864)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            exe_suffix: ""
            use_cross: true
          # Static musl build — runs on any Linux without a libc dependency
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            exe_suffix: ""
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            exe_suffix: ""
            use_cross: true
          # Windows builds use cross-compilation on Ubuntu
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            exe_suffix: ".exe"
            use_cross: true
          # macOS builds run natively on macOS runners
          - target: x86_64-apple-darwin
            os: macos-15
            exe_suffix: ""
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-15
            exe_suffix: ""
            use_cross: false
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    # Override rust-toolchain.toml to use stable for release builds
    - name: Override Rust toolchain
      run: rm -f rust-toolchain.toml

    - name: Normalize PATH for macOS (prepend ~/.cargo/bin so real cargo wins over rustup-init)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: Verify Rust toolchain (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        which -a cargo rustup rustup-init || true
        cargo --version
        rustup --version

    - name: Install cross (Linux only)
      if: matrix.use_cross
      run: cargo install cross

    - name: Build CLI
      shell: bash
      run: |
        if [[ "${{ matrix.use_cross }}" == "true" ]]; then
          cross build --package cqlite-cli --release --target ${{ matrix.target }}
        else
          cargo build --package cqlite-cli --release --target ${{ matrix.target }}
        fi

    - name: Create archive
      shell: bash
      run: |
        cd target/${{ matrix.target }}/release
        if [[ "${{ matrix.target }}" == *"windows"* ]]; then
          7z a ../../../cqlite-${{ matrix.target }}.zip cqlite${{ matrix.exe_suffix }}
        else
          tar czf ../../../cqlite-${{ matrix.target }}.tar.gz cqlite${{ matrix.exe_suffix }}
        fi

    - name: Generate SHA-256 checksum
      shell: bash
      run: |
        ext=$([[ "${{ matrix.target }}" == *"windows"* ]] && echo zip || echo tar.gz)
        file="cqlite-${{ matrix.target }}.${ext}"
        # sha256sum on Linux, shasum on macOS — emit "<hash>  <filename>"
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum "$file" > "${file}.sha256"
        else
          shasum -a 256 "$file" > "${file}.sha256"
        fi
        cat "${file}.sha256"

    - name: Upload CLI artifact + checksum
      uses: softprops/action-gh-release@v3
      with:
        files: |
          ./cqlite-${{ matrix.target }}.${{ contains(matrix.target, 'windows') && 'zip' || 'tar.gz' }}
          ./cqlite-${{ matrix.target }}.${{ contains(matrix.target, 'windows') && 'zip' || 'tar.gz' }}.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build the cqlite-flight container per architecture on a NATIVE runner
  # (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm) and push each by digest.
  # Native runners avoid QEMU-emulated Rust compiles, which are slow and prone
  # to OOM. The multi-arch manifest is assembled in the `merge-flight-image`
  # job below. The image exposes the Arrow Flight gRPC listener on :8815 and
  # reads SSTables from a directory mounted at runtime (`--data-dir`).
  build-flight-image:
    name: Build cqlite-flight image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
    - name: Prepare platform tag
      run: |
        platform="${{ matrix.platform }}"
        echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

    - uses: actions/checkout@v5

    - name: Docker metadata (labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY_IMAGE }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: cqlite-flight/Dockerfile
        platforms: ${{ matrix.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

    - name: Export digest
      run: |
        mkdir -p "${{ runner.temp }}/digests"
        digest="${{ steps.build.outputs.digest }}"
        touch "${{ runner.temp }}/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v4
      with:
        name: digests-${{ env.PLATFORM_PAIR }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  # Assemble the per-arch digests into a single multi-arch manifest list and
  # apply the human tags (vX.Y.Z, X.Y, and `latest` for non-prerelease tags).
  merge-flight-image:
    name: Publish multi-arch cqlite-flight image
    runs-on: ubuntu-latest
    needs: build-flight-image
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
    - name: Download digests
      uses: actions/download-artifact@v4
      with:
        path: ${{ runner.temp }}/digests
        pattern: digests-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Docker metadata (tags)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY_IMAGE }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create manifest list and push
      working-directory: ${{ runner.temp }}/digests
      run: |
        docker buildx imagetools create \
          $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

    - name: Inspect image
      run: |
        docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}

  # Append the changelog + hosted API-docs links to the auto-generated release
  # notes. Runs once per tag (no matrix) so the body is set a single time (#563).
  release-notes:
    name: Add changelog + API-docs links to release notes
    runs-on: ubuntu-latest
    needs: build-cli
    steps:
    - uses: actions/checkout@v5
    - name: Update release body
      uses: softprops/action-gh-release@v3
      with:
        generate_release_notes: true
        append_body: true
        body: |

          ---
          📖 **API docs for this release:** https://pmcfadin.github.io/cqlite/${{ github.ref_name }}/
          📋 **Changelog:** see [CHANGELOG.md](https://github.com/pmcfadin/cqlite/blob/${{ github.ref_name }}/CHANGELOG.md)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # NOTE: FFI and WASM builds disabled until M4 (Language Bindings)
  # Uncomment when cqlite-ffi and cqlite-wasm packages exist
  #
  # build-ffi:
  #   name: Build FFI Libraries
  #   runs-on: ubuntu-latest
  #   strategy:
