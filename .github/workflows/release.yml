  #       include:
  #         - target: x86_64-unknown-linux-gnu
  #           lib_name: libcqlite.so
  #         - target: x86_64-pc-windows-msvc
  #           lib_name: cqlite.dll
  #         - target: x86_64-apple-darwin
  #           lib_name: libcqlite.dylib
  #   steps:
  #   - uses: actions/checkout@v5
  #   - name: Install Rust
  #     uses: dtolnay/rust-toolchain@stable
  #     with:
  #       targets: ${{ matrix.target }}
  #   - name: Install cross
  #     run: cargo install cross
  #   - name: Build FFI library
  #     run: |
  #       if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-gnu" ]]; then
  #         cargo build --package cqlite-ffi --release --target ${{ matrix.target }}
  #       else
  #         cross build --package cqlite-ffi --release --target ${{ matrix.target }}
  #       fi
  #   - name: Generate C headers
  #     run: cargo run --package cqlite-ffi --bin cbindgen_gen
