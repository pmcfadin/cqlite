  # Publish cqlite-core then cqlite-cli to crates.io on a version tag.
  # Idempotent: versions already on crates.io are skipped (so re-running a tag,
  # or a tag whose version was hand-published, does not hard-fail). cqlite-core
  # publishes first and we wait for the index to expose it before cqlite-cli,
  # whose dep is `cqlite-core = { path, version = "X" }` and must resolve.
  # Auth is via crates.io OIDC trusted publishing (no stored token), matching
  # the npm (node-release.yml) and PyPI (python-release.yml) OIDC flows. The
  # auth action mints a short-lived token from the id-token JWT (#786).
  publish-crate:
    name: Publish to crates.io
    needs: [build-cli]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v5
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Authenticate to crates.io (OIDC trusted publishing)
      uses: rust-lang/crates-io-auth-action@v1
      id: auth
    - name: Publish crates (core before cli, idempotent)
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        VER="${TAG#v}"
        UA="cqlite-release-ci (https://github.com/pmcfadin/cqlite)"

        # Fail fast if the tag and the crate version disagree (avoids publishing
        # the wrong version from Cargo.toml).
        PKG_VER="$(cargo metadata --no-deps --format-version 1 \
          | jq -r '.packages[] | select(.name=="cqlite-core") | .version')"
        if [ "$PKG_VER" != "$VER" ]; then
          echo "::error::tag $VER does not match cqlite-core version $PKG_VER"
          exit 1
        fi

        on_crates_io() {  # $1=crate -> 0 if version $VER already published
          [ "$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" \
            "https://crates.io/api/v1/crates/$1/$VER")" = "200" ]
        }
        publish() {  # $1=package
          if on_crates_io "$1"; then
            echo "✓ $1 $VER already on crates.io — skipping"
          else
            echo "→ publishing $1 $VER"
            cargo publish --package "$1"
          fi
        }

        publish cqlite-core
        echo "waiting for cqlite-core $VER on the index..."
        for i in $(seq 1 20); do
          on_crates_io cqlite-core && break
          sleep 15
        done
        publish cqlite-cli

  # Refresh the Homebrew tap (pmcfadin/homebrew-cqlite) so `brew install
  # pmcfadin/cqlite/cqlite` tracks the just-released version. Runs after
  # build-cli so the per-platform tarballs + .sha256 sidecars exist to hash.
  # Skipped for prerelease tags (e.g. v1.2.3-rc1) so the tap only follows
  # stable releases. Requires the HOMEBREW_TAP_TOKEN secret — a PAT with
  # contents:write on pmcfadin/homebrew-cqlite (the default GITHUB_TOKEN
  # cannot push to a second repository).
  update-homebrew-tap:
    name: Update Homebrew tap
    needs: build-cli
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    steps:
    - name: Check out cqlite (for the formula generator)
      uses: actions/checkout@v5

    - name: Check out the Homebrew tap
      uses: actions/checkout@v5
      with:
        repository: pmcfadin/homebrew-cqlite
        token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        path: homebrew-cqlite

    - name: Regenerate the formula for this release
      env:
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        VERSION="${TAG#v}"
        bash scripts/gen-homebrew-formula.sh "$VERSION" \
          homebrew-cqlite/Formula/cqlite.rb

    - name: Commit and push the updated formula
      working-directory: homebrew-cqlite
      env:
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if git diff --quiet -- Formula/cqlite.rb; then
          echo "formula already current for ${TAG}; nothing to commit"
          exit 0
        fi
        git add Formula/cqlite.rb
        git commit -m "cqlite ${TAG}"
        git push