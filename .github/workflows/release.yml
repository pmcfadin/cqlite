name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-cli:
    name: Build CLI (${{ matrix.target }})
    strategy:
      matrix:
        include:
          # Linux builds use cross-compilation on Ubuntu
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            exe_suffix: ""
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            exe_suffix: ""
            use_cross: true
          # Windows builds use cross-compilation on Ubuntu
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            exe_suffix: ".exe"
            use_cross: true
          # macOS builds run natively on macOS runners
          - target: x86_64-apple-darwin
            os: macos-13
            exe_suffix: ""
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            exe_suffix: ""
            use_cross: false
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    # Override rust-toolchain.toml to use stable for release builds
    - name: Override Rust toolchain
      run: rm -f rust-toolchain.toml

    - name: Install cross (Linux only)
      if: matrix.use_cross
      run: cargo install cross

    - name: Build CLI
      shell: bash
      run: |
        if [[ "${{ matrix.use_cross }}" == "true" ]]; then
          cross build --package cqlite-cli --release --target ${{ matrix.target }}
        else
          cargo build --package cqlite-cli --release --target ${{ matrix.target }}
        fi

    - name: Create archive
      shell: bash
      run: |
        cd target/${{ matrix.target }}/release
        if [[ "${{ matrix.target }}" == *"windows"* ]]; then
          7z a ../../../cqlite-${{ matrix.target }}.zip cqlite${{ matrix.exe_suffix }}
        else
          tar czf ../../../cqlite-${{ matrix.target }}.tar.gz cqlite${{ matrix.exe_suffix }}
        fi

    - name: Upload CLI artifact
      uses: softprops/action-gh-release@v2
      with:
        files: ./cqlite-${{ matrix.target }}.${{ contains(matrix.target, 'windows') && 'zip' || 'tar.gz' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

