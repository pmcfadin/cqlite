  #     shell: bash
  #     run: |
  #       mkdir -p ffi-package/lib ffi-package/include
  #       cp target/${{ matrix.target }}/release/${{ matrix.lib_name }} ffi-package/lib/
  #       cp cqlite-ffi/include/*.h ffi-package/include/
  #       cp cqlite-ffi/README.md ffi-package/
