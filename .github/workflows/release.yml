# Runner pinned to ubuntu-24.04: ubuntu-latest moved to 26.04 and broke duckdb + Python 3.9 (#4473).
name: Release

on:
  push:
    tags:
      - 'v*'
  # Complete an EXISTING release tag whose original run failed part-way (e.g.
  # v0.19.0, run 45949384443). Every job checks out refs/tags/<tag>, so the code
  # built is the tag's code; only this workflow file comes from the dispatched
  # ref. dry_run (default true) runs the builds but skips every publish/upload.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and complete (e.g. v0.19.0)'
        required: true
        type: string
      dry_run:
        description: 'Build only; skip asset upload, crates.io, Homebrew and release-notes edit'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Shared release-train preflight (issue #2652): assert the tag agrees with
  # EVERY release manifest before any lane publishes. publish-crate needs this,
  # so a manifest disagreement fails the whole train up front rather than after
  # a partial, irreversible publish to an immutable registry.
  preflight:
    name: Release preflight
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release-preflight.yml
    with:
      version: ${{ inputs.tag || github.ref_name }}
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  build-cli:
    name: Build CLI (${{ matrix.target }})
    strategy:
      matrix:
        include:
          # Linux gnu build runs under cross so the binary links against an
          # older glibc (cross's image floor is ~2.31) rather than the
          # ubuntu-latest host's glibc (2.39 on 24.04). This keeps the binary
          # runnable on enterprise distros like Rocky/RHEL 9 (glibc 2.34). (#864)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            exe_suffix: ""
            use_cross: true
          # Static musl build — runs on any Linux without a libc dependency
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            exe_suffix: ""
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            exe_suffix: ""
            use_cross: true
          # Windows builds cross-compile on the Ubuntu host with apt mingw-w64
          # (posix flavour, 13.x). NOT under cross: the cross 0.2.5 image ships
          # an old mingw without libsynchronization.a, which Rust's windows-gnu
          # std links (run 45949384443: `cannot find -lsynchronization`).
          - target: x86_64-pc-windows-gnu
            os: ubuntu-24.04
            exe_suffix: ".exe"
            use_cross: false
          # macOS builds run natively on macOS runners
          - target: x86_64-apple-darwin
            os: macos-15
            exe_suffix: ""
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-15
            exe_suffix: ""
            use_cross: false
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5
      with:
        ref: refs/tags/${{ inputs.tag || github.ref_name }}

    # Release builds use the repository's pinned toolchain (rust-toolchain.toml),
    # the one the gate tests -- never floating stable. rust-toolchain.toml stays
    # in place so rustup/cross resolve the same channel.
    - name: Read pinned Rust channel
      id: toolchain
      shell: bash
      run: |
        channel="$(sed -n 's/^channel *= *"\(.*\)".*/\1/p' rust-toolchain.toml | head -n1)"
        if [ -z "$channel" ]; then
          echo "::error::no channel found in rust-toolchain.toml"
          exit 1
        fi
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - name: Install Rust (pinned channel)
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        targets: ${{ matrix.target }}

    - name: Ensure matrix target on the pinned channel
      shell: bash
      env:
        CHANNEL: ${{ steps.toolchain.outputs.channel }}
        TARGET: ${{ matrix.target }}
      run: |
        rustup target add --toolchain "$CHANNEL" "$TARGET"
        rustc --version --verbose

    - name: Install mingw-w64 (Windows target)
      if: matrix.target == 'x86_64-pc-windows-gnu'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix
        sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
        sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
        # Fail fast, with a clear message, if this mingw lacks the import lib
        # Rust's windows-gnu std needs (-lsynchronization).
        lib="$(x86_64-w64-mingw32-gcc -print-file-name=libsynchronization.a)"
        case "$lib" in /*) ls -l "$lib" ;; *) echo "::error::mingw-w64 lacks libsynchronization.a"; exit 1 ;; esac

    - name: Normalize PATH for macOS (prepend ~/.cargo/bin so real cargo wins over rustup-init)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: Verify Rust toolchain (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        which -a cargo rustup rustup-init || true
        cargo --version
        rustup --version

    - name: Install cross (Linux only)
      if: matrix.use_cross
      # Pinned to match the 0.2.5 images and to build on the pinned toolchain.
      run: cargo install cross --locked --version 0.2.5

    - name: Build CLI
      shell: bash
      run: |
        if [[ "${{ matrix.use_cross }}" == "true" ]]; then
          cross build --package cqlite-cli --release --target ${{ matrix.target }}
        else
          cargo build --package cqlite-cli --release --target ${{ matrix.target }}
        fi

    - name: Create archive
      shell: bash
      run: |
        cd target/${{ matrix.target }}/release
        if [[ "${{ matrix.target }}" == *"windows"* ]]; then
          7z a ../../../cqlite-${{ matrix.target }}.zip cqlite${{ matrix.exe_suffix }}
        else
          tar czf ../../../cqlite-${{ matrix.target }}.tar.gz cqlite${{ matrix.exe_suffix }}
        fi

    - name: Generate SHA-256 checksum
      shell: bash
      run: |
        ext=$([[ "${{ matrix.target }}" == *"windows"* ]] && echo zip || echo tar.gz)
        file="cqlite-${{ matrix.target }}.${ext}"
        # sha256sum on Linux, shasum on macOS — emit "<hash>  <filename>"
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum "$file" > "${file}.sha256"
        else
          shasum -a 256 "$file" > "${file}.sha256"
        fi
        cat "${file}.sha256"

    # Tag push: unchanged (creates the release if absent, uploads both files).
    - name: Upload CLI artifact + checksum
      if: github.event_name != 'workflow_dispatch'
      uses: softprops/action-gh-release@v3
      with:
        files: |
          ./cqlite-${{ matrix.target }}.${{ contains(matrix.target, 'windows') && 'zip' || 'tar.gz' }}
          ./cqlite-${{ matrix.target }}.${{ contains(matrix.target, 'windows') && 'zip' || 'tar.gz' }}.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Dispatch completion of an existing release: upload only what is missing.
    # If this target's archive is already on the release, skip archive AND
    # sidecar (a rebuilt archive would not match the existing hash). Otherwise
    # upload both, clobbering only this workflow's own (possibly orphaned)
    # sidecar. Other workflows' assets are never touched or deleted.
    - name: Upload missing CLI assets (dispatch)
      if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ inputs.tag }}
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        case "$TARGET" in *windows*) ext=zip ;; *) ext=tar.gz ;; esac
        archive="cqlite-${TARGET}.${ext}"
        if gh release view "$TAG" --json assets -q '.assets[].name' | grep -Fxq "$archive"; then
          echo "::notice::$archive already on release $TAG; skipping archive and checksum"
          exit 0
        fi
        gh release upload "$TAG" "./$archive" "./${archive}.sha256" --clobber

  # Append the changelog + hosted API-docs links to the auto-generated release
  # notes. Runs once per tag (no matrix) so the body is set a single time (#563).
  release-notes:
    name: Add changelog + API-docs links to release notes
    runs-on: ubuntu-24.04
    needs: build-cli
    steps:
    - uses: actions/checkout@v5
      with:
        ref: refs/tags/${{ inputs.tag || github.ref_name }}
    # Idempotent: the links block carries a marker; if the release body already
    # has it (a re-run or a completion dispatch), nothing is appended again.
    - name: Check whether the links are already in the release body
      id: marker
      if: (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        set -euo pipefail
        if gh release view "$TAG" --json body -q .body | grep -Fq 'API docs for this release:'; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Update release body
      if: (github.event_name != 'workflow_dispatch' || !inputs.dry_run) && steps.marker.outputs.present != 'true'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ inputs.tag || github.ref_name }}
        # The completion dispatch targets a release whose notes already exist.
        generate_release_notes: ${{ github.event_name != 'workflow_dispatch' }}
        append_body: true
        body: |

          ---
          📖 **API docs for this release:** https://pmcfadin.github.io/cqlite/${{ inputs.tag || github.ref_name }}/
          📋 **Changelog:** see [CHANGELOG.md](https://github.com/pmcfadin/cqlite/blob/${{ inputs.tag || github.ref_name }}/CHANGELOG.md)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # NOTE: FFI and WASM builds disabled until M4 (Language Bindings)
  # Uncomment when cqlite-ffi and cqlite-wasm packages exist
