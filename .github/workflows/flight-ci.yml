name: Flight CI

# Builds, lints, and tests the cqlite-flight Arrow Flight server; publishes the
# release binary as a workflow artifact and (on main / tags) a container image to
# GHCR.

on:
  schedule:
    # Nightly full Flight validation at 04:05 UTC
    - cron: '5 4 * * *'
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'cqlite-flight/**'
      - 'cqlite-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/flight-ci.yml'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths:
      - 'cqlite-flight/**'
      - 'cqlite-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/flight-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: flight-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt / clippy / lib test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        # Consolidated caching (issue #2649): shared composite keyed on
        # Cargo.lock+toolchain across every Rust lane.
        uses: ./.github/actions/setup-rust-ci
        with:
          components: rustfmt,clippy
          cache-key: flight

      - name: Verify Cargo.lock is up to date (--locked)
        # issue #2870: Cargo.lock is tracked and the flight image build resolves
        # --locked. Assert on the PR that the committed lockfile is consistent
        # with the manifests, so a stale lock fails HERE (fast, on the PR) rather
        # than only later at the main/tag image build. --locked makes cargo
        # refuse to update the lock and exit non-zero, naming the inconsistency.
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: rustfmt
        run: cargo fmt --package cqlite-flight -- --check

      - name: clippy
        run: cargo clippy --package cqlite-flight --all-targets -- -D warnings

      - name: test
        run: cargo test --package cqlite-flight --lib

      - name: Write CI tier summary
        if: always()
        run: |
          {
            echo "## Flight CI tier"
            echo ""
            echo "- Ordinary PRs run fmt, clippy, and cqlite-flight library tests."
            echo "- Full package tests and release binary artifacts run on push to main/tags, nightly schedule, workflow_dispatch, or PRs labeled \`ci:flight-full\`."
            echo "- Container publishing here is limited to main-branch pushes and workflow_dispatch runs (\`latest\` + sha tags); v* tag release images are built multi-arch solely by flight-image.yml (issue #2638)."
          } >> "$GITHUB_STEP_SUMMARY"

  full:
    name: full test + release binary
    needs: test
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'ci:flight-full')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        # Consolidated caching (issue #2649): shared composite keyed on
        # Cargo.lock+toolchain. Distinct cache-key namespace ('flight-full')
        # because this job builds a release binary (different target/ profile).
        uses: ./.github/actions/setup-rust-ci
        with:
          cache-key: flight-full

      - name: test
        run: cargo test --package cqlite-flight

      - name: build release binary
        run: cargo build --release --package cqlite-flight

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: cqlite-flight-linux-x86_64
          path: target/release/cqlite-flight
          if-no-files-found: error

  image:
    name: build & push container image
    needs: full
    # Publish only main-branch and workflow_dispatch images (main/sha tags).
    # NOT on v* tag pushes: on a release tag, flight-image.yml is the SOLE
    # writer of the canonical vX.Y.Z / vX.Y / latest tags as a MULTI-ARCH
    # manifest. If this single-arch (amd64) job also pushed vX.Y.Z on the same
    # tag ref, the two runs would race the same GHCR tag and last-writer-wins
    # could silently leave the release image amd64-only (issue #2638). Gating on
    # `github.ref_type != 'tag'` keeps this job to branch pushes only.
    if: >-
      ${{
        (github.event_name == 'push' && github.ref_type != 'tag') ||
        github.event_name == 'workflow_dispatch'
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # cargo-chef GHA layer cache (issue #2870) needs the buildx
      # docker-container driver: the default `docker` driver cannot export
      # cache-to type=gha. This job builds a single architecture (amd64) and
      # SHARES the `flight-linux-amd64` scope with flight-image.yml's amd64 leg
      # (below). That is deliberate: flight-ci runs frequently on main-branch
      # pushes, so it is the warm PRODUCER that keeps the cook layer hot for the
      # infrequent release/tag builds in flight-image.yml — a cache-to write from
      # a v* tag ref is ref-scoped and effectively dead (nothing re-reads a tag
      # scope), so the frequent main-branch producer is what makes the release
      # path warm. RESIDUAL: arm64 has no frequent main-branch producer (flight-ci
      # builds amd64 only), so `flight-linux-arm64` stays cold until the next
      # release rebuilds it — accepted; a registry-cache backend is a separate
      # owner-shape follow-up.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cqlite-flight
          # No `type=ref,event=tag` here: v* tag pushes are handled solely by
          # flight-image.yml (multi-arch). This job never runs on tag refs (see
          # the job `if:` above), so it publishes only `latest` (main) + sha
          # tags and can never clobber the release manifest (issue #2638).
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cqlite-flight/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # See the buildx step above: arch-scoped GHA cache (issue #2870),
          # SHARED with flight-image.yml's amd64 leg so main-branch pushes warm
          # the release path. Source-only pushes reuse the cargo-chef cook layer.
          cache-from: type=gha,scope=flight-linux-amd64
          cache-to: type=gha,mode=max,scope=flight-linux-amd64
