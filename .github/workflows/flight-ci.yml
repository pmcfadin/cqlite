name: Flight CI

# Builds, lints, and tests the cqlite-flight Arrow Flight server; publishes the
# release binary as a workflow artifact and (on main / tags) a container image to
# GHCR.

on:
  schedule:
    # Nightly full Flight validation at 04:05 UTC
    - cron: '5 4 * * *'
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'cqlite-flight/**'
      - 'cqlite-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/flight-ci.yml'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths:
      - 'cqlite-flight/**'
      - 'cqlite-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/flight-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: flight-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt / clippy / lib test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0  # pinned to rust-toolchain.toml (issue #1990)
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-flight-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: rustfmt
        run: cargo fmt --package cqlite-flight -- --check

      - name: clippy
        run: cargo clippy --package cqlite-flight --all-targets -- -D warnings

      - name: test
        run: cargo test --package cqlite-flight --lib

      - name: Write CI tier summary
        if: always()
        run: |
          {
            echo "## Flight CI tier"
            echo ""
            echo "- Ordinary PRs run fmt, clippy, and cqlite-flight library tests."
            echo "- Full package tests and release binary artifacts run on push to main/tags, nightly schedule, workflow_dispatch, or PRs labeled \`ci:flight-full\`."
            echo "- Container publishing remains limited to push and workflow_dispatch runs."
          } >> "$GITHUB_STEP_SUMMARY"

  full:
    name: full test + release binary
    needs: test
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'ci:flight-full')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0  # pinned to rust-toolchain.toml (issue #1990)

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-flight-full-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: test
        run: cargo test --package cqlite-flight

      - name: build release binary
        run: cargo build --release --package cqlite-flight

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: cqlite-flight-linux-x86_64
          path: target/release/cqlite-flight
          if-no-files-found: error

  image:
    name: build & push container image
    needs: full
    # Don't publish images from PRs or nightly validation runs.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cqlite-flight
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cqlite-flight/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
