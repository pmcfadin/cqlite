name: Flight CI

# Builds, lints, and tests the cqlite-flight Arrow Flight server; publishes the
# release binary as a workflow artifact and (on main / tags) a container image to
# GHCR.

on:
  schedule:
    # Nightly full Flight validation at 04:05 UTC
    - cron: '5 4 * * *'
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'cqlite-flight/**'
      - 'cqlite-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/flight-ci.yml'
  pull_request:
    # REGISTERED GATING TIER (issue #2910, .github/ci-gating-tiers.yml). The
    # trigger MUST always fire so the `Flight tier gate` context is emitted on
    # every PR — an absent registered context is an error, never "not
    # applicable". `ci.yml`'s established always-fire sentinel: a paths-ignore
    # that can never match. Applicability is decided by the `classify` job below.
    #
    # No `branches:` filter either: a PR based on anything other than main would
    # otherwise never start this workflow, leaving `required` to wait out the full
    # deadline on a context that can never appear. validate-workflows.rb enforces
    # both absences.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths-ignore:
      - '__required_ci_context_never_matches__'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: flight-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ALWAYS-RUN classifier (issue #2910, pattern: observability-gate.yml
  # `classify`). Decides applicability from the DIFF, so a diff that mandates the
  # tier runs it WITH OR WITHOUT the `ci:flight-full` label. On PR #2906 the
  # end-to-end tests that were the change's wiring evidence never ran because the
  # heavy job was label-gated and the PR carried no label; the diff-based mandate
  # is what closes that. The label survives only as a manual opt-in for diffs that
  # mandate nothing.
  classify:
    name: Classify Flight tier scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # EXACTLY ONE applicability output (issue #2910 round 2). The first cut had
    # two — `run_tier` (cheap fmt/clippy/lib test) and `run_full` (the end-to-end
    # tests) — governed by two overlapping regexes, and a `cqlite-core/**`-only
    # diff matched only the narrower one: the ~30 integration tests under
    # cqlite-flight/tests/ never ran and `Flight tier gate` still reported
    # success. That is #2906 reappearing inside its own fix. One output means one
    # predicate, and gating_policy_rules.rb now REJECTS a registered tier whose
    # jobs are governed by more than one (a tier with genuinely distinct scopes
    # must be registered as two tiers with two contexts, each aggregated on its
    # own).
    outputs:
      run_tier: ${{ steps.scope.outputs.run_tier }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify diff and labels
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_FULL_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:flight-full') }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run_tier=true" >> "$GITHUB_OUTPUT"
            echo "reason=non-PR event (${EVENT_NAME}): full tier" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > changed-files.txt
          echo "Changed files:"
          sed 's/^/  - /' changed-files.txt

          # FAIL-CLOSED on an empty/ambiguous changed-file set (same rule as
          # pr-gate.yml's docs-only classifier): if we cannot see the diff we
          # cannot conclude the tier is inapplicable, so run everything.
          if [ ! -s changed-files.txt ]; then
            echo "run_tier=true" >> "$GITHUB_OUTPUT"
            echo "reason=empty changed-file set; running the full tier fail-closed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # THE MANDATE SET (issue #2910 round 2) — every path that reaches the
          # Flight server at runtime or decides what its tests assert. Matching
          # ANY of them runs the WHOLE tier, end-to-end tests included; there is
          # deliberately no narrower second set that could route a mandating diff
          # to a cheaper job:
          #   cqlite-flight/**                  the crate, its Dockerfile and the
          #                                     ~30 integration/e2e tests
          #   cqlite-core/**                    the engine Flight wraps — readers,
          #                                     merge, the Arrow converter. THE
          #                                     direction from which Flight breaks:
          #                                     #2825 shipped a wrong
          #                                     worst_case_batch_capacity_bytes
          #                                     because nothing exercised it, and
          #                                     #2821 was its first caller. Both
          #                                     were core diffs whose Flight e2e
          #                                     coverage was the entire point.
          #   Cargo.toml / Cargo.lock           the workspace dependency versions
          #                                     resolved into the binary
          #   rust-toolchain.toml               the pinned compiler this tier builds
          #                                     and runs with
          #   test-data/**                      the SSTable fixtures and the
          #                                     query-semantics oracle that
          #                                     point_read_corpus_parity_test.rs and
          #                                     query_semantics_flight_parity.rs read
          #   .github/actions/setup-rust-ci/**  the composite action every job here
          #                                     depends on to build at all
          #   .github/workflows/flight-ci.yml   the tier definition itself
          # NOT mandated, deliberately: cqlite-cli/**, bindings/**, docs/** —
          # nothing in them is linked into, or read by, the Flight server.
          # `.github/ci-gating-tiers.yml` documents this list under
          # `mandate_paths`, and gating_policy_rules.rb fails the gate if the two
          # drift apart.
          mandate_regex='^(cqlite-flight/|cqlite-core/|test-data/|\.github/actions/setup-rust-ci/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|\.github/workflows/flight-ci\.yml$)'

          run_tier=false
          reason='no Flight-relevant path in the diff and no ci:flight-full label'
          if grep -Eq "$mandate_regex" changed-files.txt; then
            run_tier=true
            reason='diff reaches the Flight server at runtime; running the full tier including the end-to-end tests'
          fi
          if [ "$HAS_FULL_LABEL" = "true" ]; then
            run_tier=true
            reason='ci:flight-full label opt-in'
          fi

          echo "run_tier=${run_tier}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "Flight tier verdict: run_tier=${run_tier} (${reason})"

  test:
    name: fmt / clippy / lib test
    needs: classify
    if: needs.classify.outputs.run_tier == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        # Consolidated caching (issue #2649): shared composite keyed on
        # Cargo.lock+toolchain across every Rust lane.
        uses: ./.github/actions/setup-rust-ci
        with:
          components: rustfmt,clippy
          cache-key: flight

      - name: rustfmt
        run: cargo fmt --package cqlite-flight -- --check

      - name: clippy
        run: cargo clippy --package cqlite-flight --all-targets -- -D warnings

      - name: test
        run: cargo test --package cqlite-flight --lib

      - name: Write CI tier summary
        if: always()
        run: |
          {
            echo "## Flight CI tier"
            echo ""
            echo "- This job (fmt, clippy, cqlite-flight library tests) is the prerequisite half of the tier."
            echo "- The full package tests (cqlite-flight/tests/**, the end-to-end coverage) and the release binary run under the SAME applicability verdict — see the classify job's reason."
            echo "- A diff touching cqlite-flight/**, cqlite-core/**, test-data/**, the Cargo manifests, rust-toolchain.toml, the shared setup-rust-ci action, or this workflow mandates the whole tier with or without \`ci:flight-full\` (issue #2910)."
            echo "- Container publishing here is limited to main-branch pushes and workflow_dispatch runs (\`latest\` + sha tags); v* tag release images are built multi-arch solely by flight-image.yml (issue #2638)."
          } >> "$GITHUB_STEP_SUMMARY"

  full:
    name: full test + release binary
    needs: [classify, test]
    # Issue #2910: the DIFF decides, not the label — and it decides for the WHOLE
    # tier. This job owns `cargo test --package cqlite-flight`, i.e. the ~30
    # integration/e2e tests under cqlite-flight/tests/ that the `test` job's
    # `--lib` scope does not touch. It shares `run_tier` with that job precisely
    # so no mandating diff can reach the cheap half alone.
    if: needs.classify.outputs.run_tier == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        # Consolidated caching (issue #2649): shared composite keyed on
        # Cargo.lock+toolchain. Distinct cache-key namespace ('flight-full')
        # because this job builds a release binary (different target/ profile).
        uses: ./.github/actions/setup-rust-ci
        with:
          cache-key: flight-full

      - name: test
        run: cargo test --package cqlite-flight

      - name: build release binary
        run: cargo build --release --package cqlite-flight

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: cqlite-flight-linux-x86_64
          path: target/release/cqlite-flight
          if-no-files-found: error

  image:
    name: build & push container image
    needs: [classify, full]
    # Publish only main-branch and workflow_dispatch images (main/sha tags).
    # NOT on v* tag pushes: on a release tag, flight-image.yml is the SOLE
    # writer of the canonical vX.Y.Z / vX.Y / latest tags as a MULTI-ARCH
    # manifest. If this single-arch (amd64) job also pushed vX.Y.Z on the same
    # tag ref, the two runs would race the same GHCR tag and last-writer-wins
    # could silently leave the release image amd64-only (issue #2638). Gating on
    # `github.ref_type != 'tag'` keeps this job to branch pushes only.
    if: >-
      ${{
        (github.event_name == 'push' && github.ref_type != 'tag') ||
        github.event_name == 'workflow_dispatch'
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # cargo-chef GHA layer cache (issue #2870) needs the buildx
      # docker-container driver: the default `docker` driver cannot export
      # cache-to type=gha. This job builds a single architecture (amd64) and
      # SHARES the `flight-linux-amd64` scope with flight-image.yml's amd64 leg
      # (below). That is deliberate: flight-ci runs frequently on main-branch
      # pushes, so it is the warm PRODUCER that keeps the cook layer hot for the
      # infrequent release/tag builds in flight-image.yml — a cache-to write from
      # a v* tag ref is ref-scoped and effectively dead (nothing re-reads a tag
      # scope), so the frequent main-branch producer is what makes the release
      # path warm. RESIDUAL: arm64 has no frequent main-branch producer (flight-ci
      # builds amd64 only), so `flight-linux-arm64` stays cold until the next
      # release rebuilds it — accepted; a registry-cache backend is a separate
      # owner-shape follow-up.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cqlite-flight
          # No `type=ref,event=tag` here: v* tag pushes are handled solely by
          # flight-image.yml (multi-arch). This job never runs on tag refs (see
          # the job `if:` above), so it publishes only `latest` (main) + sha
          # tags and can never clobber the release manifest (issue #2638).
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cqlite-flight/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # See the buildx step above: arch-scoped GHA cache (issue #2870),
          # SHARED with flight-image.yml's amd64 leg so main-branch pushes warm
          # the release path. Source-only pushes reuse the cargo-chef cook layer.
          cache-from: type=gha,scope=flight-linux-amd64
          cache-to: type=gha,mode=max,scope=flight-linux-amd64

  # ALWAYS-EMIT gate job (issue #2910). Its `name:` IS the check-run context
  # registered in .github/ci-gating-tiers.yml, and `required` polls for it on the
  # PR head. `if: always()` means the context is emitted in EVERY case, including
  # the inapplicable one, so an ABSENT context is unambiguously an error rather
  # than "the tier did not apply". It must depend on every other job in this
  # workflow and inspect each `.result`, so no Flight job's failure can go
  # unreported — validate-workflows.rb enforces both structurally.
  tier-gate:
    name: Flight tier gate
    needs: [classify, test, full, image]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the Flight tier result
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          TEST_RESULT: ${{ needs.test.result }}
          FULL_RESULT: ${{ needs.full.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          SCOPE_REASON: ${{ needs.classify.outputs.reason }}
          RUN_TIER: ${{ needs.classify.outputs.run_tier }}
        run: |
          set -euo pipefail

          {
            echo "## Flight tier gate (issue #2910)"
            echo ""
            echo "- scope: run_tier=\`${RUN_TIER:-unknown}\` (${SCOPE_REASON:-no reason recorded})"
            echo "- classify: \`${CLASSIFY_RESULT}\`"
            echo "- fmt / clippy / lib test: \`${TEST_RESULT}\`"
            echo "- full test + release binary: \`${FULL_RESULT}\`"
            echo "- container image: \`${IMAGE_RESULT}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # `skipped` is a PASS here and only here: it is how an inapplicable
          # tier reports itself. Everything else that is not `success` reds the
          # context, which reds `required`.
          failed=""
          for pair in \
            "classify:${CLASSIFY_RESULT}" \
            "test:${TEST_RESULT}" \
            "full:${FULL_RESULT}" \
            "image:${IMAGE_RESULT}"; do
            job="${pair%%:*}"
            result="${pair#*:}"
            case "$result" in
              success|skipped) ;;
              *) failed="${failed}${job}(${result}) " ;;
            esac
          done

          if [ -n "$failed" ]; then
            echo "::error::Flight tier failed: ${failed}"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Flight tier FAILED: ${failed}**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${RUN_TIER:-}" != "true" ]; then
            echo "Flight tier not applicable to this diff (${SCOPE_REASON:-}); reporting success."
          fi
          echo "Flight tier gate: PASS"
