name: Python Release

on:
  push:
    tags:
      - 'v*'

# Default to read-only - jobs declare their own permissions
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build source distribution
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: bindings/python

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz
          retention-days: 30

  # Build wheels for all platforms (30min timeout for cross-compilation)
  build-wheels:
    name: Build wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: macos-14
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Normalize PATH for macOS (prepend ~/.cargo/bin so real cargo wins over rustup-init)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify Rust toolchain (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          which -a cargo rustup rustup-init || true
          cargo --version
          rustup --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "bindings/python -> target"
          key: release-${{ matrix.os }}-${{ matrix.target }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: bindings/python
          manylinux: ${{ matrix.manylinux || 'auto' }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          retention-days: 30

  # Publish to TestPyPI for pre-release tags (contains hyphen after version)
  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [build-sdist, build-wheels]
    # Pre-release: any tag with hyphen suffix (v1.0.0-rc1, v1.0.0-alpha, v1.0.0-beta1, etc.)
    if: contains(github.ref_name, '-')
    timeout-minutes: 10

    environment:
      name: testpypi
      url: https://test.pypi.org/p/cqlite-py

    permissions:
      id-token: write

    steps:
      - name: Checkout (for version validation)
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Validate artifacts
        run: |
          echo "::group::Distribution files"
          ls -lh dist/
          echo "::endgroup::"

          # Count artifacts: 1 sdist + 5+ wheels (may include PyPy wheels)
          SDIST_COUNT=$(ls dist/*.tar.gz 2>/dev/null | wc -l)
          WHEEL_COUNT=$(ls dist/*.whl 2>/dev/null | wc -l)
          echo "Source distributions: $SDIST_COUNT"
          echo "Wheels: $WHEEL_COUNT"

          if [ "$SDIST_COUNT" -ne 1 ]; then
            echo "::error::Expected 1 sdist, found $SDIST_COUNT"
            exit 1
          fi
          if [ "$WHEEL_COUNT" -lt 5 ]; then
            echo "::error::Expected at least 5 wheels, found $WHEEL_COUNT"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate package metadata
        run: |
          pip install twine
          twine check dist/*

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

      - name: Summary
        run: |
          echo "## TestPyPI Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Package**: [cqlite-py on TestPyPI](https://test.pypi.org/p/cqlite-py)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Published" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -1 dist/ >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # Publish to PyPI for stable releases (no hyphen in version)
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-sdist, build-wheels]
    # Stable release: tag without hyphen suffix (v1.0.0, v0.3.0)
    if: ${{ !contains(github.ref_name, '-') }}
    timeout-minutes: 10

    environment:
      name: pypi
      url: https://pypi.org/p/cqlite-py

    permissions:
      id-token: write

    steps:
      - name: Checkout (for version validation)
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Validate artifacts
        run: |
          echo "::group::Distribution files"
          ls -lh dist/
          echo "::endgroup::"

          # Count artifacts: 1 sdist + 5+ wheels (may include PyPy wheels)
          SDIST_COUNT=$(ls dist/*.tar.gz 2>/dev/null | wc -l)
          WHEEL_COUNT=$(ls dist/*.whl 2>/dev/null | wc -l)
          echo "Source distributions: $SDIST_COUNT"
          echo "Wheels: $WHEEL_COUNT"

          if [ "$SDIST_COUNT" -ne 1 ]; then
            echo "::error::Expected 1 sdist, found $SDIST_COUNT"
            exit 1
          fi
          if [ "$WHEEL_COUNT" -lt 5 ]; then
            echo "::error::Expected at least 5 wheels, found $WHEEL_COUNT"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate package metadata
        run: |
          pip install twine
          twine check dist/*

      - name: Validate version consistency
        run: |
          # Extract version from tag (strip 'v' prefix)
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"

          # Extract version from pyproject.toml
          PYPROJECT_VERSION=$(grep '^version = ' bindings/python/pyproject.toml | cut -d'"' -f2)

          echo "Tag version: $TAG_VERSION"
          echo "pyproject.toml version: $PYPROJECT_VERSION"

          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Version mismatch! Tag is $TAG_VERSION but pyproject.toml has $PYPROJECT_VERSION"
            exit 1
          fi

          echo "Version consistency validated"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Summary
        run: |
          echo "## PyPI Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Package**: [cqlite-py on PyPI](https://pypi.org/p/cqlite-py)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Published" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -1 dist/ >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # Create GitHub Release with wheels attached
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-sdist, build-wheels]
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Validate artifacts
        run: |
          echo "::group::Release files"
          ls -lh dist/
          echo "::endgroup::"

          # Verify expected artifact count
          TOTAL_COUNT=$(ls dist/* 2>/dev/null | wc -l)
          echo "Total artifacts: $TOTAL_COUNT"

          if [ "$TOTAL_COUNT" -lt 6 ]; then
            echo "::warning::Expected at least 6 artifacts (1 sdist + 5+ wheels), found $TOTAL_COUNT"
          fi

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          echo "::group::SHA256 Checksums"
          cat SHA256SUMS.txt
          echo "::endgroup::"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
