name: Publish Trino Connector

# Publishes the Java Trino connector (in.mcfad:cqlite-trino) to Maven Central on
# every v* release tag, so the connector releases in lockstep with the crate and
# the cqlite-flight image. The version is derived from the tag (v0.13.0 → 0.13.0).
#
# Automatic release (issue #2156): `trino-connector/build.gradle.kts` configures
# `publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL, automaticRelease = true)`,
# so a successful `./gradlew publishToMavenCentral` run here fully releases the
# artifact — no manual "Publish" click in the Central Portal UI.
#
# Secrets are not addressable in a job-level `if:`, so a guard step checks the
# Maven Central + GPG signing secrets and exposes a boolean output the publish
# step keys off. THIS IS FAIL-CLOSED (issue #2156): if it's not an explicit
# dry run and the secrets are absent, the job FAILS loudly rather than
# succeeding with the Central publish silently skipped — a prior
# `workflow_dispatch` run reported "success" while the Central step never ran,
# which is exactly the failure mode this closes.
#
# A `workflow_dispatch` trigger allows exercising the publish on demand. Manual
# runs have no tag to derive the version from, so the `version` input supplies
# it. `dry_run` DEFAULTS TO TRUE (issue #2639) — a bare `gh workflow run
# trino-publish.yml -f version=X` MUST NOT reach Maven Central. Dry-run behavior
# (publish only to the local Maven repo via publishToMavenLocal, no Central
# upload, no secrets needed) is the default; a real Central publish must be
# requested explicitly with `dry_run=false`, gated on the secrets check above.
# Tag-push runs (`push` on `v*`) are unaffected: `dry_run` only applies to
# workflow_dispatch, so a `v*` tag still publishes for real.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (no leading v), e.g. 0.13.0'
        type: string
        required: true
      dry_run:
        description: 'Dry run (DEFAULT): publishToMavenLocal only, no Central upload, no secrets needed. A real Maven Central publish requires setting this to false explicitly.'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Shared release-train preflight (issue #2652): assert the release tag agrees
  # with EVERY Rust/Python/Node manifest before the connector is published to
  # the immutable Maven Central. Only a v* tag push has a ref-derived version to
  # preflight; a manual workflow_dispatch supplies its own `version` input and
  # skips this gate (the publish job's `if:` below tolerates the skip).
  preflight:
    name: Release preflight
    if: github.event_name == 'push'
    uses: ./.github/workflows/release-preflight.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    name: publishToMavenCentral
    runs-on: ubuntu-latest
    needs: [preflight]
    # preflight is `if: push`-gated, so a workflow_dispatch run SKIPS it. Proceed
    # when it passed (tag push) or was skipped (dispatch), never when it failed.
    if: ${{ !cancelled() && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 25 (runs Gradle and matches the toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: trino-connector/*.gradle.kts

      # Tag runs derive the version from GITHUB_REF_NAME (v0.13.0 -> 0.13.0);
      # manual workflow_dispatch runs have no tag, so use the `version` input.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            resolved="${INPUT_VERSION#v}"
          else
            resolved="${GITHUB_REF_NAME#v}"
          fi
          # Strict allowlist: semver core with an optional pre-release suffix
          # (e.g. 0.13.0, 0.13.0-test, 0.13.0-rc.1). Reject anything else so a
          # crafted version cannot inject shell metacharacters into the gradle
          # invocations below — which run with Maven Central + signing secrets.
          if ! printf '%s' "$resolved" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "::error::Refusing to publish: version '$resolved' is not a valid release version (expected ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$)"
            exit 1
          fi
          echo "version=$resolved" >> "$GITHUB_OUTPUT"

      # Secrets cannot be referenced in a job/step-level `if:`. Read them here and
      # publish a boolean output the publish step gates on.
      - name: Check publishing secrets
        id: guard
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$MAVEN_CENTRAL_USERNAME" ] && [ -n "$MAVEN_CENTRAL_PASSWORD" ] \
             && [ -n "$SIGNING_KEY" ] && [ -n "$SIGNING_PASSWORD" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Resumability (issue #2652): Maven Central is immutable — a released
      # version can never be overwritten, so re-running a partially-failed train
      # would hard-fail when in.mcfad:cqlite-trino:<version> was already
      # published on a prior run. Probe the public Central repo (no secrets) and
      # expose an `already` boolean the Central publish step gates on, so the
      # train re-runs to completion instead of dead-ending here. This is a
      # public read of repo1.maven.org; PUBLISH_VERSION is validated semver and
      # passed via env, never inlined into the shell.
      - name: Check if version already on Maven Central
        id: central
        env:
          PUBLISH_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          url="https://repo1.maven.org/maven2/in/mcfad/cqlite-trino/${PUBLISH_VERSION}/cqlite-trino-${PUBLISH_VERSION}.pom"
          code="$(curl -s -o /dev/null -w '%{http_code}' -L "$url" || echo 000)"
          if [ "$code" = "200" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "in.mcfad:cqlite-trino:${PUBLISH_VERSION} is already on Maven Central — will skip publish (resumable re-run)."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "in.mcfad:cqlite-trino:${PUBLISH_VERSION} is not on Maven Central (HTTP ${code}) — will publish."
          fi

      # Pre-publish oracle (issue #2300): assert the netty pin survives into the
      # published POM's <dependencies> BEFORE any publish path runs, so a drifted
      # or BOM-only pin (which a downstream Maven consumer would resolve at netty
      # 4.2.x, re-breaking arrow-19's allocator) can never reach Central.
      - name: Verify published POM netty pin
        working-directory: trino-connector
        env:
          PUBLISH_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew --no-daemon verifyPublishedPomNettyPin -Pversion="$PUBLISH_VERSION"

      # Dry run (manual workflow_dispatch with dry_run=true): publish only to the
      # local Maven repo. No Central upload and no signing/Central secrets needed,
      # so this path is independent of the guard step above.
      - name: Publish to Maven local (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        working-directory: trino-connector
        env:
          PUBLISH_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew --no-daemon publishToMavenLocal -Pversion="$PUBLISH_VERSION"

      - name: Skip — already on Maven Central (resumable re-run)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && steps.central.outputs.already == 'true' }}
        env:
          PUBLISH_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "in.mcfad:cqlite-trino:${PUBLISH_VERSION} is already published to Maven Central; skipping the publish so a partially-failed release train re-runs to completion (issue #2652)."

      - name: Publish to Maven Central
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && steps.central.outputs.already != 'true' && steps.guard.outputs.should_publish == 'true' }}
        working-directory: trino-connector
        env:
          # vanniktech reads Central credentials + the in-memory GPG key from
          # these Gradle properties (ORG_GRADLE_PROJECT_* env override).
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          PUBLISH_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew --no-daemon publishToMavenCentral -Pversion="$PUBLISH_VERSION"

      # Issue #2156: this used to be a "Skip notice" that logged and let the job
      # succeed — that is exactly how a workflow_dispatch run reported "success"
      # while the Central publish silently never happened. A skip that isn't an
      # explicit dry run is now unmissable: the job FAILS instead of going green.
      - name: Fail — Central publish skipped (secrets absent, not a dry run)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && steps.central.outputs.already != 'true' && steps.guard.outputs.should_publish != 'true' }}
        run: |
          echo "::error::Maven Central secrets absent and this is not an explicit dry run (dry_run=true) — failing instead of silently skipping the connector publish. Set MAVEN_CENTRAL_USERNAME/MAVEN_CENTRAL_PASSWORD/SIGNING_KEY/SIGNING_PASSWORD, or dispatch with dry_run=true to validate the build without publishing."
          exit 1
