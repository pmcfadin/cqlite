name: Validator Real SSTables - Issue #30

on:
  push:
    branches: [ main, develop, feature/issue-30-* ]
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'tools/sstabledump-validator/**'
      - 'test-data/scripts/run-sstabledump-validator.sh'
      - '.github/workflows/validator-real-sstables-issue-30.yml'

jobs:
  validator-real-sstables-issue-30:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      cassandra:
        image: cassandra:5.0
        env:
          CASSANDRA_CLUSTER_NAME: cqlite-test-5-0
          CASSANDRA_DC: datacenter1
          CASSANDRA_RACK: rack1
          CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
          CASSANDRA_START_RPC: true
          CASSANDRA_RPC_ADDRESS: 0.0.0.0
          CASSANDRA_AUTHENTICATOR: AllowAllAuthenticator
          CASSANDRA_AUTHORIZER: AllowAllAuthorizer
          CASSANDRA_AUTO_BOOTSTRAP: false
          MAX_HEAP_SIZE: 2G
          HEAP_NEWSIZE: 400m
        ports:
          - 9042:9042
          - 7000:7000
        options: >-
          --health-cmd "cqlsh -e 'SELECT cluster_name FROM system.local;'"
          --health-interval 30s
          --health-timeout 20s
          --health-retries 10
          --health-start-period 180s

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build sstabledump-validator
      run: |
        cd tools/sstabledump-validator
        cargo build --release
        
    - name: Wait for Cassandra to be ready
      run: |
        echo "Waiting for Cassandra service to be healthy..."
        timeout 300 bash -c 'until docker exec $(docker ps -q --filter "ancestor=cassandra:5.0") cqlsh -e "SELECT cluster_name FROM system.local;" 2>/dev/null; do sleep 10; done'
        echo "Cassandra is ready!"

    - name: Run BIG format validation (Issue #30)
      env:
        ZERO_TOLERANCE: true
        VERBOSE: false
        DATASET_DIRS: ${{ github.workspace }}/tests/data/sstables
        CONTAINER_NAME: ${{ job.services.cassandra.id }}
      run: |
        # Run the validator integration script with CI container name
        ./test-data/scripts/run-sstabledump-validator.sh

    - name: Upload validation results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: validation-results-issue-30
        path: |
          validation-results-*/summary.md
          validation-results-*/*/junit.xml
          validation-results-*/*/validation.log
          validation-results-*/*/status.txt
        retention-days: 7

    - name: Upload JUnit test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: junit-results-issue-30
        path: validation-results-*/*/junit.xml
        retention-days: 7

    - name: Display validation summary
      if: always()
      run: |
        echo "## Validation Results" >> $GITHUB_STEP_SUMMARY
        if [ -f validation-results-*/summary.md ]; then
          cat validation-results-*/summary.md >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ No validation summary found" >> $GITHUB_STEP_SUMMARY
        fi