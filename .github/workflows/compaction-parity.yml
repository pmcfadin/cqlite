name: "CI: Compaction Parity (differential harness)"

# Runs the differential compaction-parity harness (compaction-parity/, issue #842)
# in CI. The harness compacts the SAME input SSTables through TWO engines and
# diffs the outputs:
#   1. REFERENCE  — Apache Cassandra's compaction, in-JVM via CQLTester.
#   2. CANDIDATE  — the external `cqlite compact` binary (--features write-support).
#
# TIER POLICY (issue #889/#1016, follow-up to #842):
#   - LOGICAL tier (canonical sstabledump of both outputs must match) is
#     implemented and green. It is a HARD GATE here: logical-tier failures fail
#     this workflow.
#   - BYTE tier (per-component `cmp`, no allowlist — the #842 north star) is
#     implemented in the harness (issue #1016: `gradle byteParity`). Its manifest
#     CI tier is `nightly_docker`, backed by the nightly `schedule:` below, so the
#     dedicated byteParity ASSERTION run fires nightly + on manual workflow_dispatch
#     — NOT per-PR (the per-PR logical `test` run already computes + persists the
#     byte diff + checksums as artifacts, so PRs lose no evidence and we avoid
#     doubling the expensive compaction). It is NON-BLOCKING
#     (continue-on-error), promoted to a HARD GATE once the divergence-fix children
#     (#886 → #844/#887/#888/#846/#848) land — by dropping continue-on-error.
#
# TRIGGERS: PRs that touch the write/merge/compaction paths or this harness, plus
# manual workflow_dispatch. The pinned Cassandra source build (ant jar build-test)
# is slow, so it is cached under ~/.cache/cqlite keyed on the cassandra-5.0.2 pin
# and the bootstrap script hash.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'cqlite-core/src/storage/write_engine/**'
      - 'cqlite-core/src/storage/sstable/writer/**'
      # The harness drives the external `cqlite compact` CLI command, so CLI
      # changes can regress compaction output; gate on them too (#852/#889).
      - 'cqlite-cli/**'
      # The CQL schema parser feeds the harness's table definitions; parser
      # regressions can alter compaction output, so include it in the gate.
      - 'cqlite-core/src/schema/**'
      - 'compaction-parity/**'
      - '.github/workflows/compaction-parity.yml'
  # Nightly run that honors the byte-tier's `nightly_docker` manifest CI tier:
  # the byteParity assertion (per-component cmp, no allowlist) runs automatically
  # here, not just on manual dispatch. 05:43 UTC is offset from the other nightly
  # parity jobs (tombstone/TTL 04:17, cql-type 04:31, compression 05:23) and off
  # the top-of-hour scheduler rush.
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:
    inputs:
      run_byte_tier:
        description: 'Also run the (non-blocking) byte-equality tier'
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write
  issues: write

# Cancel superseded PR runs; let manual runs finish.
concurrency:
  group: compaction-parity-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Single source of truth for the pinned Cassandra version. MUST match the pin
  # in compaction-parity/scripts/bootstrap-cassandra.sh (CASSANDRA_REF) and the
  # cassandra:5.0.2 image used elsewhere (issue #669).
  CASSANDRA_REF: cassandra-5.0.2
  # Where bootstrap-cassandra.sh fetches+builds the pinned source. The script
  # uses $HOME/.cache/cqlite/cassandra-src/<ref>; pin the parent here for caching.
  CQLITE_CASSANDRA_CACHE: ${{ github.workspace }}/.cqlite-cache/cassandra-src
  # Byte tier (issue #1016): manifest CI tier is `nightly_docker`, so the dedicated
  # `byteParity` assertion run is NOT run on every PR — that would double the
  # expensive Cassandra+cqlite compaction for no new evidence, because the logical
  # `test` run already computes + persists the per-component byte diff + checksums
  # unconditionally as artifacts. The byteParity ASSERTION runs on the nightly
  # `schedule:` + manual workflow_dispatch (gated below on schedule||dispatch). It
  # stays NON-BLOCKING (continue-on-error) until the writer is byte-stable; promote
  # to a hard gate by dropping continue-on-error. A dispatch run can set this
  # 'false'; on the nightly schedule there are no inputs so it defaults to 'true'.
  RUN_BYTE_TIER: ${{ github.event.inputs.run_byte_tier || 'true' }}

jobs:
  compaction-parity:
    name: Differential compaction parity (logical tier)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # ── JDK 17: drives Gradle, the test JVM, and the Cassandra source build. ──
      # Cassandra 5.0 builds on JDK 11 or 17 (NOT 21); the harness pins the test
      # JVM to 17 (build.gradle.kts toolchain). bootstrap-cassandra.sh reads
      # $CASSANDRA_BUILD_JAVA_HOME to pick the build JDK — we hand it this one.
      - name: Setup JDK 17
        id: setup-java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Ant (required by the Cassandra source build)
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-compaction-parity-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-compaction-parity-
            ${{ runner.os }}-cargo-

      # ── Cache the slow Cassandra source build. ──
      # Keyed on the version pin + the bootstrap script hash so any change to how
      # we build Cassandra busts the cache. The marker file (.cqlite-build-complete)
      # inside the checkout lets bootstrap-cassandra.sh no-op on a cache hit.
      - name: Cache pinned Cassandra build
        id: cassandra-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.CQLITE_CASSANDRA_CACHE }}
          key: ${{ runner.os }}-cassandra-${{ env.CASSANDRA_REF }}-${{ hashFiles('compaction-parity/scripts/bootstrap-cassandra.sh') }}

      - name: Build pinned Cassandra source (cold cache only)
        env:
          # bootstrap-cassandra.sh honours these to locate the cache and pick the
          # JDK 11/17 used for the ant build.
          CQLITE_CASSANDRA_CACHE: ${{ env.CQLITE_CASSANDRA_CACHE }}
          CASSANDRA_REF: ${{ env.CASSANDRA_REF }}
          CASSANDRA_BUILD_JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: |
          bash compaction-parity/scripts/bootstrap-cassandra.sh

      - name: Build cqlite (write-support) candidate binary
        run: |
          cargo build --package cqlite-cli --features write-support
          test -x target/debug/cqlite

      - name: Setup Gradle (no wrapper in compaction-parity)
        uses: gradle/actions/setup-gradle@v4
        with:
          # The harness has no Gradle wrapper, so the action must provision a
          # `gradle` binary itself (the hard-gate step below invokes `gradle`
          # directly). 8.x is compatible with the build's plain `java` plugin and
          # JDK 17 toolchain (build.gradle.kts).
          gradle-version: "8.10.2"

      # ── LOGICAL tier — HARD GATE. ──
      # build.gradle.kts resolves the Cassandra src via $CQLITE_CASSANDRA_SRC and
      # the candidate binary via $CQLITE_BIN. Failures here fail the workflow.
      - name: Run logical-tier parity (gradle test)
        id: logical
        working-directory: compaction-parity
        env:
          CQLITE_CASSANDRA_SRC: ${{ env.CQLITE_CASSANDRA_CACHE }}/${{ env.CASSANDRA_REF }}
          CQLITE_BIN: ${{ github.workspace }}/target/debug/cqlite
        run: |
          gradle --no-daemon test

      # ── BYTE tier — per-component cmp, NO allowlist (issue #1016, #842). ──
      # The `byteParity` Gradle task reruns the scenarios and additionally ASSERTS
      # every output component (Data/Index/Statistics/Summary/Filter/CompressionInfo/
      # Digest/TOC, as present) is byte-identical, reporting the first byte/offset
      # diff per component. This is the `nightly_docker`-tier assertion, so it runs
      # on the nightly schedule + manual workflow_dispatch — NOT on PRs (the per-PR
      # logical `test` run above already wrote byte-diff.txt + checksums.txt as
      # artifacts, so PRs lose no evidence). Kept continue-on-error so it is
      # NON-BLOCKING until the writer is byte-stable; PROMOTION to a hard gate =
      # drop continue-on-error. Artifacts are uploaded below on success AND failure.
      - name: Run byte-tier parity (non-blocking, nightly + dispatch)
        id: byte
        if: env.RUN_BYTE_TIER == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        working-directory: compaction-parity
        env:
          CQLITE_CASSANDRA_SRC: ${{ env.CQLITE_CASSANDRA_CACHE }}/${{ env.CASSANDRA_REF }}
          CQLITE_BIN: ${{ github.workspace }}/target/debug/cqlite
        run: |
          gradle --no-daemon byteParity

      # ── Surface a readable per-scenario / per-component diff on failure. ──
      # The harness asserts on a canonical sstabledump (JSONL) of each output, so
      # JUnit captures the exact mismatch. Print the failing test reports rather
      # than burying the diff in the raw Gradle log.
      - name: Surface per-scenario parity diffs (on failure)
        if: failure()
        working-directory: compaction-parity
        run: |
          echo "::group::Failed scenario reports (build/test-results)"
          if [ -d build/test-results/test ]; then
            for f in build/test-results/test/*.xml; do
              [ -e "$f" ] || continue
              echo "===== $f ====="
              # Print the failure/error message + diff text for each failing case.
              cat "$f"
              echo
            done
          else
            echo "no JUnit XML results found under build/test-results/test"
          fi
          echo "::endgroup::"

          echo "::group::Captured standard output (per-scenario diffs)"
          find build/reports/tests -name '*.txt' -print -exec cat {} \; 2>/dev/null || true
          echo "::endgroup::"

      # Upload on success AND failure (issue #1016 AC3/AC5): JUnit reports plus the
      # harness's preserved per-scenario artifacts (inputs, both engines' output
      # components, schema, exact command lines, stdout/stderr, normalized JSONL,
      # checksum summary, and the first byte/offset diff per component).
      - name: Upload parity reports and diffs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compaction-parity-reports
          path: |
            compaction-parity/build/reports/tests/**
            compaction-parity/build/test-results/**
            compaction-parity/build/parity-artifacts-test/**
            compaction-parity/build/parity-artifacts-byteParity/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Parity summary
        if: always()
        run: |
          {
            echo "# Compaction Parity Results"
            echo
            echo "| Tier | Comparison | Gating | Status |"
            echo "|---|---|---|---|"
            echo "| LOGICAL | canonical sstabledump JSONL equality | HARD GATE (per-PR) | ${{ steps.logical.outcome }} |"
            echo "| BYTE | per-component cmp, no allowlist | non-blocking (nightly/dispatch) | ${{ steps.byte.outcome || 'skipped' }} |"
            echo
            echo "Cassandra pin: ${{ env.CASSANDRA_REF }} (cache hit: ${{ steps.cassandra-cache.outputs.cache-hit }})"
            echo
            echo "The LOGICAL tier blocks this workflow on every PR and ALSO writes the"
            echo "per-component byte/offset diff + checksums as artifacts, so byte"
            echo "evidence is captured on every run. The dedicated BYTE assertion run"
            echo "(gradle byteParity, issue #1016) is the nightly_docker tier: it fires"
            echo "only on workflow_dispatch to avoid doubling the expensive compaction"
            echo "on PRs. Both tiers' artifacts upload as **compaction-parity-reports**"
            echo "(byte-diff.txt, checksums.txt, both engines' output dirs) on success"
            echo "AND failure. The byte tier is the #842 north star and stays"
            echo "non-blocking until the writer is byte-stable; promote it to a hard"
            echo "gate by dropping continue-on-error on the byte step."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR (failure)
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const body = `## ❌ Compaction Parity (logical tier) FAILED

            cqlite's compaction output diverged from Apache Cassandra's reference
            compaction for at least one scenario.

            - Logical tier (HARD GATE): \`${{ steps.logical.outcome }}\`

            The per-scenario, per-component diff is in the workflow log
            ("Surface per-scenario parity diffs") and in the
            **compaction-parity-reports** artifact (JUnit XML + HTML reports).

            Reproduce locally:
            \`\`\`bash
            compaction-parity/scripts/bootstrap-cassandra.sh
            cargo build --package cqlite-cli --features write-support
            cd compaction-parity && gradle test
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail on logical-tier divergence
        if: always() && steps.logical.outcome != 'success'
        run: |
          echo "❌ Logical-tier compaction parity failed: ${{ steps.logical.outcome }}"
          exit 1
