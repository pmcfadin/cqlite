name: Quality Gate Enforcement

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      enforcement_level:
        description: 'Enforcement level (strict, standard, permissive)'
        required: false
        type: choice
        options:
          - strict
          - standard
          - permissive
        default: strict

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTFLAGS: '-D warnings -D clippy::all -D clippy::pedantic'
  ENFORCEMENT_LEVEL: ${{ inputs.enforcement_level || 'strict' }}

jobs:
  # BLOCKING GATE 1: Code must compile without warnings
  compilation-enforcement:
    name: 🚫 BLOCKING - Compilation Enforcement
    runs-on: ubuntu-latest
    outputs:
      compilation-status: ${{ steps.compile.outputs.status }}
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Rust (Stable)
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Dependencies
      uses: Swatinem/rust-cache@v2

    - name: 🔒 STRICT COMPILATION CHECK (NO WARNINGS ALLOWED)
      id: compile
      run: |
        echo "🚫 ENFORCEMENT LEVEL: $ENFORCEMENT_LEVEL"
        echo "🔒 Zero-tolerance compilation check..."
        
        # Check workspace compilation with zero warnings tolerance
        if ! cargo check --workspace --all-features 2>&1 | tee compile.log; then
          echo "status=failed" >> $GITHUB_OUTPUT
          echo "❌ COMPILATION FAILED - PR BLOCKED"
          cat compile.log
          exit 1
        fi
        
        # Verify no warnings in compilation output
        if grep -i "warning" compile.log; then
          echo "status=failed" >> $GITHUB_OUTPUT
          echo "❌ COMPILATION WARNINGS DETECTED - PR BLOCKED"
          echo "::error::Compilation warnings are not allowed. Fix all warnings before proceeding."
          exit 1
        fi
        
        echo "status=passed" >> $GITHUB_OUTPUT
        echo "✅ COMPILATION ENFORCEMENT PASSED"

  # BLOCKING GATE 2: All tests must pass
  test-enforcement:
    name: 🚫 BLOCKING - Test Enforcement
    runs-on: ubuntu-latest
    needs: compilation-enforcement
    outputs:
      test-status: ${{ steps.test.outputs.status }}
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Dependencies
      uses: Swatinem/rust-cache@v2

    - name: 🔒 STRICT TEST ENFORCEMENT (ALL MUST PASS)
      id: test
      run: |
        echo "🔒 Running comprehensive test suite with zero-failure tolerance..."
        
        # Run all tests with detailed output
        if ! cargo test --all-features --no-fail-fast --verbose -- --nocapture 2>&1 | tee test.log; then
          echo "status=failed" >> $GITHUB_OUTPUT
          echo "❌ TESTS FAILED - PR BLOCKED"
          echo "::error::Test failures detected. All tests must pass."
          cat test.log
          exit 1
        fi
        
        # Run doc tests
        if ! cargo test --doc --all-features --verbose 2>&1 | tee doctest.log; then
          echo "status=failed" >> $GITHUB_OUTPUT
          echo "❌ DOC TESTS FAILED - PR BLOCKED"
          echo "::error::Documentation test failures detected."
          cat doctest.log
          exit 1
        fi
        
        # Check for test skips or ignored tests in non-strict mode
        if [[ "$ENFORCEMENT_LEVEL" == "strict" ]]; then
          if grep -i "ignored\|skipped" test.log doctest.log; then
            echo "❌ No ignored or skipped tests allowed in strict mode"
            echo "::error::Ignored or skipped tests detected in strict enforcement mode."
            exit 1
          fi
        fi
        
        echo "status=passed" >> $GITHUB_OUTPUT
        echo "✅ TEST ENFORCEMENT PASSED"

  # BLOCKING GATE 3: Code quality must be perfect
  quality-enforcement:
    name: 🚫 BLOCKING - Code Quality Enforcement
    runs-on: ubuntu-latest
    needs: compilation-enforcement
    outputs:
      quality-status: ${{ steps.quality.outputs.status }}
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Dependencies
      uses: Swatinem/rust-cache@v2

    - name: 🔒 STRICT FORMAT ENFORCEMENT (PERFECT FORMATTING)
      run: |
        echo "🔒 Checking code formatting with zero-tolerance..."
        if ! cargo fmt --all -- --check; then
          echo "❌ CODE FORMATTING VIOLATIONS - PR BLOCKED"
          echo "::error::Code is not properly formatted. Run 'cargo fmt --all' to fix."
          echo "::group::Formatting Diff"
          cargo fmt --all -- --check --verbose
          echo "::endgroup::"
          exit 1
        fi
        echo "✅ FORMAT ENFORCEMENT PASSED"

    - name: 🔒 STRICT CLIPPY ENFORCEMENT (ZERO LINTS)
      id: quality
      run: |
        echo "🔒 Running clippy with maximum strictness..."
        
        # Ultra-strict clippy configuration
        if ! cargo clippy --all-targets --all-features -- \
          -D warnings \
          -D clippy::all \
          -D clippy::pedantic \
          -D clippy::nursery \
          -D clippy::cargo \
          -D clippy::correctness \
          -D clippy::suspicious \
          -D clippy::complexity \
          -D clippy::perf \
          -D clippy::style \
          -D clippy::restriction \
          -A clippy::module_name_repetitions \
          -A clippy::missing_docs_in_private_items \
          -A clippy::implicit_return \
          -A clippy::exhaustive_structs \
          -A clippy::exhaustive_enums; then
          
          echo "status=failed" >> $GITHUB_OUTPUT
          echo "❌ CLIPPY VIOLATIONS DETECTED - PR BLOCKED"
          echo "::error::Clippy lints detected. All lints must be resolved."
          exit 1
        fi
        
        echo "status=passed" >> $GITHUB_OUTPUT
        echo "✅ QUALITY ENFORCEMENT PASSED"

  # BLOCKING GATE 4: Security audit must be clean
  security-enforcement:
    name: 🚫 BLOCKING - Security Enforcement
    runs-on: ubuntu-latest
    needs: compilation-enforcement
    outputs:
      security-status: ${{ steps.security.outputs.status }}
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: 🔒 STRICT SECURITY AUDIT (ZERO VULNERABILITIES)
      id: security
      uses: rustsec/audit-check@v1.4.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 🔒 DEPENDENCY VALIDATION
      run: |
        echo "🔒 Validating dependency security..."
        
        # Check for known vulnerabilities
        cargo audit --deny warnings
        
        # Analyze dependency tree for duplicates
        cargo tree --duplicate > duplicate_deps.txt
        if [[ -s duplicate_deps.txt ]]; then
          echo "⚠️ Duplicate dependencies detected:"
          cat duplicate_deps.txt
          if [[ "$ENFORCEMENT_LEVEL" == "strict" ]]; then
            echo "❌ Duplicate dependencies not allowed in strict mode"
            exit 1
          fi
        fi
        
        echo "status=passed" >> $GITHUB_OUTPUT
        echo "✅ SECURITY ENFORCEMENT PASSED"

  # BLOCKING GATE 5: Performance benchmarks must not regress
  performance-enforcement:
    name: 🚫 BLOCKING - Performance Enforcement
    runs-on: ubuntu-latest
    needs: [compilation-enforcement, test-enforcement]
    if: github.event_name == 'pull_request'
    outputs:
      performance-status: ${{ steps.performance.outputs.status }}
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Dependencies
      uses: Swatinem/rust-cache@v2

    - name: 🔒 PERFORMANCE REGRESSION DETECTION
      id: performance
      run: |
        echo "🔒 Checking for performance regressions..."
        
        # Get base branch for comparison
        git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}
        
        # Run benchmarks on base
        git checkout origin/${{ github.base_ref }}
        cargo bench --all-features -- --save-baseline base 2>&1 | tee base_bench.log
        
        # Run benchmarks on PR
        git checkout ${{ github.head_ref }}
        cargo bench --all-features -- --baseline base 2>&1 | tee pr_bench.log
        
        # Install critcmp for comparison
        cargo install critcmp --locked
        
        # Generate comparison report
        critcmp base > performance_report.txt
        
        # Check for significant regressions (>10% slower)
        if grep -E "(>.*[1-9][0-9]\.[0-9].*%.*slower|>.*[2-9]\.[0-9].*x.*slower)" performance_report.txt; then
          echo "status=failed" >> $GITHUB_OUTPUT
          echo "❌ PERFORMANCE REGRESSION DETECTED - PR BLOCKED"
          echo "::error::Significant performance regression detected (>10% slower)"
          echo "::group::Performance Report"
          cat performance_report.txt
          echo "::endgroup::"
          
          if [[ "$ENFORCEMENT_LEVEL" == "strict" ]]; then
            exit 1
          else
            echo "⚠️ Performance regression detected but allowing in non-strict mode"
          fi
        fi
        
        echo "status=passed" >> $GITHUB_OUTPUT
        echo "✅ PERFORMANCE ENFORCEMENT PASSED"

  # FINAL ENFORCEMENT GATE: All gates must pass
  enforcement-gate:
    name: 🚫 FINAL ENFORCEMENT GATE
    runs-on: ubuntu-latest
    needs: [compilation-enforcement, test-enforcement, quality-enforcement, security-enforcement, performance-enforcement]
    if: always()
    outputs:
      enforcement-result: ${{ steps.final.outputs.result }}
    
    steps:
    - name: 🔒 FINAL QUALITY GATE ENFORCEMENT
      id: final
      run: |
        echo "🔒 Evaluating all quality gates..."
        
        # Check all gate results
        COMPILATION="${{ needs.compilation-enforcement.outputs.compilation-status }}"
        TESTS="${{ needs.test-enforcement.outputs.test-status }}"
        QUALITY="${{ needs.quality-enforcement.outputs.quality-status }}"
        SECURITY="${{ needs.security-enforcement.outputs.security-status }}"
        PERFORMANCE="${{ needs.performance-enforcement.outputs.performance-status || 'skipped' }}"
        
        echo "📊 Quality Gate Results:"
        echo "  🔨 Compilation: $COMPILATION"
        echo "  🧪 Tests: $TESTS"
        echo "  🎯 Quality: $QUALITY"
        echo "  🛡️ Security: $SECURITY"
        echo "  ⚡ Performance: $PERFORMANCE"
        
        # Determine overall result
        FAILED_GATES=()
        
        if [[ "$COMPILATION" != "passed" ]]; then
          FAILED_GATES+=("Compilation")
        fi
        
        if [[ "$TESTS" != "passed" ]]; then
          FAILED_GATES+=("Tests")
        fi
        
        if [[ "$QUALITY" != "passed" ]]; then
          FAILED_GATES+=("Quality")
        fi
        
        if [[ "$SECURITY" != "passed" ]]; then
          FAILED_GATES+=("Security")
        fi
        
        if [[ "$PERFORMANCE" == "failed" ]]; then
          FAILED_GATES+=("Performance")
        fi
        
        # Final verdict
        if [[ ${#FAILED_GATES[@]} -eq 0 ]]; then
          echo "result=success" >> $GITHUB_OUTPUT
          echo "✅ ALL QUALITY GATES PASSED - MERGE ALLOWED"
          echo "🎉 This PR meets all quality standards and is ready for merge!"
        else
          echo "result=failure" >> $GITHUB_OUTPUT
          echo "❌ QUALITY GATES FAILED - MERGE BLOCKED"
          echo "🚫 Failed gates: ${FAILED_GATES[*]}"
          echo "::error::Quality gates not met. PR cannot be merged until all issues are resolved."
          
          # Create detailed failure summary
          echo "## 🚫 Quality Gate Failures" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following quality gates have failed:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for gate in "${FAILED_GATES[@]}"; do
            echo "- ❌ **$gate**" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**All quality gates must pass before this PR can be merged.**" >> $GITHUB_STEP_SUMMARY
          
          exit 1
        fi

    - name: 📊 Create Quality Gate Check
      uses: actions/github-script@v7
      if: always()
      with:
        script: |
          const result = '${{ steps.final.outputs.result }}';
          const conclusion = result === 'success' ? 'success' : 'failure';
          
          await github.rest.checks.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            name: 'Quality Gate Enforcement',
            head_sha: context.sha,
            status: 'completed',
            conclusion: conclusion,
            output: {
              title: conclusion === 'success' ? '✅ All Quality Gates Passed' : '❌ Quality Gates Failed',
              summary: conclusion === 'success' 
                ? 'All quality gates have passed. This PR is ready for merge.'
                : 'One or more quality gates have failed. Please resolve all issues before merging.'
            }
          });

  # Notification system for quality gate results
  quality-notifications:
    name: 📢 Quality Gate Notifications
    runs-on: ubuntu-latest
    needs: [enforcement-gate]
    if: always() && github.event_name == 'pull_request'
    
    steps:
    - name: 📢 Post Quality Gate Results
      uses: actions/github-script@v7
      with:
        script: |
          const result = '${{ needs.enforcement-gate.outputs.enforcement-result }}';
          const conclusion = result === 'success' ? 'success' : 'failure';
          
          const emoji = conclusion === 'success' ? '✅' : '❌';
          const status = conclusion === 'success' ? 'PASSED' : 'FAILED';
          const message = conclusion === 'success' 
            ? 'All quality gates have passed! This PR is ready for review and merge.' 
            : 'Quality gates have failed. Please address all issues before proceeding.';
          
          const comment = `## ${emoji} Quality Gates ${status}
          
          ${message}
          
          ### Gate Results:
          - 🔨 **Compilation**: ${{ needs.compilation-enforcement.result }}
          - 🧪 **Tests**: ${{ needs.test-enforcement.result }}
          - 🎯 **Code Quality**: ${{ needs.quality-enforcement.result }}
          - 🛡️ **Security**: ${{ needs.security-enforcement.result }}
          - ⚡ **Performance**: ${{ needs.performance-enforcement.result }}
          
          ${conclusion === 'failure' ? '**🚫 This PR is blocked from merging until all quality gates pass.**' : ''}
          
          ---
          *Enforcement Level: ${{ env.ENFORCEMENT_LEVEL }}*
          `;
          
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });