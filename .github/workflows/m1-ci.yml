name: "CI: Core Library (minimal)"

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    # Transitional bridge: branch protection still requires the two legacy M1
    # contexts until "Required PR Gate / required" has proven on a PR and the
    # checked-in/live protection rules are updated. Keep these contexts emitted
    # for every PR without running the retired heavyweight M1 lanes.
    paths-ignore:
      - '__required_m1_context_never_matches__'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  m1-core-validation:
    name: m1-core-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report legacy M1 core status
        run: |
          {
            echo "### Legacy M1 core context"
            echo
            echo "This workflow is retained only for branch-protection continuity."
            echo
            echo "Required Rust PR validation now runs in \`Required PR Gate / required\`, including:"
            echo
            echo "- cargo fmt"
            echo "- cqlite-core clippy with all targets and all features"
            echo "- cqlite-core all-feature build"
            echo "- fast representative cqlite-core tests"
            echo
            echo "The retired M1 fmt/clippy/build/test lanes no longer run on ordinary PRs."
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "Legacy M1 core context satisfied by Required PR Gate / required."

  sstabledump-parity-m1:
    name: sstabledump-parity-m1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report legacy M1 parity status
        run: |
          {
            echo "### Legacy M1 parity context"
            echo
            echo "This workflow is retained only for branch-protection continuity."
            echo
            echo "SSTableDump parity coverage remains in the dedicated \`CI: SSTableDump Parity Gate / sstabledump-parity\` workflow and the broader targeted/nightly parity workflows."
            echo
            echo "The retired M1 Docker/dataset parity harness no longer runs on ordinary PRs."
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "Legacy M1 parity context satisfied by the dedicated parity gate."
