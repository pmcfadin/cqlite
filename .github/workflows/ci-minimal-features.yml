name: Minimal Features CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/ci-minimal-features.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'cqlite-core/**'
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/ci-minimal-features.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'cqlite-core/**'

concurrency:
  group: minimal-features-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  # Avoid one-shot failures from transient crates.io HTTP/2 framing errors.
  CARGO_HTTP_MULTIPLEXING: false

jobs:
  minimal_compression_build:
    name: Minimal Compression Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cqlite-core

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        # No `toolchain:` input: setup-rust-toolchain reads rust-toolchain.toml
        # (pinned 1.88.0) instead of overriding it with stable (issue #1990).
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build with minimal compression (lz4 + snappy only)
        run: cargo build --no-default-features --features=lz4,snappy

  all_compression_test:
    name: All Compression Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cqlite-core

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        # No `toolchain:` input: setup-rust-toolchain reads rust-toolchain.toml
        # (pinned 1.88.0) instead of overriding it with stable (issue #1990).
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build with all compression support
        run: cargo build --no-default-features --features=all-compression

      - name: Test with all compression support (lib only)
        run: |
          # Run library tests only. This lane deliberately does NOT fetch the
          # binary Data.db fixtures, so CQLITE_DATASETS_ROOT must stay unset:
          # data-dependent unit tests (e.g. the #1080 regression tests) skip
          # cleanly when it is unset, but hard-fail ("refusing to silently
          # skip") if it points at a fixture-less directory. The lane's purpose
          # is validating feature gating and minimal compilation, not data parity.
          cargo test --no-default-features --features=all-compression --quiet --lib

  parquet_export_test:
    name: Parquet Export Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cqlite-core

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        # No `toolchain:` input: setup-rust-toolchain reads rust-toolchain.toml
        # (pinned 1.88.0) instead of overriding it with stable (issue #1990).
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build and test with parquet export feature (Epic #682)
        run: |
          # The optional parquet feature must compile and its writer unit
          # tests must pass (no test-data dependency for the lib tests).
          cargo build --features=parquet
          cargo test --features=parquet --quiet --lib export::parquet

  default_dependency_guard:
    name: Default Dependency Guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cqlite-core

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        # No `toolchain:` input: setup-rust-toolchain reads rust-toolchain.toml
        # (pinned 1.88.0) instead of overriding it with stable (issue #1990).
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Verify default build does not compile arrow/parquet (Epic #682)
        run: |
          # The parquet feature is opt-in: the default dependency surface
          # must not include the arrow/parquet crates.
          if cargo tree -e normal | grep -qE "(^|[ ])(arrow|parquet) v[0-9]"; then
            echo "ERROR: arrow/parquet found in default cqlite-core dependency tree"
            cargo tree -e normal | grep -E "(arrow|parquet) v"
            exit 1
          else
            echo "OK: default build excludes arrow/parquet"
          fi

  feature-gate-validation:
    name: Feature Gate Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        # No `toolchain:` input: setup-rust-toolchain reads rust-toolchain.toml
        # (pinned 1.88.0) instead of overriding it with stable (issue #1990).
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Verify M2+ core features ARE in defaults
        run: |
          # M2+ minimal default build must include: all-compression, state_machine
          # metrics and experimental are optional (Issue #173)
          required_features=("all-compression" "state_machine")
          for feature in "${required_features[@]}"; do
            if grep -q "default = \[.*\"$feature\".*\]" cqlite-core/Cargo.toml; then
              echo "✓ Required M2+ feature '$feature' found in defaults"
            else
              echo "ERROR: Required M2+ feature '$feature' missing from defaults"
              exit 1
            fi
          done

      - name: Verify 'parquet' feature is NOT in default features (Epic #682)
        run: |
          if grep -q 'default = \[.*"parquet".*\]' cqlite-core/Cargo.toml; then
            echo "ERROR: 'parquet' feature found in default features"
            echo "The Parquet export writer must remain opt-in (Epic #682)"
            exit 1
          else
            echo "OK: 'parquet' feature is correctly NOT in default features"
          fi

      - name: Verify 'benchmarks' feature is NOT in default features
        run: |
          if grep -q 'default = \[.*"benchmarks".*\]' cqlite-core/Cargo.toml; then
            echo "ERROR: 'benchmarks' feature found in default features"
            echo "This violates the minimal features policy for Issue #168"
            exit 1
          else
            echo "✓ 'benchmarks' feature is correctly NOT in default features"
          fi

      - name: Check for feature documentation presence
        run: |
          if grep -q "# M2+ production defaults" cqlite-core/Cargo.toml && \
             grep -q "# Compression features" cqlite-core/Cargo.toml && \
             grep -q "# Other features" cqlite-core/Cargo.toml; then
            echo "✓ Feature documentation is present"
          else
            echo "WARNING: Feature documentation may be incomplete"
            echo "Please ensure all feature sections are documented"
            exit 1
          fi

      - name: Validate default features list
        run: |
          echo "Current default features:"
          grep '^default = ' cqlite-core/Cargo.toml

          echo ""
          echo "Validating feature configuration..."

          # Ensure default features are properly documented
          if grep -A 1 '^# M2+ production defaults' cqlite-core/Cargo.toml | grep -q '^default = '; then
            echo "✓ Default features are documented"
          else
            echo "WARNING: Default features lack documentation comment"
          fi
