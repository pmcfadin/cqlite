name: "CI: Coverage Gate (90%)"

on:
  schedule:
    # Nightly deep coverage validation at 07:35 UTC, after parity/data lanes warm caches.
    - cron: '35 7 * * *'
  workflow_dispatch:
    inputs:
      coverage_mode:
        description: 'Coverage analysis mode'
        required: false
        default: 'enforced'
        type: choice
        options:
          - 'enforced'
          - 'comprehensive'
          - 'baseline'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  COVERAGE_THRESHOLD: 90

permissions:
  contents: read

concurrency:
  group: coverage-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-gate:
    name: Coverage Gate ≥90% (Phase 2 Enforcement)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        coverage-type: [enforced, comprehensive]
        
    steps:
    - uses: actions/checkout@v5
    
    # Pin to the repo toolchain (rust-toolchain.toml = 1.88.0), issue #1990.
    # dtolnay/rust-toolchain cannot read the pin file, so pin the version ref
    # explicitly (bump alongside rust-toolchain.toml).
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.88.0
      with:
        components: llvm-tools-preview
        
    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: coverage-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        
    # Install PREBUILT pinned binaries instead of `cargo install` from source
    # (issue #1990). Source-building cargo-tarpaulin v0.37.0 fails on newer
    # rustc; a prebuilt binary can't be broken by a toolchain/edition drift and
    # runs against the pinned 1.88.0 toolchain.
    - name: Install tarpaulin (prebuilt, pinned)
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-tarpaulin@0.37.0

    - name: Install llvm-cov (validation, prebuilt)
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov
      
    - name: Restore datasets-v3 cache (same as ci.yml)
      uses: actions/cache/restore@v5
      with:
        path: |
          test-data/datasets/
          validation_artifacts/sstabledump/
        key: datasets-v3-3cae644360e0142a6bb5e96ddab445ff18e3478e7058104842ce1a455fba8a33-${{ hashFiles('test-data/**/*.md') }}
        restore-keys: |
          datasets-v3-3cae644360e0142a6bb5e96ddab445ff18e3478e7058104842ce1a455fba8a33-

    - name: Download Cassandra 5 Datasets (if cache miss)
      run: |
        echo "🔍 Checking for existing datasets..."
        ls -la test-data/ || echo "📁 test-data directory does not exist"

        # Gate the download on the SSTable Data.db core fixture, NOT any *.db
        # count (#1097). A partial/stale cache can restore JSONL refs (and even
        # some unrelated *.db files) without the test_basic/simple_table Data.db
        # binary that the #1080 no-silent-skip guard requires.
        CORE_FIXTURE_COUNT=$(find test-data/datasets/sstables/test_basic -path '*simple_table-*-Data.db' 2>/dev/null | wc -l)
        echo "📊 Core Data.db fixture count: $CORE_FIXTURE_COUNT"

        if [ "$CORE_FIXTURE_COUNT" -eq 0 ]; then
          echo "📦 Core Data.db fixture missing - downloading full Cassandra 5 datasets from release..."
          mkdir -p test-data
          echo "🔍 Downloading cassandra5-small-full-v3.4.tar.gz from datasets-v3 release..."
          gh release download datasets-v3 --pattern "cassandra5-small-full-v3.4.tar.gz" --dir /tmp
          echo "3cae644360e0142a6bb5e96ddab445ff18e3478e7058104842ce1a455fba8a33  /tmp/cassandra5-small-full-v3.4.tar.gz" | sha256sum -c -
          echo "📦 Extracting datasets to repo root..."
          rm -rf test-data/datasets
          tar -xzf /tmp/cassandra5-small-full-v3.4.tar.gz -C . --exclude='*/._*' --exclude='._*' --exclude='*/.DS_Store' --exclude='.DS_Store'

          # Verify extraction
          NEW_DB_COUNT=$(find test-data/datasets/sstables -name '*-Data.db' 2>/dev/null | wc -l)
          echo "✅ Extraction complete - now have $NEW_DB_COUNT Data.db fixtures"
          echo "📁 Contents of test-data/:"
          ls -la test-data/
          echo "📁 Contents of test-data/datasets/:"
          ls -la test-data/datasets/ || echo "❌ Datasets directory missing after extraction"
        else
          echo "✅ Cache hit - core Data.db fixture present"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Verify Real Cassandra 5 Datasets
      run: |
        echo "🔍 Verifying real Cassandra 5 SSTable datasets are available..."
        echo "📁 Repository test data structure:"
        ls -la test-data/ || echo "❌ test-data directory missing"
        
        DB_COUNT=$(find test-data -name '*.db' | wc -l)
        echo "📊 Found $DB_COUNT real Cassandra 5 SSTable files"
        
        if [ "$DB_COUNT" -eq 0 ]; then
          echo "❌ CRITICAL: No real Cassandra 5 datasets found"
          echo "❌ Expected: Real SSTable files from datasets-v3 release"
          echo "❌ This workflow requires REAL data - no synthetic/mock data allowed"
          exit 1
        fi
        
        echo "✅ Real Cassandra 5 datasets verified: $DB_COUNT SSTable files available"
        echo "🎯 Ready for coverage analysis with authentic data"

    - name: Validate references manifest (non-blocking)
      run: |
        echo "::group::References manifest validation (non-blocking)"
        if [ -f test-data/datasets/references.yml ]; then
          echo "✅ Found references.yml; validating refs..."
          MISSING=0
          while IFS= read -r -d '' DATA_FILE; do
            DIR="$(dirname "$DATA_FILE")"; BASE="$(basename "$DATA_FILE")"; PREFIX_NAME="${BASE%-Data.db}"
            JSONL="$DIR/${PREFIX_NAME}-Data.db.jsonl"; STATS="$DIR/${PREFIX_NAME}-Statistics.db.txt"
            if [ ! -s "$JSONL" ]; then echo "::warning::Missing or empty $JSONL"; MISSING=$((MISSING+1)); fi
            if [ ! -s "$STATS" ]; then echo "::warning::Missing or empty $STATS"; MISSING=$((MISSING+1)); fi
          done < <(find test-data/datasets/sstables -type f -name "*-Data.db" -print0 2>/dev/null || true)
          echo "References validation complete; missing_count=$MISSING"
        else
          echo "ℹ️ references.yml not found; skipping (until datasets-v3)."
        fi
        echo "::endgroup::"
        
    - name: Format and Lint Check
      run: |
        cargo fmt --all --check
        cargo clippy --all-targets --all-features -- -D warnings
    
    - name: Run Enforced Coverage Analysis (≥90% REQUIRED - Phase 2)
      if: matrix.coverage-type == 'enforced'
      env:
        CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
      working-directory: cqlite-core
      run: |
        mkdir -p ../validation_artifacts/coverage
        # Verify real Cassandra 5 test data is available - FAIL if missing
        DB_COUNT=$(find "$CQLITE_DATASETS_ROOT" -name '*.db' | wc -l)
        if [ "$DB_COUNT" -eq 0 ]; then
          echo "❌ CRITICAL: No real Cassandra 5 SSTable files found in test-data/"
          exit 1
        fi
        echo "📊 Running enforced coverage analysis with $DB_COUNT real Cassandra 5 SSTable files"
        echo "🎯 Phase 2 requirement: ≥90% coverage for core modules"

        # Use cargo-llvm-cov for more accurate coverage. The tool supports one
        # output format per report invocation, so run tests once, then emit the
        # HTML and LCOV reports from the captured profile data.
        cargo llvm-cov clean --workspace
        cargo llvm-cov \
          --package cqlite-core \
          --no-report \
          --ignore-filename-regex='(test|spec|bench|examples|bin)' \
          --verbose
        cargo llvm-cov report \
          --html \
          --output-dir ../validation_artifacts/coverage/html \
          --ignore-filename-regex='(test|spec|bench|examples|bin)' \
          --fail-under-lines 90 \
          --verbose
        cargo llvm-cov report \
          --lcov \
          --output-path ../validation_artifacts/coverage/lcov.info \
          --ignore-filename-regex='(test|spec|bench|examples|bin)' \
          --verbose
          
    - name: Run Comprehensive Coverage (Informational)
      if: matrix.coverage-type == 'comprehensive' 
      continue-on-error: true
      env:
        CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
      working-directory: cqlite-core
      run: |
        mkdir -p ../validation_artifacts/coverage
        # Verify real Cassandra 5 test data is available - FAIL if missing
        DB_COUNT=$(find "$CQLITE_DATASETS_ROOT" -name '*.db' | wc -l)
        if [ "$DB_COUNT" -eq 0 ]; then
          echo "❌ CRITICAL: No real Cassandra 5 SSTable files found"
          exit 1
        fi
        echo "📊 Running comprehensive coverage with $DB_COUNT real Cassandra 5 SSTable files"
        cargo tarpaulin \
          --timeout 600 \
          --packages cqlite-core \
          --packages cqlite-cli \
          --out Html \
          --output-dir ../validation_artifacts/coverage \
          --fail-under 80 \
          --verbose
          
    - name: Parse Coverage Results and Generate Reports
      if: matrix.coverage-type == 'enforced'
      run: |
        mkdir -p validation_artifacts/coverage/reports

        # Parse LCOV results for detailed analysis
        python3 << 'EOF'
        import re
        import json
        import os

        def parse_lcov_coverage(lcov_file):
            """Parse LCOV file and extract detailed coverage metrics."""
            try:
                with open(lcov_file, 'r') as f:
                    content = f.read()
            except FileNotFoundError:
                print("❌ Coverage file not found")
                return None

            files = {}
            current_file = None

            for line in content.split('\n'):
                if line.startswith('SF:'):
                    current_file = line[3:]
                    files[current_file] = {'lines_hit': 0, 'lines_found': 0}
                elif line.startswith('LH:') and current_file:
                    files[current_file]['lines_hit'] = int(line[3:])
                elif line.startswith('LF:') and current_file:
                    files[current_file]['lines_found'] = int(line[3:])

            # Calculate overall coverage
            total_hit = sum(f['lines_hit'] for f in files.values())
            total_found = sum(f['lines_found'] for f in files.values())
            overall_coverage = (total_hit / total_found * 100) if total_found > 0 else 0

            return {
                'overall_coverage': overall_coverage,
                'total_lines': total_found,
                'covered_lines': total_hit,
                'files': files
            }

        # Parse coverage results
        coverage_data = parse_lcov_coverage("validation_artifacts/coverage/lcov.info")

        if coverage_data:
            coverage_pct = coverage_data['overall_coverage']
            print(f"📊 Overall Coverage: {coverage_pct:.2f}%")
            print(f"📈 Lines Covered: {coverage_data['covered_lines']}/{coverage_data['total_lines']}")

            # Generate badge
            if coverage_pct >= 90:
                color = "brightgreen"
                status = "PASSED"
            elif coverage_pct >= 80:
                color = "yellow"
                status = "WARNING"
            else:
                color = "red"
                status = "FAILED"

            # Create badge markdown
            badge_md = f"![Coverage](https://img.shields.io/badge/coverage-{coverage_pct:.1f}%25-{color})"
            with open("validation_artifacts/coverage/reports/coverage-badge.md", "w") as f:
                f.write(badge_md)

            # Create detailed report
            report = {
                "coverage_percentage": coverage_pct,
                "status": status,
                "threshold": 90,
                "total_lines": coverage_data['total_lines'],
                "covered_lines": coverage_data['covered_lines'],
                "files": len(coverage_data['files']),
                "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }

            with open("validation_artifacts/coverage/reports/coverage-report.json", "w") as f:
                json.dump(report, f, indent=2)

            print(f"✅ Coverage report generated: {status}")

            # Enforce threshold
            if coverage_pct < 90:
                print(f"❌ Coverage gate FAILED: {coverage_pct:.2f}% < 90% (Phase 2 requirement)")
                exit(1)
            else:
                print(f"✅ Coverage gate PASSED: {coverage_pct:.2f}% ≥ 90%")
        else:
            print("❌ Failed to parse coverage data")
            exit(1)
        EOF
        
    - name: Upload Coverage Reports
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: coverage-${{ matrix.coverage-type }}-reports
        path: validation_artifacts/coverage/
        retention-days: 45
        if-no-files-found: warn

    - name: Write coverage triage summary
      if: always()
      run: |
        {
          echo "## Coverage Gate (${{ matrix.coverage-type }})"
          echo ""
          echo "- Event: ${{ github.event_name }}"
          echo "- Commit: ${{ github.sha }}"
          echo "- Branch: ${{ github.ref_name }}"
          echo "- Mode input: ${{ github.event.inputs.coverage_mode || 'enforced' }}"
          echo "- Dataset root: ${{ env.CQLITE_DATASETS_ROOT }}"
          echo "- Artifact: coverage-${{ matrix.coverage-type }}-reports (retained 45 days)"
        } >> "$GITHUB_STEP_SUMMARY"

        if [ -f validation_artifacts/coverage/reports/coverage-report.json ]; then
          python3 <<'PY' >> "$GITHUB_STEP_SUMMARY"
        import json
        with open("validation_artifacts/coverage/reports/coverage-report.json") as f:
            report = json.load(f)
        print(f"- Coverage: {report['coverage_percentage']:.2f}%")
        print(f"- Threshold: {report['threshold']}%")
        print(f"- Status: {report['status']}")
        PY
        else
          {
            echo "- Coverage report: not generated for this matrix leg; inspect the job log and artifact contents."
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        
    - name: Integration with Quality Gates
      if: matrix.coverage-type == 'enforced'
      run: |
        echo "✅ Phase 2 coverage gate enforcement completed"
        echo "📊 Using real Cassandra 5 datasets from test-data/datasets/"
        echo "🚫 Test files, examples, and binaries excluded from coverage analysis"
        echo "🎯 Phase 2 requirement: ≥90% coverage for core reading library"
        echo "🔄 Coverage results available for coordination with multi-arch and performance gates"

  # Quality gate integration job
  coverage-quality-gate:
    name: Coverage Quality Gate Integration
    runs-on: ubuntu-latest
    needs: [coverage-gate]
    if: always()

    steps:
    - name: Evaluate coverage gate results
      run: |
        echo "🎯 Coverage Quality Gate Results:"
        echo "Status: ${{ needs.coverage-gate.result }}"

        if [ "${{ needs.coverage-gate.result }}" != "success" ]; then
          echo "❌ Coverage gate failed"
          echo "💡 Coverage must be ≥90% for Phase 2 requirements"
          echo "💡 Add more tests to increase coverage"
          echo "💡 Review uncovered code paths in the HTML report"
          exit 1
        fi

        echo "✅ Coverage gate passed!"
        echo "📊 Core modules meet ≥90% coverage requirement"

    - name: Write aggregate coverage summary
      if: always()
      run: |
        {
          echo "## Aggregate Coverage Gate"
          echo ""
          echo "- Coverage matrix result: ${{ needs.coverage-gate.result }}"
          echo "- Required threshold: ${COVERAGE_THRESHOLD}%"
          echo "- Failure response: inspect the per-matrix artifacts, then rerun this workflow manually after fixes."
        } >> "$GITHUB_STEP_SUMMARY"

  # Store coverage results for coordination
  store-coverage-results:
    name: Store Coverage Results
    runs-on: ubuntu-latest
    needs: [coverage-quality-gate]
    if: always()

    steps:
    - name: Store coverage test results
      run: |
        echo "📊 Coverage testing completed with status: ${{ needs.coverage-quality-gate.result }}"
        echo "🔄 Results available for coordination with multi-arch and performance gates"
