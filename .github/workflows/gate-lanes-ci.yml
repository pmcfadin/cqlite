# Runner pinned to ubuntu-24.04: ubuntu-latest moved to 26.04 and broke duckdb + Python 3.9 (#4473).
name: Gate lanes CI

# REGISTERED GATING TIER (issue #4433, part of #4407; .github/ci-gating-tiers.yml).
# Runs the remaining cheap local full-gate components on every PR, grouped
# into four jobs: lint/hygiene (workspace clippy and the policy checks), the
# guard targets, the feature-isolation lanes, and smoke. Same mechanism as
# component-tests-ci.yml (#4429): each job calls
# `scripts/agent-gate.sh --only <comma list>`, so CI executes the gate's own
# component bodies, and every listed component's OWN line must read PASS.
# tooling-tests is deliberately not here (#4433: ~50 min and unscoped under
# --only); dep-duplicates is advisory; delivery-telemetry is retired.

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/gate-lanes-ci.yml'
      - '.github/actions/setup-rust-ci/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'cqlite-core/**'
      - 'cqlite-cli/**'
      - 'tests/**'
      - 'bindings/**'
      - 'tools/**'
      - 'docs/**'
      - 'test-data/**'
      - 'scripts/**'
  pull_request:
    # The trigger MUST always fire so the `Gate lanes tier gate` context is
    # emitted on every PR (an absent registered context is an error, never "not
    # applicable"). Same always-fire sentinel and no `branches:` filter as
    # flight-ci.yml / core-tests-ci.yml; validate-workflows.rb enforces both.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths-ignore:
      - '__required_ci_context_never_matches__'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-lanes-ci-${{ github.ref }}
  # A new head sha obsoletes the in-flight run; a LABEL mutation does not
  # (applying the ci:waive:gate-lanes break-glass must not cancel this
  # tier's in-flight run). gating_event_rules.rb enforces this.
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
    && github.event.action != 'labeled'
    && github.event.action != 'unlabeled' }}

env:
  CARGO_TERM_COLOR: always
  DATASET_TAG: datasets-v4
  DATASET_ASSET: cassandra5-small-full-v4.0.tar.gz
  DATASET_SHA256: 5fa11922dd380d8c7516d287b666954d26dbe593937e5cba7c322889b9dd9142

jobs:
  # ALWAYS-RUN classifier with EXACTLY ONE applicability output (`run_tier`).
  # The tier is skipped only for a genuinely docs-only diff
  # (scripts/ci/classify-docs-only.sh, the same classifier pr-gate.yml uses).
  # Everything else, including an empty diff and every non-PR event, runs it.
  classify:
    name: Classify Gate lanes tier scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_tier: ${{ steps.scope.outputs.run_tier }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify diff
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run_tier=true" >> "$GITHUB_OUTPUT"
            echo "reason=non-PR event (${EVENT_NAME}): full tier" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # core.quotePath=false (issue #3250): raw paths so the classifier sees
          # real extensions. Same invocation as pr-gate.yml.
          git -c core.quotePath=false diff --name-only "${BASE_SHA}...${HEAD_SHA}" > changed-files.txt
          echo "Changed files:"
          sed 's/^/  - /' changed-files.txt

          if [ ! -s changed-files.txt ]; then
            echo "run_tier=true" >> "$GITHUB_OUTPUT"
            echo "reason=empty changed-file set; running the full tier fail-closed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if bash scripts/ci/classify-docs-only.sh < changed-files.txt; then
            echo "run_tier=false" >> "$GITHUB_OUTPUT"
            echo "reason=docs-only diff cannot change the compiled binary" >> "$GITHUB_OUTPUT"
          else
            echo "run_tier=true" >> "$GITHUB_OUTPUT"
            echo "reason=diff is not docs-only; running the full gate-lanes tier" >> "$GITHUB_OUTPUT"
          fi
          echo "Gate lanes tier verdict: $(grep -h run_tier "$GITHUB_OUTPUT" | tail -1)"

  gate_component:
    name: Gate lanes ${{ matrix.group }}
    needs: classify
    if: ${{ needs.classify.outputs.run_tier == 'true' }}
    runs-on: ubuntu-24.04
    # Classify (5) + this (45) + tier-gate (5) stays inside the registry's
    # wait_minutes: 70.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: lint
            components: file-size,clippy,roborev-lints,pub-surface,features-load-bearing,oom-audit,parity-report,kit-dashboard-drift,binding-unwind-profile,operator-metrics-doc
          - group: guards
            components: tombstones-scan,scan-offload-guard,work-counters-guard,byte-budget-guard,arrow-parity-guard,memory-budget,bti-multiclustering,compaction-byte-parity,flight-query-semantics-oracle
          - group: features
            components: legacy-heuristics,feature-iso-parquet,feature-iso-delta-scan,minimal-build
          - group: smoke
            components: smoke
    env:
      # Same build posture as the nightly full gate (gate.yml).
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # agent-gate.sh resolves origin/main.
          fetch-depth: 0
          persist-credentials: false

      - name: Free disk space (issue #722)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci
        with:
          components: clippy,rustfmt
          cache-key: gate-lanes-${{ matrix.group }}

      - name: Restore dataset cache
        uses: actions/cache@v5
        with:
          path: test-data/datasets
          key: datasets-${{ env.DATASET_TAG }}-${{ env.DATASET_SHA256 }}

      - name: Fetch datasets if required fixture data missing
        run: >-
          bash scripts/ci/ci-timing-summary.sh measure
          "fetch datasets"
          -- bash ./test-data/scripts/fetch-datasets.sh

      - name: Re-assert committed dataset fixtures over the cache/bundle (#4356)
        # The cache/bundle predates later fixture commits; committed copies must
        # win (fetch-datasets.sh::restore_tracked_dataset_files, #2878).
        run: git restore --source=HEAD -- test-data/datasets

      - name: Verify dataset corpus
        # `--only` keeps the gate's fixture preflight lenient, so the corpus is
        # verified here, before the run, against the committed manifest.
        run: bash test-data/scripts/check-dataset-manifest.sh test-data/datasets

      - name: Run the gate components
        env:
          COMPONENTS: ${{ matrix.components }}
          CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
          CQLITE_REQUIRE_FIXTURES: '1'
          CQLITE_PARITY_REQUIRE_DATASETS: '1'
          AGENT_GATE_SUMMARY_FILE: ${{ runner.temp }}/agent-gate-summary.txt
        run: |
          set -uo pipefail
          # GitHub runs this step under `bash -e`, and `--only` exits 3 even on
          # success (its run is PARTIAL by design), so the exit status is
          # captured with errexit off and the verdict comes from the readers below.
          set +e
          bash scripts/ci/ci-timing-summary.sh measure "agent-gate --only ${COMPONENTS}" \
            -- bash scripts/agent-gate.sh --only "${COMPONENTS}" < /dev/null
          rc=$?
          set -e
          echo "agent-gate.sh --only ${COMPONENTS} exited ${rc}"
          test -s "$AGENT_GATE_SUMMARY_FILE" || { echo "::error::no gate summary was written"; exit 1; }
          cat "$AGENT_GATE_SUMMARY_FILE"

          # Two separate assertions (docs/development/gate-ops.md): did the run
          # finish, and did EACH listed component's own line read PASS.
          run_id=$(sed -n 's/^run-id: //p' "$AGENT_GATE_SUMMARY_FILE" | head -1)
          [ -n "$run_id" ] || { echo "::error::the gate summary carries no run-id"; exit 1; }
          bash scripts/gate-liveness.sh "$AGENT_GATE_SUMMARY_FILE" --run-id "$run_id" ||
            { echo "::error::gate run did not complete (gate-liveness.sh)"; exit 1; }
          failed=""
          IFS=',' read -ra list <<< "$COMPONENTS"
          for c in "${list[@]}"; do
            if bash scripts/gate-component-verdict.sh "$AGENT_GATE_SUMMARY_FILE" \
                 --mode only --component "$c" --run-id "$run_id"; then
              echo "$c: PASS"
            else
              failed="${failed}${c} "
            fi
          done
          [ -z "$failed" ] || { echo "::error::did not PASS: ${failed}"; exit 1; }
          echo "all ${#list[@]} components PASS"

      - name: Upload gate summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agent-gate-summary-${{ matrix.group }}
          path: ${{ runner.temp }}/agent-gate-summary.txt
          if-no-files-found: warn
          retention-days: 14

      - name: CI runtime timing summary
        if: always()
        run: bash scripts/ci/ci-timing-summary.sh summary "CI gate component timing"

  # ALWAYS-EMIT gate job; its `name:` IS the check-run context registered in
  # .github/ci-gating-tiers.yml. `!cancelled()`, not `always()` (see
  # flight-ci.yml). Skipped counts as a pass only when run_tier is exactly
  # 'false'; an unreadable verdict reds.
  tier-gate:
    name: Gate lanes tier gate
    needs: [classify, gate_component]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report the Gate lanes tier result
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          COMPONENTS_RESULT: ${{ needs.gate_component.result }}
          SCOPE_REASON: ${{ needs.classify.outputs.reason }}
          RUN_TIER: ${{ needs.classify.outputs.run_tier }}
        run: |
          set -euo pipefail

          {
            echo "## Gate lanes tier gate (issue #4433)"
            echo ""
            echo "- scope: run_tier=\`${RUN_TIER:-unknown}\` (${SCOPE_REASON:-no reason recorded})"
            echo "- classify: \`${CLASSIFY_RESULT}\`"
            echo "- gate_component (lint, guards, features, smoke): \`${COMPONENTS_RESULT}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # `skipped` is a PASS here and only here; anything else that is not
          # `success` reds the context.
          failed=""
          for pair in "classify:${CLASSIFY_RESULT}" "gate_component:${COMPONENTS_RESULT}"; do
            job="${pair%%:*}"
            result="${pair#*:}"
            case "$result" in
              success|skipped) ;;
              *) failed="${failed}${job}(${result}) " ;;
            esac
          done

          if [ -n "$failed" ]; then
            echo "::error::Gate lanes tier failed: ${failed}"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Gate lanes tier FAILED: ${failed}**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # UNKNOWN MUST NOT READ AS PASS: `skipped` is a pass only as a claim
          # about run_tier, so the verdict is validated, not assumed.
          case "${RUN_TIER:-}" in
            true|false) ;;
            *)
              echo "::error::Gate lanes tier gate: the classifier's applicability verdict is" \
                   "run_tier='${RUN_TIER:-}' (neither 'true' nor 'false'). An unreadable verdict is" \
                   "NOT inapplicability; the tier reds rather than reporting a vacuous success."
              {
                echo ""
                echo "**Gate lanes tier FAILED: unreadable applicability verdict"
                echo "\`run_tier='${RUN_TIER:-}'\` (expected \`true\` or \`false\`).**"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac

          # When the tier IS applicable the work must actually have run.
          if [ "$RUN_TIER" = "true" ]; then
            inconsistent=""
            for pair in "classify:${CLASSIFY_RESULT}" "gate_component:${COMPONENTS_RESULT}"; do
              job="${pair%%:*}"
              result="${pair#*:}"
              [ "$result" = "success" ] || inconsistent="${inconsistent}${job}(${result}) "
            done
            if [ -n "$inconsistent" ]; then
              echo "::error::Gate lanes tier gate: run_tier=true (${SCOPE_REASON:-no reason recorded}) but" \
                   "${inconsistent}did not run to success. A mandating diff whose work was skipped must" \
                   "never report a green tier."
              {
                echo ""
                echo "**Gate lanes tier FAILED: run_tier=true but ${inconsistent}was not a success.**"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          else
            echo "Gate lanes tier not applicable to this diff (${SCOPE_REASON:-}); reporting success."
          fi
          echo "Gate lanes tier gate: PASS"
