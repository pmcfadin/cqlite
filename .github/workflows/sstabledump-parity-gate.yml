name: SSTableDump Parity Gate (Issue #38)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Test scope (quick|full|comprehensive)'
        required: false
        default: 'full'
        type: choice
        options:
          - quick
          - full
          - comprehensive

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  sstabledump-parity-validation:
    name: 🚫 MANDATORY - SSTableDump Parity Validation
    runs-on: ubuntu-latest
    outputs:
      validation-status: ${{ steps.validation.outputs.status }}
      validation-report: ${{ steps.validation.outputs.report }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true

    - name: 🔨 Build SSTableDump Validator
      run: |
        cd tools/sstabledump-validator
        cargo build --release --features "docker-integration"
        echo "✅ Validator built successfully"

    - name: 🐳 Setup Docker Infrastructure
      run: |
        # Start Cassandra 5.0 container for real SSTable generation
        cd test-data/docker
        docker-compose -f docker-compose-cassandra5.yml up -d cassandra-5-0
        
        # Wait for Cassandra to be ready
        echo "Waiting for Cassandra to be ready..."
        timeout 300 bash -c 'until docker exec cqlite-cassandra-5-0 cqlsh -e "SELECT cluster_name FROM system.local;" > /dev/null 2>&1; do sleep 10; done'
        echo "✅ Cassandra infrastructure ready"

    - name: 📊 Generate Comprehensive Test Corpus
      run: |
        # Create comprehensive test data covering all data types
        docker exec cqlite-cassandra-5-0 cqlsh -e "
          CREATE KEYSPACE IF NOT EXISTS parity_test 
          WITH REPLICATION = {'class': 'SimpleStrategy', 'replication_factor': 1};
          
          USE parity_test;
          
          -- Basic types table
          CREATE TABLE basic_types (
              id UUID PRIMARY KEY,
              text_val TEXT,
              int_val INT,
              bigint_val BIGINT,
              boolean_val BOOLEAN,
              timestamp_val TIMESTAMP,
              decimal_val DECIMAL,
              double_val DOUBLE,
              float_val FLOAT
          );
          
          -- Collection types table
          CREATE TABLE collections (
              id UUID PRIMARY KEY,
              list_val LIST<TEXT>,
              set_val SET<INT>,
              map_val MAP<TEXT, INT>,
              nested_list LIST<FROZEN<LIST<TEXT>>>,
              nested_map MAP<TEXT, FROZEN<SET<INT>>>
          );
          
          -- Complex clustering table
          CREATE TABLE complex_clustering (
              partition_key UUID,
              clustering_key1 TEXT,
              clustering_key2 INT,
              clustering_key3 TIMESTAMP,
              static_val TEXT STATIC,
              value TEXT,
              PRIMARY KEY (partition_key, clustering_key1, clustering_key2, clustering_key3)
          );
          
          -- Counter table
          CREATE TABLE counters (
              id UUID PRIMARY KEY,
              counter_val COUNTER
          );
        "
        
        # Insert comprehensive test data
        docker exec cqlite-cassandra-5-0 cqlsh -e "
          USE parity_test;
          
          -- Basic types data
          INSERT INTO basic_types (id, text_val, int_val, bigint_val, boolean_val, timestamp_val, decimal_val, double_val, float_val)
          VALUES (uuid(), 'test_text', 42, 9223372036854775807, true, toTimestamp(now()), 123.456, 123.456789, 123.456);
          
          INSERT INTO basic_types (id, text_val, int_val, bigint_val, boolean_val, timestamp_val, decimal_val, double_val, float_val)
          VALUES (uuid(), 'another_test', -42, -9223372036854775808, false, toTimestamp(now()), -123.456, -123.456789, -123.456);
          
          -- Collections data
          INSERT INTO collections (id, list_val, set_val, map_val, nested_list, nested_map)
          VALUES (uuid(), ['item1', 'item2', 'item3'], {1, 2, 3}, {'key1': 1, 'key2': 2}, [['nested1', 'nested2'], ['nested3', 'nested4']], {'key1': {1, 2}, 'key2': {3, 4}});
          
          -- Complex clustering data
          INSERT INTO complex_clustering (partition_key, clustering_key1, clustering_key2, clustering_key3, static_val, value)
          VALUES (uuid(), 'cluster1', 1, toTimestamp(now()), 'static_value', 'value1');
          
          INSERT INTO complex_clustering (partition_key, clustering_key1, clustering_key2, clustering_key3, value)
          VALUES (uuid(), 'cluster2', 2, toTimestamp(now()), 'value2');
        "
        
        # Counter operations require separate statements
        docker exec cqlite-cassandra-5-0 cqlsh -e "
          USE parity_test;
          UPDATE counters SET counter_val = counter_val + 1 WHERE id = uuid();
          UPDATE counters SET counter_val = counter_val + 5 WHERE id = uuid();
        "
        
        # Force flush to create SSTables
        docker exec cqlite-cassandra-5-0 nodetool flush parity_test
        echo "✅ Comprehensive test corpus generated"

    - name: 🔍 Run Comprehensive SSTableDump Parity Validation
      id: validation
      run: |
        echo "🔒 Starting MANDATORY SSTableDump Parity Validation (Zero Tolerance)"
        
        # Determine test scope
        TEST_SCOPE="${{ inputs.test_scope || 'full' }}"
        echo "Test scope: $TEST_SCOPE"
        
        cd tools/sstabledump-validator
        
        # Run comprehensive validation with zero tolerance
        VALIDATION_OUTPUT=$(./target/release/sstabledump-validator comprehensive \
          --scope "$TEST_SCOPE" \
          --fail-fast true \
          --include-bti \
          --include-all-types 2>&1) || VALIDATION_FAILED=true
        
        echo "$VALIDATION_OUTPUT"
        
        # Generate detailed report
        TIMESTAMP=$(date '+%Y%m%d-%H%M%S')
        REPORT_FILE="parity-validation-report-$TIMESTAMP.md"
        
        cat > "$REPORT_FILE" << 'EOF'
        # SSTableDump Parity Validation Report
        
        **Issue #32: Automated Validator Harness (Docker + CI)**
        
        ## Execution Details
        - **Date**: $(date)
        - **Test Scope**: $TEST_SCOPE
        - **Zero Tolerance**: Enabled (mandatory)
        - **Fail Fast**: Enabled
        - **Formats Tested**: BIG, BTI
        - **Data Types**: All comprehensive types
        
        ## Validation Results
        ```
        $VALIDATION_OUTPUT
        ```
        
        ## Status
        EOF
        
        if [ "$VALIDATION_FAILED" = "true" ]; then
          echo "status=failed" >> $GITHUB_OUTPUT
          echo "report=$REPORT_FILE" >> $GITHUB_OUTPUT
          echo "❌ **VALIDATION FAILED** - Perfect SSTable compatibility is required" >> "$REPORT_FILE"
          echo ""
          echo "🚫 CRITICAL: SSTableDump Parity Validation FAILED"
          echo "This is a MANDATORY CI gate for Issue #32/38"
          echo "Perfect compatibility between CQLite and Cassandra sstabledump is required"
          echo ""
          echo "::error::SSTableDump parity validation failed. Any differences will block merge."
          exit 1
        else
          echo "status=passed" >> $GITHUB_OUTPUT
          echo "report=$REPORT_FILE" >> $GITHUB_OUTPUT
          echo "✅ **VALIDATION PASSED** - Perfect SSTable compatibility confirmed" >> "$REPORT_FILE"
          echo ""
          echo "🎉 SUCCESS: SSTableDump Parity Validation PASSED"
          echo "✅ Perfect compatibility between CQLite and Cassandra confirmed"
        fi

    - name: 📄 Upload Validation Artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: sstabledump-parity-validation-${{ github.run_id }}
        path: |
          tools/sstabledump-validator/parity-validation-report-*.md
          tools/sstabledump-validator/target/release/sstabledump-validator
        retention-days: 30

    - name: 📊 Generate JUnit Report
      if: always()
      run: |
        # Generate JUnit XML for CI dashboard integration
        cd tools/sstabledump-validator
        
        JUNIT_FILE="sstabledump-parity-junit.xml"
        VALIDATION_STATUS="${{ steps.validation.outputs.status }}"
        DURATION="300" # Approximate duration
        
        cat > "$JUNIT_FILE" << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <testsuite name="SSTableDump Parity Gate" tests="1" failures="$([ "$VALIDATION_STATUS" = "failed" ] && echo "1" || echo "0")" errors="0" time="$DURATION">
          <testcase name="comprehensive_sstabledump_parity_validation" classname="SSTableDumpParityGate" time="$DURATION">
        EOF
        
        if [ "$VALIDATION_STATUS" = "failed" ]; then
          cat >> "$JUNIT_FILE" << EOF
            <failure message="SSTableDump parity validation failed">
              <![CDATA[Perfect compatibility between CQLite and Cassandra sstabledump is required. Any differences will block merge.]]>
            </failure>
        EOF
        fi
        
        cat >> "$JUNIT_FILE" << EOF
          </testcase>
        </testsuite>
        EOF

    - name: 📊 Upload JUnit Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: junit-sstabledump-parity-${{ github.run_id }}
        path: tools/sstabledump-validator/sstabledump-parity-junit.xml
        retention-days: 30

    - name: 🧹 Cleanup Docker Environment
      if: always()
      run: |
        cd test-data/docker
        docker-compose -f docker-compose-cassandra5.yml down || true

  # Final gate that blocks merge if parity validation fails
  parity-gate-enforcement:
    name: 🚫 PARITY GATE ENFORCEMENT
    runs-on: ubuntu-latest
    needs: [sstabledump-parity-validation]
    if: always()
    
    steps:
    - name: 🔒 Enforce SSTableDump Parity Gate
      run: |
        VALIDATION_STATUS="${{ needs.sstabledump-parity-validation.outputs.validation-status }}"
        
        echo "🔒 SSTableDump Parity Gate Enforcement"
        echo "Validation Status: $VALIDATION_STATUS"
        
        if [ "$VALIDATION_STATUS" != "passed" ]; then
          echo ""
          echo "🚫 MERGE BLOCKED: SSTableDump Parity Gate Failed"
          echo ""
          echo "Issue #32 requires perfect SSTable compatibility between CQLite and Cassandra."
          echo "Any differences in cell-by-cell comparison will block merges."
          echo ""
          echo "Please fix all SSTable compatibility issues before proceeding."
          echo ""
          echo "::error::SSTableDump parity gate failed. Perfect compatibility is required."
          exit 1
        else
          echo ""
          echo "✅ MERGE ALLOWED: SSTableDump Parity Gate Passed"
          echo ""
          echo "Perfect SSTable compatibility confirmed between CQLite and Cassandra."
          echo "This change is safe to merge."
        fi

    - name: 📊 Create Required Status Check
      uses: actions/github-script@v7
      if: always()
      with:
        script: |
          const status = '${{ needs.sstabledump-parity-validation.outputs.validation-status }}';
          const conclusion = status === 'passed' ? 'success' : 'failure';
          
          await github.rest.checks.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            name: 'SSTableDump Parity Gate (Issue #32)',
            head_sha: context.sha,
            status: 'completed',
            conclusion: conclusion,
            output: {
              title: conclusion === 'success' ? '✅ SSTableDump Parity: Perfect' : '❌ SSTableDump Parity: Failed',
              summary: conclusion === 'success' 
                ? 'Perfect SSTable compatibility confirmed between CQLite and Cassandra sstabledump.'
                : 'SSTable compatibility issues detected. Perfect compatibility is required.'
            }
          });

  # Post PR comment with results
  pr-feedback:
    name: 📢 PR Feedback
    runs-on: ubuntu-latest
    needs: [sstabledump-parity-validation, parity-gate-enforcement]
    if: always() && github.event_name == 'pull_request'
    
    steps:
    - name: 📢 Post SSTableDump Parity Results
      uses: actions/github-script@v7
      with:
        script: |
          const status = '${{ needs.sstabledump-parity-validation.outputs.validation-status }}';
          const report = '${{ needs.sstabledump-parity-validation.outputs.validation-report }}';
          
          const emoji = status === 'passed' ? '✅' : '❌';
          const statusText = status === 'passed' ? 'PASSED' : 'FAILED';
          const conclusion = status === 'passed' ? 'success' : 'failure';
          
          const comment = `## ${emoji} SSTableDump Parity Gate ${statusText}
          
          **Issue #32: Automated Validator Harness (Docker + CI)**
          
          ${conclusion === 'success' 
            ? '🎉 **Perfect SSTable compatibility confirmed!** This PR maintains perfect compatibility between CQLite and Cassandra sstabledump output.' 
            : '🚫 **SSTable compatibility issues detected.** This PR introduces differences between CQLite and Cassandra sstabledump output.'}
          
          ### Validation Details:
          - **Zero Tolerance Mode**: ✅ Enabled (mandatory)
          - **Fail Fast**: ✅ Enabled  
          - **Formats Tested**: BIG, BTI
          - **Data Types**: Comprehensive coverage
          - **Docker Integration**: ✅ Real Cassandra 5.0
          
          ${conclusion === 'failure' ? `
          ### ⚠️ Action Required:
          1. Download the validation artifacts from this workflow run
          2. Review the detailed parity report: \`${report}\`
          3. Fix any SSTable implementation differences in cqlite-core
          4. Ensure perfect cell-by-cell compatibility with Cassandra sstabledump
          5. Re-run validation by pushing new commits
          
          **This PR is blocked from merging until all SSTable compatibility issues are resolved.**` : ''}
          
          ---
          *Automated validator harness enforcing perfect SSTable compatibility (Issue #32)*
          `;
          
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });