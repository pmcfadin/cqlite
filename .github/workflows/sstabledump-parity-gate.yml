name: "CI: SSTableDump Parity Gate"

on:
  pull_request:
    branches: [main, develop]
    # This job still publishes a globally required legacy context. Keep PR
    # triggers unfiltered until branch protection moves to Required PR Gate.
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/sstabledump-parity-gate.yml'
      - '.github/actions/setup-rust-ci/**'
      - '.github/actions/restore-canonical-datasets/**'
      - '.github/actions/setup-sstabledump/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'cqlite-core/**'
      - 'tests/**'
      - 'test-data/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      parity_tier:
        description: "SSTableDump parity tier to run"
        required: true
        type: choice
        default: full
        options:
          - full
          - smoke
  schedule:
    - cron: '17 9 * * *'
  release:
    types: [published, prereleased]

permissions:
  contents: read

concurrency:
  group: sstabledump-parity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DATASET_TAG: datasets-v3
  DATASET_ASSET: cassandra5-small-full-v3.4.tar.gz
  DATASET_SHA256: 3cae644360e0142a6bb5e96ddab445ff18e3478e7058104842ce1a455fba8a33
  CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
  # Fail closed: strict parity lanes must panic instead of skipping when dataset
  # binaries are absent. A vanished/unfetched dataset can never silently green a
  # required parity gate.
  CQLITE_PARITY_REQUIRE_DATASETS: '1'

jobs:
  sstabledump-parity:
    name: sstabledump-parity
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.parity_tier == 'smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify PR parity scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_smoke=true" >> "$GITHUB_OUTPUT"
            echo "Manual smoke run requested."
            exit 0
          fi

          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > changed-files.txt

          echo "Changed files:"
          sed 's/^/  - /' changed-files.txt

          smoke_regex='^(\.github/workflows/sstabledump-parity-gate\.yml|\.github/actions/(setup-rust-ci|restore-canonical-datasets|setup-sstabledump)/|Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|cqlite-core/Cargo\.toml|cqlite-core/src/|cqlite-core/tests/|test-data/|scripts/ci/)'
          run_smoke=false
          if grep -Eq "$smoke_regex" changed-files.txt; then
            run_smoke=true
          fi

          echo "run_smoke=${run_smoke}" >> "$GITHUB_OUTPUT"

      - name: PR outside SSTableDump smoke scope
        if: steps.scope.outputs.run_smoke != 'true'
        run: |
          echo "No storage/write/parity-impacting changes detected."
          echo "Full SSTableDump parity runs on nightly, manual full, release, and mainline triggers."

      - name: Setup Rust toolchain
        if: steps.scope.outputs.run_smoke == 'true'
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: stable
          cache-key: sstabledump-parity-smoke

      - name: Start dataset restore timer
        if: steps.scope.outputs.run_smoke == 'true'
        run: date +%s > "${RUNNER_TEMP}/sstabledump-smoke-dataset-start"

      - name: Fetch canonical full datasets
        id: restore_datasets
        if: steps.scope.outputs.run_smoke == 'true'
        uses: ./.github/actions/restore-canonical-datasets
        with:
          dataset-tag: ${{ env.DATASET_TAG }}
          dataset-asset: ${{ env.DATASET_ASSET }}
          dataset-sha256: ${{ env.DATASET_SHA256 }}
          dataset-root: ${{ env.CQLITE_DATASETS_ROOT }}

      - name: Record dataset restore timing
        if: always() && steps.scope.outputs.run_smoke == 'true'
        run: |
          set -euo pipefail
          start="$(cat "${RUNNER_TEMP}/sstabledump-smoke-dataset-start" 2>/dev/null || date +%s)"
          duration="$(($(date +%s) - start))"
          bash scripts/ci/ci-timing-summary.sh note \
            "restore canonical datasets" \
            "${{ steps.restore_datasets.outcome }}" \
            "${duration}"

      - name: Dataset provenance gate
        if: steps.scope.outputs.run_smoke == 'true'
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "dataset provenance gate" -- bash <<'BASH'
          set -euo pipefail
          scripts/ci/ensure_real_dataset.sh \
            "${{ env.CQLITE_DATASETS_ROOT }}" \
            "${{ env.DATASET_ASSET }}" \
            "sstabledump parity smoke"
          BASH

      - name: Dataset smoke component diagnostics
        if: steps.scope.outputs.run_smoke == 'true'
        shell: bash
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "dataset smoke diagnostics" -- bash <<'BASH'
          set -euo pipefail

          data_count=$(find "${CQLITE_DATASETS_ROOT}" -name '*-Data.db' | wc -l)
          index_count=$(find "${CQLITE_DATASETS_ROOT}" -name '*-Index.db' | wc -l)
          summary_count=$(find "${CQLITE_DATASETS_ROOT}" -name '*-Summary.db' | wc -l)
          statistics_count=$(find "${CQLITE_DATASETS_ROOT}" -name '*-Statistics.db' | wc -l)
          compression_count=$(find "${CQLITE_DATASETS_ROOT}" -name '*-CompressionInfo.db' | wc -l)
          ttl_jsonl_count=$(find "${CQLITE_DATASETS_ROOT}" -path '*ttl*' -name '*-Data.db.jsonl' | wc -l)

          echo "CQLITE_DATASETS_ROOT=${CQLITE_DATASETS_ROOT}"
          echo "Data.db count: ${data_count}"
          echo "Index.db count: ${index_count}"
          echo "Summary.db count: ${summary_count}"
          echo "Statistics.db count: ${statistics_count}"
          echo "CompressionInfo.db count: ${compression_count}"
          echo "TTL JSONL reference count: ${ttl_jsonl_count}"

          if [ "${data_count}" -eq 0 ]; then
            echo "FAIL-CLOSED: zero *-Data.db under ${CQLITE_DATASETS_ROOT}" >&2
            exit 1
          fi
          if [ "${index_count}" -eq 0 ]; then
            echo "FAIL-CLOSED: zero *-Index.db under ${CQLITE_DATASETS_ROOT}" >&2
            exit 1
          fi
          if [ "${summary_count}" -eq 0 ]; then
            echo "FAIL-CLOSED: zero *-Summary.db under ${CQLITE_DATASETS_ROOT}" >&2
            exit 1
          fi
          if [ "${statistics_count}" -eq 0 ]; then
            echo "FAIL-CLOSED: zero *-Statistics.db under ${CQLITE_DATASETS_ROOT}" >&2
            exit 1
          fi
          if [ "${compression_count}" -eq 0 ]; then
            echo "FAIL-CLOSED: zero *-CompressionInfo.db under ${CQLITE_DATASETS_ROOT}" >&2
            exit 1
          fi
          if [ "${ttl_jsonl_count}" -eq 0 ]; then
            echo "FAIL-CLOSED: zero TTL Data.db JSONL references under ${CQLITE_DATASETS_ROOT}" >&2
            exit 1
          fi
          BASH

      - name: Setup sstabledump
        if: steps.scope.outputs.run_smoke == 'true'
        uses: ./.github/actions/setup-sstabledump

      - name: Build smoke parity targets
        if: steps.scope.outputs.run_smoke == 'true'
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "build smoke parity targets" -- bash <<'BASH'
          set -euo pipefail
          cargo test --no-run --package cqlite-core --features write-support,cli-helpers \
            --test sstabledump_parity_data \
            --test sstabledump_parity_index \
            --test sstabledump_parity_summary \
            --test sstable_parity_statistics_db_strict_test \
            --test sstable_parity_compression_info_test \
            --test issue_694_writetime_ttl_parity
          BASH

      - name: Smoke Data.db JSONL parity
        if: steps.scope.outputs.run_smoke == 'true'
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "smoke Data.db JSONL parity" -- bash <<'BASH'
          set -euo pipefail
          cargo test --package cqlite-core --features write-support \
            --test sstabledump_parity_data \
            test_data_db_jsonl_reference_parity \
            -- --nocapture
          BASH

      - name: Smoke Index.db parity
        if: steps.scope.outputs.run_smoke == 'true'
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "smoke Index.db parity" -- bash <<'BASH'
          set -euo pipefail
          cargo test --package cqlite-core --features write-support \
            --test sstabledump_parity_index \
            test_index_db_parity_comprehensive \
            -- --nocapture
          BASH

      - name: Smoke Summary.db parity
        if: steps.scope.outputs.run_smoke == 'true'
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "smoke Summary.db parity" -- bash <<'BASH'
          set -euo pipefail
          cargo test --package cqlite-core --features write-support \
            --test sstabledump_parity_summary \
            test_summary_db_parity_comprehensive \
            -- --nocapture
          BASH

      - name: Smoke Statistics.db strict parity
        if: steps.scope.outputs.run_smoke == 'true'
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "smoke Statistics.db strict parity" -- bash <<'BASH'
          set -euo pipefail
          cargo test --package cqlite-core --features write-support \
            --test sstable_parity_statistics_db_strict_test \
            statistics_db_strict_core_metadata_parity \
            -- --nocapture
          BASH

      - name: Smoke compression parity
        if: steps.scope.outputs.run_smoke == 'true'
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "smoke compression parity" -- bash <<'BASH'
          set -euo pipefail
          cargo test --package cqlite-core --features write-support \
            --test sstable_parity_compression_info_test \
            compression_info_strict_metadata_and_chunk_parity \
            -- --nocapture
          BASH

      - name: Smoke WRITETIME/TTL parity
        if: steps.scope.outputs.run_smoke == 'true'
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "smoke WRITETIME/TTL parity" -- bash <<'BASH'
          set -euo pipefail
          cargo test --package cqlite-core --features write-support,cli-helpers \
            --test issue_694_writetime_ttl_parity \
            writetime_parity_test_basic_ttl_test_table \
            -- --nocapture
          BASH

      - name: Smoke parity timing summary
        if: always()
        run: bash scripts/ci/ci-timing-summary.sh summary "SSTableDump smoke parity timing"

  sstabledump-parity-full:
    name: sstabledump-parity-full
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'release' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.parity_tier == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: stable
          cache-key: sstabledump-parity-full

      - name: Start dataset restore timer
        run: date +%s > "${RUNNER_TEMP}/sstabledump-full-dataset-start"

      - name: Fetch canonical full datasets
        id: restore_datasets_full
        uses: ./.github/actions/restore-canonical-datasets
        with:
          dataset-tag: ${{ env.DATASET_TAG }}
          dataset-asset: ${{ env.DATASET_ASSET }}
          dataset-sha256: ${{ env.DATASET_SHA256 }}
          dataset-root: ${{ env.CQLITE_DATASETS_ROOT }}

      - name: Record dataset restore timing
        if: always()
        run: |
          set -euo pipefail
          start="$(cat "${RUNNER_TEMP}/sstabledump-full-dataset-start" 2>/dev/null || date +%s)"
          duration="$(($(date +%s) - start))"
          bash scripts/ci/ci-timing-summary.sh note \
            "restore canonical datasets" \
            "${{ steps.restore_datasets_full.outcome }}" \
            "${duration}"

      - name: Dataset provenance gate
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "dataset provenance gate" -- bash <<'BASH'
          set -euo pipefail
          scripts/ci/ensure_real_dataset.sh \
            "${{ env.CQLITE_DATASETS_ROOT }}" \
            "${{ env.DATASET_ASSET }}" \
            "sstabledump full parity validation"
          BASH

      - name: Dataset full component diagnostics
        shell: bash
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "dataset full diagnostics" -- bash <<'BASH'
          set -euo pipefail

          data_count=$(find "${CQLITE_DATASETS_ROOT}" -name '*-Data.db' | wc -l)
          index_count=$(find "${CQLITE_DATASETS_ROOT}" -name '*-Index.db' | wc -l)
          summary_count=$(find "${CQLITE_DATASETS_ROOT}" -name '*-Summary.db' | wc -l)
          statistics_count=$(find "${CQLITE_DATASETS_ROOT}" -name '*-Statistics.db' | wc -l)
          compression_count=$(find "${CQLITE_DATASETS_ROOT}" -name '*-CompressionInfo.db' | wc -l)
          test_comp_data_count=$(find "${CQLITE_DATASETS_ROOT}/sstables/test_comp" -name '*-Data.db' 2>/dev/null | wc -l)
          corruption_data_count=$(find "${CQLITE_DATASETS_ROOT}/corruption/test_comp_corrupt" -name '*-Data.db' 2>/dev/null | wc -l)
          missing_fixture=0

          echo "CQLITE_DATASETS_ROOT=${CQLITE_DATASETS_ROOT}"
          echo "Data.db count: ${data_count}"
          echo "Index.db count: ${index_count}"
          echo "Summary.db count: ${summary_count}"
          echo "Statistics.db count: ${statistics_count}"
          echo "CompressionInfo.db count: ${compression_count}"
          echo "test_comp Data.db count: ${test_comp_data_count}"
          echo "test_comp_corrupt Data.db count: ${corruption_data_count}"

          require_glob() {
            local description="$1"
            local pattern="$2"
            if ! compgen -G "$pattern" > /dev/null; then
              echo "FAIL-CLOSED: missing ${description}: ${pattern}" >&2
              missing_fixture=1
            fi
          }

          for table in \
            deflate_table \
            incompressible_uncompressed_chunk \
            lz4_table \
            short_final_chunk \
            snappy_table \
            uncompressed_table \
            zstd_table
          do
            require_glob "test_comp ${table} Data.db" \
              "${CQLITE_DATASETS_ROOT}/sstables/test_comp/${table}-*/*-Data.db"
          done

          for table in \
            deflate_table \
            incompressible_uncompressed_chunk \
            lz4_table \
            short_final_chunk \
            snappy_table \
            zstd_table
          do
            require_glob "test_comp ${table} CompressionInfo.db" \
              "${CQLITE_DATASETS_ROOT}/sstables/test_comp/${table}-*/*-CompressionInfo.db"
          done

          for fixture in \
            bti_partitions_footer_flip \
            bti_rows_truncation \
            compression_info_bad_offset \
            data_db_bit_flip \
            data_db_truncation \
            digest_crc32_mismatch \
            index_db_bit_flip_big \
            statistics_db_header_damage \
            summary_db_truncation \
            toc_missing_component
          do
            require_glob "test_comp_corrupt ${fixture} Data.db" \
              "${CQLITE_DATASETS_ROOT}/corruption/test_comp_corrupt/${fixture}/*-Data.db"
          done

          if [ "${data_count}" -eq 0 ]; then
            echo "FAIL-CLOSED: zero *-Data.db under ${CQLITE_DATASETS_ROOT}" >&2
            exit 1
          fi
          if [ "${index_count}" -eq 0 ]; then
            echo "FAIL-CLOSED: zero *-Index.db under ${CQLITE_DATASETS_ROOT}" >&2
            exit 1
          fi
          if [ "${summary_count}" -eq 0 ]; then
            echo "FAIL-CLOSED: zero *-Summary.db under ${CQLITE_DATASETS_ROOT}" >&2
            exit 1
          fi
          if [ "${statistics_count}" -eq 0 ]; then
            echo "FAIL-CLOSED: zero *-Statistics.db under ${CQLITE_DATASETS_ROOT}" >&2
            exit 1
          fi
          if [ "${compression_count}" -eq 0 ]; then
            echo "FAIL-CLOSED: zero *-CompressionInfo.db under ${CQLITE_DATASETS_ROOT}" >&2
            exit 1
          fi
          if [ "${test_comp_data_count}" -eq 0 ]; then
            echo "FAIL-CLOSED: zero test_comp *-Data.db binaries under ${CQLITE_DATASETS_ROOT}" >&2
            exit 1
          fi
          if [ "${corruption_data_count}" -eq 0 ]; then
            echo "FAIL-CLOSED: zero test_comp_corrupt *-Data.db binaries under ${CQLITE_DATASETS_ROOT}" >&2
            exit 1
          fi
          if [ "${missing_fixture}" -ne 0 ]; then
            echo "FAIL-CLOSED: full compression/corruption fixture corpus is incomplete" >&2
            exit 1
          fi
          BASH

      - name: Setup sstabledump
        uses: ./.github/actions/setup-sstabledump

      - name: Build full parity test targets
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "build full parity targets" -- bash <<'BASH'
          set -euo pipefail
          cargo test --no-run --package cqlite-core --features write-support,cli-helpers \
            --test sstabledump_parity_data \
            --test sstabledump_parity_index \
            --test sstabledump_parity_statistics \
            --test sstabledump_parity_summary \
            --test sstable_parity_toc_component_test \
            --test sstable_parity_index_db_test \
            --test sstable_parity_statistics_db_strict_test \
            --test sstable_parity_compression_info_test \
            --test sstable_parity_compression_info_db_strict_test \
            --test sstable_parity_filter_db_test \
            --test sstable_parity_repaired_metadata_test \
            --test issue_997_compressioninfo_parity \
            --test issue_998_inline_crc_trailers \
            --test issue_1000_verifier \
            --test issue_1001_reject_unknown_compression \
            --test issue_1082_deflate_zlib \
            --test issue_990_data_db_row_framing_parity \
            --test issue_991_static_clustering_parity \
            --test issue_992_ttl_tombstone_parity \
            --test issue_992_range_boundary_grammar \
            --test issue_993_wide_partition_promoted_index_parity \
            --test issue_819_differential_compaction \
            --test issue_933_range_tombstone_compaction \
            --test issue_694_writetime_ttl_parity \
            --test v5_compressed_legacy_parity_test \
            --test v5_compressed_legacy_row_count_parity
          BASH

      - name: Run Data.db parity tests
        id: data_parity
        continue-on-error: true
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "full Data.db parity" -- bash <<'BASH'
          set -euo pipefail
          cargo test --package cqlite-core --features write-support \
            --test sstabledump_parity_data \
            test_data_db_jsonl_reference_parity \
            -- --nocapture
          BASH

      - name: Run Index.db parity tests
        id: index_parity
        continue-on-error: true
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "full Index.db parity" -- bash <<'BASH'
          set -euo pipefail
          cargo test --package cqlite-core --features write-support \
            --test sstabledump_parity_index \
            -- --nocapture
          BASH

      - name: Run Summary.db parity tests
        id: summary_parity
        continue-on-error: true
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "full Summary.db parity" -- bash <<'BASH'
          set -euo pipefail
          cargo test --package cqlite-core --features write-support \
            --test sstabledump_parity_summary \
            -- --nocapture
          BASH

      - name: Run Statistics.db parity tests
        id: statistics_parity
        continue-on-error: true
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "full Statistics.db parity" -- bash <<'BASH'
          set -euo pipefail
          cargo test --package cqlite-core --features write-support \
            --test sstabledump_parity_statistics \
            -- --nocapture
          BASH

      - name: Run TOC.txt + Digest.crc32 strict parity tests
        id: toc_component_parity
        continue-on-error: true
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "full TOC/Digest strict parity" -- bash <<'BASH'
          set -euo pipefail
          cargo test --package cqlite-core --features write-support \
            --test sstable_parity_toc_component_test \
            -- --nocapture
          BASH

      - name: Run Index.db strict parity tests
        id: index_db_strict_parity
        continue-on-error: true
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "full Index.db strict parity" -- bash <<'BASH'
          set -euo pipefail
          cargo test --package cqlite-core --features write-support \
            --test sstable_parity_index_db_test \
            -- --nocapture
          BASH

      - name: Run Statistics.db strict parity tests
        id: statistics_db_strict_parity
        continue-on-error: true
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "full Statistics.db strict parity" -- bash <<'BASH'
          set -euo pipefail
          cargo test --package cqlite-core --features write-support \
            --test sstable_parity_statistics_db_strict_test \
            -- --nocapture
          BASH

      - name: Run CompressionInfo.db parity tests
        id: compression_info_parity
        continue-on-error: true
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "full CompressionInfo.db parity" -- bash <<'BASH'
          set -euo pipefail
          cargo test --package cqlite-core --features write-support \
            --test sstable_parity_compression_info_test \
            -- --nocapture
          BASH

      - name: Run CompressionInfo.db strict parity tests
        id: compression_info_strict_parity
        continue-on-error: true
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "full CompressionInfo.db strict parity" -- bash <<'BASH'
          set -euo pipefail
          cargo test --package cqlite-core --features write-support \
            --test sstable_parity_compression_info_db_strict_test \
            -- --nocapture
          BASH

      - name: Run Filter.db strict parity tests
        id: filter_db_parity
        continue-on-error: true
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "full Filter.db strict parity" -- bash <<'BASH'
          set -euo pipefail
          cargo test --package cqlite-core --features write-support \
            --test sstable_parity_filter_db_test \
            --test sstable_parity_filter_bitflip_test \
            -- --nocapture
          BASH

      - name: Run repaired-metadata strict parity tests
        id: repaired_metadata_parity
        continue-on-error: true
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "full repaired-metadata strict parity" -- bash <<'BASH'
          set -euo pipefail
          cargo test --package cqlite-core --features write-support \
            --test sstable_parity_repaired_metadata_test \
            -- --nocapture
          BASH

      - name: Run compression / corruption parity tests
        id: compression_corruption_parity
        continue-on-error: true
        env:
          CQLITE_REQUIRE_FIXTURES: '1'
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "full compression/corruption parity" -- bash <<'BASH'
          set -euo pipefail
          cargo test --package cqlite-core --features write-support,cli-helpers \
            --test issue_997_compressioninfo_parity \
            --test issue_998_inline_crc_trailers \
            --test issue_1000_verifier \
            --test issue_1001_reject_unknown_compression \
            --test issue_1082_deflate_zlib \
            -- --nocapture
          BASH

      - name: Run Data.db row framing / VInt / flag byte parity tests
        id: row_framing_parity
        continue-on-error: true
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "full Data.db row framing parity" -- bash <<'BASH'
          set -euo pipefail
          cargo test --package cqlite-core --features write-support \
            --test issue_990_data_db_row_framing_parity \
            -- --nocapture
          BASH

      - name: Run static-row / clustering-bound parity tests
        id: static_clustering_parity
        continue-on-error: true
        run: |
          bash scripts/ci/ci-timing-summary.sh measure "full static-row/clustering-bound parity" -- bash <<'BASH'
          set -euo pipefail
          cargo test --package cqlite-core --features write-support \
