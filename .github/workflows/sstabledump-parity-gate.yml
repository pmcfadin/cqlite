name: "CI: SSTableDump Parity Gate"

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/sstabledump-parity-gate.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'cqlite-core/**'
      - 'tests/**'
      - 'test-data/**'
      - 'scripts/**'
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/sstabledump-parity-gate.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'cqlite-core/**'
      - 'tests/**'
      - 'test-data/**'
      - 'scripts/**'

permissions:
  issues: write
  pull-requests: write
  contents: read

concurrency:
  group: sstabledump-parity-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DATASET_TAG: datasets-v3
  DATASET_ASSET: cassandra5-small-full-v3.2.tar.gz
  DATASET_SHA256: bebc763752c8d68c7fb0483a1b31294b4d1d21343d3f7d124da069e5073202fa
  CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
  # Fail-closed switch (issue #1024): strict parity lanes must PANIC instead of
  # skipping when dataset binaries are absent. A vanished/unfetched dataset can
  # never silently green the required parity gate.
  CQLITE_PARITY_REQUIRE_DATASETS: '1'

jobs:
  sstabledump-parity:
    name: Real M5 SSTableDump parity validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache canonical full datasets
        uses: actions/cache@v5
        with:
          path: test-data/datasets/
          key: ${{ runner.os }}-datasets-${{ env.DATASET_TAG }}-${{ env.DATASET_SHA256 }}

      - name: Fetch canonical full datasets
        run: bash ./test-data/scripts/fetch-datasets.sh

      - name: Dataset provenance gate
        run: |
          scripts/ci/ensure_real_dataset.sh \
            "${{ env.CQLITE_DATASETS_ROOT }}" \
            "${{ env.DATASET_ASSET }}" \
            "sstabledump parity validation"

      - name: Dataset diagnostics
        run: |
          set -euo pipefail

          data_count=$(find "${CQLITE_DATASETS_ROOT}" -name '*-Data.db' | wc -l)
          index_count=$(find "${CQLITE_DATASETS_ROOT}" -name '*-Index.db' | wc -l)
          summary_count=$(find "${CQLITE_DATASETS_ROOT}" -name '*-Summary.db' | wc -l)
          statistics_count=$(find "${CQLITE_DATASETS_ROOT}" -name '*-Statistics.db' | wc -l)

          echo "CQLITE_DATASETS_ROOT=${CQLITE_DATASETS_ROOT}"
          echo "Data.db count: ${data_count}"
          echo "Index.db count: ${index_count}"
          echo "Summary.db count: ${summary_count}"
          echo "Statistics.db count: ${statistics_count}"

          # Fail closed (issue #1024): a dataset root that resolves to ZERO of any
          # required component is a hard gate failure, never a silent pass. The
          # explicit messages make the cause unambiguous in the job log.
          if [ "${data_count}" -eq 0 ]; then
            echo "❌ FAIL-CLOSED: zero *-Data.db under ${CQLITE_DATASETS_ROOT} — datasets missing/unfetched" >&2
            exit 1
          fi
          if [ "${index_count}" -eq 0 ]; then
            echo "❌ FAIL-CLOSED: zero *-Index.db under ${CQLITE_DATASETS_ROOT}" >&2
            exit 1
          fi
          if [ "${summary_count}" -eq 0 ]; then
            echo "❌ FAIL-CLOSED: zero *-Summary.db under ${CQLITE_DATASETS_ROOT}" >&2
            exit 1
          fi
          if [ "${statistics_count}" -eq 0 ]; then
            echo "❌ FAIL-CLOSED: zero *-Statistics.db under ${CQLITE_DATASETS_ROOT}" >&2
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install sstabledump
        run: |
          bash ./scripts/ci/install-sstabledump.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify sstabledump installation
        run: |
          output="$(sstabledump --help 2>&1 || true)"
          echo "$output"
          echo "$output" | grep -q "usage: sstabledump"

      - name: Build parity test targets
        run: |
          cargo test --no-run --package cqlite-core --features write-support,cli-helpers \
            --test sstabledump_parity_data \
            --test sstabledump_parity_index \
            --test sstabledump_parity_statistics \
            --test sstabledump_parity_summary \
            --test sstable_parity_toc_component_test \
            --test sstable_parity_index_db_test \
            --test sstable_parity_statistics_db_strict_test \
            --test sstable_parity_compression_info_test \
            --test sstable_parity_compression_info_db_strict_test \
            --test sstable_parity_filter_db_test \
            --test sstable_parity_repaired_metadata_test \
            --test issue_997_compressioninfo_parity \
            --test issue_998_inline_crc_trailers \
            --test issue_1000_verifier \
            --test issue_1001_reject_unknown_compression \
            --test issue_1082_deflate_zlib \
            --test issue_990_data_db_row_framing_parity \
            --test issue_991_static_clustering_parity \
            --test issue_992_ttl_tombstone_range_parity \
            --test issue_993_wide_partition_promoted_index_parity \
            --test issue_819_differential_compaction \
            --test issue_933_range_tombstone_compaction \
            --test issue_694_writetime_ttl_parity \
            --test v5_compressed_legacy_parity_test \
            --test v5_compressed_legacy_row_count_parity

      - name: Run Data.db parity tests
        id: data_parity
        continue-on-error: true
        run: |
          cargo test --package cqlite-core --features write-support \
            --test sstabledump_parity_data \
            test_data_db_jsonl_reference_parity \
            -- --nocapture

      - name: Run Index.db parity tests
        id: index_parity
        continue-on-error: true
        run: |
          cargo test --package cqlite-core --features write-support \
            --test sstabledump_parity_index \
            -- --nocapture

      - name: Run Summary.db parity tests
        id: summary_parity
        continue-on-error: true
        run: |
          cargo test --package cqlite-core --features write-support \
            --test sstabledump_parity_summary \
            -- --nocapture

      - name: Run Statistics.db parity tests
        id: statistics_parity
        continue-on-error: true
        run: |
          cargo test --package cqlite-core --features write-support \
            --test sstabledump_parity_statistics \
            -- --nocapture

      - name: Run TOC.txt + Digest.crc32 strict parity tests
        id: toc_component_parity
        continue-on-error: true
        run: |
          cargo test --package cqlite-core --features write-support \
            --test sstable_parity_toc_component_test \
            -- --nocapture

      - name: Run Index.db strict parity tests
        id: index_db_strict_parity
        continue-on-error: true
        run: |
          cargo test --package cqlite-core --features write-support \
            --test sstable_parity_index_db_test \
            -- --nocapture

      - name: Run Statistics.db strict parity tests
        id: statistics_db_strict_parity
        continue-on-error: true
        run: |
          cargo test --package cqlite-core --features write-support \
            --test sstable_parity_statistics_db_strict_test \
            -- --nocapture

      - name: Run CompressionInfo.db parity tests
        id: compression_info_parity
        continue-on-error: true
        run: |
          cargo test --package cqlite-core --features write-support \
            --test sstable_parity_compression_info_test \
            -- --nocapture

      - name: Run CompressionInfo.db strict parity tests
        id: compression_info_strict_parity
        continue-on-error: true
        run: |
          cargo test --package cqlite-core --features write-support \
            --test sstable_parity_compression_info_db_strict_test \
            -- --nocapture

      - name: Run Filter.db strict parity tests
        id: filter_db_parity
        continue-on-error: true
        run: |
          cargo test --package cqlite-core --features write-support \
            --test sstable_parity_filter_db_test \
            -- --nocapture

      - name: Run repaired-metadata strict parity tests
        id: repaired_metadata_parity
        continue-on-error: true
        run: |
          cargo test --package cqlite-core --features write-support \
            --test sstable_parity_repaired_metadata_test \
            -- --nocapture

      - name: Run compression / corruption parity tests (epic #970)
        # These tests skip-clean when the test_comp fixtures are absent from the
        # published bundle, so they are informational on the PR gate. The
        # authoritative strict run (regenerate + assert fixtures) lives in
        # .github/workflows/compression-corruption-parity.yml (nightly + dispatch).
        id: compression_corruption_parity
        continue-on-error: true
        run: |
          cargo test --package cqlite-core --features write-support,cli-helpers \
            --test issue_997_compressioninfo_parity \
            --test issue_998_inline_crc_trailers \
            --test issue_1000_verifier \
            --test issue_1001_reject_unknown_compression \
            --test issue_1082_deflate_zlib \
            -- --nocapture

      - name: Run Data.db row framing / VInt / flag byte parity tests (issue #990)
        id: row_framing_parity
        continue-on-error: true
        run: |
          cargo test --package cqlite-core --features write-support \
            --test issue_990_data_db_row_framing_parity \
            -- --nocapture

      - name: Run static-row / clustering-bound parity tests (issue #991)
        id: static_clustering_parity
        continue-on-error: true
        run: |
          cargo test --package cqlite-core --features write-support \
            --test issue_991_static_clustering_parity \
            -- --nocapture

      - name: Run TTL / tombstone / range-marker parity tests (issue #992)
        id: ttl_tombstone_range_parity
        continue-on-error: true
        run: |
          cargo test --package cqlite-core --features write-support \
            --test issue_992_ttl_tombstone_range_parity \
            -- --nocapture

      - name: Run wide-partition promoted-index parity tests (issue #993)
        # Canonical-semantic JSONL checks run on every push against the committed
        # golden; the byte-level Index.db assertions skip-clean because the
        # test_big.wide_partition binaries are local-only (not in the CI pin).
        id: wide_partition_promoted_index_parity
        continue-on-error: true
        run: |
          cargo test --package cqlite-core --features write-support \
            --test issue_993_wide_partition_promoted_index_parity \
            -- --nocapture

      - name: Run differential-compaction SELF-CONSISTENCY tests (issues #819 / #933)
        # SCOPE (issue #1242 finding 1): these tests run CQLite's OWN compaction
        # merge round-trips (gen1-vs-gen2, one-shot-vs-hand-driven, resurrection
        # safety) by default. The Cassandra-reference comparison
        # (differential_vs_live_cassandra_env_gated) is env-gated behind
        # CQLITE_DIFFERENTIAL_CASSANDRA=1, which this workflow does NOT set, so this
        # step proves SELF-CONSISTENCY only — it does NOT prove Cassandra parity. The
        # related cass.compaction_merge.* manifest scenarios were demoted from
        # required_parity to manual_debug (no required scenario maps to this step;
        # the #1228 workflow-check lint therefore does not depend on it). It still
        # runs as a regression guard against self-consistency defects.
        id: differential_compaction_parity
        continue-on-error: true
        run: |
          cargo test --package cqlite-core --features write-support \
            --test issue_819_differential_compaction \
            --test issue_933_range_tombstone_compaction \
            -- --nocapture

      - name: Run WRITETIME / TTL / local-deletion-time parity tests (issue #694)
        id: writetime_ttl_parity
        continue-on-error: true
        run: |
          cargo test --package cqlite-core --features write-support,cli-helpers \
            --test issue_694_writetime_ttl_parity \
            -- --nocapture

      - name: Run V5CompressedLegacy compression / row-count parity tests
        id: v5_compressed_legacy_parity
        continue-on-error: true
        run: |
          cargo test --package cqlite-core --features write-support \
            --test v5_compressed_legacy_parity_test \
            --test v5_compressed_legacy_row_count_parity \
            -- --nocapture

      - name: Generate parity summary
        if: always()
        run: |
          cat > parity_summary.md <<EOF
          # SSTableDump Parity Validation Results

          - Data.db: ${{ steps.data_parity.outcome }}
          - Index.db: ${{ steps.index_parity.outcome }}
          - Summary.db: ${{ steps.summary_parity.outcome }}
          - Statistics.db: ${{ steps.statistics_parity.outcome }}
          - TOC/Digest.crc32 (strict): ${{ steps.toc_component_parity.outcome }}
          - Index.db (strict): ${{ steps.index_db_strict_parity.outcome }}
          - Statistics.db (strict): ${{ steps.statistics_db_strict_parity.outcome }}
          - CompressionInfo.db: ${{ steps.compression_info_parity.outcome }}
          - CompressionInfo.db (strict): ${{ steps.compression_info_strict_parity.outcome }}
          - Filter.db (strict): ${{ steps.filter_db_parity.outcome }}
          - Repaired-metadata (strict): ${{ steps.repaired_metadata_parity.outcome }}
          - Data.db row framing / VInt / flags (issue #990): ${{ steps.row_framing_parity.outcome }}
          - Static-row / clustering-bound parity (issue #991): ${{ steps.static_clustering_parity.outcome }}
          - TTL / tombstone / range-marker parity (issue #992): ${{ steps.ttl_tombstone_range_parity.outcome }}
          - Wide-partition promoted-index parity (issue #993): ${{ steps.wide_partition_promoted_index_parity.outcome }}
          - Differential-compaction parity (issues #819/#933/#992): ${{ steps.differential_compaction_parity.outcome }}
          - WRITETIME / TTL / local-deletion-time parity (issue #694): ${{ steps.writetime_ttl_parity.outcome }}
          - V5CompressedLegacy compression / row-count parity: ${{ steps.v5_compressed_legacy_parity.outcome }}
          - Compression/corruption parity (epic #970, informational): ${{ steps.compression_corruption_parity.outcome }}

          Dataset:
          - Tag: ${{ env.DATASET_TAG }}
          - Asset: ${{ env.DATASET_ASSET }}
          - Root: ${{ env.CQLITE_DATASETS_ROOT }}

          This workflow is the blocking M5 parity gate for Issue #440 and should only pass when the real dataset-backed parity suite is green.
          EOF

      - name: Upload parity artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: parity-test-results
          path: |
            parity_summary.md
            cqlite-core/validation_artifacts/
            validation_artifacts/
            target/cassandra-parity/**
          retention-days: 30

      - name: Comment on PR (Success)
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.data_parity.outcome == 'success' && steps.index_parity.outcome == 'success' && steps.summary_parity.outcome == 'success' && steps.statistics_parity.outcome == 'success' && steps.toc_component_parity.outcome == 'success' && steps.index_db_strict_parity.outcome == 'success' && steps.statistics_db_strict_parity.outcome == 'success' && steps.compression_info_parity.outcome == 'success' && steps.compression_info_strict_parity.outcome == 'success' && steps.filter_db_parity.outcome == 'success' && steps.repaired_metadata_parity.outcome == 'success' && steps.row_framing_parity.outcome == 'success' && steps.static_clustering_parity.outcome == 'success' && steps.ttl_tombstone_range_parity.outcome == 'success' && steps.wide_partition_promoted_index_parity.outcome == 'success' && steps.differential_compaction_parity.outcome == 'success' && steps.writetime_ttl_parity.outcome == 'success' && steps.v5_compressed_legacy_parity.outcome == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            const summary = `## ✅ SSTableDump Parity Validation PASSED

            Real M5 parity validation passed against the canonical full Cassandra dataset.

            - Data.db: success
            - Index.db: success
            - Summary.db: success
            - Statistics.db: success
            - TOC/Digest.crc32 (strict): success
            - Index.db (strict): success
            - Statistics.db (strict): success
            - CompressionInfo.db: success
            - CompressionInfo.db (strict): success
            - Filter.db (strict): success
            - Repaired-metadata (strict): success
            - Data.db row framing / VInt / flags (issue #990): success
            - Static-row / clustering-bound parity (issue #991): success
            - TTL / tombstone / range-marker parity (issue #992): success
            - Wide-partition promoted-index parity (issue #993): success
            - Differential-compaction parity (issues #819/#933/#992): success
            - WRITETIME / TTL / local-deletion-time parity (issue #694): success
            - V5CompressedLegacy compression / row-count parity: success

            Issue #440 remains green only while all dataset-backed parity checks stay green.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Comment on PR (Failure)
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (steps.data_parity.outcome != 'success' || steps.index_parity.outcome != 'success' || steps.summary_parity.outcome != 'success' || steps.statistics_parity.outcome != 'success' || steps.toc_component_parity.outcome != 'success' || steps.index_db_strict_parity.outcome != 'success' || steps.statistics_db_strict_parity.outcome != 'success' || steps.compression_info_parity.outcome != 'success' || steps.compression_info_strict_parity.outcome != 'success' || steps.filter_db_parity.outcome != 'success' || steps.repaired_metadata_parity.outcome != 'success' || steps.row_framing_parity.outcome != 'success' || steps.static_clustering_parity.outcome != 'success' || steps.ttl_tombstone_range_parity.outcome != 'success' || steps.wide_partition_promoted_index_parity.outcome != 'success' || steps.differential_compaction_parity.outcome != 'success' || steps.writetime_ttl_parity.outcome != 'success' || steps.v5_compressed_legacy_parity.outcome != 'success')
        uses: actions/github-script@v8
        with:
          script: |
            const summary = `## ❌ SSTableDump Parity Validation FAILED

            The real M5 parity gate failed against the canonical full Cassandra dataset.

            - Data.db: ${{ steps.data_parity.outcome }}
            - Index.db: ${{ steps.index_parity.outcome }}
            - Summary.db: ${{ steps.summary_parity.outcome }}
            - Statistics.db: ${{ steps.statistics_parity.outcome }}
            - TOC/Digest.crc32 (strict): ${{ steps.toc_component_parity.outcome }}
            - Index.db (strict): ${{ steps.index_db_strict_parity.outcome }}
            - Statistics.db (strict): ${{ steps.statistics_db_strict_parity.outcome }}
            - CompressionInfo.db: ${{ steps.compression_info_parity.outcome }}
            - CompressionInfo.db (strict): ${{ steps.compression_info_strict_parity.outcome }}
            - Filter.db (strict): ${{ steps.filter_db_parity.outcome }}
            - Repaired-metadata (strict): ${{ steps.repaired_metadata_parity.outcome }}
            - Data.db row framing / VInt / flags (issue #990): ${{ steps.row_framing_parity.outcome }}
            - Static-row / clustering-bound parity (issue #991): ${{ steps.static_clustering_parity.outcome }}
            - TTL / tombstone / range-marker parity (issue #992): ${{ steps.ttl_tombstone_range_parity.outcome }}
            - Wide-partition promoted-index parity (issue #993): ${{ steps.wide_partition_promoted_index_parity.outcome }}
            - Differential-compaction parity (issues #819/#933/#992): ${{ steps.differential_compaction_parity.outcome }}
            - WRITETIME / TTL / local-deletion-time parity (issue #694): ${{ steps.writetime_ttl_parity.outcome }}
            - V5CompressedLegacy compression / row-count parity: ${{ steps.v5_compressed_legacy_parity.outcome }}

            Download the uploaded parity artifacts and reproduce locally with:

            \`\`\`bash
            bash ./test-data/scripts/fetch-datasets.sh
            cargo test --package cqlite-core --features write-support --test sstabledump_parity_data test_data_db_jsonl_reference_parity -- --nocapture
            cargo test --package cqlite-core --features write-support --test sstabledump_parity_index -- --nocapture
            cargo test --package cqlite-core --features write-support --test sstabledump_parity_summary -- --nocapture
            cargo test --package cqlite-core --features write-support --test sstabledump_parity_statistics -- --nocapture
            cargo test --package cqlite-core --features write-support --test sstable_parity_toc_component_test -- --nocapture
            cargo test --package cqlite-core --features write-support --test sstable_parity_index_db_test -- --nocapture
            cargo test --package cqlite-core --features write-support --test sstable_parity_statistics_db_strict_test -- --nocapture
            cargo test --package cqlite-core --features write-support --test sstable_parity_compression_info_test -- --nocapture
            cargo test --package cqlite-core --features write-support --test sstable_parity_compression_info_db_strict_test -- --nocapture
            cargo test --package cqlite-core --features write-support --test sstable_parity_filter_db_test -- --nocapture
            cargo test --package cqlite-core --features write-support --test sstable_parity_repaired_metadata_test -- --nocapture
            cargo test --package cqlite-core --features write-support --test issue_990_data_db_row_framing_parity -- --nocapture
            cargo test --package cqlite-core --features write-support --test issue_991_static_clustering_parity -- --nocapture
            cargo test --package cqlite-core --features write-support --test issue_992_ttl_tombstone_range_parity -- --nocapture
            cargo test --package cqlite-core --features write-support --test issue_993_wide_partition_promoted_index_parity -- --nocapture
            cargo test --package cqlite-core --features write-support --test issue_819_differential_compaction --test issue_933_range_tombstone_compaction -- --nocapture
            cargo test --package cqlite-core --features write-support,cli-helpers --test issue_694_writetime_ttl_parity -- --nocapture
            cargo test --package cqlite-core --features write-support --test v5_compressed_legacy_parity_test --test v5_compressed_legacy_row_count_parity -- --nocapture
            \`\`\``;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Fail build on parity differences
        if: always() && (steps.data_parity.outcome != 'success' || steps.index_parity.outcome != 'success' || steps.summary_parity.outcome != 'success' || steps.statistics_parity.outcome != 'success' || steps.toc_component_parity.outcome != 'success' || steps.index_db_strict_parity.outcome != 'success' || steps.statistics_db_strict_parity.outcome != 'success' || steps.compression_info_parity.outcome != 'success' || steps.compression_info_strict_parity.outcome != 'success' || steps.filter_db_parity.outcome != 'success' || steps.repaired_metadata_parity.outcome != 'success' || steps.row_framing_parity.outcome != 'success' || steps.static_clustering_parity.outcome != 'success' || steps.ttl_tombstone_range_parity.outcome != 'success' || steps.wide_partition_promoted_index_parity.outcome != 'success' || steps.differential_compaction_parity.outcome != 'success' || steps.writetime_ttl_parity.outcome != 'success' || steps.v5_compressed_legacy_parity.outcome != 'success')
        run: |
          echo "❌ M5 parity gate failed"
          echo "Data.db row framing / VInt / flags (issue #990): ${{ steps.row_framing_parity.outcome }}"
          echo "Static-row / clustering-bound parity (issue #991): ${{ steps.static_clustering_parity.outcome }}"
          echo "TTL / tombstone / range-marker parity (issue #992): ${{ steps.ttl_tombstone_range_parity.outcome }}"
          echo "Wide-partition promoted-index parity (issue #993): ${{ steps.wide_partition_promoted_index_parity.outcome }}"
          echo "Differential-compaction parity (issues #819/#933/#992): ${{ steps.differential_compaction_parity.outcome }}"
