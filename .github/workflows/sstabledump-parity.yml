# Issue #38: Zero-diff sstabledump parity CI gate
# Validates SSTable format compliance with Cassandra reference implementation

name: SSTable Parity Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'cqlite-core/src/**'
      - 'cqlite-core/tests/sstabledump_parity_*.rs'
      - 'test-data/datasets/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'cqlite-core/src/**'
      - 'cqlite-core/tests/sstabledump_parity_*.rs'  
      - 'test-data/datasets/**'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  parity-validation:
    name: SSTable Format Parity Validation
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        component: [statistics, index, summary]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true  # Ensure test datasets are downloaded
    
    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        profile: minimal
        override: true
    
    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    # Dataset cache and download for parity validation
    - name: Restore datasets-v1 cache
      uses: actions/cache/restore@v4
      with:
        path: |
          test-data/datasets/
        key: datasets-v1-${{ hashFiles('test-data/**/*.md') }}
        restore-keys: |
          datasets-v1-
        
    - name: Download Cassandra 5 Datasets (if cache miss)
      run: |
        DB_COUNT=$(find test-data -name '*.db' 2>/dev/null | wc -l)
        if [ "$DB_COUNT" -eq 0 ]; then
          echo "📦 Downloading real Cassandra 5 datasets from release..."
          mkdir -p test-data
          gh release download datasets-v1 --pattern "cassandra5-small.tar.gz" --dir /tmp
          tar -xzf /tmp/cassandra5-small.tar.gz -C test-data
          DB_COUNT=$(find test-data -name '*.db' 2>/dev/null | wc -l)
          echo "✅ Downloaded $DB_COUNT SSTable files for parity validation"
        else
          echo "✅ Using cached datasets ($DB_COUNT SSTable files)"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    # Removed external tool installation - Rust-only parity using precomputed references (Issue #89)
    
    - name: Validate test datasets and references integrity
      run: |
        echo "🔍 Checking dataset integrity..."
        
        # Verify key test tables exist
        test -d "test-data/datasets/sstables/test_basic" || (echo "❌ test_basic dataset missing"; exit 1)
        test -d "test-data/datasets/sstables/test_timeseries" || (echo "❌ test_timeseries dataset missing"; exit 1) 
        test -d "test-data/datasets/sstables/test_wide_rows" || (echo "❌ test_wide_rows dataset missing"; exit 1)
        
        echo "🔧 Generating missing references (JSONL, Statistics) on-the-fly if absent..."
        REQUIRED_TABLES=(
          "test_basic/simple_table"
          "test_timeseries/sensor_data"
          "test_wide_rows/wide_partition_table"
          "test_collections/collection_table"
        )
        for T in "${REQUIRED_TABLES[@]}"; do
          echo "🔍 Searching for table: $T"
          DIR=$(find test-data/datasets/sstables/"$T"-* -maxdepth 1 -type d | head -n1)
          if [ -z "$DIR" ]; then echo "❌ Missing table directory for $T"; exit 1; fi
          echo "🔍 Files in $DIR before filtering:"
          ls -la "$DIR"
          DATA=$(find "$DIR" -type f -name "*-Data.db" ! -name "._*" | head -n1)
          if [ -z "$DATA" ]; then echo "❌ Missing Data.db in $DIR"; exit 1; fi
          echo "✅ Selected Data file: $DATA"
          PREFIX=${DATA%-Data.db}
          JSONL="${PREFIX}-Data.db.jsonl"
          STATS="${PREFIX}-Statistics.db.txt"
          echo "🔍 Looking for reference files:"
          echo "  Expected JSONL: $JSONL"
          echo "  Expected Stats: $STATS"
          if [ ! -s "$JSONL" ]; then
            echo "⚠️ Expected JSONL not found, generating via Cassandra tools..."
            docker run --rm -v "$(dirname "$DATA"):/data" docker.io/library/cassandra:5.0 \
              bash -lc '"/opt/cassandra/tools/bin/sstabledump" "/data/'"$(basename "$DATA")"'" -l > "/data/'"$(basename "$JSONL")"'"' || true
            if [ ! -s "$JSONL" ]; then
              echo "❌ Failed to generate JSONL for $DATA"
              exit 1
            fi
          fi
          if [ ! -s "$STATS" ]; then
            echo "⚠️ Expected Statistics not found, generating via Cassandra tools..."
            docker run --rm -v "$(dirname "$DATA"):/data" docker.io/library/cassandra:5.0 \
              bash -lc '"/opt/cassandra/tools/bin/sstablemetadata" "/data/'"$(basename "$DATA")"'" > "/data/'"$(basename "$STATS")"'"' || true
            if [ ! -s "$STATS" ]; then
              echo "❌ Failed to generate Statistics for $DATA"
              exit 1
            fi
          fi
          echo "✅ References present for $T"
        done

        echo "🔎 Checking precomputed references (JSONL, Statistics) exist for deterministic tables..."
        REQUIRED_TABLES=(
          "test_basic/simple_table"
          "test_timeseries/sensor_data"
          "test_wide_rows/wide_partition_table"
          "test_collections/collection_table"
        )
        for T in "${REQUIRED_TABLES[@]}"; do
          # More robust search - find any directory matching the table name pattern
          echo "🔍 Searching for table: $T"
          DIR=$(find test-data/datasets/sstables -path "*/$T-*" -type d | head -n1)
          if [ -z "$DIR" ]; then
            # Debug what's actually available
            echo "❌ No directory found for $T, searching for alternatives..."
            echo "Available directories in $(dirname "test-data/datasets/sstables/$T"):"
            ls -la "test-data/datasets/sstables/$(dirname "$T")/" | head -10
            echo "All directories containing $(basename "$T"):"
            find test-data/datasets/sstables -name "*$(basename "$T")*" -type d | head -5
            echo "❌ Missing table directory for $T"
            exit 1
          fi
          # BULLETPROOF AppleDouble filtering - explicitly exclude all AppleDouble files
          echo "🔍 Files in $DIR before filtering:"
          ls -la "$DIR" | grep -E "\.(db|jsonl|txt)$" || echo "No matching files"
          
          # Find Data.db files, excluding AppleDouble files completely
          DATA=$(find "$DIR" -type f -name "*-Data.db" ! -name "._*" ! -path "*/._*" | grep -v "^\._" | head -n1)
          if [ -z "$DATA" ]; then 
            echo "❌ No valid Data.db found in $DIR (after AppleDouble filtering)"
            echo "Available .db files:"
            find "$DIR" -name "*.db" | head -10
            exit 1
          fi
          
          echo "✅ Selected Data file: $DATA"
          
          # Build reference paths from the selected data file
          PREFIX=${DATA%-Data.db}
          JSONL="${PREFIX}-Data.db.jsonl"
          STATS="${PREFIX}-Statistics.db.txt"
          
          echo "🔍 Looking for reference files:"
          echo "  Expected JSONL: $JSONL"
          echo "  Expected Stats: $STATS"
          
          # Check if expected reference files exist
          if [ ! -s "$JSONL" ]; then
            echo "⚠️ Expected JSONL not found, searching for alternatives..."
            echo "Available JSONL files in $DIR:"
            find "$DIR" -name "*.jsonl" ! -name "._*" | head -5
            ALT_JSONL=$(find "$DIR" -name "*-Data.db.jsonl" ! -name "._*" | head -n1)
            if [ -n "$ALT_JSONL" ] && [ -s "$ALT_JSONL" ]; then 
              JSONL="$ALT_JSONL"
              echo "✅ Using alternative JSONL: $JSONL"
            else
              echo "❌ No valid JSONL files found in $DIR"
              exit 1
            fi
          fi
          
          if [ ! -s "$STATS" ]; then
            echo "⚠️ Expected Stats not found, searching for alternatives..."
            echo "Available Stats files in $DIR:"
            find "$DIR" -name "*Statistics*" ! -name "._*" | head -5
            ALT_STATS=$(find "$DIR" -name "*-Statistics.db.txt" ! -name "._*" | head -n1)
            if [ -n "$ALT_STATS" ] && [ -s "$ALT_STATS" ]; then 
              STATS="$ALT_STATS"
              echo "✅ Using alternative Stats: $STATS"
            else
              echo "❌ No valid Stats files found in $DIR"  
              exit 1
            fi
          fi
          test -s "$JSONL" || (echo "❌ Missing Data JSONL: $JSONL"; exit 1)
          test -s "$STATS" || (echo "❌ Missing Statistics: $STATS"; exit 1)
          echo "✅ References found for $T"
        done

        echo "✅ Dataset structure and references validated"
    
    - name: Run Rust-only parity validation (${{ matrix.component }})
      env:
        CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
        STRICT_PARITY: 1
      run: |
        echo "🧪 Running ${{ matrix.component }} parity validation (Rust-only references)..."
        cargo test --test sstabledump_parity_${{ matrix.component }} -- --exact --nocapture
        echo "✅ ${{ matrix.component }} parity validation passed"
    
    - name: Upload validation artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: parity-validation-${{ matrix.component }}
        path: |
          validation_artifacts/
          target/debug/deps/sstabledump_parity_${{ matrix.component }}-*/
        retention-days: 30
    
    - name: Check for zero discrepancies
      run: |
        echo "🔍 Verifying zero-diff requirement..."
        
        # Check validation artifacts for any discrepancies
        if find validation_artifacts/ -name "*.json" -exec grep -l "discrepanc" {} \; | grep -q .; then
          echo "❌ ZERO-DIFF VIOLATION: Discrepancies found in validation artifacts"
          echo "Issue #38 requires perfect parity with Cassandra sstabledump output"
          exit 1
        fi
        
        echo "✅ Zero-diff requirement satisfied"

  comprehensive-report:
    name: Generate Comprehensive Parity Report
    needs: parity-validation
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Download all validation artifacts
      uses: actions/download-artifact@v4
      with:
        path: validation-results/
    
    - name: Generate M1 milestone report
      run: |
        echo "# Issue #38 M1 Milestone: SSTable Parity Validation Report" > parity-report.md
        echo "" >> parity-report.md
        echo "**Generated**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> parity-report.md
        echo "**Commit**: ${{ github.sha }}" >> parity-report.md
        echo "" >> parity-report.md
        
        # Summary status
        if [ "${{ needs.parity-validation.result }}" = "success" ]; then
          echo "## ✅ ZERO-DIFF PARITY ACHIEVED" >> parity-report.md
          echo "" >> parity-report.md
          echo "All SSTable components (Statistics.db, Index.db, Summary.db) achieve" >> parity-report.md
          echo "perfect zero-diff validation against Cassandra 5 sstabledump reference." >> parity-report.md
        else
          echo "## ❌ PARITY VALIDATION FAILED" >> parity-report.md
          echo "" >> parity-report.md
          echo "One or more SSTable components failed zero-diff validation." >> parity-report.md
          echo "Review validation artifacts for specific discrepancies." >> parity-report.md
        fi
        
        echo "" >> parity-report.md
        echo "## Component Status" >> parity-report.md
        echo "- **Statistics.db**: $([ -d validation-results/parity-validation-statistics ] && echo '✅ Validated' || echo '❌ Failed')" >> parity-report.md
        echo "- **Index.db**: $([ -d validation-results/parity-validation-index ] && echo '✅ Validated' || echo '❌ Failed')" >> parity-report.md
        echo "- **Summary.db**: $([ -d validation-results/parity-validation-summary ] && echo '✅ Validated' || echo '❌ Failed')" >> parity-report.md
    
    - name: Upload comprehensive report
      uses: actions/upload-artifact@v4
      with:
        name: m1-milestone-parity-report
        path: parity-report.md
        retention-days: 90