name: Docs Site

# Builds and deploys the Astro Starlight documentation site to the gh-pages branch.
#
# On push to main touching website/ or docs/: build + deploy to gh-pages root.
# keep_files: true so existing rustdoc trees under api/ survive.
#
# On pull_request touching the same paths: build only (link check runs, no deploy).
#
# workflow_dispatch: manual trigger for out-of-band full validation.
#
# Requires GitHub Pages enabled with "Deploy from a branch" → gh-pages source
# (Settings → Pages). This is a one-time maintainer action.

on:
  schedule:
    # Nightly full docs validation at 05:20 UTC
    - cron: '20 5 * * *'
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'docs/**'
      - 'scripts/docs-examples-smoke.sh'
      - 'scripts/docs-site-check.sh'
      - '.github/workflows/docs-site.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'scripts/docs-examples-smoke.sh'
      - 'scripts/docs-site-check.sh'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DATASET_TAG: datasets-v3
  DATASET_ASSET: cassandra5-small-full-v3.5.tar.gz
  DATASET_SHA256: ace8e0e371af8d254c2bc89d7a8e75f11f2552eca0c2a7ba9f0ab1ee3547dad6

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    env:
      RUN_FULL: >-
        ${{
          github.event_name != 'pull_request' ||
          contains(github.event.pull_request.labels.*.name, 'ci:docs-full')
        }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site (includes internal link validation + raw markdown emit)
        run: npm run build

      - name: Validate agent plumbing (llms.txt coverage + raw .md endpoints)
        run: node scripts/validate-agent-plumbing.mjs

      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site-dist
          path: website/dist/
          retention-days: 1

      - name: Write CI tier summary
        if: always()
        run: |
          {
            echo "## Docs site CI tier"
            echo ""
            echo "- Ordinary PRs build the Astro site and validate agent plumbing."
            echo "- Recipe smoke tests, CLI build, and dataset fetch run on push to main, nightly schedule, workflow_dispatch, or PRs labeled \`ci:docs-full\`."
            echo "- GitHub Pages deploy remains push-to-main only."
            echo "- Current full-tier decision: ${RUN_FULL}."
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Recipe smoke tests
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'ci:docs-full')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Issue #1209/#1217: GitHub runner images ship a stable toolchain that
      # already provides bin/cargo-clippy. The dtolnay/rust-toolchain@1.88.0
      # action performs a rustup reconcile that can intermittently try to
      # (re)install the 'clippy-preview' component and fail with
      # "detected conflict: 'bin/cargo-clippy'". Remove the conflicting
      # component FIRST — before the toolchain action runs any rustup work — so
      # the @stable setup (minimal profile, no clippy) cannot reinstall
      # clippy-preview. The runner ships a working rustup, so this `run:` step
      # before the action has rustup available.
      # This lane does not run clippy. Idempotent: a no-op if clippy is absent.
      - name: Remove preinstalled clippy (avoid clippy-preview install conflict)
        shell: bash
        run: rustup component remove clippy --toolchain stable 2>/dev/null || true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0  # pinned to rust-toolchain.toml (issue #1990)

      - name: Cache Cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-smoke-

      - name: Build CLI with write-support
        run: cargo build --package cqlite-cli --features write-support

      - name: Cache test datasets
        id: dataset-cache
        uses: actions/cache@v4
        with:
          path: test-data/datasets
          # Cache key MUST include SHA256 — never tag alone (see dataset release gotchas)
          key: datasets-${{ env.DATASET_TAG }}-${{ env.DATASET_SHA256 }}

      - name: Fetch datasets if cache miss
        if: steps.dataset-cache.outputs.cache-hit != 'true'
        run: |
          bash test-data/scripts/fetch-datasets.sh

      - name: Run recipe smoke tests
        env:
          CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
          CQLITE_CLI: ${{ github.workspace }}/target/debug/cqlite
        run: bash scripts/docs-examples-smoke.sh

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build, smoke]
    # Only deploy on push to main (not on PRs or forks)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site-dist
          path: dist/

      - name: Deploy to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: .
          keep_files: true
