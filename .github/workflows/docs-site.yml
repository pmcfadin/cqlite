name: Docs Site

# Builds and deploys the Astro Starlight documentation site to the gh-pages branch.
#
# On push to main touching website/ or docs/: build + deploy to gh-pages root.
# keep_files: true so existing rustdoc trees under api/ survive.
#
# On pull_request touching the same paths: build only (link check runs, no deploy).
#
# workflow_dispatch: manual trigger for out-of-band deploys.
#
# Requires GitHub Pages enabled with "Deploy from a branch" → gh-pages source
# (Settings → Pages). This is a one-time maintainer action.

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'docs/**'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site (includes internal link validation)
        run: npm run build

      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site-dist
          path: website/dist/
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    # Only deploy on push to main (not on PRs or forks)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site-dist
          path: dist/

      - name: Deploy to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: .
          keep_files: true
