# Smoke Tests - All Tables
#
# Issue #200: Comprehensive smoke testing for all 33 test tables across all keyspaces
#
# This workflow validates that every test table in the datasets can be successfully
# loaded using the read-sstable command. It provides a comprehensive health check
# of parsing coverage across all data types, collection types, and table structures.
#
# CI TIERING (issue #1368): all-table smoke is intentionally off ordinary PR
# fan-out. Run it nightly, manually, or when this workflow / the smoke script
# changes.
#
# Expected Pass Rate:
#   - Current: 8/33 tables (baseline)
#   - Target: 33/33 tables (100% coverage)
#
# Results:
#   - Detailed validation matrix: test-data/validation-matrix.md
#   - Per-table JSON outputs: smoke-test-results/*.json
#   - Failure artifacts uploaded on CI failure

name: Smoke Tests - All Tables

on:
  schedule:
    # Nightly at 03:15 UTC
    - cron: '15 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-tests.yml'
      - 'test-data/scripts/smoke-test-all-tables.sh'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/smoke-tests.yml'
      - 'test-data/scripts/smoke-test-all-tables.sh'

concurrency:
  group: smoke-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  DATASET_TAG: datasets-v3
  DATASET_ASSET: cassandra5-small-full-v3.5.tar.gz
  DATASET_SHA256: 13d8da00743d9780c7ee89478649c280f9d91519a4561f6909cc4ce3bb7a3631
  CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
  OUTPUT_DIR: ${{ github.workspace }}/smoke-test-results

jobs:
  smoke-test-all-tables:
    name: Comprehensive Table Loading Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Issue #1209/#1217: GitHub runner images ship a stable toolchain that
      # already provides bin/cargo-clippy. The dtolnay/rust-toolchain@1.88.0
      # action performs a rustup reconcile that can intermittently try to
      # (re)install the 'clippy-preview' component and fail with
      # "detected conflict: 'bin/cargo-clippy'". Remove the conflicting
      # component FIRST — before the toolchain action runs any rustup work — so
      # the @stable setup (minimal profile, no clippy) cannot reinstall
      # clippy-preview. The runner ships a working rustup, so this `run:` step
      # before the action has rustup available.
      # This lane does not run clippy. Idempotent: a no-op if clippy is absent.
      - name: Remove preinstalled clippy (avoid clippy-preview install conflict)
        shell: bash
        run: rustup component remove clippy --toolchain stable 2>/dev/null || true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0  # pinned to rust-toolchain.toml (issue #1990)

      - name: Cache cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Restore dataset cache
        id: dataset-cache
        uses: actions/cache@v5
        with:
          path: test-data/datasets
          key: datasets-${{ env.DATASET_TAG }}-${{ env.DATASET_SHA256 }}

      - name: Fetch datasets if cache miss
        if: steps.dataset-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          echo "📦 Downloading dataset: ${DATASET_ASSET}"
          mkdir -p test-data/datasets
          curl -fsSL -o "/tmp/${DATASET_ASSET}" \
            "https://github.com/pmcfadin/cqlite/releases/download/${DATASET_TAG}/${DATASET_ASSET}"

          echo "🔐 Verifying checksum..."
          echo "${DATASET_SHA256}  /tmp/${DATASET_ASSET}" | sha256sum -c -

          echo "📂 Extracting dataset..."
          tar -xzf "/tmp/${DATASET_ASSET}" -C . --exclude='*/._*' --exclude='._*' --exclude='*/.DS_Store' --exclude='.DS_Store'

          # Issue #1335: stamp the .dataset-pin that fetch-datasets.sh writes so
          # the shared `datasets-${DATASET_TAG}-${DATASET_SHA256}` cache entry is
          # accepted by has_required_dataset() in jobs that use fetch-datasets.sh
          # (no needless re-download; a genuinely stale pin still forces refetch).
          printf 'tag=%s\nasset=%s\nsha256=%s\n' \
            "${DATASET_TAG}" "${DATASET_ASSET}" "${DATASET_SHA256}" \
            > test-data/datasets/.dataset-pin

          echo "✅ Dataset ready"

      - name: Sanity check dataset exists
        run: |
          echo "🔍 Verifying dataset structure..."

          # Check metadata file exists
          if [ ! -f test-data/datasets/metadata.yml ]; then
            echo "❌ Missing metadata.yml"
            exit 1
          fi

          # Check SSTables directory exists
          if [ ! -d test-data/datasets/sstables ]; then
            echo "❌ Missing sstables directory"
            exit 1
          fi

          # Count Data.db files
          DATA_FILES=$(find test-data/datasets/sstables -name "*-Data.db" | wc -l)
          echo "✅ Found ${DATA_FILES} Data.db files"

          if [ "${DATA_FILES}" -eq 0 ]; then
            echo "❌ No Data.db files found"
            exit 1
          fi

          # List keyspaces
          echo ""
          echo "📊 Available keyspaces:"
          ls -1 test-data/datasets/sstables/

      - name: Build CQLite CLI
        run: |
          echo "🔨 Building CLI binary (release mode)..."
          cargo build --package cqlite-cli --bin cqlite --release
          echo "✅ CLI binary built at target/release/cqlite"

          # Verify binary exists and is executable
          ls -lh target/release/cqlite
          file target/release/cqlite

      - name: Run comprehensive smoke tests
        env:
          CQLITE_DATASETS_ROOT: ${{ github.workspace }}/test-data/datasets
          CQLITE_CLI: ${{ github.workspace }}/target/release/cqlite
          OUTPUT_DIR: ${{ github.workspace }}/smoke-test-results
        run: |
          echo "🧪 Running smoke tests on all 33 test tables..."
          echo ""
          echo "Configuration:"
          echo "  CLI:          ${CQLITE_CLI}"
          echo "  Datasets:     ${CQLITE_DATASETS_ROOT}"
          echo "  Output:       ${OUTPUT_DIR}"
          echo ""

          # Make script executable
          chmod +x test-data/scripts/smoke-test-all-tables.sh

          # Run smoke tests (script handles all error reporting)
          ./test-data/scripts/smoke-test-all-tables.sh

      - name: Upload smoke test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-test-results
          path: |
            smoke-test-results/*.txt
            smoke-test-results/*.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload validation matrix
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: validation-matrix
          path: test-data/validation-matrix.md
          retention-days: 30
          if-no-files-found: warn

      - name: Summary comment
        if: always()
        run: |
          {
            echo "## All-table smoke tier"
            echo ""
            echo "- Runs nightly, manually, and when all-table smoke workflow/script logic changes."
            echo "- Ordinary PRs should use faster targeted checks; use workflow_dispatch for ad hoc full-table coverage."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          echo "📊 Smoke Test Summary"
          echo ""

          if [ '${{ job.status }}' == 'success' ]; then
            echo "✅ All tables passed smoke testing"
            echo "✅ All tables passed smoke testing" >> "$GITHUB_STEP_SUMMARY"
            echo ""
            echo "Next steps:"
            echo "  - Review validation matrix: test-data/validation-matrix.md"
            echo "  - Check coverage across all keyspaces and data types"
          else
            echo "❌ Some tables failed smoke testing"
            echo "❌ Some tables failed smoke testing" >> "$GITHUB_STEP_SUMMARY"
            echo ""
            echo "Debugging:"
            echo "  1. Download smoke-test-results artifact for detailed output"
            echo "  2. Review validation-matrix.md for failure patterns"
            echo "  3. Check individual table JSON outputs in smoke-test-results/"
            echo ""
            echo "Issue: https://github.com/pmcfadin/cqlite/issues/200"
          fi
