name: Restore Canonical Datasets
description: Restore the canonical Cassandra dataset cache and repair partial caches.

inputs:
  dataset-tag:
    description: GitHub release tag containing the canonical dataset asset.
    required: false
    default: datasets-v3
  dataset-asset:
    description: Canonical dataset tarball asset name.
    required: false
    default: cassandra5-small-full-v3.5.tar.gz
  dataset-sha256:
    description: Expected SHA256 digest for the canonical dataset asset.
    required: false
    default: 13d8da00743d9780c7ee89478649c280f9d91519a4561f6909cc4ce3bb7a3631
  dataset-root:
    description: Directory where the canonical dataset should be present.
    required: false
    default: test-data/datasets

outputs:
  cache-hit:
    description: Whether the primary canonical dataset cache was restored.
    value: ${{ steps.dataset-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Restore canonical dataset cache
      id: dataset-cache
      uses: actions/cache@v5
      with:
        path: ${{ inputs.dataset-root }}
        key: datasets-${{ inputs.dataset-tag }}-${{ inputs.dataset-sha256 }}
        restore-keys: |
          datasets-${{ inputs.dataset-tag }}-

    - name: Fetch or repair canonical datasets
      shell: bash
      env:
        DATASET_TAG: ${{ inputs.dataset-tag }}
        DATASET_ASSET: ${{ inputs.dataset-asset }}
        DATASET_SHA256: ${{ inputs.dataset-sha256 }}
        CQLITE_DATASETS_ROOT: ${{ inputs.dataset-root }}
      run: bash ./test-data/scripts/fetch-datasets.sh
