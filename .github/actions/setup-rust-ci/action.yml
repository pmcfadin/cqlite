name: Setup Rust CI
description: Install the CI Rust toolchain and restore the shared Cargo cache.

inputs:
  toolchain:
    description: Rust toolchain channel or pinned version to install.
    required: false
    default: 1.88.0
  components:
    description: Comma-separated rustup components to install, such as clippy,rustfmt.
    required: false
    default: ''
  cache-key:
    description: Stable cache namespace for this workflow or job family.
    required: false
    default: rust-ci

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      shell: bash
      env:
        RUST_TOOLCHAIN: ${{ inputs.toolchain }}
        RUST_COMPONENTS: ${{ inputs.components }}
      run: |
        set -euo pipefail

        rustup_args=(toolchain install "${RUST_TOOLCHAIN}" --profile minimal)
        if [ -n "${RUST_COMPONENTS}" ]; then
          IFS=',' read -ra components <<< "${RUST_COMPONENTS}"
          for component in "${components[@]}"; do
            component="${component#"${component%%[![:space:]]*}"}"
            component="${component%"${component##*[![:space:]]}"}"
            [ -n "${component}" ] || continue
            rustup_args+=(--component "${component}")
          done
        fi

        rustup "${rustup_args[@]}"
        rustup default "${RUST_TOOLCHAIN}"
        rustc --version
        cargo --version

    - name: Restore Cargo cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/git
          ~/.cargo/registry
          target
        key: ${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key }}-${{ inputs.toolchain }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key }}-${{ inputs.toolchain }}-
          ${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key }}-
