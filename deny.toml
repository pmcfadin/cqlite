# Security and license policy configuration
# Based on senior engineer recommendations

[licenses]
# Allow only these licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
]

# Deny these licenses
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "AGPL-3.0",
]

# Confidence threshold for license detection
confidence-threshold = 0.8

# Multiple license strategy
multiple = "allow"

[bans]
# Deny multiple versions of the same crate
multiple-versions = "deny"

# Allow these specific duplicate versions (if needed)
skip = [
    # Example: { name = "some-crate", version = "0.1" }
]

# Deny these crates entirely
deny = [
    # Example security-problematic crates
]

[advisories]
# Database of security advisories
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

# Vulnerability action
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
notice = "warn"

# Ignore these advisories (use sparingly)
ignore = [
    # Example: "RUSTSEC-2020-0001",
]

[sources]
# Only allow crates from these sources
unknown-registry = "deny"
unknown-git = "deny"

allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []