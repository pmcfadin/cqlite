# cargo-deny configuration for CQLite project
# Ensures license compliance and dependency security for M1 milestone
# Generated for issue #72: License policy stabilization
# Compatible with cargo-deny 0.18+

# The graph table configures how the dependency graph is constructed
[graph]
# If 1 or more target triples are specified, only those targets will be checked
targets = []
# When true, all features of all dependencies will be enabled
all-features = false
# When false, crates that are only in dev-dependencies will not be included
exclude-dev = false

[licenses]
# See https://spdx.org/licenses/ for list of identifiers
# Allow only licenses compatible with Apache-2.0
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",          # Mozilla Public License (weak copyleft, compatible)
    "Zlib",             # Permissive compression library license
    "0BSD",             # BSD Zero Clause License
]

# Confidence threshold for license detection (0.0 to 1.0)
confidence-threshold = 0.8

# Clarifications for crates with ambiguous licensing
[[licenses.clarify]]
crate = "unicode-ident"
expression = "MIT OR Apache-2.0"
license-files = []

# Allow workspace members that haven't specified a license yet
# These are internal crates and will inherit the project license
[[licenses.clarify]]
crate = "cqlite-integration-tests"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "cqlite-validator"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "format-validator"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "sstabledump-validator"
expression = "MIT OR Apache-2.0"
license-files = []

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"

# Allow specific duplicate versions that are often unavoidable
skip = [
    { name = "windows-sys" },     # Often has multiple versions
    { name = "windows-targets" },  # Windows dependency
    { name = "windows_x86_64_msvc" },
    { name = "windows_x86_64_gnu" },
    { name = "windows_i686_msvc" },
    { name = "windows_i686_gnu" },
    { name = "windows_aarch64_msvc" },
    { name = "itertools" },       # Common utility, versions often diverge
    { name = "hashbrown" },       # Often has multiple versions
    { name = "indexmap" },        # Data structure library
    { name = "bitflags" },        # Different versions used by different crates
    { name = "clap" },            # v3 vs v4 used by different dependencies 
    { name = "clap_lex" },        # Related to clap version differences
    { name = "getrandom" },       # v0.2 vs v0.3 ecosystem transition
    { name = "heck" },            # v0.4 vs v0.5 used by different crates
    { name = "hermit-abi" },      # Different versions for different platforms
    { name = "mio" },             # v0.8 vs v1.0 ecosystem transition
    { name = "rand" },            # v0.8 vs v0.9 ecosystem transition
    { name = "rand_chacha" },     # Related to rand version differences
    { name = "rand_core" },       # Related to rand version differences
    { name = "regex-automata" },  # Different versions used in ecosystem
    { name = "regex-syntax" },    # Related to regex-automata differences
    { name = "strsim" },          # Different versions used by clap ecosystem
    { name = "syn" },             # v1 vs v2 proc-macro ecosystem transition
    { name = "thiserror" },       # v1 vs v2 error handling libraries
    { name = "thiserror-impl" },  # Related to thiserror version differences
    { name = "toml" },            # v0.5 vs v0.8 ecosystem transition
    { name = "unicode-width" },   # Different versions for terminal handling
    { name = "wasi" },            # WebAssembly system interface versions
    { name = "windows_aarch64_gnullvm" }, # Windows target triple variations
    { name = "windows_i686_gnullvm" },    # Windows target triple variations  
    { name = "windows_x86_64_gnullvm" },  # Windows target triple variations
]

# Certain crates/versions that will be skipped when doing duplicate detection
wildcards = "allow"

[advisories]
# Database of security advisories to check against
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

# Threshold for security vulnerabilities (CVSS score)
# severity-threshold = "medium"

# Warn for yanked crates
yanked = "warn"

# Ignore specific advisories (use sparingly and document why)
ignore = [
    # Temporarily ignore these advisories for M1 - they don't affect core functionality
    "RUSTSEC-2021-0145", # atty crate - only affects terminal detection, not core SSTable functionality  
    "RUSTSEC-2024-0375", # html5ever - only used in dev dependencies for testing
    "RUSTSEC-2024-0384", # quinn - not used in core library, only in optional networking features
    "RUSTSEC-2024-0436", # time crate - informational only, doesn't affect our usage
]

[sources]
# Lint level for when a dependency is from a source not in the allow list
unknown-registry = "deny"
unknown-git = "deny"

# Allowed registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Allowed Git repositories (be very selective)
allow-git = []