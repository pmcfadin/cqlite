[package]
name = "cqlite-property-tests"
version = "0.1.0"
edition = "2021"
description = "Property-based tests for CQLite type system and edge cases"

[workspace]

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Property testing
proptest = "1.4"

# Additional utilities
rand = "0.8"
thiserror = "1.0"

[dev-dependencies]
criterion = "0.5"

[features]
default = []
performance-tests = []
stress-tests = []