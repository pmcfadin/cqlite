name: docker
services:
  cassandra-3-7:
    container_name: cqlite-test-cassandra-3-7
    environment:
      CASSANDRA_CLUSTER_NAME: CQLiteTestCluster37
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_RACK: rack1
      HEAP_NEWSIZE: 400M
      MAX_HEAP_SIZE: 2G
    healthcheck:
      test:
        - CMD-SHELL
        - cqlsh -e 'SELECT now() FROM system.local'
      timeout: 10s
      interval: 30s
      retries: 10
    image: cassandra:3.7
    networks:
      cqlite-test-network: null
    ports:
      - mode: ingress
        target: 9042
        published: "9042"
        protocol: tcp
      - mode: ingress
        target: 7000
        published: "7000"
        protocol: tcp
    volumes:
      - type: volume
        source: cassandra-3-7-data
        target: /var/lib/cassandra
        volume: {}
      - type: bind
        source: /Users/patrick/local_projects/cqlite/test-data/docker/schemas
        target: /schemas
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /Users/patrick/local_projects/cqlite/test-data/docker/generated
        target: /generated
        bind:
          create_host_path: true
  cassandra-3-11:
    container_name: cqlite-test-cassandra-3-11
