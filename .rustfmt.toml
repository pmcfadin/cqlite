# CQLite Rust formatting configuration
# Compatible with stable Rust toolchain

# Core formatting
edition = "2021"
hard_tabs = false
tab_spaces = 4
max_width = 100
newline_style = "Unix"

# Function formatting - use stable option
fn_params_layout = "Tall"

# Arrays
array_width = 60

# Error handling
use_small_heuristics = "Default"

# Misc - stable options only
struct_lit_width = 18
struct_variant_width = 35
use_field_init_shorthand = true