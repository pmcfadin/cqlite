[package]
name = "cqlite-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Command-line interface for CQLite — read Apache Cassandra 5.0 SSTables without a cluster"
readme = "../README.md"

[[bin]]
name = "cqlite"
path = "src/main.rs"

[dependencies]
# version is required (alongside path) so the dep resolves when published to
# crates.io. Keep this literal in sync with [workspace.package].version on every
# release (see release checklist).
cqlite-core = { path = "../cqlite-core", version = "0.16.1" }

# CLI framework
clap = { workspace = true }

# Async runtime
# `io-std` + `io-util` back the async stdin loop in the interactive writable
# session (issue #1693); `signal` backs its Ctrl-C graceful-shutdown handler.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "signal", "io-std", "io-util"] }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging and tracing.
# Issue #1033: the CLI now installs a unified `tracing_subscriber` registry
# (fmt -> stderr, EnvFilter, log->tracing bridge) instead of `env_logger`.
# `log` stays a direct dep: existing `log::*` call sites flow through the bridge,
# and the TUI suppresses output via `log::set_max_level`.
log = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Terminal UI
colored = { workspace = true }
indicatif = { workspace = true }
console = { workspace = true }
ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }

# Serialization
serde = { workspace = true }
# `raw_value` (issue #3644 item 3) lets the JSON egress emit a `decimal`/`varint`
# as an UNQUOTED JSON number of ARBITRARY precision — `serde_json::value::RawValue`
# carries the already-rendered digits verbatim, which no `serde_json::Number` can
# hold. Oracle: `cassandra-5.0.8` `DecimalType.toJSONString:314-317` and
# `IntegerType.toJSONString:488-491` both return an unquoted `toString()`.
# It is purely ADDITIVE: it adds a type and changes nothing about `Number`. Cargo
# UNIFIES features across the dependency graph, so enabling it here turns it on
# for every serde_json user in the build, not just this crate — which is harmless
# precisely because it is additive. `arbitrary_precision` is the other way to
# carry those digits and is deliberately NOT enabled, for the reason already
# recorded on the dev-dependency below, and unification is exactly why: it changes
# `Number`'s representation, equality and serialization for EVERY serde_json user
# in the build — including the ~20 test files in this crate that assert on
# serialized JSON.
serde_json = { workspace = true, features = ["raw_value"] }

# Table formatting
prettytable-rs = "0.10"

# CSV handling
csv = "1.3"

# Hex encoding for blob display
hex = "0.4"

# Insertion-ordered map for the `--format json` egress cell tree
# (`src/output/json_cell.rs`). `IndexMap::insert` keeps a key's FIRST position and
# writes its LAST value, which is exactly the collapse `serde_json::Map` performs
# here (this workspace builds serde_json with `preserve_order`, so THAT type IS an
# `IndexMap`) — so the JSON object cell gets the semantics it needs from the
# container instead of a hand-rolled dedupe.
#
# This adds NO code to the build: serde_json's `preserve_order` already pulls
# indexmap 2.14 into every cqlite-cli build with the same (default) features, so
# this is a DECLARATION of a dependency that is already compiled and linked.
indexmap = "2"

# Configuration parsing
toml = { workspace = true }
serde_yaml = { workspace = true }
dirs = { workspace = true }

# Date/time handling
chrono = { workspace = true }

# Regular expressions
regex = "1.10"

# Base64 encoding for binary data display
base64 = "0.21"

# System memory monitoring (cross-platform)
sysinfo = "0.30"

# Line editing for REPL
rustyline = "14.0"

# E2E validation: DuckDB reads Parquet exports to validate data integrity.
#
# This stays optional and off the normal dev-dependency path because `bundled`
# compiles DuckDB from source via libduckdb-sys. The main CI unit-test job does
# not need it and has historically hit runner disk limits when it is pulled into
# every CLI test target. DuckDB-backed tests opt in through `duckdb-tests`.
#
# `bundled` keeps test binaries from linking against a system `-lduckdb`, which
# is absent on ubuntu-latest runners (issue #916). `parquet` statically links the
# parquet extension so read_parquet() never auto-installs it into
# ~/.duckdb/extensions at runtime.
duckdb = { version = "1.1", features = ["bundled", "parquet"], optional = true }

# Development dependencies
[dev-dependencies]
# Arrow/Parquet readers for Parquet output validation tests (the writer itself
# lives in cqlite-core behind its `parquet` feature, Epic #682)
arrow = { workspace = true }
parquet = { workspace = true }
# Issue #1490: the Parquet-vs-sstabledump-JSONL value-parity harness parses the
# goldens' float literals with serde_json, and serde_json's DEFAULT float parser
# is approximate — measured: `1014.5449131979983` (a real `test_timeseries.sensor_data`
# `double`) parses ONE ULP high, while `str::parse::<f64>` is exact. That made the
# ORACLE wrong, reporting a divergence in correct export output. `float_roundtrip`
# makes the parse exact. Enabled here (dev only) so the parity oracle is sound;
# widening it to the WORKSPACE dependency (which every cqlite-core parity lane needs)
# is issue #3557.
# `tests/issue_1490_parquet_jsonl_parity.rs::golden_float_literals_parse_exactly`
# fails if it is ever dropped.
#
# `raw_value` (issue #1490 round 13) lets the same harness retain a cell value's
# ORIGINAL TEXT through the parse (`serde_json::value::RawValue`), which is what
# keeps a declared `decimal`/`varint` literal off the `f64` path — see
# `tests/support/parquet_parity/golden_text.rs`. It is purely ADDITIVE: it adds a
# type and changes nothing about `Number`, so no other serde_json user in these
# test targets is affected. `arbitrary_precision` would have been the other way
# to keep the text and is deliberately NOT enabled: it changes `Number`'s
# representation, equality and serialization for EVERY serde_json user in this
# crate's tests — including the ~20 files whose assertions compare serialized
# JSON output (`output_determinism_regression_tests.rs`,
# `output_format_tests.rs`) — so a decimal fix would silently move those
# determinism contracts.
serde_json = { workspace = true, features = ["float_roundtrip", "raw_value"] }
num-bigint = "0.4"
bytes = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
once_cell = { workspace = true }
tokio-test = { workspace = true }
rand = { workspace = true }
# Heap-allocation guard for the bounded-memory query test (issue #1581). Gated
# behind the `dhat-heap` feature so it never installs a global allocator or runs
# in the normal gate (mirrors cqlite-core's dhat-heap pattern, issue #1046).
dhat = "0.3"

# CLI testing dependencies
assert_cmd = "2.0"
predicates = "3.0"
serial_test = "3.0"

# Test infrastructure dependencies
test-log = "0.2"
wait-timeout = "0.2"
# Send SIGINT to a spawned CLI child in the graceful-shutdown test (issue #1693).
libc = { workspace = true }
rustc_version = "0.4"

# Enhanced testing framework dependencies
rstest = "0.18"                 # Parameterized tests
mockall = "0.11"                # Mocking framework
test-case = "3.0"               # Test case generation
insta = "1.34"                  # Snapshot testing
fake = "2.8"                    # Fake data generation
quickcheck = "1.0"              # Property-based testing
quickcheck_macros = "1.0"       # QuickCheck macros
# golden_tests = "1.2"            # Golden file testing (dependency not found)
trycmd = "0.14"                 # Command line testing
escargot = "0.5"                # Cargo subprocess management

# Coverage and reporting
# tarpaulin = "0.27"              # Code coverage - commented out due to availability issues
cargo-llvm-cov = "0.5"          # LLVM coverage
trybuild = "1.0"                # Compile-fail testing

# NOTE: scripts/agent-gate.sh's cli-tests component parses these [[test]] blocks
# line-wise (issue #2039) — keep `name` before a single-line `required-features`
# per block, or a target could silently drop out of both gate passes.
[[test]]
name = "delta_export_tests"
path = "tests/delta_export_tests.rs"
required-features = ["delta-export", "duckdb-tests"]

[[test]]
name = "delta_roundtrip_tests"
path = "tests/delta_roundtrip_tests.rs"
required-features = ["delta-export", "duckdb-tests"]

[[test]]
name = "duckdb_parquet_validation"
path = "tests/duckdb_parquet_validation.rs"
required-features = ["state_machine", "duckdb-tests"]

[[test]]
name = "issue_1388_compact_major_drop"
path = "tests/issue_1388_compact_major_drop.rs"
required-features = ["write-support"]

# Issue #1846: this target spawns the pre-built `cqlite` binary via
# CARGO_BIN_EXE_cqlite and exercises write-path DML, so it must be compiled with
# `write-support` for that binary to be write-capable.
[[test]]
name = "cli_dml_integration_tests"
path = "tests/cli_dml_integration_tests.rs"
required-features = ["write-support"]

# Issue #1581: dhat-gated bounded-memory guard for the streaming query cutover.
# Installs the dhat global allocator, so it must be its own opt-in test binary.
[[test]]
name = "issue_1581_query_stream_memory"
path = "tests/issue_1581_query_stream_memory.rs"
required-features = ["dhat-heap"]

# Issue #1494 (AD5): CSV export-writer throughput bench. Hosted here (not in
# cqlite-core) because the real public writer is cqlite_cli::output::CSVWriter;
# core carries no csv dependency. Registered STRICT (id export/csv) in
# cqlite-core/benches/perf-gate.json and run by perf-regression.yml against the
# cqlite-cli package. Needs cli-helpers (queryable Database + CSVWriter).
[[bench]]
name = "export_csv"
path = "benches/export_csv.rs"
harness = false
required-features = ["cli-helpers"]

[features]
# M2+ production defaults: Interactive REPL with query engine
# `interactive` was deleted in #1698: it had zero cfg sites, so enabling it (even
# from `default`) changed nothing. The REPL is unconditional in src/.
default = ["tui", "cli-helpers"]
tui = ["ratatui", "crossterm"]
benchmarks = []
integration-tests = []
# Issue #1581: gates the dhat-based bounded-memory query allocation test
# (tests/issue_1581_query_stream_memory.rs). Off by default so the dhat global
# allocator is never installed in a normal build/test; the test opts in via
# `required-features` and runs under `--features dhat-heap`.
dhat-heap = ["cli-helpers"]
# state_machine also enables cqlite-core/parquet: the CLI's Parquet output
# (gated on state_machine) consumes the core export writer (Epic #682)
state_machine = ["cqlite-core/state_machine", "cqlite-core/parquet"]
experimental = ["cqlite-core/experimental"]
# Issue #249: CLI-specific helpers (enables state_machine locally + cqlite-core/cli-helpers)
cli-helpers = ["state_machine", "cqlite-core/cli-helpers"]
# Issue #392: Write support (enables cqlite-core/write-support for CLI write operations)
write-support = ["state_machine", "cqlite-core/write-support"]
# Issue #705: Delta-export CDC subcommand (Epic #696 DS9).
# Enables cqlite-core/delta-scan (DeltaRecord types, scan_delta API) and
# cqlite-core/parquet (DeltaParquetWriter, arrow/parquet crates).
delta-export = ["state_machine", "cqlite-core/delta-scan", "cqlite-core/parquet"]
# Expensive, source-built DuckDB validation tests. Keep this out of default
# and main PR unit-test CI; focused E2E/parity workflows opt in explicitly.
duckdb-tests = ["dep:duckdb"]
# Issue #1033 / Epic #1031: OpenTelemetry wiring for the CLI.
# Enables cqlite-core/observability so cqlite_core::observability::tracing_layer()
# and the OTel exporter/runtime are available. NOT in default features; when off
# the CLI keeps its plain tracing-subscriber stderr logging (the OTel layer
# composition is compiled out). Config plumbing (CQLITE_OTEL_*/--otel-*) is
# always available because ObservabilityConfig/init() are always compiled.
observability = ["cqlite-core/observability"]
