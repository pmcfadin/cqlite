[package]
name = "cqlite-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Command-line interface for CQLite — read Apache Cassandra 5.0 SSTables without a cluster"
readme = "../README.md"

[[bin]]
name = "cqlite"
path = "src/main.rs"

[dependencies]
# version is required (alongside path) so the dep resolves when published to
# crates.io. Keep this literal in sync with [workspace.package].version on every
# release (see release checklist).
cqlite-core = { path = "../cqlite-core", version = "0.12.0" }

# CLI framework
clap = { workspace = true }

# Async runtime
# `io-std` + `io-util` back the async stdin loop in the interactive writable
# session (issue #1693); `signal` backs its Ctrl-C graceful-shutdown handler.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "signal", "io-std", "io-util"] }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging and tracing.
# Issue #1033: the CLI now installs a unified `tracing_subscriber` registry
# (fmt -> stderr, EnvFilter, log->tracing bridge) instead of `env_logger`.
# `log` stays a direct dep: existing `log::*` call sites flow through the bridge,
# and the TUI suppresses output via `log::set_max_level`.
log = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Terminal UI
colored = { workspace = true }
indicatif = { workspace = true }
console = { workspace = true }
ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Table formatting
prettytable-rs = "0.10"

# CSV handling
csv = "1.3"

# Hex encoding for blob display
hex = "0.4"

# Configuration parsing
toml = { workspace = true }
serde_yaml = { workspace = true }
dirs = { workspace = true }

# Date/time handling
chrono = { workspace = true }

# Regular expressions
regex = "1.10"

# Base64 encoding for binary data display
base64 = "0.21"

# System memory monitoring (cross-platform)
sysinfo = "0.30"

# Line editing for REPL
rustyline = "14.0"

# E2E validation: DuckDB reads Parquet exports to validate data integrity.
#
# This stays optional and off the normal dev-dependency path because `bundled`
# compiles DuckDB from source via libduckdb-sys. The main CI unit-test job does
# not need it and has historically hit runner disk limits when it is pulled into
# every CLI test target. DuckDB-backed tests opt in through `duckdb-tests`.
#
# `bundled` keeps test binaries from linking against a system `-lduckdb`, which
# is absent on ubuntu-latest runners (issue #916). `parquet` statically links the
# parquet extension so read_parquet() never auto-installs it into
# ~/.duckdb/extensions at runtime.
duckdb = { version = "1.1", features = ["bundled", "parquet"], optional = true }

# Development dependencies
[dev-dependencies]
# Arrow/Parquet readers for Parquet output validation tests (the writer itself
# lives in cqlite-core behind its `parquet` feature, Epic #682)
arrow = { workspace = true }
parquet = { workspace = true }
num-bigint = "0.4"
bytes = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
once_cell = { workspace = true }
tokio-test = { workspace = true }
rand = { workspace = true }

# CLI testing dependencies
assert_cmd = "2.0"
predicates = "3.0"
serial_test = "3.0"

# Test infrastructure dependencies
test-log = "0.2"
wait-timeout = "0.2"
# Send SIGINT to a spawned CLI child in the graceful-shutdown test (issue #1693).
libc = { workspace = true }
rustc_version = "0.4"

# Enhanced testing framework dependencies
rstest = "0.18"                 # Parameterized tests
mockall = "0.11"                # Mocking framework
test-case = "3.0"               # Test case generation
wiremock = "0.5"                # HTTP mocking
insta = "1.34"                  # Snapshot testing
fake = "2.8"                    # Fake data generation
quickcheck = "1.0"              # Property-based testing
quickcheck_macros = "1.0"       # QuickCheck macros
# golden_tests = "1.2"            # Golden file testing (dependency not found)
trycmd = "0.14"                 # Command line testing
escargot = "0.5"                # Cargo subprocess management

# Coverage and reporting
# tarpaulin = "0.27"              # Code coverage - commented out due to availability issues
cargo-llvm-cov = "0.5"          # LLVM coverage
trybuild = "1.0"                # Compile-fail testing

[[test]]
name = "delta_export_tests"
path = "tests/delta_export_tests.rs"
required-features = ["delta-export", "duckdb-tests"]

[[test]]
name = "delta_roundtrip_tests"
path = "tests/delta_roundtrip_tests.rs"
required-features = ["delta-export", "duckdb-tests"]

[[test]]
name = "duckdb_parquet_validation"
path = "tests/duckdb_parquet_validation.rs"
required-features = ["state_machine", "duckdb-tests"]

[[test]]
name = "issue_1388_compact_major_drop"
path = "tests/issue_1388_compact_major_drop.rs"
required-features = ["write-support"]

# Issue #1846: this target spawns the pre-built `cqlite` binary via
# CARGO_BIN_EXE_cqlite and exercises write-path DML, so it must be compiled with
# `write-support` for that binary to be write-capable.
[[test]]
name = "cli_dml_integration_tests"
path = "tests/cli_dml_integration_tests.rs"
required-features = ["write-support"]

[features]
# M2+ production defaults: Interactive REPL with query engine
default = ["interactive", "tui", "cli-helpers"]
interactive = []
tui = ["ratatui", "crossterm"]
benchmarks = []
ci_zero_tolerance = []
integration-tests = []
# state_machine also enables cqlite-core/parquet: the CLI's Parquet output
# (gated on state_machine) consumes the core export writer (Epic #682)
state_machine = ["cqlite-core/state_machine", "cqlite-core/parquet"]
experimental = ["cqlite-core/experimental"]
# Issue #249: CLI-specific helpers (enables state_machine locally + cqlite-core/cli-helpers)
cli-helpers = ["state_machine", "cqlite-core/cli-helpers"]
# Issue #392: Write support (enables cqlite-core/write-support for CLI write operations)
write-support = ["state_machine", "cqlite-core/write-support"]
# Issue #705: Delta-export CDC subcommand (Epic #696 DS9).
# Enables cqlite-core/delta-scan (DeltaRecord types, scan_delta API) and
# cqlite-core/parquet (DeltaParquetWriter, arrow/parquet crates).
delta-export = ["state_machine", "cqlite-core/delta-scan", "cqlite-core/parquet"]
# Expensive, source-built DuckDB validation tests. Keep this out of default
# and main PR unit-test CI; focused E2E/parity workflows opt in explicitly.
duckdb-tests = ["dep:duckdb"]
# Issue #1033 / Epic #1031: OpenTelemetry wiring for the CLI.
# Enables cqlite-core/observability so cqlite_core::observability::tracing_layer()
# and the OTel exporter/runtime are available. NOT in default features; when off
# the CLI keeps its plain tracing-subscriber stderr logging (the OTel layer
# composition is compiled out). Config plumbing (CQLITE_OTEL_*/--otel-*) is
# always available because ObservabilityConfig/init() are always compiled.
observability = ["cqlite-core/observability"]
