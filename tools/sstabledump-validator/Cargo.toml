[package]
name = "sstabledump-validator"
publish = false
version = "0.1.0"
edition = "2021"
description = "Zero-tolerance cell-by-cell validation harness for sstabledump compatibility"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
csv = "1.3"
regex = "1.10"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
tempfile = "3.8"
walkdir = "2.4"
bollard = { version = "0.16", optional = true }
futures-util = { version = "0.3", optional = true }

[dependencies.cqlite-core]
path = "../../cqlite-core"

[dev-dependencies]
tokio-test = "0.4"
assert_cmd = "2.0"
predicates = "3.0"

[[bin]]
name = "sstabledump-validator"
path = "src/main.rs"

[features]
default = []
docker-integration = ["bollard", "futures-util"]