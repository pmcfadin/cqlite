[workspace]
members = [
    "cqlite-core",
    "cqlite-ffi", 
    "cqlite-wasm",
    "cqlite-cli",
    "tests",
    "examples",
    "tools/*",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["CQLite Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cqlite/cqlite"
keywords = ["database", "embedded", "sstable", "wasm"]
categories = ["database-implementations", "embedded", "wasm"]
rust-version = "1.85"

[workspace.lints.rust]
unused_imports = "deny"
unused_variables = "deny"
dead_code = "warn"  # Allow dead code during development
unused_mut = "deny"
unused_assignments = "deny"
unreachable_code = "deny"
unused_must_use = "deny"
warnings = "warn"  # Allow warnings during Rust 2024 migration
private_interfaces = "allow"  # Allow private interfaces during development


[workspace.dependencies]
# Core dependencies - avoid "full" features, enable per-crate
tokio = { version = "1.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI dependencies
clap = { version = "4.4", features = ["derive", "env"] }
colored = "2.0"
indicatif = "0.17"
console = "0.15"
ratatui = "0.24"
crossterm = "0.27"

# Storage and compression - define versions, feature-gate in individual crates
lz4_flex = "0.11"
snap = "1.1"
flate2 = "1.0"
zstd = "0.13"
crc32fast = "1.3"

# Collections and data structures
crossbeam = "0.8"
parking_lot = "0.12"
dashmap = "5.5"

# Memory management
bytes = "1.4"
memmap2 = "0.9"

# Development and testing
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.0"
tempfile = "3.8"
once_cell = "1.19"
assert_cmd = "2.0"
predicates = "3.0"
tokio-test = "0.4"
rand = "0.9"

# Configuration parsing
toml = "0.8"
serde_yaml = "0.9"
dirs = "5.0"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# FFI
libc = "0.2"
cbindgen = "0.26"

# WASM
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
wasm-bindgen-futures = "0.4"
futures = "0.3"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
wee_alloc = "0.4"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

[profile.bench]
debug = true

[profile.dev]
# Faster builds for development
opt-level = 0
debug = true
rpath = false
lto = false
debug-assertions = true
codegen-units = 256
panic = "unwind"
incremental = true
overflow-checks = true

[profile.test]
# Optimized test builds
opt-level = 1
debug = true
rpath = false
lto = false
debug-assertions = true
codegen-units = 256
incremental = true
overflow-checks = true

# Clippy configuration for strict code quality
[workspace.lints.clippy]
# Set clippy group lints with lower priority to avoid conflicts
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"