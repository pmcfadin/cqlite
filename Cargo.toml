[workspace]
members = [
    "cqlite-core",
    "cqlite-cli",
    "tests",
    "examples",
    "tools/*",
]
resolver = "2"

[package]
name = "cqlite"
version = "0.3.0"
edition = "2021"

[dependencies]
cqlite-core = { path = "cqlite-core" }
clap = { workspace = true }
tokio = { workspace = true, features = ["full"] }
log = { workspace = true }
env_logger = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
futures = { workspace = true }
uuid = { version = "1.6", features = ["v4"] }
insta = "1.34"

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["CQLite Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cqlite/cqlite"
keywords = ["database", "embedded", "sstable", "wasm"]
categories = ["database-implementations", "embedded", "wasm"]
rust-version = "1.85"

[workspace.lints.rust]
unused_imports = "deny"
unused_variables = "deny"
dead_code = "warn"  # Allow dead code during development
unused_mut = "deny"
unused_assignments = "deny"
unreachable_code = "deny"
unused_must_use = "deny"
warnings = "warn"  # Allow warnings during Rust 2024 migration
private_interfaces = "allow"  # Allow private interfaces during development


[workspace.dependencies]
# Core dependencies - avoid "full" features, enable per-crate
tokio = { version = "1.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
bincode = "1.3"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI dependencies
clap = { version = "4.4", features = ["derive", "env"] }
colored = "2.0"
indicatif = "0.17"
console = "0.15"
ratatui = "0.24"
crossterm = "0.27"

# Storage and compression - define versions, feature-gate in individual crates
lz4_flex = "0.11"
snap = "1.1"
flate2 = "1.0"
zstd = "0.13"
crc32fast = "1.3"

# Collections and data structures
crossbeam = "0.8"
parking_lot = "0.12"
dashmap = "5.5"

# Memory management
bytes = "1.4"
memmap2 = "0.9"

# Development and testing
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.0"
tempfile = "3.8"
once_cell = "1.19"
assert_cmd = "2.0"
predicates = "3.0"
tokio-test = "0.4"
rand = "0.9"

# Configuration parsing
toml = "0.8"
serde_yaml = "0.9"
dirs = "5.0"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# FFI
libc = "0.2"
cbindgen = "0.26"

# Arrow and Parquet support (M3 output writers)
arrow = { version = "53", default-features = false }
parquet = { version = "53", default-features = false, features = ["arrow", "snap", "zstd"] }

# WASM
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
wasm-bindgen-futures = "0.4"
futures = "0.3"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
wee_alloc = "0.4"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

[profile.bench]
debug = true

[profile.dev]
# Faster builds for development
opt-level = 0
debug = true
rpath = false
lto = false
debug-assertions = true
codegen-units = 256
panic = "unwind"
incremental = true
overflow-checks = true

[profile.test]
# Optimized test builds
opt-level = 1
debug = true
rpath = false
lto = false
debug-assertions = true
codegen-units = 256
incremental = true
overflow-checks = true

# Package metadata for CI/CD quality gates
[package.metadata.coverage]
minimum-coverage = 90
exclude-files = ["src/bin/*", "benches/*", "examples/*"]
enforce-threshold = true
tool = "cargo-llvm-cov"

[package.metadata.performance]
max-regression = 0.1
baseline-path = "target/criterion"
enforce-benchmarks = true
timeout-seconds = 300

# M1 Clippy Configuration - Balanced for milestone delivery
[workspace.lints.clippy]
# Enable critical correctness checks with higher priority
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# Enable important performance and style checks but as warnings
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }

# Allow pedantic/nursery during M1 development
pedantic = "allow"
nursery = "allow"
cargo = "allow"
restriction = "allow"

# Specific allows for M1 development velocity (higher priority to override groups)
too_many_arguments = "allow"
module_name_repetitions = "allow"
missing_docs_in_private_items = "allow"
implicit_return = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
uninlined_format_args = "allow"
single_component_path_imports = "allow"
if_same_then_else = "allow"
field_reassign_with_default = "allow"
assertions_on_constants = "allow"
