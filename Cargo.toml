[workspace]
members = [
    "cqlite-core",
    "cqlite-ffi-common",
    "cqlite-cli",
    "cqlite-flight",
    "bindings/python",
    "bindings/node",
    "tests",
    "tests/format-compatibility",
    "examples",
    "tools/*",
    "xtask",
]
# The cargo-fuzz crate (issue #1614) is its own workspace (`fuzz/Cargo.toml` has
# an empty `[workspace]` table). Exclude it here too so no default `cargo
# build`/`clippy`/test at the repo root — or `scripts/agent-gate.sh` — ever
# compiles it; fuzzing requires nightly and is run only via its own workflow.
exclude = [
    "fuzz",
]

# NOTE (issue #1716, epic #1688 finding AK5): do NOT add `default-members` here
# expecting it to make a bare root build cheaper — it would do the OPPOSITE.
# This workspace has a ROOT PACKAGE (`cqlite`, below), and cargo's default for
# `default-members` in that case is THE ROOT PACKAGE ALONE (it is "all members"
# only for a VIRTUAL workspace). Verified on this manifest: `cargo tree
# --depth 0` at the root resolves to `cqlite` and nothing else. So a bare
# `cargo build` already compiles the narrowest possible set, and spelling out a
# `default-members` list would EXPAND it from 1 package to 14.
# The unwired `tools/` crates (see each one's README) are compiled only by an
# explicit `--workspace` or `-p`, never by a bare build.
resolver = "2"

[package]
# Workspace-root package: hosts the top-level tests/*.rs integration tests (the
# issue #514 arrangement). Never published — the `cqlite` name on crates.io
# belongs to an unrelated project; the CLI publishes as `cqlite-cli` (binary
# `cqlite`). See issue #782.
name = "cqlite"
version = "0.16.1"
edition = "2021"
publish = false

[dependencies]
cqlite-core = { path = "cqlite-core" }
clap = { workspace = true }
tokio = { workspace = true, features = ["full"] }
log = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Dev/test-only logging init. The workspace-root `cqlite` package has no src/
# (it only hosts the top-level tests/*.rs integration tests), so env_logger can
# only ever serve dev/test context — a dev-dependency, never a shipped one
# (issue #2519, item b from #2151).
env_logger = { workspace = true }
futures = { workspace = true }
uuid = { version = "1.6", features = ["v4"] }
insta = "1.34"
crc32fast = { workspace = true }
# Required so that the integration tests in tests/ that import cqlite_tests
# (issue #514) can compile when the root cqlite package is also a target.
cqlite-integration-tests = { path = "tests" }

[workspace.package]
version = "0.16.1"
edition = "2021"
authors = ["CQLite Team"]
license = "Apache-2.0"
repository = "https://github.com/pmcfadin/cqlite"
keywords = ["database", "embedded", "sstable", "wasm"]
categories = ["database-implementations", "embedded", "wasm"]
rust-version = "1.85"

[workspace.lints.rust]
unused_imports = "deny"
unused_variables = "deny"
dead_code = "warn"  # Allow dead code during development
unused_mut = "deny"
unused_assignments = "deny"
unreachable_code = "deny"
unused_must_use = "deny"
warnings = "warn"  # Allow warnings during Rust 2024 migration
private_interfaces = "allow"  # Allow private interfaces during development


[workspace.dependencies]
# Core dependencies - avoid "full" features, enable per-crate
tokio = { version = "1.0", default-features = false }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
bincode = "1.3"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Observability / OpenTelemetry (opt-in via the `observability` feature on
# cqlite-core; epic #1031). Versions pinned together because the OTel crates
# release in lockstep and mixing minor versions breaks the trait wiring.
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.30", features = ["grpc-tonic", "http-proto", "reqwest-blocking-client", "metrics", "trace"] }
tracing-opentelemetry = "0.31"
opentelemetry-semantic-conventions = "0.30"

# CLI dependencies
clap = { version = "4.4", features = ["derive", "env"] }
colored = "2.0"
indicatif = "0.17"
console = "0.15"
ratatui = "0.24"
crossterm = "0.27"

# Storage and compression - define versions, feature-gate in individual crates
lz4_flex = "0.11"
snap = "1.1"
flate2 = "1.0"
zstd = "0.13"
crc32fast = "1.3"
# SHA-256, for content digests (corpus identity in tools/ws0-corpus-gen, and
# cqlite-core's own hashing). Declared here so the two consumers cannot drift to
# different minor lines (issue #3096 review).
sha2 = "0.10"

# Collections and data structures
crossbeam = "0.8"
parking_lot = "0.12"
dashmap = "5.5"
# Lock-free atomic Arc swap for hot-path signal cells (issue #1595).
arc-swap = "1"

# Memory management
bytes = "1.6"
memmap2 = "0.9"

# Development and testing
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.0"
tempfile = "3.8"
once_cell = "1.19"
assert_cmd = "2.0"
predicates = "3.0"
tokio-test = "0.4"
rand = "0.9"

# File locking (cross-platform advisory locks for write_dir exclusivity)
fs2 = "0.4"

# Configuration parsing
toml = "0.8"
serde_yaml = "0.9"
dirs = "5.0"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# FFI
libc = "0.2"
cbindgen = "0.26"
pyo3 = { version = "0.23" }

# napi-rs for Node.js bindings
napi = { version = "2.16", default-features = false }
napi-derive = "2.16"
napi-build = "2.1"

# Arrow and Parquet support (M3 output writers)
arrow = { version = "53", default-features = false }
parquet = { version = "53", default-features = false, features = ["arrow", "snap", "zstd"] }

# WASM (M6 placeholders — no workspace member references these yet. The
# wasm-bindgen/js-sys/web-sys pins were dropped in #1698 with cqlite-core's `wasm`
# feature, which pulled them and gated nothing; M6 re-adds them when the bindings
# exist. NOTE `futures` below is NOT a WASM pin — it is used by four members.)
wasm-bindgen-futures = "0.4"
futures = "0.3"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
wee_alloc = "0.4"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

# Binding cdylibs (Python wheel, Node npm prebuild) ship with this profile so the
# PyO3 / napi-rs catch_unwind->exception firewall at the FFI boundary is active
# (issue #1440). Inherits release (lto, codegen-units, strip) and flips only the
# panic strategy to unwind. CLI/core keep [profile.release] (panic = "abort").
[profile.release-unwind]
inherits = "release"
panic = "unwind"

# Profiling profile for the WS0 per-function attribution work (issue #3248).
#
# WHY THIS EXISTS: `[profile.release]` sets `strip = true`, so a stock release binary
# carries no symbols and per-function `perf` attribution against it is IMPOSSIBLE — the
# profiler reports raw addresses and the region under study stays exactly as unattributed
# as it was before you profiled. That is a silent failure: `perf record` exits 0 and
# `perf report` prints a confident table of `[.] 0x00000000000224eb`.
#
# WHY NOT `--profile bench`: bench also inherits release and unstrips, but cargo writes it
# to `target/release/`, which would clobber the release binaries the WS0 rig digests for
# provenance (`scripts/perf/ws0_binary_snapshot.py`). A named profile gets its own
# `target/perfprof/` and cannot collide.
#
# CODEGEN FIDELITY IS THE WHOLE POINT and it is MEASURED, not assumed: this profile changes
# only debuginfo emission and symbol retention, never an optimization input (opt-level, lto,
# codegen-units and panic are all inherited from release untouched). Deliberately NO
# `-C force-frame-pointers` here — that WOULD alter codegen. Call-graph runs that need
# unwinding use `perf record --call-graph dwarf` and are reported as STRUCTURAL evidence
# only, never as the source of a headline per-function number.
# Symbols-only profiling profile (issue #3248). See [profile.perfprof] below for why a
# profiling profile is needed at all. This one exists because the two things a profiler
# wants have DIFFERENT codegen costs, and only one of them is needed for the headline
# numbers:
#   * the SYMBOL TABLE  -> what flat per-function attribution needs. `strip = "none"`.
#   * DEBUGINFO         -> only needed for `perf annotate` source interleaving and for
#                          `--call-graph dwarf`. `debug = 1`, and it MOVES `.text`.
# Measured on cqlite-flight: debug = 1 grows `.text` by 12,992 bytes (+0.156%) over
# release, so `perfprof` is NOT codegen-identical. This profile drops debuginfo and keeps
# only the symbol table, which is the codegen-faithful vehicle for AC1's headline figures.
[profile.perfsym]
inherits = "release"
debug = 0
strip = "none"

[profile.perfprof]
inherits = "release"
debug = 1
strip = "none"

[profile.bench]
debug = true
# bench inherits from release, which sets `strip = true` — that would discard
# the symbols that profilers (pprof flamegraphs, dhat backtraces) need even
# with debug = true above. Keep bench binaries unstripped (docs/profiling.md).
strip = "none"

[profile.dev]
# Faster builds for development
opt-level = 0
debug = true
rpath = false
lto = false
debug-assertions = true
codegen-units = 256
panic = "unwind"
incremental = true
overflow-checks = true

[profile.test]
# Optimized test builds
opt-level = 1
debug = true
rpath = false
lto = false
debug-assertions = true
codegen-units = 256
incremental = true
overflow-checks = true

# Package metadata for CI/CD quality gates
[package.metadata.coverage]
minimum-coverage = 90
exclude-files = ["src/bin/*", "benches/*", "examples/*"]
enforce-threshold = true
tool = "cargo-llvm-cov"

[package.metadata.performance]
max-regression = 0.1
baseline-path = "target/criterion"
enforce-benchmarks = true
timeout-seconds = 300

# M1 Clippy Configuration - Balanced for milestone delivery
[workspace.lints.clippy]
# Enable critical correctness checks with higher priority
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# Enable important performance and style checks but as warnings
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }

# Allow pedantic/nursery during M1 development
pedantic = "allow"
nursery = "allow"
cargo = "allow"
restriction = "allow"

# Specific allows for M1 development velocity (higher priority to override groups)
too_many_arguments = "allow"
module_name_repetitions = "allow"
missing_docs_in_private_items = "allow"
implicit_return = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
uninlined_format_args = "allow"
single_component_path_imports = "allow"
if_same_then_else = "allow"
field_reassign_with_default = "allow"
assertions_on_constants = "allow"
