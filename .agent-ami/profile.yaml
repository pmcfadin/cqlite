version: 1
project:
  name: cqlite
datasets_root_env: CQLITE_DATASETS_ROOT
toolchains:
  - kind: rust
    version: "stable"
    components: [clippy, rustfmt]
    targets: [wasm32-unknown-unknown]
    # cargo-nextest --locked (unpinned): on latest stable (verified 1.97.1,
    # 2026-07-24) the newest nextest builds fine, but it ships a build-time
    # "locked-tripwire" that FAILS unless installed with --locked. So keep
    # --locked; the old @0.9.114 rustc-version pin is no longer needed.
    accelerators: [sccache, "cargo-nextest --locked"]
  - kind: python
    version: "3.9"
  - kind: node
    version: "18"
datasets:
  # {data_mount}, NOT {repo_root}. Two reasons, the second of which is a
  # data-loss bug rather than a preference:
  #  1. The clone is ephemeral, so a golden snapshot cannot preserve datasets
  #     under it — every worker would re-download ~20 min of data.
  #  2. fetch-datasets.sh does `rm -rf "$DATASET_ROOT"`, and 875 git-TRACKED
  #     fixtures live under test-data/datasets/. Its restore guard early-returns
  #     unless $CI is set (it is not on a worker), so pointing DATASET_ROOT into
  #     the repo SILENTLY DELETES TRACKED FIXTURES and the gate then fails on
  #     pristine main. That is #2878; it cost the 2026-07-25 trial ~90 minutes.
  #  On /data the script's "already present + pinned" check exits 0 before the rm.
  - run: "bash test-data/scripts/fetch-datasets.sh"
    env:
      CQLITE_DATASETS_ROOT: "{data_mount}/datasets"
env:
  RUSTFLAGS: "-D warnings"
  # NOTE: do NOT set RUSTC_WRAPPER=sccache here. Profile env is applied to every
  # onboard command, including `cargo install sccache` — wrapping rustc with a
  # not-yet-built sccache deadlocks the toolchain step. cqlite's agent-gate.sh
  # auto-detects sccache and wires it in itself; these two vars are all it needs.
  # Both caches live on the DURABLE volume so the golden snapshot captures them;
  # under $HOME they are lost with the instance and every worker rebuilds cold.
  SCCACHE_DIR: "{data_mount}/sccache"
  # DERIVED AS A BRACKET, NOT A ROUND NUMBER (issue #3727). `50G` sits inside an interval whose
  # BOTH ENDS WERE MEASURED, not argued:
  #   LOWER, measured on box3's own production cache: with the cap made non-binding, the fleet's
  #   real workload pushed the cache PAST the old 10 GiB ceiling within ~19 minutes
  #   (10380303858 -> 11516555977 bytes, 18:14Z -> 18:29Z 2026-09-01, continuing to 13612750401 by
  #   18:58Z) — so the working set EXCEEDS 10 GiB, proven on the cache being sized rather than
  #   inferred from a hit rate.
  #   UPPER, lane-3358's independent measurement on box2: (10 GiB, ~56 GB], carrying their own
  #   caveat that thrashing inflates the upper end because an evicted-then-recompiled unit is
  #   counted twice.
  # 50G is inside that bracket near the top, leaving headroom not to evict within one gate, and it
  # is affordable on a 295G device. The previous value was a round `30G` with no derivation.
  # FALSIFIABLE, which is the point of shipping it this way: lane-3358's criterion is "the cache
  # never evicts during one full gate", and since #3727 every gate SUMMARY carries
  # `sccache-used=<bytes>(<pct>%)` beside `sccache-cap=`, so ANY gate can refute it. If a SUMMARY
  # ever shows sccache-used near 100% of cap, the working set has outgrown this value and the
  # bracket must be RE-DERIVED — never just raised while declaring victory (issue #3727 AC6).
  #
  # WHY THE OLD VALUE WAS INEFFECTIVE, WHICH IS THE WHOLE OF #3727: it was declared HERE and
  # NEVER PERSISTED. This block's env reaches the commands the LAUNCHER runs, so the variable
  # existed only inside those processes — measured, a fresh PAM session (`sudo -i`) and
  # `env -i bash -lc` both reported it UNSET, while SCCACHE_DIR two lines up IS in
  # /etc/environment — so the fleet-effective cap was sccache's own 10 GiB DEFAULT on boxes
  # provisioned to hold 50G, and no artifact said so. The persistence that makes it
  # real is `--fix-sccache-cap` in verify.run below, which writes /etc/environment (read by PAM at
  # session creation) and then VERIFIES it by correlating THREE MEASUREMENTS: the line in that file,
  # the BYTES sccache resolves the value to (asked of an isolated sccache), and the BYTES the
  # running server enforces. It probes NO session, so it establishes nothing about what a gate's
  # own session sees — that claim belongs to #3946 (lead ruling req-3727-w4 removed the session
  # half). What it does establish is the fact this file's own value depends on: the sccache SERVER
  # reads the cap at STARTUP, so a server already up keeps its old cap until
  # `sccache --stop-server`.
  #
  # THE SPELLING IS PART OF THE VALUE. sccache accepts `<digits>[KkMmGgTt]` (binary multipliers)
  # and SILENTLY DISCARDS anything else — measured, `30GiB` and `30GB` both yield the 10 GiB
  # default with no diagnostic, and a bare integer means BYTES. Keep the suffix form.
  #
  # This literal must equal SCC_ENV_VALUE in scripts/bootstrap-agent-machine.sh (the single source
  # of truth for the fleet cap); scripts/tests/test_bootstrap_agent_machine.sh asserts they agree.
  SCCACHE_CACHE_SIZE: "50G"
  CQLITE_DATASETS_ROOT: "{data_mount}/datasets"
verify:
  # --fix-credentials --strict (issue #3369). Two independent gaps, both real on a box
  # launched from the pinned image:
  #  1. WIRING. The image has a working `gh` but no git credential helper, so the first
  #     thing a lane does — `scripts/flow/claim.sh claim <N>`, a plain `git push` of a
  #     claim ref — fails `CLAIM: ERROR reason=auth`. Bare (no flag) the bootstrap can
  #     only ever WARN about that; it cannot wire it. --fix-credentials runs section
  #     3b's auto-fix (preferring `gh auth setup-git`) and NOTHING else, so verify stays
  #     a verification step rather than becoming a toolchain installer — which is what
  #     --yes would have made it.
  #  2. FAIL-CLOSED. The script always exits 0 by design (it composes into setup
  #     scripts), so the expect string below was the ONLY failure signal. --strict makes
  #     the exit code fail closed too. It adds no NEW strictness: "All checks green." is
  #     printed only when there are zero warnings, which is exactly --strict's condition
  #     — belt and braces on the same fact, from two independent channels.
  # Section 3b now measures git PUSH capability by performing the operation (create +
  # read back + delete a throwaway refs/claims/smoke-<commit-sha> ref), not by probing the
  # credential helper: the affected box passed `gh auth status` AND
  # `git ls-remote origin HEAD` and still could not push.
  # --fix-gate-pin (issue #3414) is the SECOND narrow repair, added for the same reason and
  # in the same shape as --fix-credentials above. The single-gate pin
  # (CQLITE_GATE_MAX_CONCURRENCY=1) has to be PERSISTED where a non-interactive shell reads
  # it — /etc/environment, read by PAM at session creation — and a launched box gets no
  # other bootstrap invocation, so without this flag every new instance arrives UNPINNED,
  # its gates silently resolve the #1825 cap from the default formula and admit co-tenants,
  # and verify merely reds. That converts a silent defect into a loud one without removing
  # it, and an alarm that fires on every new box is one people learn to waive. Persisting an
  # env line is not a toolchain install, so verify stays a verification step — the same
  # boundary --yes would have crossed. The write is idempotent and NEVER rewrites an existing
  # value, and the verdict still comes from probing a fresh session, so a box that cannot be
  # pinned (no passwordless sudo) stays non-passing and --strict still exits 1.
  # (That sentence is about --fix-gate-pin, #3414, which DOES probe a session. --fix-sccache-cap
  # below does not — see its own note.)
  # --fix-sccache-cap (issue #3727) is the THIRD narrow repair, added for the same reason and in
  # the same shape as --fix-credentials and --fix-gate-pin above: the env block's
  # SCCACHE_CACHE_SIZE reaches launcher-created processes only, so without this flag every new
  # instance arrives with an UNPERSISTED cap and its sccache server enforces the 10 GiB default.
  # Persisting an env line is not a toolchain install, so verify stays a verification step. The
  # write is idempotent and NEVER rewrites an existing value, and the verdict comes from the FILE,
  # the value->bytes oracle and the RUNNING server — no session probe — so a box whose file cannot
  # be written, or whose running server enforces something else, stays non-passing and --strict
  # still exits 1.
  run: "bash scripts/bootstrap-agent-machine.sh --fix-credentials --fix-gate-pin --fix-sccache-cap --strict"
  expect: "All checks green."
hooks:
  # Deliberately EMPTY (issue #3369). The credential wiring belongs in verify.run above,
  # not here: the hook schema is defined by the EXTERNAL agent-ami launcher and nothing
  # in this repo documents or consumes it, so a command placed here would be a guess at
  # an external contract — and a wrong guess breaks onboarding fleet-wide. verify.run's
  # shape is known and already exercised on every launch.
  post_toolchain: []
  pre_verify: []
